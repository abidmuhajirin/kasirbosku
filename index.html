          )}

          {leaveForm && (
            <Modal title="Liburkan karyawan" desc="Catat karyawan yang sakit, izin, atau tidak hadir tanpa keterangan." onClose={() => setLeaveForm(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setLeaveForm(null)}>Batal</Btn><Btn icon="calendar" onClick={saveLeave} disabled={!leaveForm.user_id || leaveForm.to < leaveForm.from}>Simpan</Btn></>}>
              <div className="space-y-4">
                <Field label="Karyawan"><select value={leaveForm.user_id} onChange={e => setLeaveForm({ ...leaveForm, user_id: e.target.value })} className={inputCls}>{staff.map(u => <option key={u.id} value={u.id}>{u.name} · {ROLE_LABELS[u.role]}</option>)}</select></Field>
                <div>
                  <span className="text-sm font-medium text-slate-700">Jenis</span>
                  <div className="mt-1.5"><SegmentedControl size="md" label="Jenis ketidakhadiran" value={leaveForm.type} onChange={v => setLeaveForm({ ...leaveForm, type: v })} options={Object.entries(LEAVE_TYPES).map(([value, t]) => ({ value, label: t.label }))} /></div>
                  <p className="mt-1 text-xs text-slate-500">{LEAVE_TYPES[leaveForm.type].desc}</p>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Dari tanggal"><input type="date" value={leaveForm.from} onChange={e => setLeaveForm({ ...leaveForm, from: e.target.value, to: e.target.value > leaveForm.to ? e.target.value : leaveForm.to })} className={inputCls} /></Field>
                  <Field label="Sampai tanggal" error={leaveForm.to < leaveForm.from ? 'Harus sama atau setelah tanggal mulai.' : null}><input type="date" min={leaveForm.from} value={leaveForm.to} onChange={e => setLeaveForm({ ...leaveForm, to: e.target.value })} className={inputCls} /></Field>
                </div>
                <Field label="Keterangan" hint="Opsional, cth. ada surat dokter, acara keluarga."><input value={leaveForm.note} onChange={e => setLeaveForm({ ...leaveForm, note: e.target.value })} className={inputCls} /></Field>
                <p className="text-xs text-slate-500">Karyawan akan menerima pemberitahuan di lonceng notifikasinya.</p>
              </div>
            </Modal>
          )}

          {rejecting && (
            <Modal title="Tolak lembur?" desc={`${db.users.find(u => u.id === rejecting.ot.user_id)?.name} · ${fmtDuration(rejecting.ot.minutes)}`} onClose={() => setRejecting(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setRejecting(null)}>Batal</Btn><Btn variant="danger" onClick={() => { decideOt(rejecting.ot, 'rejected', rejecting.note); setRejecting(null); }}>Tolak lembur</Btn></>}>
              <Field label="Alasan (opsional)"><input autoFocus value={rejecting.note} onChange={e => setRejecting({ ...rejecting, note: e.target.value })} className={inputCls} placeholder="cth. lupa absen pulang" /></Field>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // FINANCE (P&L)
    // =====================================================================
    // 'Uang Deposit Pelanggan' is written only by the refund in Pelanggan, not picked by hand
    const DEPOSIT_REFUND = 'Uang Deposit Pelanggan';
    const EXPENSE_CATEGORIES = ['Bahan Baku', 'Gaji & Bonus', 'Listrik & Air', 'Sewa & Kebersihan', 'Transportasi', 'Perawatan', 'Lainnya', DEPOSIT_REFUND];
    // Refunds saved before the rename keep their old category name
    const expenseCat = (e) => e.category === 'Uang Pelanggan' ? DEPOSIT_REFUND : e.category;

    function ExpenseModal({ form, setForm, onSave, onClose, expenses = [] }) {
      // The day's expenses so staff can see what was already bought
      const dayList = expenses.filter(e => e.date === form.date);
      const dayTotal = dayList.reduce((a, e) => a + (Number(e.amount) || 0), 0);
      return (
        <Modal title="Catat pengeluaran" onClose={onClose}
          footer={<><span className="flex-1" /><Btn variant="secondary" onClick={onClose}>Batal</Btn><Btn onClick={onSave} disabled={!form.amount}>Simpan</Btn></>}>
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <Field label="Tanggal"><input type="date" value={form.date} max={dateKey()} onChange={e => setForm({ ...form, date: e.target.value })} className={inputCls} /></Field>
              <Field label="Kategori"><select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} className={inputCls}>{EXPENSE_CATEGORIES.filter(c => c !== DEPOSIT_REFUND).map(c => <option key={c}>{c}</option>)}</select></Field>
            </div>
            <Field label="Nominal"><MoneyInput autoFocus value={form.amount} onChange={v => setForm({ ...form, amount: v })} /></Field>
            <Field label="Catatan"><input value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} className={inputCls} placeholder="cth. beli gula 5 kg" /></Field>
            <section aria-labelledby="exp-day-title" className="border-t border-slate-200 pt-4">
              <div className="flex items-baseline justify-between gap-2">
                <h4 id="exp-day-title" className="text-sm font-bold text-slate-900">Pengeluaran {form.date === dateKey() ? 'hari ini' : fmtDateShort(form.date)}</h4>
                {dayList.length > 0 && <span className="text-sm font-bold text-slate-900 tabular">{formatIDR(dayTotal)}</span>}
              </div>
              {dayList.length === 0 ? <p className="mt-1 text-sm text-slate-500">Belum ada pengeluaran yang dicatat.</p> : (
                <div className="mt-2 overflow-x-auto rounded-xl border border-slate-200">
                  <table className="w-full min-w-[420px] text-left text-sm">
                    <thead className="bg-slate-50 text-xs uppercase tracking-wide text-slate-600">
                      <tr><th scope="col" className="px-3 py-2 font-semibold">Kategori</th><th scope="col" className="px-3 py-2 font-semibold">Catatan</th><th scope="col" className="px-3 py-2 font-semibold">Dicatat</th><th scope="col" className="px-3 py-2 text-right font-semibold">Nominal</th></tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {dayList.map(e => (
                        <tr key={e.id}>
                          <td className="px-3 py-2 text-slate-800">{expenseCat(e)}</td>
                          <td className="px-3 py-2 text-slate-600">{e.note || '—'}</td>
                          <td className="px-3 py-2 text-slate-600">{e.by || '—'}</td>
                          <td className="px-3 py-2 text-right font-medium text-slate-900 tabular">{formatIDR(e.amount)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </section>
          </div>
        </Modal>
      );
    }
    const newExpense = () => ({ date: dateKey(), category: 'Bahan Baku', amount: 0, note: '' });
    // Every expense keeps who wrote it down
    const addExpense = (setDb, form, user) => setDb(prev => ({ ...prev, expenses: [{ id: generateId('EXP'), ...form, by: user.name, by_id: user.id }, ...prev.expenses] }));

    function FinanceModule({ db, setDb, notify, currentUser }) {
      const [month, setMonth] = useState(dateKey().slice(0, 7));
      const [expForm, setExpForm] = useState(null);
      const [pdfBusy, setPdfBusy] = useState(false);
      const from = month + '-01';
      const to = dateKey(new Date(Number(month.slice(0, 4)), Number(month.slice(5, 7)), 0));
      const f = computeFinancials(db, from, to);
      const months = monthOptions(allSalesOf(db).reduce((m, s) => saleDay(s) < m ? saleDay(s) : m, dateKey()));
      const expenses = db.expenses.filter(e => e.date >= from && e.date <= to).sort((a, b) => b.date.localeCompare(a.date));
      const payroll = db.users.filter(u => isStaffRole(u.role)).reduce((a, u) => a + monthlyRecap(db, u, month).total, 0);
      const amountOf = (list) => list.reduce((a, e) => a + (Number(e.amount) || 0), 0);
      const salaryGap = payroll - amountOf(expenses.filter(e => e.category === 'Gaji & Bonus'));
      const costRows = [...new Set(expenses.map(expenseCat))]
        .map(c => [c === DEPOSIT_REFUND ? `${c} dikembalikan` : c, amountOf(expenses.filter(e => expenseCat(e) === c))])
        .sort((a, b) => b[1] - a[1]);

      // Money received in the month by method: sales paid on the spot plus kasbon paid back
      const monthSales = allSalesOf(db).filter(s => isValidSale(s) && saleDay(s) >= from && saleDay(s) <= to);
      const repayments = (db.debt_payments || []).filter(p => { const k = dateKey(new Date(p.date)); return p.kind === 'customer' && k >= from && k <= to; });
      const received = ['qris', 'cash', 'transfer'].map(m => [PAYMENT_LABELS[m],
        monthSales.filter(s => s.payment_method === m).reduce((a, s) => a + s.total, 0) + amountOf(repayments.filter(p => (p.method || 'cash') === m))]);
      const kasbonOpen = db.customers.reduce((a, c) => a + (c.debt || 0), 0);
      const depositOwners = db.customers.filter(c => c.deposit > 0);
      const supplierOwed = db.purchases.reduce((a, p) => a + poOutstanding(p), 0);

      // One definition of the report, so the screen, PDF and Excel always show the same lines
      const sections = [
        { title: '1. Penjualan bersih', rows: [['Harga produk terjual', f.salesNet + f.discount], ['Diskon dan voucher', f.discount, '−']], total: ['Penjualan bersih', f.salesNet], note: `Sudah tanpa pajak. Pajak ${formatIDR(f.taxCollected)} ada di bagian 7.` },
        { title: '2. Pemasukan lain (deposit)', rows: [['Deposit masuk', f.depositIn, '+'], ['Saldo deposit dipakai belanja pelanggan, sudah terhitung di penjualan', f.depositUsed, '−']], total: ['Total pemasukan lain (deposit)', f.depositIn - f.depositUsed] },
        { title: '3. Total pemasukan', rows: [['Penjualan bersih', f.salesNet], ['Pemasukan lain (deposit)', f.depositIn - f.depositUsed, '+']], total: ['Total pemasukan', f.revenue] },
        { title: '4. Laba kotor', rows: [['Total pemasukan', f.revenue], ['HPP (modal produk terjual)', f.hpp, '−']], total: ['Laba kotor', f.grossProfit] },
        { title: '5. Biaya operasional (Pengeluaran)', rows: costRows, total: ['Total biaya operasional (Pengeluaran)', f.expenses],
          warn: salaryGap > 0 ? `Total rekap gaji harusnya ${formatIDR(payroll)}. Ada selisih ${formatIDR(salaryGap)} belum dicatat di pengeluaran.` : null },
        { title: '6. Laba bersih', rows: [['Laba kotor', f.grossProfit], ['Biaya operasional (Pengeluaran)', f.expenses, '−']], result: [f.netProfit >= 0 ? 'Laba bersih' : 'Rugi bersih', f.netProfit] },
        { title: '7. Pencocokan uang', hint: 'tidak mengubah laba', rows: received, total: ['Total uang masuk', received.reduce((a, r) => a + r[1], 0)], note: 'Sudah termasuk pajak dan pelunasan kasbon.',
          more: [['Pajak terkumpul, wajib disetor', f.taxCollected], [`Pelunasan kasbon ${monthLabel(month).split(' ')[0]} (pelanggan bayar kasbon)`, amountOf(repayments)], ['Kasbon pelanggan belum dibayar', kasbonOpen], [`Saldo deposit tersimpan, ${depositOwners.length} pelanggan`, depositOwners.reduce((a, c) => a + c.deposit, 0)]],
          alert: ['Hutang ke supplier', supplierOwed],
          tail: [['Laba bersih', f.netProfit], ['Hutang ke supplier', supplierOwed, '−']], tailTotal: ['Sisa laba bersih jika hutang dilunasi', f.netProfit - supplierOwed] }
      ];

      const exportCsv = async () => {
        const signed = ([label, value, sign]) => [label, sign === '−' ? -value : value];
        const columns = [{ header: 'Keterangan', width: 62 }, { header: 'Nominal', width: 20, t: 'money' }];
        const how = await downloadReport(`Laba_Rugi_${month}`, {
          title: `Laporan Laba Rugi · ${db.business.name}`, subtitle: `${monthLabel(month)} · ${f.count} transaksi`,
          sheets: [
            { name: 'Laba Rugi', tables: sections.flatMap(s => [
              { heading: s.title, columns, rows: [...s.rows.map(signed), ...(s.warn ? [[s.warn, '']] : [])], ...(s.total ? { total: s.total } : { total: s.result }) },
              ...(s.more ? [{ heading: 'Posisi saat ini', columns, rows: [...s.more, s.alert, ...s.tail].map(signed), total: s.tailTotal }] : [])
            ]) },
            { name: 'Pengeluaran', tables: [{
              columns: [{ header: 'Tanggal', width: 16 }, { header: 'Kategori', width: 20 }, { header: 'Catatan', width: 36 }, { header: 'Dicatat oleh', width: 20 }, { header: 'Nominal', width: 16, t: 'money' }],
              rows: expenses.map(e => [fmtDateShort(e.date), expenseCat(e), e.note || '', e.by || '', Number(e.amount) || 0]),
              total: ['Total', '', '', '', expenses.reduce((a, e) => a + (Number(e.amount) || 0), 0)]
            }] }
          ]
        });
        notify(reportDone(how, 'Laporan laba rugi'));
      };

      // Builds a real PDF file and downloads it directly (no print dialog)
      const downloadPdf = async () => {
        setPdfBusy(true);
        try {
          const JsPDF = await ensureJsPdf();
          const doc = new JsPDF({ unit: 'pt', format: 'a4' });
          const rp = pdfMoney;
          const margin = { left: 40, right: 40, top: 40, bottom: 44 };
          await pdfHeader(doc, 'Laporan Laba Rugi', `${db.business.name} · ${monthLabel(month)} · ${f.count} transaksi`);
          const amount = ([, value, sign]) => `${sign === '−' ? '- ' : sign === '+' ? '+ ' : ''}${value < 0 ? `- ${rp(-value)}` : rp(value)}`;
          const line = (cells, styles) => [{ content: cells[0], styles }, { content: amount(cells), styles }];
          const totalStyle = { fontStyle: 'bold', fillColor: [238, 244, 255] };
          const body = sections.flatMap(s => [
            [{ content: s.hint ? `${s.title} (${s.hint})` : s.title, colSpan: 2, styles: { fontStyle: 'bold', fillColor: PDF_BLUE, textColor: 255 } }],
            ...s.rows.map(r => line(r, {})),
            ...(s.total ? [line(s.total, totalStyle)] : []),
            ...(s.result ? [line(s.result, { fontStyle: 'bold', fillColor: s.result[1] >= 0 ? [220, 252, 231] : [255, 228, 230] })] : []),
            ...(s.note ? [[{ content: s.note, colSpan: 2, styles: { fontSize: 9, textColor: 110 } }]] : []),
            ...(s.warn ? [[{ content: s.warn, colSpan: 2, styles: { fontSize: 9, textColor: [146, 64, 14], fillColor: [255, 251, 235] } }]] : []),
            ...(s.more || []).map(r => line(r, {})),
            ...(s.alert ? [line(s.alert, { fontStyle: 'bold', textColor: [190, 18, 60], fillColor: [255, 241, 242] })] : []),
            ...(s.tail || []).map(r => line(r, {})),
            ...(s.tailTotal ? [line(s.tailTotal, totalStyle)] : [])
          ]);
          doc.autoTable({ startY: 90, theme: 'plain', margin, body, rowPageBreak: 'avoid', styles: { fontSize: 10, cellPadding: 5 }, columnStyles: { 1: { halign: 'right', cellWidth: 120 } } });
          let expY = doc.lastAutoTable.finalY + 34;
          if (expY > 700) { doc.addPage(); expY = 50; }
          doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(30);
          doc.text('Rincian Biaya Operasional (Pengeluaran)', 40, expY);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110);
          doc.text(`Semua uang keluar untuk operasional toko selama ${monthLabel(month)}.`, 40, expY + 14);
          doc.autoTable({
            startY: expY + 24, margin, showFoot: 'lastPage',
            head: [['Tanggal', 'Jenis pengeluaran', 'Keterangan', 'Uang keluar']],
            foot: [[{ content: 'Total biaya operasional (Pengeluaran)', colSpan: 3 }, rp(f.expenses)]],
            footStyles: { fillColor: [238, 244, 255], textColor: 30, fontStyle: 'bold', halign: 'right' },
            body: expenses.length ? expenses.map(e => [fmtDateShort(e.date), expenseCat(e), e.note || '-', rp(e.amount)]) : [[{ content: 'Tidak ada pengeluaran bulan ini', colSpan: 4 }]],
            headStyles: { fillColor: PDF_BLUE }, styles: { fontSize: 10 }, columnStyles: { 3: { halign: 'right' } }
          });
          pdfFooter(doc, currentUser.name);
          doc.save(`Laba_Rugi_${db.business.name.replace(/\s+/g, '_')}_${month}.pdf`);
          notify('PDF laba rugi diunduh.');
        } catch {
          notify('PDF gagal dibuat (butuh internet untuk pertama kali). Membuka dialog cetak sebagai gantinya.', 'warn');
          window.print();
        } finally { setPdfBusy(false); }
      };

      const saveExpense = () => {
        if (!expForm.amount) return;
        addExpense(setDb, expForm, currentUser);
        notify(`Pengeluaran ${formatIDR(expForm.amount)} dicatat.`);
        setExpForm(null);
      };

      const lineRow = ([label, value, sign], strong, key) => (
        <div key={key ?? label} className={cx('flex justify-between gap-4 py-2', strong && 'border-t border-slate-300')}>
          <dt className={cx(strong ? 'font-semibold text-slate-900' : 'text-slate-600')}>{label}</dt>
          <dd className={cx('whitespace-nowrap tabular text-slate-900', strong ? 'font-bold' : 'font-medium', value < 0 && 'text-rose-600')}>{sign ? `${sign} ` : ''}{formatIDR(value)}</dd>
        </div>
      );

      return (
        <div className="space-y-5">
          <PageHeader title="Laporan Laba Rugi" desc="Pemasukan, HPP, dan biaya operasional (pengeluaran) per bulan."
            actions={<>
              {isStaffRole(currentUser.role) && <Btn variant="secondary" icon="plus" onClick={() => setExpForm(newExpense())}>Catat pengeluaran</Btn>}
              <Btn variant="secondary" icon="download" onClick={exportCsv}>Excel</Btn>
              <Btn variant="dark" icon="download" onClick={downloadPdf} disabled={pdfBusy}>{pdfBusy ? 'Membuat PDF…' : 'Unduh PDF'}</Btn>
            </>} />
          <Field label="Bulan" className="w-full sm:w-64"><select value={month} onChange={e => setMonth(e.target.value)} className={inputCls}>{months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}</select></Field>
          <div className="grid grid-cols-1 gap-5 lg:grid-cols-2">
            <Card className="print-area p-5">
              <h3 className="text-base font-bold text-slate-900">{db.business.name}</h3>
              <p className="text-sm text-slate-500">Periode {monthLabel(month)} · {f.count} transaksi</p>
              {sections.map(s => (
                <section key={s.title} className="mt-5">
                  <h4 className="flex flex-wrap items-baseline gap-x-2 border-b border-slate-300 pb-1 text-sm font-bold text-slate-900">{s.title}{s.hint && <span className="text-xs font-normal text-slate-500">{s.hint}</span>}</h4>
                  <dl className="text-sm">
                    {s.rows.map(r => lineRow(r))}
                    {s.total && lineRow(s.total, true, 'total')}
                  </dl>
                  {s.note && <p className="text-xs text-slate-500">{s.note}</p>}
                  {s.warn && <p className="mt-1.5 rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-900">{s.warn}</p>}
                  {s.result && (
                    <div className={cx('mt-2 flex justify-between gap-4 rounded-xl p-3', s.result[1] >= 0 ? 'bg-emerald-50' : 'bg-rose-50')}>
                      <span className={cx('font-bold', s.result[1] >= 0 ? 'text-emerald-900' : 'text-rose-900')}>{s.result[0]}</span>
                      <span className={cx('text-lg font-bold tabular', s.result[1] >= 0 ? 'text-emerald-800' : 'text-rose-700')}>{formatIDR(s.result[1])}</span>
                    </div>
                  )}
                  {s.more && <dl className="mt-1 text-sm">{s.more.map(r => lineRow(r))}</dl>}
                  {s.alert && (
                    <div className="mt-2 flex justify-between gap-4 rounded-xl bg-rose-50 p-3 text-sm font-bold text-rose-700">
                      <span>{s.alert[0]}</span><span className="tabular">{formatIDR(s.alert[1])}</span>
                    </div>
                  )}
                  {s.tail && <dl className="mt-1 text-sm">{s.tail.map((r, i) => lineRow(r, false, i))}{lineRow(s.tailTotal, true, 'tail')}</dl>}
                </section>
              ))}
            </Card>
            <Card className="self-start p-5">
              <div className="flex items-baseline justify-between gap-3">
                <h3 className="text-base font-bold text-slate-900">Pengeluaran</h3>
                <span className="text-base font-bold text-rose-600 tabular">{formatIDR(f.expenses)}</span>
              </div>
              {expenses.length === 0 ? <EmptyState icon="finance" title="Belum ada pengeluaran bulan ini" /> : (
                <ul className="mt-3 divide-y divide-slate-100">
                  {expenses.map(e => (
                    <li key={e.id} className="flex items-center justify-between gap-3 py-3 text-sm">
                      <div className="min-w-0"><p className="font-semibold text-slate-900">{expenseCat(e)}</p><p className="truncate text-slate-500">{fmtDateShort(e.date)}{e.note ? ` · ${e.note}` : ''}{e.by ? ` · ${e.by}` : ''}</p></div>
                      <span className="font-semibold text-rose-600 tabular">{formatIDR(e.amount)}</span>
                    </li>
                  ))}
                </ul>
              )}
            </Card>
          </div>

          {expForm && <ExpenseModal form={expForm} setForm={setExpForm} onSave={saveExpense} onClose={() => setExpForm(null)} expenses={db.expenses} />}
        </div>
      );
    }

    // =====================================================================
    // DEBTS
    // =====================================================================
    function AmountPresets({ amount, total, onPick }) {
      const options = [{ label: 'Lunas', value: total }, { label: '50%', value: Math.round(total / 2) }];
      return (
        <div className="flex gap-2" role="group" aria-label="Pilihan nominal cepat">
          {options.map(o => {
            const active = amount === o.value;
            return (
              <button key={o.label} type="button" aria-pressed={active} onClick={() => onPick(o.value)}
                className={cx('inline-flex min-h-[40px] items-center gap-1.5 rounded-xl border px-4 text-sm font-semibold transition-colors', focusRing,
                  active ? 'border-brand-700 bg-brand-700 text-white' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50')}>
                {active && <SvgIcon name="check" className="h-4 w-4" />}{o.label}
              </button>
            );
          })}
        </div>
      );
    }

    function DebtsModule({ db, setDb, notify, currentUser }) {
      const [paying, setPaying] = useState(null);
      const [amount, setAmount] = useState(0);
      const [method, setMethod] = useState('cash');
      const [openId, setOpenId] = useState(null);
      const [pdfFor, setPdfFor] = useState(null);
      const today = dateKey();

      const suppliers = db.suppliers.map(s => {
        const pos = db.purchases.filter(p => p.supplier_id === s.id && p.payment === 'tempo').sort((a, b) => (a.due_date || '').localeCompare(b.due_date || ''));
        const open = pos.filter(p => poOutstanding(p) > 0);
        return { ...s, pos, open, debt: open.reduce((a, p) => a + poOutstanding(p), 0), nextDue: open[0]?.due_date };
      });
      const receivables = db.customers.filter(c => c.debt > 0).map(c => {
        const sales = allSalesOf(db).filter(s => s.payment_method === 'bayar_nanti' && isValidSale(s) && (s.customer_id === c.id || s.customer_name === c.name)).sort((a, b) => new Date(b.date) - new Date(a.date));
        return { ...c, sales };
      });
      const paymentsOf = (kind, id) => (db.debt_payments || []).filter(p => p.kind === kind && p.party_id === id);
      const kasbonStatus = useMemo(() => kasbonStatusMap(db), [db.sales, db.offlineQueue, db.customers]);
      const payRows = useMemo(() => kasbonPayRows(db), [db.debt_payments, db.sales, db.offlineQueue, db.customers]);
      const kasbonLeft = (s) => s.total - payRows.filter(r => r.sale?.id === s.id).reduce((a, r) => a + r.amount, 0);
      // A payment that finished every nota it touched is a settlement; anything else is an instalment
      const settledPayment = (p) => payRows.filter(r => r.pay.id === p.id).every(r => r.settled);

      const debt = paying?.entity.debt || 0;
      const amountError = amount <= 0 ? 'Masukkan nominal.' : amount > debt ? `Melebihi sisa ${formatIDR(debt)}.` : null;

      const confirm = () => {
        if (amountError) return;
        const { kind, entity } = paying;
        const record = { id: generateId('PAY'), kind, party_id: entity.id, amount, method, date: new Date().toISOString(), by: currentUser.name, by_id: currentUser.id, remaining: Math.max(0, debt - amount) };
        setDb(prev => {
          if (kind === 'supplier') {
            // Pay the oldest due purchase orders first
            let left = amount;
            const order = prev.purchases.filter(p => p.supplier_id === entity.id && poOutstanding(p) > 0).sort((a, b) => (a.due_date || '').localeCompare(b.due_date || '')).map(p => p.id);
            const paidMap = {};
            order.forEach(id => { const po = prev.purchases.find(p => p.id === id); const take = Math.min(left, poOutstanding(po)); if (take > 0) { paidMap[id] = take; left -= take; } });
            record.allocations = Object.entries(paidMap).map(([id, amt]) => { const po = prev.purchases.find(p => p.id === id); return { po_number: po.po_number, due_date: po.due_date || '', total: po.total, amount: amt, left: poOutstanding(po) - amt }; });
            return { ...prev, purchases: prev.purchases.map(p => paidMap[p.id] ? { ...p, paid: (p.paid || 0) + paidMap[p.id] } : p), debt_payments: [record, ...(prev.debt_payments || [])] };
          }
          return { ...prev, customers: prev.customers.map(c => c.id === entity.id ? { ...c, debt: Math.max(0, c.debt - amount) } : c), debt_payments: [record, ...(prev.debt_payments || [])] };
        });
        notify(kind === 'supplier' ? `Pembayaran ${formatIDR(amount)} ke ${entity.name} tercatat. Invoice bisa diunduh di riwayat pembayaran.` : `Pelunasan ${formatIDR(amount)} (${PAYMENT_LABELS[method]}) dari ${entity.name} diterima.`);
        if (kind === 'supplier') setOpenId(entity.id);
        setPaying(null);
      };
      const open = (kind, entity) => { setPaying({ kind, entity }); setAmount(entity.debt); setMethod('cash'); };

      // Payment slip for a supplier, laid out like the Laba Rugi PDF
      const downloadInvoice = async (pay, supplier) => {
        setPdfFor(pay.id);
        try {
          const JsPDF = await ensureJsPdf();
          const doc = new JsPDF({ unit: 'pt', format: 'a4' });
          const invNo = `INV-${pay.id.replace(/^PAY-?/, '').slice(-8).toUpperCase()}`;
          await pdfHeader(doc, 'Invoice Pembayaran Hutang', `${db.business.name} · ${fmtDateShort(dateKey(new Date(pay.date)))}`);
          doc.autoTable({
            startY: 95, theme: 'plain', margin: { left: 40, right: 40 },
            head: [['Detail pembayaran', '']], headStyles: { fillColor: PDF_BLUE, textColor: 255, fontStyle: 'bold' },
            styles: { fontSize: 11, cellPadding: 7 }, columnStyles: { 1: { halign: 'right' } },
            body: [
              ['No. invoice', invNo],
              ['Dibayar kepada', supplier.name],
              ['Dibayar oleh', `${db.business.name}${db.business.phone ? ` · ${db.business.phone}` : ''}`],
              ['Tanggal & jam', fmtDateTime(pay.date)],
              ['Metode pembayaran', PAYMENT_LABELS[pay.method] || 'Tunai'],
              ['Dicatat oleh', pay.by || '-'],
              [{ content: 'JUMLAH DIBAYAR', styles: { fontStyle: 'bold', fillColor: [238, 244, 255] } }, { content: pdfMoney(pay.amount), styles: { fontStyle: 'bold', fillColor: [238, 244, 255] } }],
              ...(pay.remaining != null ? [[{ content: 'Sisa hutang setelah pembayaran ini', styles: { textColor: 110 } }, { content: pdfMoney(pay.remaining), styles: { textColor: 110 } }]] : [])
            ]
          });
          if (pay.allocations?.length) {
            const y = doc.lastAutoTable.finalY + 34;
            doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(30);
            doc.text('Rincian pesanan yang dibayar', 40, y);
            doc.setFont('helvetica', 'normal');
            doc.autoTable({
              startY: y + 12, margin: { left: 40, right: 40 },
              head: [['No. Pesanan', 'Jatuh tempo', 'Total pesanan', 'Dibayar', 'Sisa']],
              foot: [[{ content: 'Total dibayar', colSpan: 3 }, pdfMoney(pay.amount), '']],
              footStyles: { fillColor: [238, 244, 255], textColor: 30, fontStyle: 'bold', halign: 'right' },
              body: pay.allocations.map(a => [a.po_number, a.due_date ? fmtDateShort(a.due_date) : '-', pdfMoney(a.total), pdfMoney(a.amount), pdfMoney(a.left)]),
              headStyles: { fillColor: PDF_BLUE }, styles: { fontSize: 10 }, columnStyles: { 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } }
            });
          }
          doc.setFontSize(8); doc.setTextColor(140);
          doc.text(`Dibuat dengan ${APP_NAME} · ${fmtDateTime(new Date().toISOString())}`, 40, 820);
          const tag = `Invoice_${supplier.name.trim().replace(/\s+/g, '_')}_${invNo}`;
          const how = await savePdf(doc, `${tag}.pdf`, `Terima Kasih sudah bermitra dengan ${db.business.name} #${tag}`);
          if (how === 'saved') notify('Invoice PDF diunduh.');
        } catch {
          notify('Invoice gagal dibuat. Pastikan ada internet untuk pertama kali, lalu coba lagi.', 'warn');
        } finally { setPdfFor(null); }
      };

      const PaymentHistory = ({ list, supplier }) => list.length === 0 ? null : (
        <div className="mt-3">
          <p className="text-xs font-semibold uppercase tracking-wide text-slate-500">{supplier ? 'Riwayat pembayaran' : 'Riwayat pembayaran kasbon'}</p>
          <div className="mt-1 overflow-x-auto">
            <table className="w-full min-w-[540px] text-left text-sm">
              <thead className="text-xs text-slate-500">
                <tr>
                  <th scope="col" className="py-1 pr-3 font-medium">Tanggal</th>
                  <th scope="col" className="py-1 pr-3 font-medium">Jam</th>
                  <th scope="col" className="py-1 pr-3 font-medium">Dicatat oleh</th>
                  <th scope="col" className="py-1 pr-3 font-medium">Metode</th>
                  {!supplier && <th scope="col" className="py-1 pr-3 font-medium">Status</th>}
                  <th scope="col" className="py-1 text-right font-medium">Nominal</th>
                  {supplier && <th scope="col" className="py-1 pl-2"><span className="sr-only">Invoice</span></th>}
                </tr>
              </thead>
              <tbody className="text-slate-700">
                {list.map(p => (
                  <tr key={p.id}>
                    <td className="whitespace-nowrap py-1 pr-3 tabular">{fmtDateShort(dateKey(new Date(p.date)))}</td>
                    <td className="whitespace-nowrap py-1 pr-3 tabular">{fmtTime(p.date)}</td>
                    <td className="py-1 pr-3">{p.by}</td>
                    <td className="whitespace-nowrap py-1 pr-3 font-medium text-slate-900">{PAYMENT_LABELS[p.method] || '—'}</td>
                    {!supplier && <td className="py-1 pr-3"><Badge tone={settledPayment(p) ? 'green' : 'amber'}>{settledPayment(p) ? 'Lunas' : 'Dicicil'}</Badge></td>}
                    <td className={cx('whitespace-nowrap py-1 text-right font-semibold tabular', supplier || settledPayment(p) ? 'text-emerald-700' : 'text-amber-700')}>{formatIDR(p.amount)}</td>
                    {supplier && <td className="py-1 pl-2 text-right"><Btn variant="ghost" size="sm" icon="download" onClick={() => downloadInvoice(p, supplier)} disabled={pdfFor === p.id} aria-label={`Unduh invoice pembayaran ${fmtDateTime(p.date)}`}>{pdfFor === p.id ? 'Membuat…' : 'Invoice'}</Btn></td>}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );

      const Toggle = ({ id, children }) => (
        <button type="button" aria-expanded={openId === id} onClick={() => setOpenId(openId === id ? null : id)}
          className={cx('inline-flex min-h-[36px] items-center gap-1 rounded-lg px-2 text-sm font-semibold text-brand-800 hover:bg-brand-50', focusRing)}>
          {children}<SvgIcon name={openId === id ? 'chevUp' : 'chevDown'} className="h-4 w-4" />
        </button>
      );

      return (
        <div className="space-y-5">
          <PageHeader title="Hutang & Piutang" desc="Hutang ke supplier (dari PO tempo) dan kasbon pelanggan." />

          <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <StatCard label="Total hutang ke supplier" value={formatIDR(suppliers.reduce((a, s) => a + s.debt, 0))} sub={`${suppliers.filter(s => s.debt > 0).length} supplier`} icon="purchases" tone="rose" />
            <StatCard label="Total piutang pelanggan" value={formatIDR(receivables.reduce((a, c) => a + c.debt, 0))} sub={`${receivables.length} pelanggan`} icon="customers" tone="amber" />
          </div>

          <Card>
            <div className="border-b border-slate-200 p-4"><h3 className="text-base font-bold text-slate-900">Hutang ke supplier</h3></div>
            <ul className="divide-y divide-slate-100">
              {suppliers.map(s => {
                const overdue = s.nextDue && s.nextDue < today;
                return (
                  <li key={s.id} className="p-4">
                    <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                      <div>
                        <p className="font-semibold text-slate-900">{s.name}</p>
                        <p className="text-sm text-slate-600">{s.phone ? `HP ${s.phone}` : 'Belum ada nomor HP'}{s.address ? ` · ${s.address}` : ''}</p>
                        {s.debt > 0 && <p className="mt-0.5 flex items-center gap-2 text-sm text-slate-500">{s.open.length} pesanan belum lunas · jatuh tempo terdekat {fmtDateShort(s.nextDue)}{overdue && <Badge tone="rose">Terlambat</Badge>}</p>}
                      </div>
                      <div className="flex items-center gap-3 sm:flex-col sm:items-end sm:gap-1.5">
                        <span className={cx('text-base font-bold tabular', s.debt > 0 ? 'text-rose-600' : 'text-slate-400')}>{formatIDR(s.debt)}</span>
                        {s.debt > 0 ? <Btn size="sm" onClick={() => open('supplier', s)}>Bayar</Btn> : <Badge tone="green">Lunas</Badge>}
                      </div>
                    </div>
                    {(s.pos.length > 0 || paymentsOf('supplier', s.id).length > 0) && <div className="mt-2"><Toggle id={s.id}>Rincian hutang & invoice</Toggle></div>}
                    {openId === s.id && (
                      <div className="mt-2 space-y-2 rounded-xl bg-slate-50 p-3">
                        {s.pos.map(po => (
                          <div key={po.id} className="rounded-lg bg-white p-3 ring-1 ring-slate-200">
                            <div className="flex flex-wrap items-center justify-between gap-2 text-sm">
                              <span className="font-mono font-semibold text-slate-900">{po.po_number}</span>
                              <span className="text-slate-600">{fmtDateShort(po.date)} · jatuh tempo {fmtDateShort(po.due_date)}</span>
                            </div>
                            <table className="mt-2 w-full text-sm">
                              <tbody className="divide-y divide-slate-100">
                                {po.items.map((it, i) => (
                                  <tr key={i}><td className="py-1 text-slate-800">{it.name} <span className="text-slate-500">({it.category})</span></td><td className="py-1 text-right text-slate-600 tabular">{it.qty} {it.unit} × {formatIDR(it.unit_cost)}</td><td className="py-1 text-right font-medium tabular">{formatIDR(it.qty * it.unit_cost)}</td></tr>
                                ))}
                              </tbody>
                            </table>
                            <div className="mt-2 flex flex-wrap justify-end gap-x-4 border-t border-slate-100 pt-2 text-sm">
                              <span>Total <span className="font-semibold tabular">{formatIDR(po.total)}</span></span>
                              <span>Dibayar <span className="font-semibold text-emerald-700 tabular">{formatIDR(po.paid || 0)}</span></span>
                              <span>Sisa <span className="font-bold text-rose-600 tabular">{formatIDR(poOutstanding(po))}</span></span>
                            </div>
                          </div>
                        ))}
                        <PaymentHistory list={paymentsOf('supplier', s.id)} supplier={s} />
                      </div>
                    )}
                  </li>
                );
              })}
            </ul>
          </Card>

          <Card>
            <div className="border-b border-slate-200 p-4"><h3 className="text-base font-bold text-slate-900">Piutang pelanggan (kasbon)</h3></div>
            {receivables.length === 0 ? <EmptyState icon="check" title="Tidak ada kasbon terbuka" /> : (
              <ul className="divide-y divide-slate-100">
                {receivables.map(c => (
                  <li key={c.id} className="p-4">
                    <div className="flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <Avatar name={c.name} />
                        <div><p className="font-semibold text-slate-900">{c.name}</p><p className="text-sm text-slate-600">{c.phone} · {c.sales.length} transaksi kasbon</p></div>
                      </div>
                      <div className="flex items-center gap-3"><span className="text-base font-bold text-rose-600 tabular">{formatIDR(c.debt)}</span><Btn size="sm" onClick={() => open('customer', c)}>Terima</Btn></div>
                    </div>
                    <div className="mt-2"><Toggle id={c.id}>Rincian kasbon</Toggle></div>
                    {openId === c.id && (
                      <div className="mt-2 space-y-2 rounded-xl bg-slate-50 p-3">
                        {c.sales.length === 0 && <p className="text-sm text-slate-500">Saldo awal tanpa rincian transaksi.</p>}
                        {c.sales.map(s => (
                          <div key={s.id} className="rounded-lg bg-white p-3 ring-1 ring-slate-200">
                            <div className="flex flex-wrap items-center justify-between gap-2 text-sm">
                              <span className="flex flex-wrap items-center gap-2">
                                <span className="font-mono font-semibold text-slate-900">{s.receipt_no}</span>
                                {kasbonStatus.get(s.id) === 'paid' ? <Badge tone="green">Lunas</Badge> : <Badge tone="rose">Kasbon</Badge>}
                              </span>
                              <span className="text-slate-600">{fmtDateTime(s.date)} · kasir {s.cashier}</span>
                            </div>
                            <ul className="mt-2 space-y-0.5 text-sm">
                              {s.items.map((it, i) => <li key={i} className="flex justify-between gap-2"><span className="text-slate-800">{it.name} <span className="text-slate-500">× {it.qty}</span></span><span className="tabular">{formatIDR(it.qty * it.sell_price)}</span></li>)}
                            </ul>
                            <p className="mt-2 flex flex-wrap justify-end gap-x-4 border-t border-slate-100 pt-2 text-sm">
                              <span>Total nota <span className="font-semibold tabular">{formatIDR(s.total)}</span></span>
                              {kasbonStatus.get(s.id) === 'partial' && <span>Sisa <span className="font-bold text-rose-600 tabular">{formatIDR(kasbonLeft(s))}</span></span>}
                            </p>
                          </div>
                        ))}
                        <PaymentHistory list={paymentsOf('customer', c.id)} />
                      </div>
                    )}
                  </li>
                ))}
              </ul>
            )}
          </Card>

          {paying && (
            <Modal title={paying.kind === 'supplier' ? 'Bayar hutang supplier' : 'Terima pelunasan kasbon'} desc={paying.entity.name} onClose={() => setPaying(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setPaying(null)}>Batal</Btn><Btn onClick={confirm} disabled={!!amountError}>Konfirmasi {amount > 0 && !amountError ? formatIDR(amount) : ''}</Btn></>}>
              <div className="space-y-4">
                <div className="flex justify-between rounded-xl bg-rose-50 p-3 text-sm"><span className="text-rose-900">Sisa {paying.kind === 'supplier' ? 'hutang' : 'kasbon'}</span><span className="font-bold text-rose-700 tabular">{formatIDR(debt)}</span></div>
                <AmountPresets amount={amount} total={debt} onPick={setAmount} />
                <Field label="Nominal pembayaran" error={amountError} hint={!amountError && amount < debt ? `Sisa setelah bayar ${formatIDR(debt - amount)}` : null}><MoneyInput autoFocus value={amount} onChange={setAmount} /></Field>
                <div>
                  <span className="text-sm font-medium text-slate-700">Metode pembayaran</span>
                  <div role="radiogroup" aria-label="Metode pembayaran" className="mt-1.5 grid grid-cols-3 gap-2">
                    {[['cash', 'cash'], ['qris', 'qr'], ['transfer', 'bank']].map(([m, icon]) => (
                      <button key={m} type="button" role="radio" aria-checked={method === m} onClick={() => setMethod(m)}
                        className={cx('flex min-h-[44px] items-center justify-center gap-2 rounded-xl border text-sm font-semibold transition-colors', focusRing,
                          method === m ? 'border-brand-700 bg-brand-50 text-brand-800 shadow-[inset_0_0_0_1px_#1440c8]' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50')}>
                        <SvgIcon name={icon} className="h-4 w-4" />{PAYMENT_LABELS[m]}
                      </button>
                    ))}
                  </div>
                </div>
                {paying.kind === 'supplier' && <p className="text-xs text-slate-500">Pembayaran dialokasikan ke pesanan dengan jatuh tempo paling awal.</p>}
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // PROMO & SALES TARGETS
    // =====================================================================
    const promoStatus = (p, today = dateKey()) => !p.active ? { label: 'Nonaktif', tone: 'slate' } : p.end < today ? { label: 'Selesai', tone: 'slate' } : p.start > today ? { label: 'Terjadwal', tone: 'blue' } : { label: 'Berjalan', tone: 'green' };

    function IncentivesModule({ db, setDb, notify, isOwner }) {
      const kasir = db.users.filter(u => isStaffRole(u.role));
      const [modal, setModal] = useState(null);
      const [coupon, setCoupon] = useState({ code: '', type: 'percent', val: 10, min_spend: 50000 });
      const [inc, setInc] = useState({ employee: kasir[0]?.name || '', target: 10000000, bonus: 200000 });
      const [promo, setPromo] = useState(null);
      const [confirmDelCoupon, setConfirmDelCoupon] = useState(false);
      const [confirmDelInc, setConfirmDelInc] = useState(false);
      const [confirmDelPromo, setConfirmDelPromo] = useState(false);
      const [productQuery, setProductQuery] = useState('');
      const ym = dateKey().slice(0, 7);
      const codeTaken = db.coupons.some(c => c.code === coupon.code && c.id !== coupon.id);
      const couponError = !coupon.code ? 'Kode wajib diisi.' : codeTaken ? 'Kode sudah dipakai.' : null;
      const salesBy = (name) => allSalesOf(db).filter(s => isValidSale(s) && s.cashier === name && saleDay(s).startsWith(ym)).reduce((a, s) => a + s.total, 0);
      const seasonal = db.seasonal_promos || [];

      const promoErrors = promo ? {
        name: !promo.name.trim() ? 'Nama promo wajib diisi.' : null,
        value: !(promo.value > 0) ? 'Isi besar potongan.' : promo.type === 'percent' && promo.value > 90 ? 'Maksimal 90%.' : null,
        dates: promo.end < promo.start ? 'Tanggal berakhir harus setelah tanggal mulai.' : null,
        products: promo.scope === 'products' && promo.product_ids.length === 0 ? 'Pilih minimal satu produk.' : null
      } : {};
      const promoInvalid = Object.values(promoErrors).some(Boolean);

      const saveCoupon = () => {
        if (couponError) return;
        setDb(prev => ({ ...prev, coupons: coupon.id ? prev.coupons.map(c => c.id === coupon.id ? coupon : c) : [...prev.coupons, { id: generateId('CP'), ...coupon, active: true }] }));
        notify(`Kode voucher ${coupon.code} ${coupon.id ? 'diperbarui' : 'dibuat'}.`); setModal(null);
      };
      const deleteCoupon = () => {
        setDb(prev => ({ ...prev, coupons: prev.coupons.filter(c => c.id !== coupon.id) }));
        notify(`Kode voucher ${coupon.code} dihapus.`, 'info'); setModal(null);
      };
      const saveIncentive = () => {
        if (!inc.employee || !inc.target) return;
        const userId = db.users.find(u => u.name === inc.employee)?.id;
        const record = { employee: inc.employee, target_sales: inc.target, bonus_amount: inc.bonus };
        setDb(prev => withStaffNotif({
          ...prev,
          employeeIncentives: inc.id ? prev.employeeIncentives.map(i => i.id === inc.id ? { ...i, ...record } : i) : [...prev.employeeIncentives, { id: generateId('INC'), ...record, status: 'Aktif', note: 'Target omzet bulanan' }]
        }, userId, { icon: 'incentives', tone: 'blue', title: inc.id ? 'Target penjualan diubah' : 'Target penjualan baru', msg: `Target ${formatIDR(inc.target)} bulan ini, bonus ${formatIDR(inc.bonus)} jika tercapai.`, go: 'incentives' }));
        notify(`Target untuk ${inc.employee} ${inc.id ? 'diperbarui' : 'dibuat'}.`); setModal(null);
      };
      const deleteIncentive = () => {
        setDb(prev => ({ ...prev, employeeIncentives: prev.employeeIncentives.filter(i => i.id !== inc.id) }));
        notify(`Target ${inc.employee} dihapus.`, 'info'); setModal(null);
      };
      const savePromo = () => {
        if (promoInvalid) return;
        const clean = { ...promo, name: promo.name.trim(), product_ids: promo.scope === 'all' ? [] : promo.product_ids };
        setDb(prev => ({ ...prev, seasonal_promos: clean.id ? prev.seasonal_promos.map(p => p.id === clean.id ? clean : p) : [{ ...clean, id: generateId('SP') }, ...(prev.seasonal_promos || [])] }));
        notify(`Promo "${clean.name}" disimpan.`); setPromo(null);
      };
      const deletePromo = () => {
        setDb(prev => ({ ...prev, seasonal_promos: (prev.seasonal_promos || []).filter(p => p.id !== promo.id) }));
        notify(`Promo "${promo.name}" dihapus.`, 'info'); setPromo(null);
      };
      const toggleCoupon = (id) => setDb(prev => ({ ...prev, coupons: prev.coupons.map(c => c.id === id ? { ...c, active: !c.active } : c) }));
      const togglePromo = (id) => setDb(prev => ({ ...prev, seasonal_promos: prev.seasonal_promos.map(p => p.id === id ? { ...p, active: !p.active } : p) }));
      const toggleProduct = (id) => setPromo(p => ({ ...p, product_ids: p.product_ids.includes(id) ? p.product_ids.filter(x => x !== id) : [...p.product_ids, id] }));

      const pq = productQuery.trim().toLowerCase();

      return (
        <div className="space-y-5">
          <PageHeader title="Promo & Target Penjualan" desc="Promo musiman, kode voucher, dan target bonus kasir."
            actions={isOwner && <>
              <Btn icon="plus" onClick={() => { setProductQuery(''); setPromo({ name: '', type: 'percent', value: 10, start: dateKey(), end: addDays(dateKey(), 7), scope: 'all', product_ids: [], active: true }); }}>Promo musiman</Btn>
              <Btn variant="secondary" icon="plus" onClick={() => { setCoupon({ code: '', type: 'percent', val: 10, min_spend: 50000 }); setModal('coupon'); }}>Kode voucher</Btn>
              <Btn variant="secondary" icon="plus" onClick={() => { setInc({ employee: kasir[0]?.name || '', target: 10000000, bonus: 200000 }); setConfirmDelInc(false); setModal('incentive'); }}>Target kasir</Btn>
            </>} />

          <Card className="p-5">
            <h3 className="text-base font-bold text-slate-900">Promo musiman</h3>
            <p className="text-sm text-slate-600">Harga otomatis dicoret di kasir selama periode promo berjalan.</p>
            {seasonal.length === 0 ? <EmptyState icon="calendar" title="Belum ada promo musiman" desc="Cocok untuk Ramadan, akhir tahun, atau ulang tahun toko." /> : (
              <ul className="mt-3 divide-y divide-slate-100">
                {seasonal.map(p => {
                  const st = promoStatus(p);
                  const names = p.scope === 'all' ? 'Semua produk' : p.product_ids.map(id => db.products.find(x => x.id === id)?.name).filter(Boolean).join(', ');
                  return (
                    <li key={p.id} className="flex flex-col gap-3 py-3 sm:flex-row sm:items-center sm:justify-between">
                      <div className="min-w-0">
                        <p className="flex flex-wrap items-center gap-2 font-semibold text-slate-900">{p.name}<Badge tone={st.tone}>{st.label}</Badge></p>
                        <p className="text-sm text-slate-600"><span className="font-semibold text-rose-600">{p.type === 'percent' ? `Diskon ${p.value}%` : `Potongan ${formatIDR(p.value)}`}</span> · {fmtDateShort(p.start)} – {fmtDateShort(p.end)}</p>
                        <p className="truncate text-xs text-slate-500">{names}</p>
                      </div>
                      {isOwner && <div className="flex items-center gap-2">
                        <Btn variant="ghost" size="sm" icon="edit" onClick={() => { setProductQuery(''); setConfirmDelPromo(false); setPromo({ ...p }); }} aria-label={`Edit atau hapus ${p.name}`}>Edit</Btn>
                        <Switch checked={p.active} onChange={() => togglePromo(p.id)} label={`Aktifkan ${p.name}`} />
                      </div>}
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>

          <Card className="p-5">
            <h3 className="text-base font-bold text-slate-900">Kode voucher</h3>
            <p className="text-sm text-slate-600">Dimasukkan kasir di layar pembayaran.</p>
            <ul className="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3">
              {db.coupons.map(cp => (
                <li key={cp.id} className={cx('flex items-center justify-between gap-3 rounded-xl border-2 border-dashed p-4', cp.active ? 'border-brand-300 bg-brand-50' : 'border-slate-200 bg-slate-50')}>
                  <div className="min-w-0">
                    <p className="flex items-center gap-1 font-mono text-base font-bold tracking-wider text-slate-900">{cp.code}
                      <IconBtn icon="copy" label={`Salin kode ${cp.code}`} iconClass="h-4 w-4" className="h-8 w-8 text-slate-500 hover:bg-white hover:text-brand-700"
                        onClick={async () => notify(await copyText(cp.code) ? `Kode ${cp.code} disalin.` : 'Gagal menyalin. Salin manual ya.', 'info')} />
                    </p>
                    <p className="text-sm font-semibold text-brand-800">{cp.type === 'percent' ? `Diskon ${cp.val}%` : `Potongan ${formatIDR(cp.val)}`}</p>
                    <p className="text-xs text-slate-500">Min. belanja {formatIDR(cp.min_spend)}</p>
                  </div>
                  {isOwner ? <div className="flex flex-shrink-0 items-center gap-1">
                    <IconBtn icon="edit" label={`Edit atau hapus ${cp.code}`} iconClass="h-4 w-4" onClick={() => { setCoupon({ ...cp }); setConfirmDelCoupon(false); setModal('coupon'); }} className="h-9 w-9" />
                    <Switch checked={cp.active} onChange={() => toggleCoupon(cp.id)} label={`Aktifkan ${cp.code}`} />
                  </div> : <Badge tone={cp.active ? 'green' : 'slate'}>{cp.active ? 'Aktif' : 'Nonaktif'}</Badge>}
                </li>
              ))}
            </ul>
          </Card>

          <Card className="p-5">
            <h3 className="text-base font-bold text-slate-900">Target penjualan kasir · {monthLabel(ym)}</h3>
            {db.employeeIncentives.length === 0 ? <EmptyState icon="users" title="Belum ada target" /> : (
              <ul className="mt-3 space-y-3">
                {db.employeeIncentives.map(i => {
                  const achieved = salesBy(i.employee);
                  const pct = Math.min(100, Math.round((achieved / i.target_sales) * 100)) || 0;
                  return (
                    <li key={i.id} className="rounded-xl border border-slate-200 p-4">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div><p className="font-semibold text-slate-900">{i.employee}</p><p className="text-sm text-slate-600">Bonus {formatIDR(i.bonus_amount)} jika tercapai</p></div>
                        <div className="flex items-center gap-1">
                          <Badge tone={pct >= 100 ? 'green' : 'blue'}>{pct >= 100 ? 'Tercapai' : `${pct}%`}</Badge>
                          {isOwner && <IconBtn icon="edit" label={`Edit atau hapus target ${i.employee}`} iconClass="h-4 w-4" className="h-9 w-9"
                            onClick={() => { setInc({ id: i.id, employee: i.employee, target: i.target_sales, bonus: i.bonus_amount }); setConfirmDelInc(false); setModal('incentive'); }} />}
                        </div>
                      </div>
                      <div className="mt-3 flex justify-between text-xs text-slate-600"><span className="tabular">{formatIDR(achieved)}</span><span className="tabular">Target {formatIDR(i.target_sales)}</span></div>
                      <div className="mt-1 h-2 overflow-hidden rounded-full bg-slate-100" role="progressbar" aria-valuenow={pct} aria-valuemin={0} aria-valuemax={100} aria-label={`Progres target ${i.employee}`}>
                        <div className="h-full rounded-full bg-indigo-600" style={{ width: `${pct}%` }} />
                      </div>
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>

          {promo && (
            <Modal title={promo.id ? 'Edit promo musiman' : 'Promo musiman baru'} size="lg" onClose={() => setPromo(null)}
              footer={confirmDelPromo ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus promo ini? Harga di kasir kembali normal.</p>
                <Btn variant="secondary" onClick={() => setConfirmDelPromo(false)}>Batal</Btn>
                <Btn variant="danger" onClick={deletePromo}>Ya, hapus</Btn>
              </> : <>
                {promo.id && <Btn variant="ghost" icon="trash" className="text-rose-700 hover:bg-rose-50" onClick={() => setConfirmDelPromo(true)}>Hapus</Btn>}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={() => setPromo(null)}>Batal</Btn>
                <Btn onClick={savePromo} disabled={promoInvalid}>Simpan promo</Btn>
              </>}>
              <div className="space-y-4">
                <Field label="Nama promo" error={promo.name ? null : promoErrors.name}><input autoFocus value={promo.name} onChange={e => setPromo({ ...promo, name: e.target.value })} className={inputCls} placeholder="cth. Promo Ramadan" /></Field>
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Jenis potongan"><select value={promo.type} onChange={e => setPromo({ ...promo, type: e.target.value, value: 0 })} className={inputCls}><option value="percent">Persen (%)</option><option value="fixed">Nominal per produk (Rp)</option></select></Field>
                  <Field label={promo.type === 'percent' ? 'Besar diskon (%)' : 'Potongan per produk'} error={promoErrors.value}>
                    {promo.type === 'percent'
                      ? <input type="number" min="1" max="90" value={promo.value || ''} onChange={e => setPromo({ ...promo, value: parseInt(e.target.value, 10) || 0 })} className={cx(inputCls, 'tabular')} />
                      : <MoneyInput value={promo.value} onChange={v => setPromo({ ...promo, value: v })} />}
                  </Field>
                  <Field label="Tanggal mulai"><input type="date" value={promo.start} onChange={e => setPromo({ ...promo, start: e.target.value })} className={inputCls} /></Field>
                  <Field label="Tanggal berakhir" error={promoErrors.dates}><input type="date" value={promo.end} min={promo.start} onChange={e => setPromo({ ...promo, end: e.target.value })} className={inputCls} /></Field>
                </div>
                <div>
                  <span className="text-sm font-medium text-slate-700">Berlaku untuk</span>
                  <div className="mt-1.5"><SegmentedControl size="md" label="Cakupan promo" value={promo.scope} onChange={v => setPromo({ ...promo, scope: v })} options={[{ value: 'all', label: 'Semua produk' }, { value: 'products', label: `Produk tertentu${promo.product_ids.length ? ` (${promo.product_ids.length})` : ''}` }]} /></div>
                </div>
                {promo.scope === 'products' && (
                  <div>
                    <SearchInput id="promo-prod" value={productQuery} onChange={setProductQuery} placeholder="Cari produk…" />
                    <ul className="mt-2 max-h-64 divide-y divide-slate-100 overflow-y-auto rounded-xl border border-slate-200">
                      {db.products.filter(p => !pq || p.name.toLowerCase().includes(pq) || p.sku.toLowerCase().includes(pq)).map(p => {
                        const checked = promo.product_ids.includes(p.id);
                        const after = promo.type === 'percent' ? Math.round(p.sell_price * (1 - (promo.value || 0) / 100)) : Math.max(0, p.sell_price - (promo.value || 0));
                        return (
                          <li key={p.id}>
                            <label className={cx('flex min-h-[48px] cursor-pointer items-center gap-3 px-3 py-2', checked && 'bg-brand-50')}>
                              <input type="checkbox" checked={checked} onChange={() => toggleProduct(p.id)} className="h-4 w-4 rounded accent-brand-700" />
                              <ProductThumb product={p} className="h-8 w-8 rounded-md" textClass="text-[10px]" />
                              <span className="flex-1 text-sm text-slate-800">{p.name}</span>
                              <span className="text-xs text-slate-500 tabular"><span className="line-through">{formatIDR(p.sell_price)}</span> → <span className="font-semibold text-rose-600">{formatIDR(after)}</span></span>
                            </label>
                          </li>
                        );
                      })}
                    </ul>
                    {promoErrors.products && <p className="mt-1 text-xs font-medium text-rose-600" role="alert">{promoErrors.products}</p>}
                  </div>

            </Modal>

          {modal === 'coupon' && (
            <Modal title={coupon.id ? `Edit voucher ${coupon.code}` : 'Buat kode voucher'} onClose={() => setModal(null)}
              footer={confirmDelCoupon ? <>

                <Btn variant="secondary" onClick={() => setConfirmDelCoupon(false)}>Batal</Btn>
                <Btn variant="danger" onClick={deleteCoupon}>Ya, hapus</Btn>

                {coupon.id && <Btn variant="ghost" icon="trash" className="text-rose-700 hover:bg-rose-50" onClick={() => setConfirmDelCoupon(true)}>Hapus</Btn>}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={() => setModal(null)}>Batal</Btn>
                <Btn onClick={saveCoupon} disabled={!!couponError}>Simpan</Btn>
              </>}>
              <div className="space-y-4">
                <Field label="Kode voucher" error={coupon.code ? couponError : null} hint="Huruf kapital tanpa spasi, cth. HEMAT20"><input autoFocus value={coupon.code} onChange={e => setCoupon({ ...coupon, code: e.target.value.toUpperCase().replace(/\s/g, '') })} className={cx(inputCls, 'font-mono tracking-wider')} /></Field>
                <Field label="Jenis potongan"><select value={coupon.type} onChange={e => setCoupon({ ...coupon, type: e.target.value, val: 0 })} className={inputCls}><option value="percent">Persentase (%)</option><option value="fixed">Nominal tetap (Rp)</option></select></Field>
                <Field label={coupon.type === 'percent' ? 'Besar diskon (%)' : 'Besar potongan'}>
                  {coupon.type === 'percent'
                    ? <input type="number" min="1" max="100" value={coupon.val || ''} onChange={e => setCoupon({ ...coupon, val: Math.min(100, parseInt(e.target.value, 10) || 0) })} className={cx(inputCls, 'tabular')} />
                    : <MoneyInput value={coupon.val} onChange={v => setCoupon({ ...coupon, val: v })} />}

            </Modal>

          {modal === 'incentive' && (
            <Modal title={inc.id ? `Edit target ${inc.employee}` : 'Buat target penjualan'} onClose={() => setModal(null)}
              footer={confirmDelInc ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus target ini?</p>
                <Btn variant="secondary" onClick={() => setConfirmDelInc(false)}>Batal</Btn>
                <Btn variant="danger" onClick={deleteIncentive}>Ya, hapus</Btn>

                <span className="flex-1" />
                <Btn variant="secondary" onClick={() => setModal(null)}>Batal</Btn>
                <Btn onClick={saveIncentive} disabled={!inc.employee || !inc.target}>Simpan</Btn>
              </>}>
              <div className="space-y-4">
                <Field label="Kasir"><select value={inc.employee} onChange={e => setInc({ ...inc, employee: e.target.value })} className={inputCls}>{kasir.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}</select></Field>
                <Field label="Target omzet bulanan"><MoneyInput value={inc.target} onChange={v => setInc({ ...inc, target: v })} /></Field>
                <Field label="Bonus jika tercapai"><MoneyInput value={inc.bonus} onChange={v => setInc({ ...inc, bonus: v })} /></Field>
              </div>
