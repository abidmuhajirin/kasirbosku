                <p className="flex items-start gap-3 text-sm text-purple-900"><SvgIcon name="gift" className="mt-0.5 h-5 w-5 flex-shrink-0" /><span><span className="font-semibold">{perfect.map(x => x.u.name).join(', ')}</span> tidak pernah terlambat bulan ini. Layak diberi reward Tepat Waktu.</span></p>
                <Btn size="sm" onClick={() => setRewardForm({ user_id: perfect[0].u.id, type: 'Tepat Waktu', amount: 100000, note: `Tidak pernah terlambat ${monthLabel(month)}` })}>Beri reward</Btn>
              </div>
            )}
            <Card>
              <div className="overflow-x-auto">
                <table className="w-full min-w-[1080px] text-left text-sm">
                  <thead className="bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-600">
                    <tr>
                      <th scope="col" className="px-4 py-3">Karyawan</th><th scope="col" className="px-4 py-3 text-right">Hadir</th><th scope="col" className="px-4 py-3 text-right">Telat</th><th scope="col" className="px-4 py-3 text-right">Sakit</th><th scope="col" className="px-4 py-3 text-right">Izin</th><th scope="col" className="px-4 py-3 text-right">Alpha</th>
                      <th scope="col" className="px-4 py-3 text-right">Jam kerja</th><th scope="col" className="px-4 py-3 text-right">Lembur</th><th scope="col" className="px-4 py-3 text-right">Upah lembur</th>
                      <th scope="col" className="px-4 py-3 text-right">Reward</th><th scope="col" className="px-4 py-3 text-right">Gaji pokok</th><th scope="col" className="px-4 py-3 text-right">Total</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {recaps.map(({ u, r }) => (
                      <tr key={u.id} className="hover:bg-slate-50">
                        <td className="px-4 py-3"><div className="flex items-center gap-2"><Avatar name={u.name} className="h-8 w-8 text-xs" /><div><p className="font-semibold text-slate-900">{u.name}</p><p className="text-xs text-slate-500">{shiftOf(u, work).name}</p></div></div></td>
                        <td className="px-4 py-3 text-right tabular">{r.present}</td>
                        <td className={cx('px-4 py-3 text-right tabular', r.lateDays && 'font-semibold text-amber-700')}>{r.lateDays}</td>
                        <td className="px-4 py-3 text-right tabular">{r.sick}</td>
                        <td className="px-4 py-3 text-right tabular">{r.permit}</td>
                        <td className={cx('px-4 py-3 text-right tabular', r.alpha && 'font-semibold text-rose-600')}>{r.alpha}</td>
                        <td className="px-4 py-3 text-right tabular">{(r.worked / 60).toFixed(0)} jam</td>
                        <td className="px-4 py-3 text-right tabular">{fmtDuration(r.otMinutes)}{r.otPending ? <span className="block text-xs text-amber-700">{r.otPending} menunggu</span> : null}</td>
                        <td className="px-4 py-3 text-right tabular">{formatIDR(r.otPay)}</td>
                        <td className="px-4 py-3 text-right tabular">{formatIDR(r.reward)}</td>
                        <td className="px-4 py-3 text-right tabular">{formatIDR(u.base_salary)}</td>
                        <td className="px-4 py-3 text-right font-bold text-slate-900 tabular">{formatIDR(r.total)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <p className="border-t border-slate-100 p-4 text-xs text-slate-500">Upah lembur {formatIDR(work.overtime_rate)}/jam, hanya lembur yang disetujui. Bonus target penjualan dicatat terpisah di Promo & Target.</p>
            </Card>
            <Card>
              <div className="flex items-center justify-between border-b border-slate-200 p-4">
                <h3 className="text-base font-bold text-slate-900">Sakit, izin & alpha · {monthLabel(month)}</h3>
                <Btn variant="secondary" size="sm" icon="calendar" onClick={() => setLeaveForm({ user_id: staff[0]?.id || '', type: 'izin', from: todayKey, to: todayKey, note: '' })}>Catat</Btn>
              </div>
              {(() => {
                const list = (db.leaves || []).filter(l => l.date.startsWith(month)).sort((a, b) => b.date.localeCompare(a.date));
                return list.length === 0 ? <p className="p-4 text-sm text-slate-500">Tidak ada catatan di bulan ini.</p> : (
                  <ul className="divide-y divide-slate-100">
                    {list.map(l => (
                      <li key={l.id} className="flex items-center justify-between gap-3 px-4 py-2.5 text-sm">
                        <span className="flex min-w-0 items-center gap-2">
                          <Badge tone={LEAVE_TYPES[l.type].tone}>{LEAVE_TYPES[l.type].label}</Badge>
                          <span className="truncate text-slate-800">{db.users.find(u => u.id === l.user_id)?.name || '—'} · {fmtDateShort(l.date)}{l.note ? ` · ${l.note}` : ''}</span>
                        </span>
                        <IconBtn icon="trash" label="Hapus catatan" iconClass="h-4 w-4" onClick={() => removeLeave(l)} className="h-9 w-9 text-slate-400 hover:bg-rose-50 hover:text-rose-600" />
                      </li>
                    ))}
                  </ul>
                );
              })()}
            </Card>
          </div>
        );
      };

      const OvertimeView = () => {
        const sorted = [...db.overtime].sort((a, b) => (a.status === 'pending') === (b.status === 'pending') ? b.date.localeCompare(a.date) : a.status === 'pending' ? -1 : 1).slice(0, 40);
        return (
          <Card>
            {sorted.length === 0 ? <EmptyState icon="clock" title="Belum ada pengajuan lembur" /> : (
              <ul className="divide-y divide-slate-100">
                {sorted.map(o => {
                  const u = db.users.find(x => x.id === o.user_id);
                  return (
                    <li key={o.id} className="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between">
                      <div className="flex items-center gap-3">
                        <Avatar name={u?.name || '?'} />
                        <div>
                          <p className="font-semibold text-slate-900">{u?.name} · {fmtDuration(o.minutes)}</p>
                          <p className="text-sm text-slate-600">{fmtDateShort(o.date)} · {formatIDR(Math.round(o.minutes / 60 * work.overtime_rate))}{o.owner_note ? ` · ${o.owner_note}` : ''}</p>
                        </div>
                      </div>
                      {o.status === 'pending' ? (
                        <div className="flex gap-2">
                          <Btn variant="secondary" size="sm" onClick={() => setRejecting({ ot: o, note: '' })}>Tolak</Btn>
                          <Btn size="sm" icon="check" onClick={() => decideOt(o, 'approved')}>Setujui</Btn>
                        </div>
                      ) : <Badge tone={o.status === 'approved' ? 'green' : 'rose'}>{o.status === 'approved' ? 'Disetujui' : 'Ditolak'}</Badge>}
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>
        );
      };

      const RewardsView = () => (
        <div className="space-y-4">
          <div className="flex justify-end"><Btn icon="gift" onClick={() => setRewardForm({ user_id: staff[0]?.id || '', type: 'Karyawan Teladan', amount: 100000, note: '' })}>Beri reward</Btn></div>
          <Card>
            {db.rewards.length === 0 ? <EmptyState icon="gift" title="Belum ada reward" desc="Apresiasi karyawan yang rajin agar tim makin semangat." /> : (
              <ul className="divide-y divide-slate-100">
                {db.rewards.map(r => {
                  const u = db.users.find(x => x.id === r.user_id);
                  return (
                    <li key={r.id} className="flex items-center justify-between gap-3 p-4">
                      <div className="flex items-center gap-3">
                        <span className="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-xl bg-purple-50 text-purple-700"><SvgIcon name="gift" className="h-5 w-5" /></span>
                        <div><p className="font-semibold text-slate-900">{r.type} · {u?.name}</p><p className="text-sm text-slate-600">{fmtDateShort(r.date)}{r.note ? ` · ${r.note}` : ''}</p></div>
                      </div>
                      <span className="font-bold text-purple-700 tabular">{formatIDR(r.amount)}</span>
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>
        </div>
      );

      return (
        <div className="space-y-5">
          <PageHeader title="Absensi, Lembur & Reward" desc={isOwner ? 'Pantau kehadiran per shift, atur jadwal, setujui lembur, dan beri apresiasi.' : 'Absen, lihat lembur, dan reward Anda.'} />
          {tabs.length > 1 && <SegmentedControl label="Bagian" size="md" value={tab} onChange={setTab} options={tabs} />}
          {tab === 'me' && MyView()}
          {tab === 'today' && TodayView()}
          {tab === 'schedule' && ScheduleView()}
          {tab === 'recap' && RecapView()}
          {tab === 'overtime' && OvertimeView()}
          {tab === 'rewards' && RewardsView()}

          {rewardForm && (
            <Modal title="Beri reward" onClose={() => setRewardForm(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setRewardForm(null)}>Batal</Btn><Btn icon="gift" onClick={giveReward} disabled={!rewardForm.user_id || !rewardForm.amount}>Simpan</Btn></>}>
              <div className="space-y-4">
                <Field label="Karyawan"><select value={rewardForm.user_id} onChange={e => setRewardForm({ ...rewardForm, user_id: e.target.value })} className={inputCls}>{staff.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</select></Field>
                <Field label="Jenis reward"><select value={rewardForm.type} onChange={e => setRewardForm({ ...rewardForm, type: e.target.value })} className={inputCls}>{REWARD_TYPES.map(t => <option key={t}>{t}</option>)}</select></Field>
                <Field label="Nominal" hint="Masuk ke rekap gaji bulan ini."><MoneyInput value={rewardForm.amount} onChange={v => setRewardForm({ ...rewardForm, amount: v })} /></Field>
                <Field label="Catatan"><input value={rewardForm.note} onChange={e => setRewardForm({ ...rewardForm, note: e.target.value })} className={inputCls} placeholder="cth. pelayanan ramah, dapat pujian pelanggan" /></Field>
              </div>
            </Modal>
          )}

          {leaveForm && (
            <Modal title="Liburkan karyawan" desc="Catat karyawan yang sakit, izin, atau tidak hadir tanpa keterangan." onClose={() => setLeaveForm(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setLeaveForm(null)}>Batal</Btn><Btn icon="calendar" onClick={saveLeave} disabled={!leaveForm.user_id || leaveForm.to < leaveForm.from}>Simpan</Btn></>}>
              <div className="space-y-4">
                <Field label="Karyawan"><select value={leaveForm.user_id} onChange={e => setLeaveForm({ ...leaveForm, user_id: e.target.value })} className={inputCls}>{staff.map(u => <option key={u.id} value={u.id}>{u.name} · {ROLE_LABELS[u.role]}</option>)}</select></Field>
                <div>
                  <span className="text-sm font-medium text-slate-700">Jenis</span>
                  <div className="mt-1.5"><SegmentedControl size="md" label="Jenis ketidakhadiran" value={leaveForm.type} onChange={v => setLeaveForm({ ...leaveForm, type: v })} options={Object.entries(LEAVE_TYPES).map(([value, t]) => ({ value, label: t.label }))} /></div>
                  <p className="mt-1 text-xs text-slate-500">{LEAVE_TYPES[leaveForm.type].desc}</p>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Dari tanggal"><input type="date" value={leaveForm.from} onChange={e => setLeaveForm({ ...leaveForm, from: e.target.value, to: e.target.value > leaveForm.to ? e.target.value : leaveForm.to })} className={inputCls} /></Field>
                  <Field label="Sampai tanggal" error={leaveForm.to < leaveForm.from ? 'Harus sama atau setelah tanggal mulai.' : null}><input type="date" min={leaveForm.from} value={leaveForm.to} onChange={e => setLeaveForm({ ...leaveForm, to: e.target.value })} className={inputCls} /></Field>
                </div>
                <Field label="Keterangan" hint="Opsional, cth. ada surat dokter, acara keluarga."><input value={leaveForm.note} onChange={e => setLeaveForm({ ...leaveForm, note: e.target.value })} className={inputCls} /></Field>
                <p className="text-xs text-slate-500">Karyawan akan menerima pemberitahuan di lonceng notifikasinya.</p>
              </div>
            </Modal>
          )}

          {rejecting && (
            <Modal title="Tolak lembur?" desc={`${db.users.find(u => u.id === rejecting.ot.user_id)?.name} · ${fmtDuration(rejecting.ot.minutes)}`} onClose={() => setRejecting(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setRejecting(null)}>Batal</Btn><Btn variant="danger" onClick={() => { decideOt(rejecting.ot, 'rejected', rejecting.note); setRejecting(null); }}>Tolak lembur</Btn></>}>
              <Field label="Alasan (opsional)"><input autoFocus value={rejecting.note} onChange={e => setRejecting({ ...rejecting, note: e.target.value })} className={inputCls} placeholder="cth. lupa absen pulang" /></Field>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // FINANCE (P&L)
    // =====================================================================
    const EXPENSE_CATEGORIES = ['Bahan Baku', 'Gaji & Bonus', 'Listrik & Air', 'Sewa & Kebersihan', 'Transportasi', 'Perawatan', 'Lainnya'];

    function FinanceModule({ db, setDb, notify }) {
      const [month, setMonth] = useState(dateKey().slice(0, 7));
      const [expForm, setExpForm] = useState(null);
      const [pdfBusy, setPdfBusy] = useState(false);
      const from = month + '-01';
      const to = dateKey(new Date(Number(month.slice(0, 4)), Number(month.slice(5, 7)), 0));
      const f = computeFinancials(db, from, to);
      const months = Array.from({ length: 6 }, (_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); return dateKey(d).slice(0, 7); });
      const expenses = db.expenses.filter(e => e.date >= from && e.date <= to).sort((a, b) => b.date.localeCompare(a.date));
      const payroll = db.users.filter(u => isStaffRole(u.role)).reduce((a, u) => a + monthlyRecap(db, u, month).total, 0);

      const exportCsv = () => {
        downloadCsv(`Laba_Rugi_${month}.csv`, [
          ['Laporan Laba Rugi', db.business.name, monthLabel(month)], [],
          ['Penjualan bersih', f.revenue], ['HPP', f.hpp], ['Laba kotor', f.grossProfit], ['Biaya operasional', f.expenses], ['Laba bersih', f.netProfit], ['Pajak terkumpul (disetor)', f.taxCollected], [],
          ['Tanggal', 'Kategori', 'Catatan', 'Nominal'], ...expenses.map(e => [e.date, e.category, e.note, e.amount])
        ]);
        notify('Laporan laba rugi diunduh (CSV).');
      };

      // Builds a real PDF file and downloads it directly (no print dialog)
      const downloadPdf = async () => {
        setPdfBusy(true);
        try {
          const JsPDF = await ensureJsPdf();
          const doc = new JsPDF({ unit: 'pt', format: 'a4' });
          const teal = [20, 64, 200];
          const rp = (v) => formatIDR(v).replace(/ /g, ' ');
          doc.setFillColor(...teal); doc.rect(0, 0, 595, 70, 'F');
          doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
          doc.text('Laporan Laba Rugi', 40, 34);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
          doc.text(`${db.business.name} · ${monthLabel(month)}`, 40, 54);
          doc.setTextColor(30);
          doc.autoTable({
            startY: 95, theme: 'plain', margin: { left: 40, right: 40 },
            head: [['Ringkasan Laba Rugi', 'Nominal']], headStyles: { fillColor: teal, textColor: 255, fontStyle: 'bold' },
            styles: { fontSize: 11, cellPadding: 7 }, columnStyles: { 1: { halign: 'right' } },
            body: [
              [`Penjualan bersih (${f.count} transaksi)`, rp(f.revenue)],
              ['HPP (harga beli produk terjual)', `- ${rp(f.hpp)}`],
              [{ content: 'Laba kotor', styles: { fontStyle: 'bold' } }, { content: rp(f.grossProfit), styles: { fontStyle: 'bold' } }],
              ['Biaya operasional', `- ${rp(f.expenses)}`],
              [{ content: f.netProfit >= 0 ? 'LABA BERSIH' : 'RUGI BERSIH', styles: { fontStyle: 'bold', fillColor: [238, 244, 255] } }, { content: rp(f.netProfit), styles: { fontStyle: 'bold', fillColor: [238, 244, 255] } }],
              [{ content: `Pajak terkumpul ${rp(f.taxCollected)} tidak dihitung sebagai pendapatan karena harus disetor.`, colSpan: 2, styles: { fontSize: 9, textColor: 110 } }]
            ]
          });
          const expY = doc.lastAutoTable.finalY + 34;
          doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(30);
          doc.text('Rincian Pengeluaran (Biaya Operasional)', 40, expY);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110);
          doc.text(`Semua uang keluar untuk operasional toko selama ${monthLabel(month)}.`, 40, expY + 14);
          doc.autoTable({
            startY: expY + 24, margin: { left: 40, right: 40 },
            head: [['Tanggal', 'Jenis pengeluaran', 'Keterangan', 'Uang keluar']],
            foot: [[{ content: 'Total pengeluaran', colSpan: 3 }, rp(f.expenses)]],
            footStyles: { fillColor: [238, 244, 255], textColor: 30, fontStyle: 'bold', halign: 'right' },
            body: expenses.length ? expenses.map(e => [fmtDateShort(e.date), e.category, e.note || '-', rp(e.amount)]) : [[{ content: 'Tidak ada pengeluaran bulan ini', colSpan: 4 }]],
            headStyles: { fillColor: teal }, styles: { fontSize: 10 }, columnStyles: { 3: { halign: 'right' } }
          });
          doc.setFontSize(8); doc.setTextColor(140);
          doc.text(`Dibuat dengan ${APP_NAME} · ${fmtDateTime(new Date().toISOString())}`, 40, 820);
          doc.save(`Laba_Rugi_${db.business.name.replace(/\s+/g, '_')}_${month}.pdf`);
          notify('PDF laba rugi diunduh.');
        } catch {
          notify('PDF gagal dibuat (butuh internet untuk pertama kali). Membuka dialog cetak sebagai gantinya.', 'warn');
          window.print();
        } finally { setPdfBusy(false); }
      };

      const saveExpense = () => {
        if (!expForm.amount) return;
        setDb(prev => ({ ...prev, expenses: [{ id: generateId('EXP'), ...expForm }, ...prev.expenses] }));
        notify(`Pengeluaran ${formatIDR(expForm.amount)} dicatat.`);
        setExpForm(null);
      };

      const Line = ({ label, value, strong, tone, sign }) => (
        <div className={cx('flex justify-between gap-4 py-2.5', strong && 'border-t border-slate-200')}>
          <dt className={cx(strong ? 'font-semibold text-slate-900' : 'text-slate-600')}>{label}</dt>
          <dd className={cx('tabular', strong ? 'font-bold' : 'font-medium', tone || 'text-slate-900')}>{sign}{formatIDR(value)}</dd>
        </div>
      );

      return (
        <div className="space-y-5">
          <PageHeader title="Laporan Laba Rugi" desc="Penjualan, HPP, dan biaya operasional per bulan."
            actions={<>
              <Btn variant="secondary" icon="plus" onClick={() => setExpForm({ date: dateKey(), category: 'Bahan Baku', amount: 0, note: '' })}>Catat pengeluaran</Btn>
              <Btn variant="secondary" icon="download" onClick={exportCsv}>Excel (CSV)</Btn>
              <Btn variant="dark" icon="download" onClick={downloadPdf} disabled={pdfBusy}>{pdfBusy ? 'Membuat PDF…' : 'Unduh PDF'}</Btn>
            </>} />
          <Field label="Bulan" className="max-w-xs"><select value={month} onChange={e => setMonth(e.target.value)} className={inputCls}>{months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}</select></Field>
          <div className="grid grid-cols-1 gap-5 lg:grid-cols-2">
            <Card className="print-area p-5">
              <h3 className="text-base font-bold text-slate-900">{db.business.name}</h3>
              <p className="text-sm text-slate-500">Periode {monthLabel(month)}</p>
              <dl className="mt-3 text-sm">
                <Line label={`Penjualan bersih (${f.count} transaksi)`} value={f.revenue} />
                <Line label="HPP (harga beli produk terjual)" value={f.hpp} sign="− " tone="text-slate-700" />
                <Line label="Laba kotor" value={f.grossProfit} strong />
                <Line label="Biaya operasional" value={f.expenses} sign="− " tone="text-rose-600" />
                <div className={cx('mt-2 flex justify-between gap-4 rounded-xl p-3', f.netProfit >= 0 ? 'bg-emerald-50' : 'bg-rose-50')}>
                  <dt className={cx('font-bold', f.netProfit >= 0 ? 'text-emerald-900' : 'text-rose-900')}>{f.netProfit >= 0 ? 'Laba bersih' : 'Rugi bersih'}</dt>
                  <dd className={cx('text-lg font-bold tabular', f.netProfit >= 0 ? 'text-emerald-800' : 'text-rose-700')}>{formatIDR(f.netProfit)}</dd>
                </div>
              </dl>
              <p className="mt-3 text-xs text-slate-500">Pajak terkumpul {formatIDR(f.taxCollected)} tidak dihitung sebagai pendapatan karena harus disetor.</p>
              {payroll > 0 && <p className="mt-1 text-xs text-slate-500">Estimasi gaji karyawan bulan ini {formatIDR(payroll)} (dari rekap absensi). Catat sebagai pengeluaran "Gaji & Bonus" saat dibayarkan.</p>}
            </Card>
            <Card className="p-5">
              <h3 className="text-base font-bold text-slate-900">Pengeluaran</h3>
              {expenses.length === 0 ? <EmptyState icon="finance" title="Belum ada pengeluaran bulan ini" /> : (
                <ul className="mt-3 divide-y divide-slate-100">
                  {expenses.map(e => (
                    <li key={e.id} className="flex items-center justify-between gap-3 py-3 text-sm">
                      <div className="min-w-0"><p className="font-semibold text-slate-900">{e.category}</p><p className="truncate text-slate-500">{fmtDateShort(e.date)}{e.note ? ` · ${e.note}` : ''}</p></div>
                      <span className="font-semibold text-rose-600 tabular">{formatIDR(e.amount)}</span>
                    </li>
                  ))}
                </ul>
              )}
            </Card>
          </div>

          {expForm && (
            <Modal title="Catat pengeluaran" onClose={() => setExpForm(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setExpForm(null)}>Batal</Btn><Btn onClick={saveExpense} disabled={!expForm.amount}>Simpan</Btn></>}>
              <div className="space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Tanggal"><input type="date" value={expForm.date} max={dateKey()} onChange={e => setExpForm({ ...expForm, date: e.target.value })} className={inputCls} /></Field>
                  <Field label="Kategori"><select value={expForm.category} onChange={e => setExpForm({ ...expForm, category: e.target.value })} className={inputCls}>{EXPENSE_CATEGORIES.map(c => <option key={c}>{c}</option>)}</select></Field>
                </div>
                <Field label="Nominal"><MoneyInput autoFocus value={expForm.amount} onChange={v => setExpForm({ ...expForm, amount: v })} /></Field>
                <Field label="Catatan"><input value={expForm.note} onChange={e => setExpForm({ ...expForm, note: e.target.value })} className={inputCls} placeholder="cth. beli gula 5 kg" /></Field>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // DEBTS
    // =====================================================================
    function AmountPresets({ amount, total, onPick }) {
      const options = [{ label: 'Lunas', value: total }, { label: '50%', value: Math.round(total / 2) }];
      return (
        <div className="flex gap-2" role="group" aria-label="Pilihan nominal cepat">
          {options.map(o => {
            const active = amount === o.value;
            return (
              <button key={o.label} type="button" aria-pressed={active} onClick={() => onPick(o.value)}
                className={cx('inline-flex min-h-[40px] items-center gap-1.5 rounded-xl border px-4 text-sm font-semibold transition-colors', focusRing,
                  active ? 'border-brand-700 bg-brand-700 text-white' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50')}>
                {active && <SvgIcon name="check" className="h-4 w-4" />}{o.label}
              </button>
            );
          })}
        </div>
      );
    }

    function DebtsModule({ db, setDb, notify, currentUser }) {
      const [paying, setPaying] = useState(null);
      const [amount, setAmount] = useState(0);
      const [openId, setOpenId] = useState(null);
      const today = dateKey();

      const suppliers = db.suppliers.map(s => {
        const pos = db.purchases.filter(p => p.supplier_id === s.id && p.payment === 'tempo').sort((a, b) => (a.due_date || '').localeCompare(b.due_date || ''));
        const open = pos.filter(p => poOutstanding(p) > 0);
        return { ...s, pos, open, debt: open.reduce((a, p) => a + poOutstanding(p), 0), nextDue: open[0]?.due_date };
      });
      const receivables = db.customers.filter(c => c.debt > 0).map(c => {
        const sales = allSalesOf(db).filter(s => s.payment_method === 'bayar_nanti' && isValidSale(s) && (s.customer_id === c.id || s.customer_name === c.name)).sort((a, b) => new Date(b.date) - new Date(a.date));
        return { ...c, sales };
      });
      const paymentsOf = (kind, id) => (db.debt_payments || []).filter(p => p.kind === kind && p.party_id === id);

      const debt = paying?.entity.debt || 0;
      const amountError = amount <= 0 ? 'Masukkan nominal.' : amount > debt ? `Melebihi sisa ${formatIDR(debt)}.` : null;

      const confirm = () => {
        if (amountError) return;
        const { kind, entity } = paying;
        const record = { id: generateId('PAY'), kind, party_id: entity.id, amount, date: new Date().toISOString(), by: currentUser.name };
        setDb(prev => {
          if (kind === 'supplier') {
            // Pay the oldest due purchase orders first
            let left = amount;
            const order = prev.purchases.filter(p => p.supplier_id === entity.id && poOutstanding(p) > 0).sort((a, b) => (a.due_date || '').localeCompare(b.due_date || '')).map(p => p.id);
            const paidMap = {};
            order.forEach(id => { const po = prev.purchases.find(p => p.id === id); const take = Math.min(left, poOutstanding(po)); if (take > 0) { paidMap[id] = take; left -= take; } });
            return { ...prev, purchases: prev.purchases.map(p => paidMap[p.id] ? { ...p, paid: (p.paid || 0) + paidMap[p.id] } : p), debt_payments: [record, ...(prev.debt_payments || [])] };
          }
          return { ...prev, customers: prev.customers.map(c => c.id === entity.id ? { ...c, debt: Math.max(0, c.debt - amount) } : c), debt_payments: [record, ...(prev.debt_payments || [])] };
        });
        notify(kind === 'supplier' ? `Pembayaran ${formatIDR(amount)} ke ${entity.name} tercatat.` : `Pelunasan ${formatIDR(amount)} dari ${entity.name} diterima.`);
        setPaying(null);
      };
      const open = (kind, entity) => { setPaying({ kind, entity }); setAmount(entity.debt); };

      const PaymentHistory = ({ list }) => list.length === 0 ? null : (
        <div className="mt-3">
          <p className="text-xs font-semibold uppercase tracking-wide text-slate-500">Riwayat pembayaran</p>
          <ul className="mt-1 space-y-1 text-sm">
            {list.map(p => <li key={p.id} className="flex justify-between gap-2 text-slate-700"><span>{fmtDateTime(p.date)} · {p.by}</span><span className="font-semibold text-emerald-700 tabular">{formatIDR(p.amount)}</span></li>)}
          </ul>
        </div>
      );

      const Toggle = ({ id, children }) => (
        <button type="button" aria-expanded={openId === id} onClick={() => setOpenId(openId === id ? null : id)}
          className={cx('inline-flex min-h-[36px] items-center gap-1 rounded-lg px-2 text-sm font-semibold text-brand-800 hover:bg-brand-50', focusRing)}>
          {children}<SvgIcon name={openId === id ? 'chevUp' : 'chevDown'} className="h-4 w-4" />
        </button>
      );

      return (
        <div className="space-y-5">
          <PageHeader title="Hutang & Piutang" desc="Hutang ke supplier (dari PO tempo) dan kasbon pelanggan." />

          <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <StatCard label="Total hutang ke supplier" value={formatIDR(suppliers.reduce((a, s) => a + s.debt, 0))} sub={`${suppliers.filter(s => s.debt > 0).length} supplier`} icon="purchases" tone="rose" />
            <StatCard label="Total piutang pelanggan" value={formatIDR(receivables.reduce((a, c) => a + c.debt, 0))} sub={`${receivables.length} pelanggan`} icon="customers" tone="amber" />
          </div>

          <Card>
            <div className="border-b border-slate-200 p-4"><h3 className="text-base font-bold text-slate-900">Hutang ke supplier</h3></div>
            <ul className="divide-y divide-slate-100">
              {suppliers.map(s => {
                const overdue = s.nextDue && s.nextDue < today;
                return (
                  <li key={s.id} className="p-4">
                    <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                      <div>
                        <p className="font-semibold text-slate-900">{s.name}</p>
                        <p className="text-sm text-slate-600">{s.phone ? `HP ${s.phone}` : 'Belum ada nomor HP'}{s.address ? ` · ${s.address}` : ''}</p>
                        {s.debt > 0 && <p className="mt-0.5 flex items-center gap-2 text-sm text-slate-500">{s.open.length} PO belum lunas · jatuh tempo terdekat {fmtDateShort(s.nextDue)}{overdue && <Badge tone="rose">Terlambat</Badge>}</p>}
                      </div>
                      <div className="flex items-center gap-3 sm:flex-col sm:items-end sm:gap-1.5">
                        <span className={cx('text-base font-bold tabular', s.debt > 0 ? 'text-rose-600' : 'text-slate-400')}>{formatIDR(s.debt)}</span>
                        {s.debt > 0 ? <Btn size="sm" onClick={() => open('supplier', s)}>Bayar</Btn> : <Badge tone="green">Lunas</Badge>}
                      </div>
                    </div>
                    {s.pos.length > 0 && <div className="mt-2"><Toggle id={s.id}>Rincian hutang</Toggle></div>}
                    {openId === s.id && (
                      <div className="mt-2 space-y-2 rounded-xl bg-slate-50 p-3">
                        {s.pos.map(po => (
                          <div key={po.id} className="rounded-lg bg-white p-3 ring-1 ring-slate-200">
                            <div className="flex flex-wrap items-center justify-between gap-2 text-sm">
                              <span className="font-mono font-semibold text-slate-900">{po.po_number}</span>
                              <span className="text-slate-600">{fmtDateShort(po.date)} · jatuh tempo {fmtDateShort(po.due_date)}</span>
                            </div>
                            <table className="mt-2 w-full text-sm">
                              <tbody className="divide-y divide-slate-100">
                                {po.items.map((it, i) => (
                                  <tr key={i}><td className="py-1 text-slate-800">{it.name} <span className="text-slate-500">({it.category})</span></td><td className="py-1 text-right text-slate-600 tabular">{it.qty} {it.unit} × {formatIDR(it.unit_cost)}</td><td className="py-1 text-right font-medium tabular">{formatIDR(it.qty * it.unit_cost)}</td></tr>
                                ))}
                              </tbody>
                            </table>
                            <div className="mt-2 flex flex-wrap justify-end gap-x-4 border-t border-slate-100 pt-2 text-sm">
                              <span>Total <span className="font-semibold tabular">{formatIDR(po.total)}</span></span>
                              <span>Dibayar <span className="font-semibold text-emerald-700 tabular">{formatIDR(po.paid || 0)}</span></span>
                              <span>Sisa <span className="font-bold text-rose-600 tabular">{formatIDR(poOutstanding(po))}</span></span>
                            </div>
                          </div>
                        ))}
                        <PaymentHistory list={paymentsOf('supplier', s.id)} />
                      </div>
                    )}
                  </li>
                );
              })}
            </ul>
          </Card>

          <Card>
            <div className="border-b border-slate-200 p-4"><h3 className="text-base font-bold text-slate-900">Piutang pelanggan (kasbon)</h3></div>
            {receivables.length === 0 ? <EmptyState icon="check" title="Tidak ada kasbon terbuka" /> : (
              <ul className="divide-y divide-slate-100">
                {receivables.map(c => (
                  <li key={c.id} className="p-4">
                    <div className="flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <Avatar name={c.name} />
                        <div><p className="font-semibold text-slate-900">{c.name}</p><p className="text-sm text-slate-600">{c.phone} · {c.sales.length} transaksi kasbon</p></div>
                      </div>
                      <div className="flex items-center gap-3"><span className="text-base font-bold text-rose-600 tabular">{formatIDR(c.debt)}</span><Btn size="sm" onClick={() => open('customer', c)}>Terima</Btn></div>
                    </div>
                    <div className="mt-2"><Toggle id={c.id}>Rincian kasbon</Toggle></div>
                    {openId === c.id && (
                      <div className="mt-2 space-y-2 rounded-xl bg-slate-50 p-3">
                        {c.sales.length === 0 && <p className="text-sm text-slate-500">Saldo awal tanpa rincian transaksi.</p>}
                        {c.sales.map(s => (
                          <div key={s.id} className="rounded-lg bg-white p-3 ring-1 ring-slate-200">
                            <div className="flex flex-wrap items-center justify-between gap-2 text-sm">
                              <span className="font-mono font-semibold text-slate-900">{s.receipt_no}</span>
                              <span className="text-slate-600">{fmtDateTime(s.date)} · kasir {s.cashier}</span>
                            </div>
                            <ul className="mt-2 space-y-0.5 text-sm">
                              {s.items.map((it, i) => <li key={i} className="flex justify-between gap-2"><span className="text-slate-800">{it.name} <span className="text-slate-500">× {it.qty}</span></span><span className="tabular">{formatIDR(it.qty * it.sell_price)}</span></li>)}
                            </ul>
                            <p className="mt-2 border-t border-slate-100 pt-2 text-right text-sm">Total nota <span className="font-semibold tabular">{formatIDR(s.total)}</span></p>
                          </div>
                        ))}
                        <PaymentHistory list={paymentsOf('customer', c.id)} />
                      </div>
                    )}
                  </li>
                ))}
              </ul>
            )}
          </Card>

          {paying && (
            <Modal title={paying.kind === 'supplier' ? 'Bayar hutang supplier' : 'Terima pelunasan kasbon'} desc={paying.entity.name} onClose={() => setPaying(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setPaying(null)}>Batal</Btn><Btn onClick={confirm} disabled={!!amountError}>Konfirmasi {amount > 0 && !amountError ? formatIDR(amount) : ''}</Btn></>}>
              <div className="space-y-4">
                <div className="flex justify-between rounded-xl bg-rose-50 p-3 text-sm"><span className="text-rose-900">Sisa {paying.kind === 'supplier' ? 'hutang' : 'kasbon'}</span><span className="font-bold text-rose-700 tabular">{formatIDR(debt)}</span></div>
                <AmountPresets amount={amount} total={debt} onPick={setAmount} />
                <Field label="Nominal pembayaran" error={amountError} hint={!amountError && amount < debt ? `Sisa setelah bayar ${formatIDR(debt - amount)}` : null}><MoneyInput autoFocus value={amount} onChange={setAmount} /></Field>
                {paying.kind === 'supplier' && <p className="text-xs text-slate-500">Pembayaran dialokasikan ke PO dengan jatuh tempo paling awal.</p>}
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // PROMO & SALES TARGETS
    // =====================================================================
    const promoStatus = (p, today = dateKey()) => !p.active ? { label: 'Nonaktif', tone: 'slate' } : p.end < today ? { label: 'Selesai', tone: 'slate' } : p.start > today ? { label: 'Terjadwal', tone: 'blue' } : { label: 'Berjalan', tone: 'green' };

    function IncentivesModule({ db, setDb, notify, isOwner }) {
      const kasir = db.users.filter(u => isStaffRole(u.role));
      const [modal, setModal] = useState(null);
      const [coupon, setCoupon] = useState({ code: '', type: 'percent', val: 10, min_spend: 50000 });
      const [inc, setInc] = useState({ employee: kasir[0]?.name || '', target: 10000000, bonus: 200000 });
      const [promo, setPromo] = useState(null);
      const [confirmDelCoupon, setConfirmDelCoupon] = useState(false);
      const [confirmDelInc, setConfirmDelInc] = useState(false);
      const [productQuery, setProductQuery] = useState('');
      const ym = dateKey().slice(0, 7);
      const codeTaken = db.coupons.some(c => c.code === coupon.code && c.id !== coupon.id);
      const couponError = !coupon.code ? 'Kode wajib diisi.' : codeTaken ? 'Kode sudah dipakai.' : null;
      const salesBy = (name) => allSalesOf(db).filter(s => isValidSale(s) && s.cashier === name && saleDay(s).startsWith(ym)).reduce((a, s) => a + s.total, 0);
      const seasonal = db.seasonal_promos || [];

      const promoErrors = promo ? {
        name: !promo.name.trim() ? 'Nama promo wajib diisi.' : null,
        value: !(promo.value > 0) ? 'Isi besar potongan.' : promo.type === 'percent' && promo.value > 90 ? 'Maksimal 90%.' : null,
        dates: promo.end < promo.start ? 'Tanggal berakhir harus setelah tanggal mulai.' : null,
        products: promo.scope === 'products' && promo.product_ids.length === 0 ? 'Pilih minimal satu produk.' : null
      } : {};
      const promoInvalid = Object.values(promoErrors).some(Boolean);

      const saveCoupon = () => {
        if (couponError) return;
        setDb(prev => ({ ...prev, coupons: coupon.id ? prev.coupons.map(c => c.id === coupon.id ? coupon : c) : [...prev.coupons, { id: generateId('CP'), ...coupon, active: true }] }));
        notify(`Kode voucher ${coupon.code} ${coupon.id ? 'diperbarui' : 'dibuat'}.`); setModal(null);
      };
      const deleteCoupon = () => {
        setDb(prev => ({ ...prev, coupons: prev.coupons.filter(c => c.id !== coupon.id) }));
        notify(`Kode voucher ${coupon.code} dihapus.`, 'info'); setModal(null);
      };
      const saveIncentive = () => {
        if (!inc.employee || !inc.target) return;
        const userId = db.users.find(u => u.name === inc.employee)?.id;
        const record = { employee: inc.employee, target_sales: inc.target, bonus_amount: inc.bonus };
        setDb(prev => withStaffNotif({
          ...prev,
          employeeIncentives: inc.id ? prev.employeeIncentives.map(i => i.id === inc.id ? { ...i, ...record } : i) : [...prev.employeeIncentives, { id: generateId('INC'), ...record, status: 'Aktif', note: 'Target omzet bulanan' }]
        }, userId, { icon: 'incentives', tone: 'blue', title: inc.id ? 'Target penjualan diubah' : 'Target penjualan baru', msg: `Target ${formatIDR(inc.target)} bulan ini, bonus ${formatIDR(inc.bonus)} jika tercapai.`, go: 'incentives' }));
        notify(`Target untuk ${inc.employee} ${inc.id ? 'diperbarui' : 'dibuat'}.`); setModal(null);
      };
      const deleteIncentive = () => {
        setDb(prev => ({ ...prev, employeeIncentives: prev.employeeIncentives.filter(i => i.id !== inc.id) }));
        notify(`Target ${inc.employee} dihapus.`, 'info'); setModal(null);
      };
      const savePromo = () => {
        if (promoInvalid) return;
        const clean = { ...promo, name: promo.name.trim(), product_ids: promo.scope === 'all' ? [] : promo.product_ids };
        setDb(prev => ({ ...prev, seasonal_promos: clean.id ? prev.seasonal_promos.map(p => p.id === clean.id ? clean : p) : [{ ...clean, id: generateId('SP') }, ...(prev.seasonal_promos || [])] }));
        notify(`Promo "${clean.name}" disimpan.`); setPromo(null);
      };
      const toggleCoupon = (id) => setDb(prev => ({ ...prev, coupons: prev.coupons.map(c => c.id === id ? { ...c, active: !c.active } : c) }));
      const togglePromo = (id) => setDb(prev => ({ ...prev, seasonal_promos: prev.seasonal_promos.map(p => p.id === id ? { ...p, active: !p.active } : p) }));
      const toggleProduct = (id) => setPromo(p => ({ ...p, product_ids: p.product_ids.includes(id) ? p.product_ids.filter(x => x !== id) : [...p.product_ids, id] }));

      const pq = productQuery.trim().toLowerCase();

      return (
        <div className="space-y-5">
          <PageHeader title="Promo & Target Penjualan" desc="Promo musiman, kode voucher, dan target bonus kasir."
            actions={isOwner && <>
              <Btn icon="plus" onClick={() => { setProductQuery(''); setPromo({ name: '', type: 'percent', value: 10, start: dateKey(), end: addDays(dateKey(), 7), scope: 'all', product_ids: [], active: true }); }}>Promo musiman</Btn>
              <Btn variant="secondary" icon="plus" onClick={() => { setCoupon({ code: '', type: 'percent', val: 10, min_spend: 50000 }); setModal('coupon'); }}>Kode voucher</Btn>
              <Btn variant="secondary" icon="plus" onClick={() => { setInc({ employee: kasir[0]?.name || '', target: 10000000, bonus: 200000 }); setConfirmDelInc(false); setModal('incentive'); }}>Target kasir</Btn>
            </>} />

          <Card className="p-5">
            <h3 className="text-base font-bold text-slate-900">Promo musiman</h3>
            <p className="text-sm text-slate-600">Harga otomatis dicoret di kasir selama periode promo berjalan.</p>
            {seasonal.length === 0 ? <EmptyState icon="calendar" title="Belum ada promo musiman" desc="Cocok untuk Ramadan, akhir tahun, atau ulang tahun toko." /> : (
              <ul className="mt-3 divide-y divide-slate-100">
                {seasonal.map(p => {
                  const st = promoStatus(p);
                  const names = p.scope === 'all' ? 'Semua produk' : p.product_ids.map(id => db.products.find(x => x.id === id)?.name).filter(Boolean).join(', ');
                  return (
                    <li key={p.id} className="flex flex-col gap-3 py-3 sm:flex-row sm:items-center sm:justify-between">
                      <div className="min-w-0">
                        <p className="flex flex-wrap items-center gap-2 font-semibold text-slate-900">{p.name}<Badge tone={st.tone}>{st.label}</Badge></p>
                        <p className="text-sm text-slate-600"><span className="font-semibold text-rose-600">{p.type === 'percent' ? `Diskon ${p.value}%` : `Potongan ${formatIDR(p.value)}`}</span> · {fmtDateShort(p.start)} – {fmtDateShort(p.end)}</p>
                        <p className="truncate text-xs text-slate-500">{names}</p>
                      </div>
                      {isOwner && <div className="flex items-center gap-2">
                        <Btn variant="ghost" size="sm" icon="edit" onClick={() => { setProductQuery(''); setPromo({ ...p }); }}>Edit</Btn>
                        <Switch checked={p.active} onChange={() => togglePromo(p.id)} label={`Aktifkan ${p.name}`} />
                      </div>}
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>

          <Card className="p-5">
            <h3 className="text-base font-bold text-slate-900">Kode voucher</h3>
            <p className="text-sm text-slate-600">Dimasukkan kasir di layar pembayaran.</p>
            <ul className="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3">
              {db.coupons.map(cp => (
                <li key={cp.id} className={cx('flex items-center justify-between gap-3 rounded-xl border-2 border-dashed p-4', cp.active ? 'border-brand-300 bg-brand-50' : 'border-slate-200 bg-slate-50')}>
                  <div className="min-w-0">
                    <p className="font-mono text-base font-bold tracking-wider text-slate-900">{cp.code}</p>
                    <p className="text-sm font-semibold text-brand-800">{cp.type === 'percent' ? `Diskon ${cp.val}%` : `Potongan ${formatIDR(cp.val)}`}</p>
                    <p className="text-xs text-slate-500">Min. belanja {formatIDR(cp.min_spend)}</p>
                  </div>
                  {isOwner ? <div className="flex flex-shrink-0 items-center gap-1">
                    <IconBtn icon="edit" label={`Edit atau hapus ${cp.code}`} iconClass="h-4 w-4" onClick={() => { setCoupon({ ...cp }); setConfirmDelCoupon(false); setModal('coupon'); }} className="h-9 w-9" />
                    <Switch checked={cp.active} onChange={() => toggleCoupon(cp.id)} label={`Aktifkan ${cp.code}`} />
                  </div> : <Badge tone={cp.active ? 'green' : 'slate'}>{cp.active ? 'Aktif' : 'Nonaktif'}</Badge>}
                </li>
              ))}
            </ul>
          </Card>

          <Card className="p-5">
            <h3 className="text-base font-bold text-slate-900">Target penjualan kasir · {monthLabel(ym)}</h3>
            {db.employeeIncentives.length === 0 ? <EmptyState icon="users" title="Belum ada target" /> : (
              <ul className="mt-3 space-y-3">
                {db.employeeIncentives.map(i => {
                  const achieved = salesBy(i.employee);
                  const pct = Math.min(100, Math.round((achieved / i.target_sales) * 100)) || 0;
                  return (
                    <li key={i.id} className="rounded-xl border border-slate-200 p-4">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div><p className="font-semibold text-slate-900">{i.employee}</p><p className="text-sm text-slate-600">Bonus {formatIDR(i.bonus_amount)} jika tercapai</p></div>
                        <div className="flex items-center gap-1">
                          <Badge tone={pct >= 100 ? 'green' : 'blue'}>{pct >= 100 ? 'Tercapai' : `${pct}%`}</Badge>
                          {isOwner && <IconBtn icon="edit" label={`Edit atau hapus target ${i.employee}`} iconClass="h-4 w-4" className="h-9 w-9"
                            onClick={() => { setInc({ id: i.id, employee: i.employee, target: i.target_sales, bonus: i.bonus_amount }); setConfirmDelInc(false); setModal('incentive'); }} />}
                        </div>
                      </div>
                      <div className="mt-3 flex justify-between text-xs text-slate-600"><span className="tabular">{formatIDR(achieved)}</span><span className="tabular">Target {formatIDR(i.target_sales)}</span></div>
                      <div className="mt-1 h-2 overflow-hidden rounded-full bg-slate-100" role="progressbar" aria-valuenow={pct} aria-valuemin={0} aria-valuemax={100} aria-label={`Progres target ${i.employee}`}>
                        <div className="h-full rounded-full bg-indigo-600" style={{ width: `${pct}%` }} />
                      </div>
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>

          {promo && (
            <Modal title={promo.id ? 'Edit promo musiman' : 'Promo musiman baru'} size="lg" onClose={() => setPromo(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setPromo(null)}>Batal</Btn><Btn onClick={savePromo} disabled={promoInvalid}>Simpan promo</Btn></>}>
              <div className="space-y-4">
                <Field label="Nama promo" error={promo.name ? null : promoErrors.name}><input autoFocus value={promo.name} onChange={e => setPromo({ ...promo, name: e.target.value })} className={inputCls} placeholder="cth. Promo Ramadan" /></Field>
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Jenis potongan"><select value={promo.type} onChange={e => setPromo({ ...promo, type: e.target.value, value: 0 })} className={inputCls}><option value="percent">Persen (%)</option><option value="fixed">Nominal per produk (Rp)</option></select></Field>
                  <Field label={promo.type === 'percent' ? 'Besar diskon (%)' : 'Potongan per produk'} error={promoErrors.value}>
                    {promo.type === 'percent'
                      ? <input type="number" min="1" max="90" value={promo.value || ''} onChange={e => setPromo({ ...promo, value: parseInt(e.target.value, 10) || 0 })} className={cx(inputCls, 'tabular')} />
                      : <MoneyInput value={promo.value} onChange={v => setPromo({ ...promo, value: v })} />}
                  </Field>
                  <Field label="Tanggal mulai"><input type="date" value={promo.start} onChange={e => setPromo({ ...promo, start: e.target.value })} className={inputCls} /></Field>
                  <Field label="Tanggal berakhir" error={promoErrors.dates}><input type="date" value={promo.end} min={promo.start} onChange={e => setPromo({ ...promo, end: e.target.value })} className={inputCls} /></Field>
                </div>
                <div>
                  <span className="text-sm font-medium text-slate-700">Berlaku untuk</span>
                  <div className="mt-1.5"><SegmentedControl size="md" label="Cakupan promo" value={promo.scope} onChange={v => setPromo({ ...promo, scope: v })} options={[{ value: 'all', label: 'Semua produk' }, { value: 'products', label: `Produk tertentu${promo.product_ids.length ? ` (${promo.product_ids.length})` : ''}` }]} /></div>
                </div>
                {promo.scope === 'products' && (
                  <div>
                    <SearchInput id="promo-prod" value={productQuery} onChange={setProductQuery} placeholder="Cari produk…" />
                    <ul className="mt-2 max-h-64 divide-y divide-slate-100 overflow-y-auto rounded-xl border border-slate-200">
                      {db.products.filter(p => !pq || p.name.toLowerCase().includes(pq) || p.sku.toLowerCase().includes(pq)).map(p => {
                        const checked = promo.product_ids.includes(p.id);
                        const after = promo.type === 'percent' ? Math.round(p.sell_price * (1 - (promo.value || 0) / 100)) : Math.max(0, p.sell_price - (promo.value || 0));
                        return (
                          <li key={p.id}>
                            <label className={cx('flex min-h-[48px] cursor-pointer items-center gap-3 px-3 py-2', checked && 'bg-brand-50')}>
                              <input type="checkbox" checked={checked} onChange={() => toggleProduct(p.id)} className="h-4 w-4 rounded accent-brand-700" />
                              <ProductThumb product={p} className="h-8 w-8 rounded-md" textClass="text-[10px]" />
                              <span className="flex-1 text-sm text-slate-800">{p.name}</span>
                              <span className="text-xs text-slate-500 tabular"><span className="line-through">{formatIDR(p.sell_price)}</span> → <span className="font-semibold text-rose-600">{formatIDR(after)}</span></span>
                            </label>
                          </li>
                        );
                      })}
                    </ul>
                    {promoErrors.products && <p className="mt-1 text-xs font-medium text-rose-600" role="alert">{promoErrors.products}</p>}
                  </div>
                )}
              </div>
            </Modal>
          )}

          {modal === 'coupon' && (
            <Modal title={coupon.id ? `Edit voucher ${coupon.code}` : 'Buat kode voucher'} onClose={() => setModal(null)}
              footer={confirmDelCoupon ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus voucher ini? Kasir tidak bisa memakainya lagi.</p>
                <Btn variant="secondary" onClick={() => setConfirmDelCoupon(false)}>Batal</Btn>
                <Btn variant="danger" onClick={deleteCoupon}>Ya, hapus</Btn>
              </> : <>
                {coupon.id && <Btn variant="ghost" icon="trash" className="text-rose-700 hover:bg-rose-50" onClick={() => setConfirmDelCoupon(true)}>Hapus</Btn>}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={() => setModal(null)}>Batal</Btn>
                <Btn onClick={saveCoupon} disabled={!!couponError}>Simpan</Btn>
              </>}>
              <div className="space-y-4">
                <Field label="Kode voucher" error={coupon.code ? couponError : null} hint="Huruf kapital tanpa spasi, cth. HEMAT20"><input autoFocus value={coupon.code} onChange={e => setCoupon({ ...coupon, code: e.target.value.toUpperCase().replace(/\s/g, '') })} className={cx(inputCls, 'font-mono tracking-wider')} /></Field>
                <Field label="Jenis potongan"><select value={coupon.type} onChange={e => setCoupon({ ...coupon, type: e.target.value, val: 0 })} className={inputCls}><option value="percent">Persentase (%)</option><option value="fixed">Nominal tetap (Rp)</option></select></Field>
                <Field label={coupon.type === 'percent' ? 'Besar diskon (%)' : 'Besar potongan'}>
                  {coupon.type === 'percent'
                    ? <input type="number" min="1" max="100" value={coupon.val || ''} onChange={e => setCoupon({ ...coupon, val: Math.min(100, parseInt(e.target.value, 10) || 0) })} className={cx(inputCls, 'tabular')} />
                    : <MoneyInput value={coupon.val} onChange={v => setCoupon({ ...coupon, val: v })} />}
                </Field>
                <Field label="Minimal belanja"><MoneyInput value={coupon.min_spend} onChange={v => setCoupon({ ...coupon, min_spend: v })} /></Field>
              </div>
            </Modal>
          )}
          {modal === 'incentive' && (
            <Modal title={inc.id ? `Edit target ${inc.employee}` : 'Buat target penjualan'} onClose={() => setModal(null)}
              footer={confirmDelInc ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus target ini?</p>
                <Btn variant="secondary" onClick={() => setConfirmDelInc(false)}>Batal</Btn>
                <Btn variant="danger" onClick={deleteIncentive}>Ya, hapus</Btn>
              </> : <>
                {inc.id && <Btn variant="ghost" icon="trash" className="text-rose-700 hover:bg-rose-50" onClick={() => setConfirmDelInc(true)}>Hapus</Btn>}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={() => setModal(null)}>Batal</Btn>
                <Btn onClick={saveIncentive} disabled={!inc.employee || !inc.target}>Simpan</Btn>
              </>}>
              <div className="space-y-4">
                <Field label="Kasir"><select value={inc.employee} onChange={e => setInc({ ...inc, employee: e.target.value })} className={inputCls}>{kasir.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}</select></Field>
                <Field label="Target omzet bulanan"><MoneyInput value={inc.target} onChange={v => setInc({ ...inc, target: v })} /></Field>
                <Field label="Bonus jika tercapai"><MoneyInput value={inc.bonus} onChange={v => setInc({ ...inc, bonus: v })} /></Field>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // EMPLOYEES
    // =====================================================================
    const WEEKDAYS = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    function EmployeeManagementModule({ db, setDb, notify, currentUser, checkUsername }) {
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({});
      const [password, setPassword] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [saving, setSaving] = useState(false);
      const [confirmDel, setConfirmDel] = useState(false);
      const [takenName, setTakenName] = useState('');
      const work = db.business.work;
      const ownerCount = db.users.filter(u => u.role === 'owner').length;
      const deleteBlock = editing && editing !== 'new' && (editing.id === currentUser.id ? 'Anda tidak bisa menghapus akun yang sedang dipakai.' : editing.role === 'owner' && ownerCount <= 1 ? 'Harus ada minimal satu Bos.' : null);
      const removeEmployee = () => {
        setDb(prev => ({ ...prev, users: prev.users.filter(u => u.id !== editing.id) }));
        notify(`${editing.name} dihapus. Riwayat absensi dan transaksinya tetap tersimpan.`, 'info');
        setEditing(null);
      };

      const isNew = editing === 'new';
      const hasLogin = editing && editing !== 'new' && !!editing.password_hash;
      const username = (form.username || '').trim().toLowerCase();
      const errors = {
        name: !(form.name || '').trim() ? 'Nama wajib diisi.' : null,
        email: form.email && !/^\S+@\S+\.\S+$/.test(form.email) ? 'Format email tidak valid.' : null,
        phone: waError(form.phone),
        username: !username ? 'ID login wajib diisi.' : !/^[a-z0-9._]{3,20}$/.test(username) ? '3–20 karakter: huruf kecil, angka, titik, atau garis bawah.' : db.users.some(u => u.username === username && u.id !== form.id) ? 'ID login sudah dipakai.' : takenName === username ? 'ID login ini sudah dipakai di toko lain. Coba tambahkan nama toko, cth. sari.berkah.' : null,
        password: (isNew || !hasLogin) && !password ? 'Buat password untuk akun ini.' : password && password.length < 6 ? 'Minimal 6 karakter.' : null
      };
      const invalid = Object.values(errors).some(Boolean);

      const open = (u) => {
        setEditing(u); setSubmitted(false); setPassword(''); setShowPw(false); setConfirmDel(false);
        setForm(u === 'new' ? { name: '', username: '', email: '', phone: '', base_salary: 3200000, role: 'kasir', day_off: 0, shift_id: work.shifts[0].id, status: 'Aktif' } : { ...u });
      };

      const save = async () => {
        setSubmitted(true);
        if (invalid) return;
        setSaving(true);
        try {
          // Online: ask the server first. Offline: the server checks when the change is sent and undoes it if taken.
          if (checkUsername && (isNew || username !== editing.username)) {
            const free = await checkUsername(username, isNew ? '' : editing.id).catch(e => e.status === 0 ? true : Promise.reject(e));
            if (!free) { setTakenName(username); return; }
          }
          const clean = { ...form, name: form.name.trim(), username, day_off: Number(form.day_off) };
          if (password) {
            const salt = generateId('SALT');
            clean.password_salt = salt;
            clean.password_hash = await hashPassword(password, salt);
            clean.password_updated = new Date().toISOString();
          }
          if (isNew) {
            setDb(prev => ({ ...prev, users: [...prev.users, { ...clean, id: 'usr-' + Date.now() }] }));
            notify(`Akun ${clean.name} dibuat. Masuk dengan ID login "${username}" dan password yang kamu buat. Berikan langsung ke karyawan.`);
          } else {
            setDb(prev => ({ ...prev, users: prev.users.map(u => u.id === editing.id ? { ...u, ...clean } : u) }));
            notify(password ? `Password ${clean.name} diperbarui.` : `Data ${clean.name} diperbarui.`);
          }
          setEditing(null);
        } catch (e) {
          notify(e instanceof ApiError ? e.message : 'Browser ini tidak mendukung penyimpanan password aman. Buka aplikasi lewat https.', 'warn');
        } finally { setSaving(false); }
      };

      return (
        <div className="space-y-5">
          <PageHeader title="Data Karyawan" desc="Akun login, peran, shift, gaji pokok, dan hari libur." actions={<Btn icon="plus" onClick={() => open('new')}>Tambah karyawan</Btn>} />
          <Card>
            <div className="overflow-x-auto">
              <table className="w-full min-w-[820px] text-left text-sm">
                <thead className="bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-600">
                  <tr><th scope="col" className="px-4 py-3">Karyawan</th><th scope="col" className="px-4 py-3">Akun login</th><th scope="col" className="px-4 py-3">Peran</th><th scope="col" className="px-4 py-3">Shift & libur</th><th scope="col" className="px-4 py-3 text-right">Gaji pokok</th><th scope="col" className="px-4 py-3">Status</th><th scope="col" className="px-4 py-3"><span className="sr-only">Aksi</span></th></tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {db.users.map(u => (
                    <tr key={u.id} className={cx('hover:bg-slate-50', u.status === 'Nonaktif' && 'text-slate-400')}>
                      <td className="px-4 py-3"><div className="flex items-center gap-3"><Avatar name={u.name} /><div><p className="font-semibold">{u.name}</p><p className="text-xs text-slate-500">{u.phone}</p></div></div></td>
                      <td className="px-4 py-3">
                        <p className="font-mono text-sm">{u.username || '—'}</p>
                        {u.password_hash ? <Badge tone="green"><SvgIcon name="key" className="h-3 w-3" />Password aktif</Badge> : <Badge tone="amber">Belum ada password</Badge>}
                      </td>
                      <td className="px-4 py-3"><Badge tone={ROLE_TONES[u.role] || 'slate'}>{ROLE_LABELS[u.role] || u.role}</Badge></td>
                      <td className="px-4 py-3 text-slate-700">{u.role === 'owner' ? '—' : <>{shiftOf(u, work).name}<p className="text-xs text-slate-500">Libur {WEEKDAYS[u.day_off ?? 0]}</p></>}</td>
                      <td className="px-4 py-3 text-right font-semibold tabular">{u.role === 'owner' ? '—' : formatIDR(u.base_salary)}</td>
                      <td className="px-4 py-3"><Badge tone={u.status === 'Nonaktif' ? 'slate' : 'green'}>{u.status || 'Aktif'}</Badge></td>
                      <td className="px-4 py-3 text-right"><Btn variant="ghost" size="sm" icon="edit" onClick={() => open(u)} aria-label={`Edit ${u.name}`}>Edit</Btn></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="border-t border-slate-100 p-4 text-xs text-slate-500">Password disimpan dalam bentuk terenkripsi (hash), Bos pun tidak bisa melihatnya lagi. Akun ini dipakai di portal login saat server online diaktifkan.</p>
          </Card>
          {editing && (
            <Modal title={isNew ? 'Tambah karyawan' : `Edit ${editing.name}`} size="lg" onClose={() => setEditing(null)}
              footer={confirmDel ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus {editing.name}? Akun loginnya ikut terhapus.</p>
                <Btn variant="secondary" onClick={() => setConfirmDel(false)}>Batal</Btn>
                <Btn variant="danger" onClick={removeEmployee}>Ya, hapus</Btn>
              </> : <>
                {!isNew && <IconBtn icon="trash" label={`Hapus ${editing.name}`} className="text-rose-600 hover:bg-rose-50" onClick={() => deleteBlock ? notify(deleteBlock, 'warn') : setConfirmDel(true)} />}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={() => setEditing(null)}>Batal</Btn>
                <Btn onClick={save} disabled={saving}>{saving ? 'Menyimpan…' : 'Simpan'}</Btn>
              </>}>
              <div className="space-y-4">
                <Field label="Nama lengkap" error={submitted ? errors.name : null}><input autoFocus value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className={inputCls} /></Field>

                <div className="rounded-xl border border-slate-200 p-4">
                  <p className="flex items-center gap-2 text-sm font-semibold text-slate-900"><SvgIcon name="key" className="h-4 w-4 text-brand-700" />Akun login</p>
                  <div className="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <Field label="ID login (username)" error={submitted || form.username ? errors.username : null} hint="Dipakai karyawan untuk masuk.">
                      <input value={form.username || ''} onChange={e => setForm({ ...form, username: e.target.value.toLowerCase().replace(/\s/g, '') })} className={cx(inputCls, 'font-mono')} autoComplete="off" placeholder="cth. rian" />
                    </Field>
                    <Field label={hasLogin ? 'Password baru' : 'Password'} error={submitted || password ? errors.password : null} hint={hasLogin ? 'Kosongkan jika tidak diganti.' : 'Minimal 6 karakter.'}>
                      <div className="flex gap-2">
                        <div className="relative flex-1">
                          <input type={showPw ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} className={cx(inputCls, 'pr-11 font-mono')} autoComplete="new-password" />
                          <IconBtn icon={showPw ? 'eyeOff' : 'eye'} label={showPw ? 'Sembunyikan password' : 'Tampilkan password'} iconClass="h-4 w-4" onClick={() => setShowPw(v => !v)} className="absolute right-0 top-0" />
                        </div>
                        <Btn variant="secondary" size="sm" className="min-h-[44px]" onClick={() => { setPassword(generatePassword()); setShowPw(true); }}>Buat acak</Btn>
                      </div>
                    </Field>
                  </div>
                </div>

                <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                  <Field label="Email" error={errors.email}><input type="email" value={form.email || ''} onChange={e => setForm({ ...form, email: e.target.value })} className={inputCls} autoComplete="off" /></Field>
                  <Field label="Nomor WhatsApp" error={waError(form.phone)}><WaInput value={form.phone || ''} onChange={v => setForm({ ...form, phone: v })} /></Field>
                  <Field label="Peran" hint={form.role === 'owner' ? 'Bos punya akses penuh ke semua menu.' : form.role === 'investor' ? 'Hanya bisa melihat Dashboard, Laporan Penjualan, Laba Rugi, dan bagi hasilnya sendiri.' : 'Akses diatur di menu Hak Akses.'}><select value={form.role} onChange={e => setForm({ ...form, role: e.target.value })} className={inputCls}>{Object.entries(ROLE_LABELS).map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select></Field>
                  <Field label="Status"><select value={form.status || 'Aktif'} onChange={e => setForm({ ...form, status: e.target.value })} className={inputCls}><option>Aktif</option><option>Nonaktif</option></select></Field>
                </div>
                {form.role === 'investor' && (
                  <Field label="Tautkan ke data investor" hint={db.investors.length ? 'Investor ini hanya melihat porsi dan riwayat bagi hasil miliknya.' : 'Belum ada data investor. Tambahkan dulu di menu Portal Investor.'}>
                    <select value={form.investor_id || ''} onChange={e => setForm({ ...form, investor_id: e.target.value })} className={inputCls}>
                      <option value="">— Pilih investor —</option>
                      {db.investors.map(i => <option key={i.id} value={i.id}>{i.name} · {i.profit_share}%</option>)}
                    </select>
                  </Field>
                )}
                {isStaffRole(form.role) && (
                  <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
                    <Field label="Gaji pokok"><MoneyInput value={form.base_salary} onChange={v => setForm({ ...form, base_salary: v })} /></Field>
                    <Field label="Shift"><select value={form.shift_id || work.shifts[0].id} onChange={e => setForm({ ...form, shift_id: e.target.value })} className={inputCls}>{work.shifts.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
                    <Field label="Hari libur"><select value={form.day_off ?? 0} onChange={e => setForm({ ...form, day_off: e.target.value })} className={inputCls}>{WEEKDAYS.map((d, i) => <option key={d} value={i}>{d}</option>)}</select></Field>
                  </div>
                )}
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // PERMISSIONS
    // =====================================================================
    function PermissionsMatrixModule({ db, setDb, notify }) {
      const toggle = (key, label) => {
        const next = !db.permissions[key];
        setDb(prev => ({ ...prev, permissions: { ...prev.permissions, [key]: next } }));
        notify(`${label}: ${next ? 'diizinkan' : 'dibatasi'} untuk kasir.`, 'info');
      };
      const perms = [
        { key: 'can_add_product', label: 'Tambah produk', desc: 'Menambah item baru ke katalog.' },
        { key: 'can_edit_product', label: 'Edit produk, harga & stok', desc: 'Mengubah harga jual, foto, dan menambah stok.' },
        { key: 'can_delete_product', label: 'Hapus produk', desc: 'Menghapus produk dari sistem secara permanen.', risky: true },
        { key: 'can_give_discount', label: 'Beri diskon', desc: 'Memberi potongan harga saat checkout.' },
        { key: 'can_void_sale', label: 'Batalkan transaksi', desc: 'Membatalkan nota yang sudah dibayar di Laporan Penjualan.', risky: true },
        { key: 'can_view_finance', label: 'Lihat laba rugi', desc: 'Melihat laba, HPP, dan biaya operasional.', risky: true }
      ];
      return (
        <div className="space-y-5">
          <PageHeader title="Hak Akses Karyawan" desc="Atur fitur yang boleh digunakan Supervisor, Kepala Toko, dan Kasir. Bos selalu punya akses penuh." />
          <Card>
            <ul className="divide-y divide-slate-100">
              {perms.map(p => (
                <li key={p.key} className="flex items-center justify-between gap-4 p-4">
                  <div>
                    <p id={`perm-${p.key}`} className="flex items-center gap-2 text-sm font-semibold text-slate-900">{p.label}{p.risky && <Badge tone="amber">Sensitif</Badge>}</p>
                    <p className="text-sm text-slate-600">{p.desc}</p>
                  </div>
                  <Switch checked={!!db.permissions[p.key]} onChange={() => toggle(p.key, p.label)} labelledBy={`perm-${p.key}`} />
                </li>
              ))}
            </ul>
          </Card>
        </div>
      );
    }

    // =====================================================================
    // INVESTORS
    // =====================================================================
    // Payouts are plain records (no photo) to keep device storage small; the period can be a month or a whole year
    const payoutPeriodLabel = (p) => p.period_type === 'yearly' ? `Tahun ${p.period}` : monthLabel(p.period);
    const FREQ_LABEL = { monthly: 'Bulanan', yearly: 'Tahunan' };
    const MONTH_NAMES = Array.from({ length: 12 }, (_, i) => new Date(2026, i, 1).toLocaleDateString('id-ID', { month: 'long' }));

    function InvestorsModule({ db, setDb, notify, currentUser }) {
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({ name: '', phone: '', profit_share: 20, frequency: 'monthly' });
      const [payout, setPayout] = useState(null);
      const [openId, setOpenId] = useState(null);
      const [confirmDel, setConfirmDel] = useState(false);
      useEffect(() => setConfirmDel(false), [editing]);
      const removeInvestor = () => {
        setDb(prev => ({ ...prev, investors: prev.investors.filter(i => i.id !== editing.id), investor_payouts: (prev.investor_payouts || []).filter(x => x.investor_id !== editing.id) }));
        notify(`${editing.name} dihapus dari daftar investor.`, 'info');
        setEditing(null);
      };
      const today = dateKey();
      const year = Number(today.slice(0, 4));
      const monthNet = Math.max(0, computeFinancials(db, today.slice(0, 8) + '01', today).netProfit);
      const yearNet = Math.max(0, computeFinancials(db, `${year}-01-01`, today).netProfit);
      const baseFor = (inv) => (inv.frequency === 'yearly' ? yearNet : monthNet);
      const payouts = db.investor_payouts || [];
      const otherShares = db.investors.filter(i => editing === 'new' || !editing || i.id !== editing.id).reduce((a, i) => a + i.profit_share, 0);
      const share = parseFloat(form.profit_share) || 0;
      const shareError = share <= 0 ? 'Masukkan persentase.' : otherShares + share > 100 ? `Total bagi hasil jadi ${otherShares + share}% (maks. 100%).` : null;
      const totalShare = db.investors.reduce((a, i) => a + i.profit_share, 0);
      const paidOf = (id) => payouts.filter(p => p.investor_id === id).reduce((a, p) => a + p.amount, 0);
      const years = [year, year - 1, year - 2];

      const save = () => {
        if (!form.name.trim() || shareError || waError(form.phone)) return;
        const clean = { name: form.name.trim(), phone: form.phone || '', profit_share: share, frequency: form.frequency };
        if (editing === 'new') {
          setDb(prev => ({ ...prev, investors: [...prev.investors, { id: generateId('INV'), status: 'Aktif', ...clean }] }));
          notify(`${clean.name} ditambahkan sebagai investor.`);
        } else {
          setDb(prev => ({ ...prev, investors: prev.investors.map(i => i.id === editing.id ? { ...i, ...clean } : i) }));
          notify(`Data ${clean.name} diperbarui.`);
        }
        setEditing(null);
      };

      const periodValue = (p) => p.period_type === 'yearly' ? String(p.year) : `${p.year}-${pad(p.month)}`;
      const viewer = currentUser.role === 'investor';
      if (viewer) {
        const me = db.investors.find(i => i.id === currentUser.investor_id);
        if (!me) return (
          <div className="space-y-5">
            <PageHeader title="Bagi Hasil Saya" desc="Porsi dan riwayat bagi hasil Anda." />
            <EmptyState icon="investors" title="Akun belum ditautkan" desc="Minta Bos membuka menu Karyawan, memilih akun Anda, lalu memilih data investor yang sesuai." />
          </div>
        );
        const freq = me.frequency || 'monthly';
        const mine = payouts.filter(p => p.investor_id === me.id).sort((a, b) => b.date.localeCompare(a.date));
        return (
          <div className="space-y-5">
            <PageHeader title="Bagi Hasil Saya" desc={`Porsi ${me.profit_share}% dari laba bersih, dibagi ${FREQ_LABEL[freq].toLowerCase()}.`} />
            <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
              <StatCard label={freq === 'yearly' ? `Estimasi bagian ${year} sejauh ini` : 'Estimasi bagian bulan ini'} value={formatIDR(Math.round(baseFor(me) * me.profit_share / 100))} sub={`Laba bersih ${freq === 'yearly' ? 'tahun ini' : 'bulan ini'}: ${formatIDR(baseFor(me))}`} icon="investors" highlight />
              <StatCard label="Porsi saya" value={`${me.profit_share}%`} sub={`Dibagi ${FREQ_LABEL[freq].toLowerCase()}`} icon="users" />
              <StatCard label="Total sudah diterima" value={formatIDR(paidOf(me.id))} sub={`${mine.length} pembayaran`} icon="dollar" tone="amber" />
            </div>
            <Card className="p-4">
              <h3 className="text-base font-bold text-slate-900">Riwayat bagi hasil</h3>
              {mine.length === 0 ? <p className="mt-2 text-sm text-slate-500">Belum ada pembayaran tercatat.</p> : (
                <div className="mt-2 overflow-x-auto">
                  <table className="w-full min-w-[480px] text-left text-sm">
                    <thead className="text-xs font-semibold uppercase tracking-wide text-slate-500">
                      <tr><th scope="col" className="py-1.5 pr-3">Periode</th><th scope="col" className="py-1.5 pr-3">Tanggal bayar</th><th scope="col" className="py-1.5 pr-3">Metode</th><th scope="col" className="py-1.5 text-right">Nominal</th></tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {mine.map(p => (
                        <tr key={p.id}>
                          <td className="py-2 pr-3 font-medium text-slate-900">{payoutPeriodLabel(p)}</td>
                          <td className="py-2 pr-3 text-slate-700">{fmtDateShort(p.date)}</td>
                          <td className="py-2 pr-3 text-slate-600">{p.method}{p.note ? ` · ${p.note}` : ''}</td>
                          <td className="py-2 text-right font-semibold tabular">{formatIDR(p.amount)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </Card>
          </div>
        );
      }
      const duplicate = payout && payouts.some(x => x.investor_id === payout.investor_id && x.period_type === payout.period_type && x.period === periodValue(payout));

      const savePayout = () => {
        if (!payout.amount) return;
        const { month: _m, year: _y, ...rest } = payout;
        const record = { id: generateId('IP'), ...rest, period: periodValue(payout), recorded_by: currentUser.name };
        setDb(prev => ({ ...prev, investor_payouts: [record, ...(prev.investor_payouts || [])] }));
        notify(`Bagi hasil ${payoutPeriodLabel(record)} sebesar ${formatIDR(record.amount)} untuk ${db.investors.find(i => i.id === record.investor_id)?.name} tercatat.`);
        setOpenId(record.investor_id);
        setPayout(null);
      };

      const startPayout = (inv) => {
        const prevMonth = new Date(year, Number(today.slice(5, 7)) - 2, 1);
        setPayout({
          investor_id: inv.id, period_type: inv.frequency || 'monthly',
          month: prevMonth.getMonth() + 1, year: inv.frequency === 'yearly' ? year - 1 : prevMonth.getFullYear(),
          date: today, amount: Math.round(baseFor(inv) * inv.profit_share / 100), method: 'Transfer bank', note: ''
        });
      };

      return (
        <div className="space-y-5">
          <PageHeader title="Portal Investor" desc="Simulasi bagi hasil dan catatan pembayaran ke tiap investor." actions={<Btn icon="plus" onClick={() => { setForm({ name: '', phone: '', profit_share: 10, frequency: 'monthly' }); setEditing('new'); }}>Tambah investor</Btn>} />
          <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
