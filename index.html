  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback, useId } = React;

    const RechartsObj = window.Recharts || {};
    const { ResponsiveContainer, BarChart, Bar, Cell, XAxis, YAxis, Tooltip, CartesianGrid, Legend } = RechartsObj;

    const APP_NAME = 'KasirBosku';
    const STORAGE_KEY = 'kasirbosku_v3';
    // Isi dengan API key Gemini untuk mengaktifkan Asisten AI.
    const GEMINI_API_KEY = '';

    // =====================================================================
    // UTILITIES
    // =====================================================================
    const pad = (n) => String(n).padStart(2, '0');
    const cx = (...c) => c.filter(Boolean).join(' ');

    const formatIDR = (val) => new Intl.NumberFormat('id-ID', {
      style: 'currency', currency: 'IDR', maximumFractionDigits: 0
    }).format(Math.round(Number(val) || 0));

    const formatNumberWithDots = (val) => {
      if (!val && val !== 0) return '';
      return val.toString().replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    };
    const parseDotsToNumber = (str) => parseInt((str || '').toString().replace(/\D/g, ''), 10) || 0;

    // Local-calendar date key (YYYY-MM-DD); toISOString would shift days for UTC+7
    const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const addDays = (key, n) => { const d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + n); return dateKey(d); };
    const minToHHMM = (m) => `${pad(Math.floor(((m % 1440) + 1440) % 1440 / 60))}:${pad(((m % 60) + 60) % 60)}`;
    const hhmmToMin = (s) => { const [h, m] = (s || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
    const minutesOfIso = (iso) => { const d = new Date(iso); return d.getHours() * 60 + d.getMinutes(); };
    const fmtTime = (iso) => iso ? minToHHMM(minutesOfIso(iso)) : '—';
    const fmtDuration = (mins) => { const h = Math.floor(mins / 60), m = Math.round(mins % 60); return h ? (m ? `${h}j ${m}m` : `${h} jam`) : `${m} menit`; };
    const fmtDateLong = (d) => d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).replace(/^Minggu/, 'Ahad');
    const fmtDateShort = (key) => new Date(key + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
    const monthLabel = (ym) => new Date(ym + '-01T00:00:00').toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

    const generateId = (prefix = 'ID') => `${prefix}-${Math.random().toString(36).slice(2, 7).toUpperCase()}${Date.now().toString().slice(-4)}`;
    const newReceiptNo = () => `INV-${dateKey().replace(/-/g, '')}-${Math.floor(1000 + Math.random() * 9000)}`;

    const initialsOf = (name = '') => name.replace(/^(Hj?\.|Bpk\.|Ibu|Pak)\s*/i, '').split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?';

    const downloadCsv = (filename, rows, sep = ',') => {
      const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(sep)).join('\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    };

    // Excel reports: a styled .xlsx (title band, coloured headers, Rupiah format, totals).
    // ExcelJS loads on first use; without internet the same tables are saved as CSV.
    // A cell is a value, or { v, t } to format one cell differently from its column.
    const XLS_FMT = { money: '"Rp"#,##0;[Red]-"Rp"#,##0', paren: '"(Rp"#,##0")"', int: '#,##0', dec: '#,##0.0', pct: '0%' };
    const xlsVal = (c) => c && typeof c === 'object' && 'v' in c ? c.v : c;
    async function downloadReport(filename, { title, subtitle, sheets }) {
      try {
        if (!window.ExcelJS) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
        const wb = new window.ExcelJS.Workbook();
        wb.creator = APP_NAME; wb.created = new Date();
        const line = { style: 'thin', color: { argb: 'FFE2E8F0' } };
        const fill = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
        sheets.forEach(sh => {
          const ws = wb.addWorksheet(sh.name, { views: [{ showGridLines: false }], pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
          const span = Math.max(2, ...sh.tables.map(t => t.columns.length));
          ws.columns = Array.from({ length: span }, (_, i) => ({ width: Math.max(12, ...sh.tables.map(t => t.columns[i]?.width || 0)) }));
          const band = (r, text, font, argb, height) => {
            ws.mergeCells(r, 1, r, span);
            const c = ws.getCell(r, 1);
            c.value = text; c.font = font; c.fill = fill(argb); c.alignment = { vertical: 'middle', indent: 1 };
            ws.getRow(r).height = height;
          };
          band(1, title, { bold: true, size: 16, color: { argb: 'FFFFFFFF' } }, 'FF1A4FE6', 30);
          band(2, subtitle, { size: 11, color: { argb: 'FFDBE6FF' } }, 'FF1440C8', 20);
          let r = 4;
          sh.tables.forEach(t => {
            if (t.heading) { const c = ws.getCell(r, 1); c.value = t.heading; c.font = { bold: true, size: 12, color: { argb: 'FF0F172A' } }; r++; }
            const head = ws.getRow(r);
            t.columns.forEach((col, i) => {
              const c = head.getCell(i + 1);
              c.value = col.header; c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; c.fill = fill('FF1A4FE6');
              c.alignment = { vertical: 'middle', horizontal: col.t ? 'right' : 'left', wrapText: true };
              c.border = { top: line, bottom: line, left: line, right: line };
            });
            head.height = 22; r++;
            const put = (cells, argb, bold) => {
              const row = ws.getRow(r);
              t.columns.forEach((col, i) => {
                const raw = cells[i], c = row.getCell(i + 1);
                const type = (raw && typeof raw === 'object' && raw.t) || col.t;
                c.value = xlsVal(raw) ?? '';
                if (type && typeof c.value === 'number') c.numFmt = XLS_FMT[type];
                c.alignment = { vertical: 'top', horizontal: type && typeof c.value === 'number' ? 'right' : 'left', wrapText: !type };
                c.border = { bottom: line, left: line, right: line };
                if (argb) c.fill = fill(argb);
                if (bold) c.font = { bold: true };
              });
              r++;
            };
            t.rows.forEach((cells, i) => put(cells, i % 2 ? 'FFF6F8FC' : null));
            if (!t.rows.length) put(['Tidak ada data'], null);
            (t.totals || (t.total ? [t.total] : [])).forEach(row => put(row, 'FFEEF4FF', true));
            r++;
          });
        });
        const blob = new Blob([await wb.xlsx.writeBuffer()], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename + '.xlsx';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        return 'xlsx';
      } catch {
        downloadCsv(filename + '.csv', [[title], [subtitle], [], ...sheets.flatMap(sh => sh.tables.flatMap(t => [
          ...(t.heading ? [[t.heading]] : []), t.columns.map(c => c.header), ...t.rows.map(row => row.map(xlsVal)), ...(t.totals || (t.total ? [t.total] : [])).map(row => row.map(xlsVal)), []
        ]))]);
        return 'csv';
      }
    }
    const reportDone = (how, what) => how === 'xlsx' ? `${what} diunduh (Excel).` : `${what} diunduh sebagai CSV (Excel rapi butuh internet).`;

    // Resizes uploads before storing: a raw phone photo is 3–10 MB, the store only needs ~100 KB.
    // 'cover' crops to a square (menu photos), 'contain' keeps the whole image (QRIS must stay scannable).
    // The result is made smaller (lower quality, then fewer pixels) until it fits maxBytes.
    const PHOTO_INPUT_MAX = 20 * 1024 * 1024;
    const dataUrlBytes = (d) => Math.round((d.length - d.indexOf(',') - 1) * 3 / 4);
    function imageFileToDataUrl(file, { size = 480, mode = 'cover', type = 'image/webp', quality = 0.82, maxBytes = 120 * 1024 } = {}) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) return reject(new Error('File harus berupa gambar (JPG, PNG, atau WEBP).'));
        if (file.size > PHOTO_INPUT_MAX) return reject(new Error('Ukuran foto maksimal 20 MB.'));
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const draw = (px) => {
            if (mode === 'cover') {
              const s = Math.min(img.width, img.height);
              canvas.width = canvas.height = px;
              ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, px, px);
              ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, px, px);
            } else {
              const scale = Math.min(1, px / Math.max(img.width, img.height));
              canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
              ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }
          };
          // Browsers that cannot make WEBP (older iPhones) fall back to JPEG
          const encode = (q) => {
            if (type === 'image/png') return canvas.toDataURL('image/png');
            const d = canvas.toDataURL(type, q);
            return d.startsWith(`data:${type}`) ? d : canvas.toDataURL('image/jpeg', q);
          };
          let px = size, out = '';
          for (let round = 0; round < 6; round++) {
            draw(px);
            for (const q of type === 'image/png' ? [1] : [quality, 0.7, 0.6]) {
              out = encode(q);
              if (dataUrlBytes(out) <= maxBytes) return resolve(out);
            }
            px = Math.round(px * 0.8);
          }
          resolve(out);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak dapat dibaca.')); };
        img.src = url;
      });
    }

    // Deterministic PRNG so the demo data looks the same on every fresh install
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // =====================================================================
    // PRAYER TIMES (Kemenag RI: Subuh 20°, Isya 18°, Ashar Syafi'i, ihtiyat 2 menit)
    // Astronomical formulas follow the public-domain PrayTimes.org algorithm.
    // =====================================================================
    function computePrayerTimes(y, m, d, lat, lng, tz) {
      const rad = Math.PI / 180;
      const dsin = x => Math.sin(x * rad), dcos = x => Math.cos(x * rad), dtan = x => Math.tan(x * rad);
      const darcsin = x => Math.asin(x) / rad, darccos = x => Math.acos(Math.max(-1, Math.min(1, x))) / rad;
      const darctan2 = (a, b) => Math.atan2(a, b) / rad, darccot = x => Math.atan(1 / x) / rad;
      const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };

      let Y = y, M = m;
      if (M <= 2) { Y -= 1; M += 12; }
      const A = Math.floor(Y / 100), B = 2 - A + Math.floor(A / 4);
      const JD = Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + d + B - 1524.5 - lng / (15 * 24);

      const sun = (jd) => {
        const D = jd - 2451545.0;
        const g = fix(357.529 + 0.98560028 * D, 360);
        const q = fix(280.459 + 0.98564736 * D, 360);
        const L = fix(q + 1.915 * dsin(g) + 0.020 * dsin(2 * g), 360);
        const e = 23.439 - 0.00000036 * D;
        const RA = darctan2(dcos(e) * dsin(L), dcos(L)) / 15;
        return { decl: darcsin(dsin(e) * dsin(L)), eqt: q / 15 - fix(RA, 24) };
      };
      const midDay = (t) => fix(12 - sun(JD + t).eqt, 24);
      const altTime = (alt, t, ccw) => {
        const decl = sun(JD + t).decl;
        const T = darccos((dsin(alt) - dsin(decl) * dsin(lat)) / (dcos(decl) * dcos(lat))) / 15;
        return midDay(t) + (ccw ? -T : T);
      };
      const asrTime = (t) => {
        const decl = sun(JD + t).decl;
        return altTime(darccot(1 + dtan(Math.abs(lat - decl))), t, false);
      };

      const adj = (h) => h + tz - lng / 15;
      const ih = 2 / 60;
      const t = {
        subuh: adj(altTime(-20, 5 / 24, true)) + ih,
        terbit: adj(altTime(-0.833, 6 / 24, true)) - ih,
        dzuhur: adj(midDay(12 / 24)) + ih,
        ashar: adj(asrTime(13 / 24)) + ih,
        maghrib: adj(altTime(-0.833, 18 / 24, false)) + ih,
        isya: adj(altTime(-18, 18 / 24, false)) + ih
      };
      t.imsak = t.subuh - 10 / 60;
      const out = {};
      Object.keys(t).forEach(k => { out[k] = Math.round(fix(t[k], 24) * 60); });
      return out;
    }

    const PRAYER_LIST = [
      { key: 'imsak', label: 'Imsak', main: false },
      { key: 'subuh', label: 'Subuh', main: true },
      { key: 'terbit', label: 'Terbit', main: false },
      { key: 'dzuhur', label: 'Dzuhur', main: true },

    // WhatsApp numbers: digits only, normalised to 08xx-xxxx-xxxx (a pasted +62 prefix becomes 0)
    const formatWa = (raw) => {
      let d = String(raw || '').replace(/\D/g, '');
      if (d.startsWith('62')) d = '0' + d.slice(2);
      d = d.slice(0, 13);
      return [d.slice(0, 4), d.slice(4, 8), d.slice(8)].filter(Boolean).join('-');
    };
    const waError = (v) => {
      const d = String(v || '').replace(/\D/g, '');
      if (!d) return null;
      return /^08\d{8,11}$/.test(d) ? null : 'Nomor WhatsApp harus diawali 08 dan berisi 10–13 angka.';
    };
    function WaInput({ value, onChange, className, ...rest }) {
      return (
        <input type="tel" inputMode="numeric" autoComplete="tel" maxLength={15} placeholder="0812-3456-7890"
          value={value === '-' ? '' : (value || '')} onChange={e => onChange(formatWa(e.target.value))}
          className={cx(inputCls, 'tabular', waError(value) && 'border-rose-400', className)} {...rest} />
      );
    }

    // Any phone number (incl. landline like 0274-555123): digits only, must start with 0
    const formatPhone = (raw) => {
      let d = String(raw || '').replace(/\D/g, '');
      if (d.startsWith('62')) d = '0' + d.slice(2);
      if (d.startsWith('08')) return formatWa(d);
      d = d.slice(0, 14);

    function loadDb() {
      const seed = buildSeed();
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (!saved) return seed;
        return { ...seed, ...saved, business: mergeBusiness(seed.business, saved.business) };
      } catch {
        return seed;
      }
    }

    // =====================================================================
    // DOMAIN HELPERS
    // =====================================================================
    const PAYMENT_LABELS = { qris: 'QRIS', cash: 'Tunai', transfer: 'Transfer', bayar_nanti: 'Kasbon', deposit: 'Deposit' };
    // 'owner' stays the internal id so saved data keeps working; it is shown as "Bos"
    const ROLE_LABELS = { owner: 'Bos', supervisor: 'Supervisor', kepala_toko: 'Kepala Toko', kasir: 'Kasir', investor: 'Investor' };
    const ROLE_TONES = { owner: 'purple', supervisor: 'blue', kepala_toko: 'amber', kasir: 'teal', investor: 'green' };
    // People who work shifts, get paid a salary and appear in attendance / sales targets
    const isStaffRole = (role) => role !== 'owner' && role !== 'investor';
    // An investor only reads the store's numbers and their own profit share
    const INVESTOR_TABS = new Set(['dashboard', 'sales_report', 'finance', 'investors']);
    const LEAVE_TYPES = {
      sakit: { label: 'Sakit', tone: 'amber', desc: 'Tidak masuk karena sakit.' },
      izin: { label: 'Izin', tone: 'blue', desc: 'Tidak masuk dengan izin Bos.' },
      alpha: { label: 'Alpha', tone: 'rose', desc: 'Tidak masuk tanpa keterangan.' }
    };

    // Records something the Bos did that affects one employee; it appears in that employee's bell
    function withStaffNotif(state, userId, n) {
      if (!userId) return state;
      return { ...state, staff_notifications: [{ id: generateId('N'), user_id: userId, date: new Date().toISOString(), ...n }, ...(state.staff_notifications || [])].slice(0, 300) };
    }
    const isValidSale = (s) => s.status !== 'void';
    const saleDay = (s) => dateKey(new Date(s.date));
    const allSalesOf = (db) => [...db.offlineQueue, ...db.sales];

    // A cart/sale line for a variant has id "product::variant"; stock and cost belong to the product
    const productIdOf = (it) => it.product_id || String(it.id).split('::')[0];
    const variantIdOf = (it) => it.variant_id || String(it.id).split('::')[1] || '';
    // Variants with their own stock count separately, and the product's stock is their sum.
    // Variants left without a stock number share the product's stock instead.
    const hasVariantStock = (p) => (p?.variants || []).some(v => v.stock !== '' && v.stock != null);
    const variantStockSum = (variants) => variants.reduce((a, v) => a + (parseInt(v.stock, 10) || 0), 0);
    // Products sold without stock (made to order, services) are never out of stock or low
    const isLowStock = (p) => !p.no_stock && p.stock <= p.min_stock;
    const findVariant = (p, vid) => vid && (p?.variants || []).find(v => v.id === vid);
    // Stock that limits one cart line: its variant's own stock, or the product's
    function lineStock(products, lineId) {
      const p = products.find(x => x.id === productIdOf({ id: lineId }));
      if (!p || p.no_stock) return Infinity;
      const v = hasVariantStock(p) && findVariant(p, variantIdOf({ id: lineId }));
      return v ? parseInt(v.stock, 10) || 0 : p.stock;
    }
    // Units in the cart that use the same stock as this line
    function unitsSharingStock(cart, products, lineId) {
      const pid = productIdOf({ id: lineId });
      const p = products.find(x => x.id === pid);
      if (p && hasVariantStock(p) && variantIdOf({ id: lineId })) return cart.filter(c => c.id === lineId).reduce((a, c) => a + c.qty, 0);
      return cart.filter(c => productIdOf(c) === pid).reduce((a, c) => a + c.qty, 0);
    }
    // Adds (or with a negative delta takes) stock for one sold line, keeping the product total equal to its variants
    function changeLineStock(p, vid, delta) {
      if (p.no_stock) return p;
      const v = hasVariantStock(p) && findVariant(p, vid);
      if (!v) return { ...p, stock: Math.max(0, p.stock + delta) };
      const variants = p.variants.map(x => x.id === vid ? { ...x, stock: Math.max(0, (parseInt(x.stock, 10) || 0) + delta) } : x);
      return { ...p, variants, stock: variantStockSum(variants) };
    }
    const applySaleLines = (products, items, sign) => products.map(p => items.filter(i => productIdOf(i) === p.id).reduce((acc, i) => changeLineStock(acc, variantIdOf(i), sign * i.qty), p));

    // Which kasbon sales are paid off. The customer's open balance covers their newest kasbon first; anything older is paid.
    // Worked out from the balance, so it also holds for kasbon paid before this rule existed and on every device.
    function kasbonStatusMap(db) {
      const map = new Map(), groups = {};
      allSalesOf(db).filter(s => s.payment_method === 'bayar_nanti' && s.status !== 'void').forEach(s => (groups[s.customer_id || s.customer_name] ||= []).push(s));
      for (const [cid, list] of Object.entries(groups)) {
        const c = db.customers.find(x => x.id === cid || x.name === cid);
        let open = c ? (c.debt || 0) : 0;
        list.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(sale => {
          if (open >= sale.total) { map.set(sale.id, 'unpaid'); open -= sale.total; }
          else if (open > 0) { map.set(sale.id, 'partial'); open = 0; }
          else map.set(sale.id, 'paid');
        });
      }
      return map;
    }
    const withKasbonStatus = (sale, db) => sale && sale.payment_method === 'bayar_nanti' && sale.status !== 'void' ? { ...sale, kasbon_status: kasbonStatusMap(db).get(sale.id) } : sale;
    const paymentLabel = (sale) => sale.payment_method !== 'bayar_nanti' ? PAYMENT_LABELS[sale.payment_method]
      : sale.kasbon_status === 'paid' ? 'LUNAS' : sale.kasbon_status === 'partial' ? 'Kasbon (dibayar sebagian)' : 'Kasbon';

    // sale.total is the money that came in: the bill, minus what the customer's saldo paid, plus change left as saldo.
    // Every report, the cash drawer and kasbon read it, so saldo is income once: when it is left, not again when it is used.
    const saleBill = (s) => s.total - (s.deposit_in || 0) + (s.deposit_used || 0);

    // Which kasbon sales each repayment paid, oldest first (the same order as kasbonStatusMap)
    function kasbonPayRows(db) {
      const pays = (db.debt_payments || []).filter(p => p.kind === 'customer').sort((a, b) => new Date(a.date) - new Date(b.date));
      if (!pays.length) return [];
      const open = {};
      allSalesOf(db).filter(s => s.payment_method === 'bayar_nanti' && s.status !== 'void').sort((a, b) => new Date(a.date) - new Date(b.date))
        .forEach(s => (open[s.customer_id || s.customer_name] ||= []).push({ sale: s, left: s.total }));
      const rows = [];
      pays.forEach(pay => {
        const name = db.customers.find(c => c.id === pay.party_id)?.name;
        let rest = pay.amount;
        for (const o of open[pay.party_id] || open[name] || []) {
          if (rest <= 0) break;
          const take = Math.min(rest, o.left);
          if (take <= 0) continue;
          o.left -= take; rest -= take;
          rows.push({ pay, sale: o.sale, amount: take, settled: o.left === 0 });
        }
        if (rest > 0) rows.push({ pay, sale: null, amount: rest, settled: true });
      });
      return rows;
    }

    // HPP from each product's real buy price; 45% of price only for items whose product was deleted
    function saleCost(sale, products) {
      return sale.items.reduce((a, it) => {
        const p = products.find(x => x.id === productIdOf(it));
        const v = findVariant(p, variantIdOf(it));
        return a + it.qty * (p ? (v && Number(v.buy_price) > 0 ? Number(v.buy_price) : p.buy_price) : it.sell_price * 0.45);
      }, 0);
    }

    function computeFinancials(db, from, to) {
      const inRange = (k) => (!from || k >= from) && (!to || k <= to);
      const sales = allSalesOf(db).filter(s => isValidSale(s) && inRange(saleDay(s)));
      const revenue = sales.reduce((a, s) => a + s.total - (s.tax || 0), 0);
      const taxCollected = sales.reduce((a, s) => a + (s.tax || 0), 0);
      const hpp = Math.round(sales.reduce((a, s) => a + saleCost(s, db.products), 0));
      const expenses = db.expenses.filter(e => inRange(e.date)).reduce((a, e) => a + e.amount, 0);
      const grossProfit = revenue - hpp;
      const discount = sales.reduce((a, s) => a + (s.discount || 0), 0);
      const depositIn = sales.reduce((a, s) => a + (s.deposit_in || 0), 0);
      const depositUsed = sales.reduce((a, s) => a + (s.deposit_used || 0), 0);
      const salesNet = revenue - depositIn + depositUsed;
      return { count: sales.length, revenue, taxCollected, hpp, grossProfit, expenses, netProfit: grossProfit - expenses, discount, depositIn, depositUsed, salesNet };
    }

    // ---------- Pricing: product "harga coret" and seasonal promos ----------
    const activePromos = (db, day = dateKey()) => (db.seasonal_promos || []).filter(p => p.active && p.start <= day && p.end >= day);
    function priceInfo(product, promos) {
      const base = product.sell_price;
      let price = product.promo_price > 0 && product.promo_price < base ? product.promo_price : base;
      let label = price < base ? 'Harga coret' : null;
      promos.forEach(p => {
        if (p.scope !== 'all' && !(p.product_ids || []).includes(product.id)) return;
        const v = p.type === 'percent' ? Math.round(base * (1 - p.value / 100)) : Math.max(0, base - p.value);
        if (v < price) { price = v; label = p.name; }
      });
      return { price, original: base, discounted: price < base, label, pct: base ? Math.round((1 - price / base) * 100) : 0 };
    }
    // On the menu a product with variants shows its cheapest variant
    function menuPriceInfo(product, promos) {
      const prices = (product.variants || []).map(v => Number(v.price)).filter(n => n > 0);
      if (!prices.length) return priceInfo(product, promos);
      const min = Math.min(...prices);
      return { price: min, original: min, discounted: false, label: null, pct: 0 };
    }

    // ---------- Shifts & attendance ----------
    const shiftOf = (user, work) => work.shifts.find(s => s.id === user?.shift_id) || work.shifts[0];
    function shiftWindow(shift) {
      const start = hhmmToMin(shift.start);
      let end = hhmmToMin(shift.end);
      if (end <= start) end += 1440;
      return { start, end };
    }
    // Minutes since midnight of the attendance day, so an overnight clock-out reads as e.g. 24:30
    const minutesFromDay = (iso, key) => Math.round((new Date(iso) - new Date(key + 'T00:00:00')) / 60000);

    function attendanceInfo(rec, work, user) {
      const { start, end } = shiftWindow(shiftOf({ shift_id: rec.shift_id || user?.shift_id }, work));
      const inMin = minutesFromDay(rec.clock_in, rec.date);
      const lateMin = inMin - start > work.late_tolerance ? inMin - start : 0;
      const worked = rec.clock_out ? Math.max(0, (new Date(rec.clock_out) - new Date(rec.clock_in)) / 60000) : 0;
      const otMin = rec.clock_out ? minutesFromDay(rec.clock_out, rec.date) - end : 0;
      return { lateMin, worked, otMin };
    }

    function monthlyRecap(db, user, ym) {
      const work = db.business.work;
      const recs = db.attendance.filter(a => a.user_id === user.id && a.date.startsWith(ym));
      let lateDays = 0, worked = 0;
      recs.forEach(r => { const i = attendanceInfo(r, work, user); if (i.lateMin) lateDays++; worked += i.worked; });
      const ots = db.overtime.filter(o => o.user_id === user.id && o.date.startsWith(ym));
      const otMinutes = ots.filter(o => o.status === 'approved').reduce((a, o) => a + o.minutes, 0);
      const otPay = Math.round(otMinutes / 60 * work.overtime_rate);
      const reward = db.rewards.filter(r => r.user_id === user.id && r.date.startsWith(ym)).reduce((a, r) => a + r.amount, 0);
      const sales = allSalesOf(db).filter(s => isValidSale(s) && s.cashier_id === user.id && saleDay(s).startsWith(ym)).reduce((a, s) => a + s.total, 0);
      const lv = (db.leaves || []).filter(l => l.user_id === user.id && l.date.startsWith(ym));
      return {
        present: recs.length, lateDays, worked, otMinutes, otPay,

      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLng / 2) ** 2;

    // A frame from the live camera with its information burned in, so it cannot be cropped off without showing
    function stampSelfie(video, lines) {
      const w = Math.min(720, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);
      const size = Math.max(14, Math.round(w / 32)), gap = Math.round(size * 1.4), pad = Math.round(size * 0.8);
      ctx.font = `600 ${size}px Inter, Arial, sans-serif`;
      ctx.textBaseline = 'top';
      // A full address is longer than one row
      const wrap = (line) => {
        const out = [''];
        for (const word of line.split(' ')) {
          const last = out[out.length - 1], joined = last ? `${last} ${word}` : word;
          if (!last || ctx.measureText(joined).width <= w - pad * 2) out[out.length - 1] = joined;
          else out.push(word);
        }
        return out;
      };
      const rows = lines.flatMap(wrap);
      const band = rows.length * gap + pad * 2;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.68)';
      ctx.fillRect(0, h - band, w, band);
      ctx.fillStyle = '#ffffff';
      rows.forEach((t, i) => ctx.fillText(t, pad, h - band + pad + i * gap, w - pad * 2));
      for (const q of [0.75, 0.6, 0.45]) {
        const out = canvas.toDataURL('image/jpeg', q);
        if (dataUrlBytes(out) <= 200 * 1024) return out;
      }
      return canvas.toDataURL('image/jpeg', 0.35);
    }

        for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
        for (let i = 16; i < 64; i++) {
          const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3);

    const newSecret = () => [...crypto.getRandomValues(new Uint8Array(20))].map(b => b.toString(16).padStart(2, '0')).join('');

    // Phone status bar colour = colour at the top of the current screen
    function setThemeColor(color) {

    // ---------- Offline sign-in ----------
    // After an online sign-in the session is kept on this device, encrypted with a key made from the password.
    // Signing in again without internet = decrypting it; only the right password can, and the password itself is never stored.
    const VAULT_KEY = 'kasirbosku_vault';
    const VAULT_ITER = 150000;
    const vaultKeys = new Map(); // username -> { key, salt } while signed in, to re-seal refreshed tokens
    const canVault = () => !!(window.crypto && crypto.subtle);
    const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const fromB64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    async function vaultDeriveKey(password, salt) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: VAULT_ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    async function vaultSeal(username, session, key, salt) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(session)));
      const all = readLocal(VAULT_KEY, {}) || {};
      all[username] = { salt: toB64(salt), iv: toB64(iv), ct: toB64(ct), saved: new Date().toISOString() };
      writeLocal(VAULT_KEY, all);
    }
    async function vaultRemember(username, password, session) {
      if (!canVault() || !username) return;
      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const key = await vaultDeriveKey(password, salt);
        vaultKeys.set(username, { key, salt });
        await vaultSeal(username, session, key, salt);
      } catch { /* offline sign-in simply stays unavailable on this browser */ }
    }
    async function vaultRefresh(session) {
      const k = vaultKeys.get(session?.user?.username);
      if (k) try { await vaultSeal(session.user.username, session, k.key, k.salt); } catch {}
    }
    function vaultForget(username) {
      vaultKeys.delete(username);
      const all = readLocal(VAULT_KEY, {}) || {};
      if (all[username]) { delete all[username]; writeLocal(VAULT_KEY, all); }
    }
    // -> { session } or { error }
    async function vaultOpen(username, password) {
      const all = readLocal(VAULT_KEY, {}) || {};
      const e = all[username];
      if (!e || !canVault()) return { error: 'Tidak ada internet. Akun ini belum pernah masuk di perangkat ini, jadi masuk pertama kali butuh internet.' };
      if (e.until && e.until > Date.now()) return { error: `Terlalu banyak percobaan. Coba lagi ${Math.ceil((e.until - Date.now()) / 60000)} menit lagi.` };
      try {
        const salt = fromB64(e.salt);
        const key = await vaultDeriveKey(password, salt);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(e.iv) }, key, fromB64(e.ct));
        const session = JSON.parse(new TextDecoder().decode(plain));
        vaultKeys.set(username, { key, salt });
        if (e.fails) { delete e.fails; delete e.until; writeLocal(VAULT_KEY, all); }
        return { session };
      } catch {
        e.fails = (e.fails || 0) + 1;
        if (e.fails >= 5) { e.fails = 0; e.until = Date.now() + 5 * 60000; }
        writeLocal(VAULT_KEY, all);
        return { error: 'Tidak ada internet, dan password tidak cocok dengan password terakhir yang dipakai di perangkat ini.' };
      }
    }

    class ApiError extends Error {
      constructor(status, message, code) { super(message); this.status = status; this.code = code; }
    }
    async function apiFetch(path, { token, method = 'GET', json, blob } = {}) {
      const headers = {};
      if (token) headers.Authorization = `Bearer ${token}`;
      if (json !== undefined) headers['Content-Type'] = 'application/json';
      if (blob) headers['Content-Type'] = blob.type;
      let res;
      try { res = await fetch(CLOUD_API + path, { method, headers, body: blob || (json !== undefined ? JSON.stringify(json) : undefined) }); }
      catch { throw new ApiError(0, 'Tidak ada koneksi ke server. Periksa internet.'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new ApiError(res.status, data.error || `Server sedang bermasalah (${res.status}).`, data.code);
      return data;
    }

    // A real store starts from these, not from the demo data
    function defaultBusiness(name = '') {
      return {
        name, type: '', address: '', phone: '', qris_nmid: '', qris_image: '',
        monthly_target: 10000000, tax_rate: 10, tax_active: false, bank_accounts: [],
        location: { city: 'Jakarta', lat: -6.2088, lng: 106.8456, tz: 7 },
        prayer: { enabled: true, remind_before: 10, sound: true, hijri_offset: 0 },
        work: { shifts: DEFAULT_SHIFTS, late_tolerance: 10, overtime_rate: 15000, overtime_min: 30, attendance_gps: false, attendance_radius: 150, attendance_store_device: false },
        store_devices: [],
        receipt: {
          logo: '', show_logo: true, show_address: true, show_phone: true, show_cashier: true, show_customer: true,
          show_discount: true, show_tax: true, show_brand: true, show_queue: false, paper: '58',

    function mergeBusiness(base, sb = {}) {

    // Server copy -> what the app keeps locally (defaults filled in the same way on every device)
    function normalizeDoc(id, val) {

      return val;
    }
    // A copy still in localStorage may be cut short, so it moves here without its sync position and the first pull refills it
    async function readSavedDb(tenantId) {
      const key = cloudKey(tenantId, 'db');
      try {
        const saved = await deviceGet(key);
        if (saved) return JSON.parse(saved);
        const old = localStorage.getItem(key);
        if (old) {
          await deviceSet(key, old);
          writeLocal(key, null);
          writeLocal(cloudKey(tenantId, 'cursor'), null);
        }
        return old ? JSON.parse(old) : {};
      } catch { return readLocal(key, {}) || {}; }
    }
    function loadCloudDb(saved) {
      const db = { categories: ['Semua'], ...Object.fromEntries(COLLECTION_KEYS.map(k => [k, []])), ...saved };
      return { ...db, business: normalizeDoc('business', saved.business || {}), permissions: normalizeDoc('permissions', saved.permissions || {}) };
    }

    function forEachRecord(db, fn) {
      for (const [k, v] of Object.entries(db)) {
        if (DOC_KEYS.includes(k)) fn('_doc', k, v);
        else if (Array.isArray(v)) v.forEach(r => { if (r && r.id != null) fn(k, String(r.id), r); });
      }
    }
    function counterBase(coll, rec) {
      const fields = COUNTER_FIELDS[coll];
      if (!fields || !rec) return null;
      // A customer without a deposit yet counts as 0, so two devices adding one at once both count
      return Object.fromEntries(fields.filter(f => typeof rec[f] === 'number' || f === 'deposit').map(f => [f, rec[f] || 0]));
    }
    const isDataImage = (v) => typeof v === 'string' && v.startsWith('data:image/');
    function findDataImages(v, out = new Set()) {
      if (isDataImage(v)) out.add(v);
      else if (Array.isArray(v)) v.forEach(x => findDataImages(x, out));
      else if (v && typeof v === 'object') Object.values(v).forEach(x => findDataImages(x, out));
      return out;
    }
    function replaceDeep(v, from, to) {
      if (v === from) return to;
      if (Array.isArray(v)) {
        let changed = false;
        const n = v.map(x => { const y = replaceDeep(x, from, to); if (y !== x) changed = true; return y; });
        return changed ? n : v;
      }
      if (v && typeof v === 'object') {
        let changed = false;
        const n = {};
        for (const [k, x] of Object.entries(v)) { const y = replaceDeep(x, from, to); if (y !== x) changed = true; n[k] = y; }
        return changed ? n : v;
      }
      return v;
    }
    function replaceInDb(db, coll, id, from, to) {
      if (coll === '_doc') { const v = replaceDeep(db[id], from, to); return v === db[id] ? db : { ...db, [id]: v }; }
      const list = db[coll];
      if (!Array.isArray(list)) return db;
      let changed = false;
      const next = list.map(r => { if (String(r?.id) !== id) return r; const n = replaceDeep(r, from, to); if (n !== r) changed = true; return n; });
      return changed ? { ...db, [coll]: next } : db;
    }
    function mergeRemote(db, updates) {
      const next = { ...db };
      const lists = {};
      for (const u of updates) {
        if (u.coll === '_doc') { if (!u.deleted) next[u.id] = u.val; continue; }
        const L = lists[u.coll] || (lists[u.coll] = { items: [...(Array.isArray(db[u.coll]) ? db[u.coll] : [])], index: null, added: false });
        if (!L.index) L.index = new Map(L.items.map((r, i) => [String(r?.id), i]));
        const i = L.index.get(u.id);
        if (u.deleted) { if (i != null) { L.items.splice(i, 1); L.index = null; } continue; }
        if (i != null) { L.items[i] = u.val; continue; }
        if (NEWEST_FIRST.has(u.coll)) { L.items.unshift(u.val); L.index = null; }
        else { L.items.push(u.val); L.index.set(u.id, L.items.length - 1); }

        if (L.added && NEWEST_FIRST.has(coll) && L.items.every(r => r && r.date)) L.items.sort((a, b) => String(b.date).localeCompare(String(a.date)));

      }
      return next;
    }

    // ---------- Activity log ----------
    // Each device keeps what its users did in a small queue; the queue goes to the server with every sync and only the Bos reads it.
    const logQueueKey = (tenantId) => tenantId ? cloudKey(tenantId, 'logq') : 'kasirbosku_logq_demo';
    function appendLog(tenantId, user, entries) {
      if (!entries.length || !user) return;
      const at = new Date(trueNow()).toISOString();
      const q = readLocal(logQueueKey(tenantId), []) || [];
      entries.forEach(e => q.push({ id: generateId('LOG'), at, user_id: user.id, user_name: user.name, role: user.role, ...e }));
      // Demo mode has no server, so its log is the queue itself; a cloud device only holds unsent entries
      writeLocal(logQueueKey(tenantId), q.slice(-(tenantId ? 3000 : 500)));
    }
    async function flushLogs(tenantId, token) {
      const key = logQueueKey(tenantId);
      for (let round = 0; round < 20; round++) {
        const q = readLocal(key, []) || [];
        if (!q.length) return;
        const batch = q.slice(0, 200);
        await apiFetch('/api/logs', { token, method: 'POST', json: { entries: batch } });
        const sent = new Set(batch.map(e => e.id));
        writeLocal(key, (readLocal(key, []) || []).filter(e => !sent.has(e.id)));
      }
    }

    // Turns a change to the store's data into readable lines: "Mengubah produk Es Teh (harga jual Rp 5.000 → Rp 6.000)"
    const LOG_FIELDS = { name: 'nama', sku: 'SKU', category: 'kategori', buy_price: 'HPP', sell_price: 'harga jual', promo_price: 'harga promo', stock: 'stok', min_stock: 'stok minimum', unit: 'satuan', img: 'foto', variants: 'varian', phone: 'no. HP', address: 'alamat', role: 'peran', status: 'status', base_salary: 'gaji pokok', username: 'ID login', shift_id: 'shift', debt: 'kasbon' };
    const MONEY_FIELDS = new Set(['buy_price', 'sell_price', 'promo_price', 'base_salary', 'debt', 'amount', 'total']);
    const LOG_COLLS = {
      products: { kind: 'produk', label: 'produk' },
      customers: { kind: 'pelanggan', label: 'pelanggan', quiet: ['debt', 'total_spent', 'visits', 'deposit'] },
      suppliers: { kind: 'pembelian', label: 'pemasok' },
      users: { kind: 'karyawan', label: 'akun', quiet: ['password_hash', 'password_salt'] },
      purchases: { kind: 'pembelian', label: 'pesanan barang', name: r => r.po_number },
      expenses: { kind: 'keuangan', label: 'pengeluaran', name: r => `${r.category || r.note || ''} ${formatIDR(r.amount || 0)}`.trim() },
      coupons: { kind: 'promo', label: 'voucher', name: r => r.code },
      seasonal_promos: { kind: 'promo', label: 'promo musiman' },
      employeeIncentives: { kind: 'promo', label: 'target karyawan' },
      investors: { kind: 'keuangan', label: 'investor' },
      investor_payouts: { kind: 'keuangan', label: 'bagi hasil investor', name: r => formatIDR(r.amount || 0) },
      leaves: { kind: 'absensi', label: 'izin/cuti' },
      rewards: { kind: 'absensi', label: 'reward', name: r => formatIDR(r.amount || 0) }
    };
    const logVal = (k, v) => v == null || v === '' ? '–' : MONEY_FIELDS.has(k) ? formatIDR(Number(v) || 0) : typeof v === 'object' ? '' : String(v);
    function describeChanges(prev, next) {
      const out = [];
      const byId = (list) => new Map((Array.isArray(list) ? list : []).filter(r => r && r.id != null).map(r => [String(r.id), r]));
      const salesChanged = prev.sales !== next.sales || prev.offlineQueue !== next.offlineQueue;
      // Sales and their cancellations
      if (salesChanged) {
        const before = byId([...(prev.offlineQueue || []), ...(prev.sales || [])]);
        [...(next.offlineQueue || []), ...(next.sales || [])].forEach(sale => {
          const old = before.get(String(sale.id));
          if (!old) out.push({ kind: 'penjualan', action: `${sale.payment_method === 'bayar_nanti' ? 'Mencatat kasbon' : 'Transaksi'} ${sale.receipt_no}`, detail: `${formatIDR(sale.total)} · ${PAYMENT_LABELS[sale.payment_method] || sale.payment_method} · ${sale.customer_name} · ${sale.items.reduce((a, it) => a + it.qty, 0)} item${sale.deposit_in ? ` · deposit ${formatIDR(sale.deposit_in)}` : ''}${sale.deposit_used ? ` · potong saldo ${formatIDR(sale.deposit_used)}` : ''}` });
          else if (old.status !== 'void' && sale.status === 'void') out.push({ kind: 'penjualan', action: `Membatalkan transaksi ${sale.receipt_no}`, detail: `${formatIDR(sale.total)} · alasan: ${sale.void_reason || '-'}` });
          else if (!old.void_request && sale.void_request) out.push({ kind: 'penjualan', action: `Mengajukan pembatalan ${sale.receipt_no}`, detail: sale.void_request.reason || '' });
        });
      }
      // Cash drawer
      if (prev.cashSessions !== next.cashSessions) {
        const before = byId(prev.cashSessions);
        (next.cashSessions || []).forEach(c => {
          const old = before.get(String(c.id));
          if (!old) out.push({ kind: 'kas', action: 'Membuka kasir', detail: `Modal awal ${formatIDR(c.opening_cash || 0)}` });
          else if (!old.closed_at && c.closed_at) out.push({ kind: 'kas', action: 'Menutup kasir', detail: `Uang di laci ${formatIDR(c.counted_cash ?? 0)}${c.difference ? ` · selisih ${formatIDR(c.difference)}` : ' · sesuai'}` });
        });
      }
      // Attendance
      if (prev.attendance !== next.attendance) {
        const before = byId(prev.attendance);
        const userName = (id) => (next.users || []).find(u => u.id === id)?.name || '';
        (next.attendance || []).forEach(a => {
          const old = before.get(String(a.id));
          if (!old && a.clock_in) out.push({ kind: 'absensi', action: 'Absen datang', detail: `${userName(a.user_id)} · ${fmtTime(a.clock_in)}` });
          else if (old && !old.clock_out && a.clock_out) out.push({ kind: 'absensi', action: 'Absen pulang', detail: `${userName(a.user_id)} · ${fmtTime(a.clock_out)}` });
        });
      }
      if (prev.overtime !== next.overtime) {
        const before = byId(prev.overtime);
        (next.overtime || []).forEach(o => {
          const old = before.get(String(o.id));
          if (old && old.status !== o.status && o.status !== 'pending') out.push({ kind: 'absensi', action: o.status === 'approved' ? 'Menyetujui lembur' : 'Menolak lembur', detail: `${(next.users || []).find(u => u.id === o.user_id)?.name || ''} · ${fmtDuration(o.minutes)}` });
        });
      }
      // Debt payments
      if (prev.debt_payments !== next.debt_payments) {
        const before = byId(prev.debt_payments);
        (next.debt_payments || []).forEach(pay => {
          if (before.has(String(pay.id))) return;
          const party = pay.kind === 'supplier' ? (next.suppliers || []).find(x => x.id === pay.party_id) : (next.customers || []).find(x => x.id === pay.party_id);
          out.push({ kind: 'keuangan', action: pay.kind === 'supplier' ? 'Membayar hutang pemasok' : 'Menerima pelunasan kasbon', detail: `${party?.name || ''} · ${formatIDR(pay.amount)}` });
        });
      }
      if (prev.deposit_moves !== next.deposit_moves) {
        const before = byId(prev.deposit_moves);
        (next.deposit_moves || []).forEach(m => {
          if (!before.has(String(m.id))) out.push({ kind: 'pelanggan', action: m.kind === 'refund' ? 'Mengembalikan uang pelanggan' : 'Memindahkan saldo Deposit', detail: `${m.customer_name}${m.to_name ? ` ke ${m.to_name}` : ''} · ${formatIDR(m.amount)}` });
        });
      }
      // Ordinary records: added, changed (with the fields that changed), deleted
      for (const [coll, cfg] of Object.entries(LOG_COLLS)) {
        if (prev[coll] === next[coll]) continue;
        const before = byId(prev[coll]);
        const nameOf = (r) => (cfg.name ? cfg.name(r) : r.name) || r.id;
        for (const r of next[coll] || []) {
          if (!r || r.id == null) continue;
          const old = before.get(String(r.id));
          before.delete(String(r.id));
          if (!old) { out.push({ kind: cfg.kind, action: `Menambah ${cfg.label} ${nameOf(r)}`, detail: '' }); continue; }
          if (old === r) continue;
          const keys = [...new Set([...Object.keys(old), ...Object.keys(r)])]
            .filter(k => !(cfg.quiet || []).includes(k) && JSON.stringify(old[k]) !== JSON.stringify(r[k]));
          // Stock moved by a sale or its cancellation is already in that line
          if (coll === 'products' && salesChanged && keys.every(k => k === 'stock')) continue;
          if (!keys.length) continue;
          const parts = keys.slice(0, 4).map(k => {
            const label = LOG_FIELDS[k] || k;
            const a = logVal(k, old[k]), b = logVal(k, r[k]);
            return a && b && (a + b).length < 60 ? `${label} ${a} → ${b}` : label;
          });
          out.push({ kind: cfg.kind, action: `Mengubah ${cfg.label} ${nameOf(r)}`, detail: parts.join(' · ') + (keys.length > 4 ? ` · +${keys.length - 4} lainnya` : '') });
        }
        before.forEach(r => out.push({ kind: cfg.kind, action: `Menghapus ${cfg.label} ${nameOf(r)}`, detail: '' }));
      }
      // Settings
      if (prev.business !== next.business) out.push({ kind: 'pengaturan', action: 'Mengubah pengaturan toko', detail: Object.keys({ ...prev.business, ...next.business }).filter(k => JSON.stringify(prev.business?.[k]) !== JSON.stringify(next.business?.[k])).slice(0, 6).join(', ') });
      if (prev.permissions !== next.permissions) out.push({ kind: 'pengaturan', action: 'Mengubah hak akses karyawan', detail: '' });
      if (prev.categories !== next.categories) {
        const a = new Set(prev.categories || []), b = new Set(next.categories || []);
        [...b].filter(c => !a.has(c)).forEach(c => out.push({ kind: 'produk', action: `Menambah kategori ${c}`, detail: '' }));
        [...a].filter(c => !b.has(c)).forEach(c => out.push({ kind: 'produk', action: `Menghapus kategori ${c}`, detail: '' }));
      }
      return out;
    }

    // ---------- License ----------
    // Remembered per store, so an expired or disabled store stays locked even offline
    const licenseKey = (tenantId) => cloudKey(tenantId, 'license');
    const LICENSE_PLAN_LABELS = { trial: 'Trial', bulanan: 'Bulanan', tahunan: 'Tahunan' };
    function licenseDaysLeft(lic) {
      if (!lic?.expires_at) return null;
      return Math.ceil((new Date(lic.expires_at).getTime() - trueNow()) / 86400000);
    }

    // Keeps this device and the server in step.
    // Local data = what the server has + this device's unsent changes (the outbox), so nothing is lost offline.
    function useCloudSync({ session, db, setDb, notify, onSessionUpdate, onSessionEnd, onLicense, readOnly = false }) {
      const enabled = !!session;
      const tenantId = session?.tenant.id;
      const cb = useRef({});
      cb.current = { setDb, notify, onSessionUpdate, onSessionEnd, onLicense, token: session?.token };
      const st = useRef(null);
      if (enabled && !st.current) {
        const outbox = new Map((readLocal(cloudKey(tenantId, 'outbox'), []) || []).map(e => [recKey(e.coll, e.id), e]));
        const server = new Map();
        forEachRecord(db, (coll, id, rec) => { const k = recKey(coll, id); if (!outbox.has(k)) server.set(k, JSON.stringify(rec)); });
        st.current = { outbox, server, prev: db, cursor: db._cursor || 0, busy: false, again: false, dead: false, uploads: new Map(), timer: null };
      }
      const [status, setStatus] = useState({ phase: 'syncing', pending: st.current ? st.current.outbox.size : 0, last: null, error: null });

      const persistOutbox = () => {
        const s = st.current;
        if (!writeLocal(cloudKey(tenantId, 'outbox'), [...s.outbox.values()]) && !s.quotaWarned) {
          s.quotaWarned = true;
          cb.current.notify('Penyimpanan perangkat penuh. Sambungkan internet agar perubahan terkirim.', 'warn');
        }
      };

      const applyRows = (rows) => {
        const s = st.current;
        const updates = [];
        for (const r of rows) {
          const k = recKey(r.coll, r.id);
          if (r.deleted || r.data == null) {
            s.server.delete(k);
            if (!s.outbox.has(k)) updates.push({ coll: r.coll, id: r.id, deleted: true });
            continue;
          }
          const val = r.coll === '_doc' ? normalizeDoc(r.id, r.data) : r.data;
          s.server.set(k, JSON.stringify(val));
          // A record this device is still sending keeps its local version; the server merges it on arrival
          if (!s.outbox.has(k)) updates.push({ coll: r.coll, id: r.id, val });
        }
        if (updates.length) cb.current.setDb(prev => mergeRemote(prev, updates));
      };

      const pushAll = async () => {
        const s = st.current;
        // Photos go to R2 first; the record then carries the photo's address instead of the photo itself
        for (const e of [...s.outbox.values()]) {
          if (e.deleted) continue;
          for (const du of findDataImages(e.data)) {
            let url = s.uploads.get(du);
            if (!url) {
              const blob = await fetch(du).then(r => r.blob());
              ({ url } = await apiFetch('/api/files', { token: cb.current.token, method: 'POST', blob }));
              s.uploads.set(du, url);
            }
            const cur = s.outbox.get(recKey(e.coll, e.id));
            if (cur) cur.data = replaceDeep(cur.data, du, url);
            cb.current.setDb(prev => replaceInDb(prev, e.coll, e.id, du, url));
          }
        }
        for (let round = 0; round < 50 && s.outbox.size; round++) {
          const batch = [...s.outbox.values()].slice(0, 100).map(e => ({ ...e }));
          const res = await apiFetch('/api/sync/push', {
            token: cb.current.token, method: 'POST',
            json: { changes: batch.map(({ coll, id, data, deleted, base }) => ({ coll, id, data, deleted, base })) }
          });
          let progressed = false;
          for (const e of batch) {
            const k = recKey(e.coll, e.id);
            if (e.deleted) s.server.delete(k); else s.server.set(k, JSON.stringify(e.data));
            if (s.outbox.get(k)?.v === e.v) { s.outbox.delete(k); progressed = true; }
          }
          if (res.rejected?.length) {
            res.rejected.forEach(r => s.outbox.delete(recKey(r.coll, r.id)));
            applyRows(res.rejected);
            const reason = res.rejected.find(r => r.reason)?.reason;
            cb.current.notify(reason || 'Sebagian perubahan hanya boleh dilakukan Bos, jadi dibatalkan.', 'warn');
          }
          persistOutbox();
          setStatus(x => ({ ...x, pending: s.outbox.size }));
          if (!progressed) break;
        }
      };

      const pullAll = async () => {
        const s = st.current;
        for (let page = 0; page < 500; page++) {
          const res = await apiFetch(`/api/sync/pull?since=${s.cursor}`, { token: cb.current.token });
          if (res.rows.length) applyRows(res.rows);
          // Saved inside the data: a position ahead of it would hide the missing records from every later pull
          if (res.cursor !== s.cursor) cb.current.setDb(prev => ({ ...prev, _cursor: res.cursor }));
          s.cursor = res.cursor;
          learnServerTime(res.now);
          if (res.license) cb.current.onLicense?.({ ...res.license, blocked: false, message: '' });
          cb.current.onSessionUpdate?.({ token: res.token, user: res.user, tenant: res.tenant });
          if (!res.more) return;
        }
      };

      const schedule = (ms) => {
        const s = st.current;
        clearTimeout(s.timer);
        s.timer = setTimeout(run, ms);
      };

      async function run() {
        const s = st.current;
        if (!s || s.dead) return;
        if (s.busy) { s.again = true; return; }
        s.busy = true; s.again = false;
        setStatus(x => ({ ...x, phase: 'syncing' }));
        try {
          await pushAll();
          if (!readOnly) await flushLogs(tenantId, cb.current.token);
          await pullAll();
          setStatus({ phase: 'synced', pending: s.outbox.size, last: new Date().toISOString(), error: null });
        } catch (e) {
          if (e.status === 401) { s.dead = true; cb.current.onSessionEnd?.(e.message); return; }
          if (e.status === 403 && e.code === 'license') cb.current.onLicense?.({ blocked: true, message: e.message });
          setStatus(x => ({ ...x, phase: e.status === 0 ? 'offline' : 'error', pending: s.outbox.size, error: e.message }));
          if (e.status === 403 && !s.warned) { s.warned = true; cb.current.notify(e.message, 'warn'); }
        } finally {
          s.busy = false;
          if (s.again && !s.dead) schedule(300);
        }
      }

      // Every local change is compared with the server's copy; differences wait in the outbox
      useEffect(() => {
        if (!enabled) return;
        const s = st.current, prev = s.prev;
        s.prev = db;
        if (prev === db || readOnly) return;
        let changed = false;
        const note = (coll, id, rec, before) => {
          const k = recKey(coll, id);
          const js = JSON.stringify(rec);
          const queued = s.outbox.get(k);
          if (s.server.get(k) === js) { if (queued) { s.outbox.delete(k); changed = true; } return; }
          if (queued && !queued.deleted && JSON.stringify(queued.data) === js) return;
          s.outbox.set(k, { coll, id, data: rec, deleted: false, base: queued ? queued.base : counterBase(coll, before), v: (queued?.v || 0) + 1 });
          changed = true;
        };
        const noteDelete = (coll, id) => {
          const k = recKey(coll, id);
          if (s.server.has(k)) { s.outbox.set(k, { coll, id, data: null, deleted: true, base: null, v: (s.outbox.get(k)?.v || 0) + 1 }); changed = true; }
          else if (s.outbox.delete(k)) changed = true;
        };
        for (const key of Object.keys(db)) {
          const a = prev[key], b = db[key];
          if (a === b) continue;
          if (DOC_KEYS.includes(key)) { note('_doc', key, b, a); continue; }
          if (!Array.isArray(b)) continue;
          const before = new Map((Array.isArray(a) ? a : []).filter(r => r && r.id != null).map(r => [String(r.id), r]));
          for (const r of b) {
            if (!r || r.id == null) continue;
            const id = String(r.id), old = before.get(id);
            before.delete(id);
            if (old !== r) note(key, id, r, old);
          }
          for (const id of before.keys()) noteDelete(key, id);
        }
        if (changed) {
          persistOutbox();
          setStatus(x => ({ ...x, pending: s.outbox.size }));
          schedule(1500);
        }
      }, [db]);

      useEffect(() => {
        if (!enabled) return;
        const s = st.current;
        run();
        const timer = setInterval(() => { if (document.visibilityState === 'visible') run(); }, 20000);
        const onVisible = () => { if (document.visibilityState === 'visible') run(); };
        window.addEventListener('online', run);
        document.addEventListener('visibilitychange', onVisible);
        return () => {
          s.dead = true;
          clearInterval(timer); clearTimeout(s.timer);
          window.removeEventListener('online', run);
          document.removeEventListener('visibilitychange', onVisible);
        };
      }, []);

      return { status, syncNow: run };
    }

    const SYNC_LOOK = {
      synced: { label: 'Tersimpan', cls: 'border-emerald-200 bg-emerald-50 text-emerald-800', dot: 'bg-emerald-500' },
      syncing: { label: 'Menyinkron…', cls: 'border-brand-200 bg-brand-50 text-brand-800', dot: 'bg-brand-500 animate-pulse' },
      offline: { label: 'Offline', cls: 'border-amber-300 bg-amber-50 text-amber-900', dot: 'bg-amber-500' },
      error: { label: 'Gagal sinkron', cls: 'border-rose-200 bg-rose-50 text-rose-700', dot: 'bg-rose-500' }
    };
    function SyncChip({ status, onClick }) {
      const look = SYNC_LOOK[status.phase] || SYNC_LOOK.syncing;
      const pending = status.pending > 0 && status.phase !== 'syncing' ? status.pending : 0;
      const desc = status.phase === 'synced' ? 'semua data sudah tersimpan di server'
        : status.phase === 'offline' ? `offline, ${status.pending} perubahan menunggu dikirim`
        : status.phase === 'error' ? `gagal sinkron: ${String(status.error || '').replace(/\.$/, '')}` : 'sedang menyinkronkan';
      return (
        <button type="button" onClick={onClick} aria-label={`Status sinkron: ${desc}. Klik untuk sinkron sekarang.`}
          title={status.last ? `Terakhir sinkron ${fmtTime(status.last)}` : undefined}
          className={cx('inline-flex min-h-[40px] min-w-[40px] items-center justify-center gap-2 rounded-xl border px-3 text-xs font-semibold transition-colors', focusRing, look.cls)}>
          <span className={cx('h-2 w-2 rounded-full', look.dot)} aria-hidden="true" />
          <span className="hidden lg:inline">{look.label}</span>
          {pending > 0 && <span className="tabular">{pending}</span>}
        </button>
      );
    }

    // ---------- Login & activation ----------
    // KB-XXXX-XXXX-XXXX-XXXX, with or without dashes and the KB prefix; the server reads it the same way
    // Dashes appear by themselves while typing: "kba1b2c3" becomes "KB-A1B2-C3". A dash only sits between groups, so backspace works normally.
    const formatProductKey = (raw) => {
      const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      const hasPrefix = s.startsWith('KB');
      const groups = (hasPrefix ? s.slice(2) : s).slice(0, 16).match(/.{1,4}/g) || [];
      return (hasPrefix ? ['KB', ...groups] : groups).join('-');
    };
    const productKeyCore = (raw) => {
      const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      return s.length === 18 && s.startsWith('KB') ? s.slice(2) : s;
    };

    function AuthScreen({ onLogin, notice }) {
      const [mode, setMode] = useState('login');
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');
      // The store's license ended or was switched off: the sign-in screen turns grey and shows the admin's contact
      const [licenseError, setLicenseError] = useState('');
      useEffect(() => {
        document.documentElement.classList.toggle('license-locked', !!licenseError);
        return () => document.documentElement.classList.remove('license-locked');
      }, [licenseError]);
      const [forgot, setForgot] = useState(false);
      const [login, setLogin] = useState({ username: readLocal('kasirbosku_last_user', '') || '', password: '' });
      const [act, setAct] = useState({ key: '', store_name: '', owner_name: '', username: '', password: '', password2: '' });
      const [created, setCreated] = useState(null);

      // The login ID is kept on the session so offline sign-in can find this account again
      const finish = (s, username, password) => {
        const sess = { ...s, user: { ...s.user, username } };
        writeLocal('kasirbosku_last_user', username);
        vaultRemember(username, password, sess);
        return sess;
      };

      const submitLogin = async (e) => {
        e.preventDefault();
        setError('');
        const username = login.username.trim().toLowerCase();
        if (!username || !login.password) return setError('Isi ID login dan password.');
        setBusy(true);
        try {
          const s = await apiFetch('/api/login', { method: 'POST', json: { username, password: login.password } });
          onLogin(finish(s, username, login.password));
        } catch (err) {
          if (err.code === 'license') { setLicenseError(err.message); return; }
          if (err.status !== 0) { setError(err.message); return; }
          // No internet: open the copy this device kept from the last online sign-in
          const r = await vaultOpen(username, login.password);
          if (r.session) { writeLocal('kasirbosku_last_user', username); onLogin(r.session); }
          else setError(r.error);
        } finally { setBusy(false); }
      };

      const keyCore = productKeyCore(act.key);
      const actErrors = {
        key: keyCore.length !== 16 ? 'Product key terdiri dari 16 huruf/angka, cth. KB-A1B2-C3D4-E5F6-G7H8.' : null,
        store_name: !act.store_name.trim() ? 'Nama toko wajib diisi.' : null,
        owner_name: !act.owner_name.trim() ? 'Nama kamu wajib diisi.' : null,
        username: !/^[a-z0-9._]{3,20}$/.test(act.username.trim().toLowerCase()) ? '3–20 karakter: huruf kecil, angka, titik, atau garis bawah.' : null,
        password: act.password.length < 6 ? 'Minimal 6 karakter.' : null,
        password2: act.password2 !== act.password ? 'Password tidak sama.' : null
      };
      const [tried, setTried] = useState(false);
      const submitActivate = async (e) => {
        e.preventDefault();
        setError(''); setTried(true);
        if (Object.values(actErrors).some(Boolean)) return;
        setBusy(true);
        const username = act.username.trim().toLowerCase();
        try {
          const s = await apiFetch('/api/activate', { method: 'POST', json: { key: keyCore, store_name: act.store_name.trim(), owner_name: act.owner_name.trim(), username, password: act.password } });
          setCreated(finish(s, username, act.password));
        } catch (err) { setError(err.message); }
        finally { setBusy(false); }
      };
      const setA = (k) => (e) => setAct(a => ({ ...a, [k]: e.target.value }));
      const actErr = (k) => tried ? actErrors[k] : null;

      if (licenseError) return <LicenseLockedNotice message={licenseError} storeName={login.username} onRetry={() => setLicenseError('')} retryLabel="Kembali" />;

      return (
        <div className="flex min-h-full items-center justify-center bg-[#f6f8fc] px-4 py-10">
          <div className="w-full max-w-md">
            <div className="mb-6 flex flex-col items-center text-center">
              <BrandMark className="h-14 w-14" iconClass="h-8 w-8" />
              <p className="mt-3 text-2xl font-extrabold tracking-tight text-slate-900">Kasir<span className="text-brand-600">Bosku</span></p>
              <p className="text-sm text-slate-600">Kasir dan manajemen toko untuk UMKM</p>
            </div>

            {created ? (
              <Card className="p-5 text-center sm:p-6">
                <span className="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-emerald-100 text-emerald-700"><SvgIcon name="check" className="h-6 w-6" /></span>
                <h1 className="mt-3 text-lg font-bold text-slate-900">Toko {created.tenant.name} siap dipakai</h1>
                <p className="mt-1 text-sm text-slate-600">Mulai sekarang, masuk cukup dengan ID login <b className="text-slate-900">{created.user.username}</b> dan password yang baru kamu buat.</p>
                <p className="mt-3 rounded-xl bg-brand-50 p-3 text-left text-sm text-brand-900 ring-1 ring-brand-100">Tambahkan karyawan di menu <b>Karyawan</b>. Mereka masuk dengan ID login dan password masing-masing, dari HP mana saja.</p>
                <Btn className="mt-5 w-full" onClick={() => onLogin(created)}>Mulai pakai {APP_NAME}</Btn>
              </Card>
            ) : (
              <Card className="p-5 sm:p-6">
                <SegmentedControl label="Pilih" size="md" full value={mode} onChange={(m) => { setMode(m); setError(''); setTried(false); }}
                  options={[{ value: 'login', label: 'Masuk' }, { value: 'activate', label: 'Aktivasi Toko Baru' }]} />
                {notice && <p className="mt-4 rounded-xl bg-amber-50 p-3 text-sm text-amber-900 ring-1 ring-amber-200" role="status">{notice}</p>}

                {mode === 'login' ? (
                  <form onSubmit={submitLogin} className="mt-5 space-y-4" noValidate>
                    <Field label="ID login / Username">
                      <div className="relative">
                        <input value={login.username} onChange={e => setLogin(l => ({ ...l, username: e.target.value.toLowerCase() }))} className={cx(inputCls, login.username && 'pr-11')}
                          autoComplete="username" autoCapitalize="none" spellCheck="false" placeholder="cth. budi" />
                        {login.username && <IconBtn icon="x" label="Hapus ID login" iconClass="h-4 w-4" onClick={(e) => { setLogin(l => ({ ...l, username: '' })); e.currentTarget.parentElement.querySelector('input').focus(); }} className="absolute right-0 top-0 text-slate-400 hover:bg-transparent hover:text-slate-700" />}
                      </div>
                    </Field>
                    <div>
                      <Field label="Password">
                        <PasswordInput value={login.password} onChange={v => setLogin(l => ({ ...l, password: v }))} placeholder="Masukkan password" />
                      </Field>
                      <div className="mt-1 flex justify-end">
                        <button type="button" onClick={() => setForgot(true)} className={cx('min-h-[36px] rounded-lg px-1 text-sm font-semibold text-brand-700 hover:underline', focusRing)}>Lupa password?</button>
                      </div>
                    </div>
                    {error && <p className="text-sm font-medium text-rose-600" role="alert">{error}</p>}
                    <Btn type="submit" className="w-full" disabled={busy} icon="login">{busy ? 'Memeriksa…' : 'Masuk'}</Btn>
                  </form>
                ) : (
                  <form onSubmit={submitActivate} className="mt-5 space-y-4" noValidate>
                    <Field label="Product key" error={actErr('key')} hint="Dikirim penjual saat kamu membeli KasirBosku.">
                      <input value={act.key} onChange={e => setAct(a => ({ ...a, key: formatProductKey(e.target.value) }))} className={cx(inputCls, 'font-mono uppercase')}
                        placeholder="cth. KB-A1B2-C3D4-E5F6-G7H8" autoComplete="off" autoCapitalize="characters" spellCheck="false" maxLength={30} />
                    </Field>
                    <Field label="Nama toko" error={actErr('store_name')}>
                      <input value={act.store_name} onChange={setA('store_name')} className={inputCls} autoComplete="organization" maxLength={60} placeholder="cth. Warung Berkah Jaya" />
                    </Field>
                    <Field label="Nama Kamu Bos" error={actErr('owner_name')}>
                      <input value={act.owner_name} onChange={setA('owner_name')} className={inputCls} autoComplete="name" maxLength={60} placeholder="cth. Budi Santoso" />
                    </Field>
                    <Field label="ID login / Username" error={actErr('username')} hint="Dipakai untuk masuk. Huruf kecil, angka, titik, atau garis bawah.">
                      <input value={act.username} onChange={e => setAct(a => ({ ...a, username: e.target.value.toLowerCase() }))} className={inputCls}
                        autoComplete="username" autoCapitalize="none" spellCheck="false" maxLength={20} placeholder="cth. budi.berkah" />
                    </Field>
                    <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
                      <Field label="Password" error={actErr('password')}><PasswordInput value={act.password} onChange={v => setAct(a => ({ ...a, password: v }))} autoComplete="new-password" placeholder="Minimal 6 karakter" /></Field>
                      <Field label="Ulangi password" error={actErr('password2')}><PasswordInput value={act.password2} onChange={v => setAct(a => ({ ...a, password2: v }))} autoComplete="new-password" placeholder="Ketik ulang password" /></Field>
                    </div>
                    {error && <p className="text-sm font-medium text-rose-600" role="alert">{error}</p>}
                    <Btn type="submit" className="w-full" disabled={busy} icon="key">{busy ? 'Mengaktifkan…' : 'Aktifkan toko'}</Btn>
                  </form>
                )}
              </Card>
            )}
            <p className="mt-4 text-center text-xs text-slate-500">Data toko tersimpan di server dan tetap bisa dipakai saat sinyal hilang.</p>
            <p className="mt-2 text-center text-xs text-slate-500">crafted by <a href={MAKER_URL} target="_blank" rel="noreferrer" className={cx('font-semibold text-brand-700 hover:underline', focusRing)}>menjadibos.com</a></p>
          </div>
          {forgot && <ForgotPasswordModal username={login.username.trim()} onClose={() => setForgot(false)} />}
        </div>
      );
    }

    function AttendanceCodePrompt({ onDone }) {

    // Shown only on registered store devices: the current attendance code and how long it stays valid
    function AttendanceCodeChip({ secret }) {
      const [state, setState] = useState({ code: '', left: 30 });
      const [open, setOpen] = useState(false);
      useEffect(() => {
        let alive = true, step = -1;
        const tick = async () => {
          const t = trueNow();
          const s = Math.floor(t / ATT_CODE_STEP);
          const left = Math.ceil(((s + 1) * ATT_CODE_STEP - t) / 1000);
          if (s !== step) { step = s; const code = await attendanceCodeAt(secret, t); if (alive) setState({ code, left }); }
          else if (alive) setState(x => ({ ...x, left }));
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => { alive = false; clearInterval(id); };
      }, [secret]);
      const pretty = state.code ? `${state.code.slice(0, 3)} ${state.code.slice(3)}` : '··· ···';
      return (
        <>
          <button type="button" onClick={() => setOpen(true)} aria-label={`Kode absen ${pretty}, berganti dalam ${state.left} detik`}
            className={cx('inline-flex min-h-[40px] items-center gap-2 rounded-xl border border-emerald-200 bg-emerald-50 px-2.5 text-xs font-semibold text-emerald-900 hover:bg-emerald-100', focusRing)}>

          </button>
          {open && (
            <Modal title="Kode absen" desc="Karyawan yang absen dari HP-nya sendiri memasukkan kode ini." onClose={() => setOpen(false)} size="sm"
              footer={<Btn variant="secondary" className="flex-1" onClick={() => setOpen(false)}>Tutup</Btn>}>
