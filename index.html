    // =====================================================================
    // EMPLOYEES
    // =====================================================================
    const WEEKDAYS = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    function EmployeeManagementModule({ db, setDb, notify, currentUser, checkUsername }) {
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({});
      const [password, setPassword] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [saving, setSaving] = useState(false);
      const [confirmDel, setConfirmDel] = useState(false);
      const [takenName, setTakenName] = useState('');
      const work = db.business.work;
      const ownerCount = db.users.filter(u => u.role === 'owner').length;
      const deleteBlock = editing && editing !== 'new' && (editing.id === currentUser.id ? 'Anda tidak bisa menghapus akun yang sedang dipakai.' : editing.role === 'owner' && ownerCount <= 1 ? 'Harus ada minimal satu Bos.' : null);
      const removeEmployee = () => {
        setDb(prev => ({ ...prev, users: prev.users.filter(u => u.id !== editing.id) }));
        notify(`${editing.name} dihapus. Riwayat absensi dan transaksinya tetap tersimpan.`, 'info');
        setEditing(null);
      };

      const isNew = editing === 'new';
      const hasLogin = editing && editing !== 'new' && !!editing.password_hash;
      const username = (form.username || '').trim().toLowerCase();
      const errors = {
        name: !(form.name || '').trim() ? 'Nama wajib diisi.' : null,
        email: form.email && !/^\S+@\S+\.\S+$/.test(form.email) ? 'Format email tidak valid.' : null,
        phone: waError(form.phone),
        username: !username ? 'ID login wajib diisi.' : !/^[a-z0-9._]{3,20}$/.test(username) ? '3–20 karakter: huruf kecil, angka, titik, atau garis bawah.' : db.users.some(u => u.username === username && u.id !== form.id) ? 'ID login sudah dipakai.' : takenName === username ? 'ID login ini sudah dipakai di toko lain. Coba tambahkan nama toko, cth. sari.berkah.' : null,
        password: (isNew || !hasLogin) && !password ? 'Buat password untuk akun ini.' : password && password.length < 6 ? 'Minimal 6 karakter.' : null
      };
      const invalid = Object.values(errors).some(Boolean);

      const open = (u) => {
        setEditing(u); setSubmitted(false); setPassword(''); setShowPw(false); setConfirmDel(false);
        setForm(u === 'new' ? { name: '', username: '', email: '', phone: '', base_salary: 3200000, role: 'kasir', day_off: 0, shift_id: work.shifts[0].id, status: 'Aktif' } : { ...u });
      };

      const save = async () => {
        setSubmitted(true);
        if (invalid) return;
        setSaving(true);
        try {
          // Online: ask the server first. Offline: the server checks when the change is sent and undoes it if taken.
          if (checkUsername && (isNew || username !== editing.username)) {
            const free = await checkUsername(username, isNew ? '' : editing.id).catch(e => e.status === 0 ? true : Promise.reject(e));
            if (!free) { setTakenName(username); return; }
          }
          const clean = { ...form, name: form.name.trim(), username, day_off: Number(form.day_off) };
          if (password) {
            const salt = generateId('SALT');
            clean.password_salt = salt;
            clean.password_hash = await hashPassword(password, salt);
            clean.password_updated = new Date().toISOString();
          }
          if (isNew) {
            setDb(prev => ({ ...prev, users: [...prev.users, { ...clean, id: 'usr-' + Date.now() }] }));
            notify(`Akun ${clean.name} dibuat. Masuk dengan ID login "${username}" dan password yang kamu buat. Berikan langsung ke karyawan.`);
          } else {
            setDb(prev => ({ ...prev, users: prev.users.map(u => u.id === editing.id ? { ...u, ...clean } : u) }));
            notify(password ? `Password ${clean.name} diperbarui.` : `Data ${clean.name} diperbarui.`);
          }
          setEditing(null);
        } catch (e) {
          notify(e instanceof ApiError ? e.message : 'Browser ini tidak mendukung penyimpanan password aman. Buka aplikasi lewat https.', 'warn');
        } finally { setSaving(false); }
      };

      return (
        <div className="space-y-5">
          <PageHeader title="Data Karyawan" desc="Akun login, peran, shift, gaji pokok, dan hari libur." actions={<Btn icon="plus" onClick={() => open('new')}>Tambah karyawan</Btn>} />
          <Card>
            <div className="overflow-x-auto">
              <table className="w-full min-w-[820px] text-left text-sm">
                <thead className="bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-600">
                  <tr><th scope="col" className="px-4 py-3">Karyawan</th><th scope="col" className="px-4 py-3">Akun login</th><th scope="col" className="px-4 py-3">Peran</th><th scope="col" className="px-4 py-3">Shift & libur</th><th scope="col" className="px-4 py-3 text-right">Gaji pokok</th><th scope="col" className="px-4 py-3">Status</th><th scope="col" className="px-4 py-3"><span className="sr-only">Aksi</span></th></tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {db.users.map(u => (
                    <tr key={u.id} className={cx('hover:bg-slate-50', u.status === 'Nonaktif' && 'text-slate-400')}>
                      <td className="px-4 py-3"><div className="flex items-center gap-3"><Avatar name={u.name} src={u.photo} /><div><p className="font-semibold">{u.name}</p><p className="text-xs text-slate-500">{u.phone}</p></div></div></td>
                      <td className="px-4 py-3">
                        <p className="font-mono text-sm">{u.username || '—'}</p>
                        {u.password_hash ? <Badge tone="green"><SvgIcon name="key" className="h-3 w-3" />Password aktif</Badge> : <Badge tone="amber">Belum ada password</Badge>}
                      </td>
                      <td className="px-4 py-3"><Badge tone={ROLE_TONES[u.role] || 'slate'}>{ROLE_LABELS[u.role] || u.role}</Badge></td>
                      <td className="px-4 py-3 text-slate-700">{u.role === 'owner' ? '—' : <>{shiftOf(u, work).name}<p className="text-xs text-slate-500">Libur {WEEKDAYS[u.day_off ?? 0]}</p></>}</td>
                      <td className={cx('px-4 py-3 text-right tabular', isStaffRole(u.role) ? 'text-slate-800' : 'text-slate-400')}>{isStaffRole(u.role) ? formatIDR(u.base_salary) : '—'}</td>
                      <td className="px-4 py-3"><Badge tone={u.status === 'Nonaktif' ? 'slate' : 'green'}>{u.status || 'Aktif'}</Badge></td>
                      <td className="px-4 py-3 text-right"><Btn variant="ghost" size="sm" icon="edit" onClick={() => open(u)} aria-label={`Edit ${u.name}`}>Edit</Btn></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="border-t border-slate-100 p-4 text-xs text-slate-500">Password disimpan dalam bentuk terenkripsi (hash), Bos pun tidak bisa melihatnya lagi. Akun ini dipakai di portal login saat server online diaktifkan.</p>
          </Card>
          {editing && (
            <Modal title={isNew ? 'Tambah karyawan' : `Edit ${editing.name}`} size="lg" onClose={() => setEditing(null)}
              footer={confirmDel ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus {editing.name}? Akun loginnya ikut terhapus.</p>
                <Btn variant="secondary" onClick={() => setConfirmDel(false)}>Batal</Btn>
                <Btn variant="danger" onClick={removeEmployee}>Ya, hapus</Btn>
              </> : <>
                {!isNew && <IconBtn icon="trash" label={`Hapus ${editing.name}`} className="text-rose-600 hover:bg-rose-50" onClick={() => deleteBlock ? notify(deleteBlock, 'warn') : setConfirmDel(true)} />}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={() => setEditing(null)}>Batal</Btn>
                <Btn onClick={save} disabled={saving}>{saving ? 'Menyimpan…' : 'Simpan'}</Btn>
              </>}>
              <div className="space-y-4">
                <ImageUpload label="Foto profil" value={form.photo || ''} onChange={v => setForm({ ...form, photo: v })} hint="JPG atau PNG. Foto dipotong persegi. Tanpa foto, inisial nama yang tampil."
                  formats={['image/jpeg', 'image/png']} options={{ size: 320, type: 'image/jpeg', maxBytes: 60 * 1024 }} />
                <Field label="Nama lengkap" error={submitted ? errors.name : null}><input autoFocus value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className={inputCls} /></Field>

                <div className="rounded-xl border border-slate-200 p-4">
                  <p className="flex items-center gap-2 text-sm font-semibold text-slate-900"><SvgIcon name="key" className="h-4 w-4 text-brand-700" />Akun login</p>
                  <div className="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <Field label="ID login (username)" error={submitted || form.username ? errors.username : null} hint="Dipakai karyawan untuk masuk.">
                      <input value={form.username || ''} onChange={e => setForm({ ...form, username: e.target.value.toLowerCase().replace(/\s/g, '') })} className={cx(inputCls, 'font-mono')} autoComplete="off" placeholder="cth. rian" />
                    </Field>
                    <Field label={hasLogin ? 'Password baru' : 'Password'} error={submitted || password ? errors.password : null} hint={hasLogin ? 'Kosongkan jika tidak diganti.' : 'Minimal 6 karakter.'}>
                      <div className="flex gap-2">
                        <div className="relative flex-1">
                          <input type={showPw ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} className={cx(inputCls, 'pr-11 font-mono')} autoComplete="new-password" />
                          <IconBtn icon={showPw ? 'eyeOff' : 'eye'} label={showPw ? 'Sembunyikan password' : 'Tampilkan password'} iconClass="h-4 w-4" onClick={() => setShowPw(v => !v)} className="absolute right-0 top-0" />
                        </div>
                        <Btn variant="secondary" size="sm" className="min-h-[44px]" onClick={() => { setPassword(generatePassword()); setShowPw(true); }}>Buat acak</Btn>
                      </div>
                    </Field>
                  </div>
                </div>

                <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                  <Field label="Email" error={errors.email}><input type="email" value={form.email || ''} onChange={e => setForm({ ...form, email: e.target.value })} className={inputCls} autoComplete="off" /></Field>
                  <Field label="Nomor WhatsApp" error={waError(form.phone)}><WaInput value={form.phone || ''} onChange={v => setForm({ ...form, phone: v })} /></Field>
                  <Field label="Peran" hint={form.role === 'owner' ? 'Bos punya akses penuh ke semua menu.' : form.role === 'investor' ? 'Hanya bisa melihat Dashboard, Laporan Penjualan, Laba Rugi, dan bagi hasilnya sendiri.' : 'Akses diatur di menu Hak Akses.'}><select value={form.role} onChange={e => setForm({ ...form, role: e.target.value })} className={inputCls}>{Object.entries(ROLE_LABELS).map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select></Field>
                  <Field label="Status"><select value={form.status || 'Aktif'} onChange={e => setForm({ ...form, status: e.target.value })} className={inputCls}><option>Aktif</option><option>Nonaktif</option></select></Field>
                </div>
                {form.role === 'investor' && (
                  <Field label="Tautkan ke data investor" hint={db.investors.length ? 'Investor ini hanya melihat porsi dan riwayat bagi hasil miliknya.' : 'Belum ada data investor. Tambahkan dulu di menu Portal Investor.'}>
                    <select value={form.investor_id || ''} onChange={e => setForm({ ...form, investor_id: e.target.value })} className={inputCls}>
                      <option value="">— Pilih investor —</option>
                      {db.investors.map(i => <option key={i.id} value={i.id}>{i.name} · {i.profit_share}%</option>)}
                    </select>
                  </Field>
                )}
                {isStaffRole(form.role) && (
                  <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
                    <Field label="Gaji pokok"><MoneyInput value={form.base_salary} onChange={v => setForm({ ...form, base_salary: v })} /></Field>
                    <Field label="Shift"><select value={form.shift_id || work.shifts[0].id} onChange={e => setForm({ ...form, shift_id: e.target.value })} className={inputCls}>{work.shifts.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
                    <Field label="Hari libur"><select value={form.day_off ?? 0} onChange={e => setForm({ ...form, day_off: e.target.value })} className={inputCls}>{WEEKDAYS.map((d, i) => <option key={d} value={i}>{d}</option>)}</select></Field>
                  </div>
                )}
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // PERMISSIONS
    // =====================================================================
    function PermissionsMatrixModule({ db, setDb, notify }) {
      const [attOpen, setAttOpen] = useState(false);
      const perm = normalizePermissions(db.permissions);
      const toggle = (role, key, label) => {
        const next = !perm[role][key];
        setDb(prev => { const cur = normalizePermissions(prev.permissions); return { ...prev, permissions: { ...cur, [role]: { ...cur[role], [key]: next } } }; });
        notify(`${label}: ${next ? 'diizinkan' : 'dibatasi'} untuk ${ROLE_LABELS[role]}.`, 'info');
      };
      const perms = [
        { key: 'can_add_product', label: 'Tambah produk', desc: 'Menambah item baru ke katalog.' },
        { key: 'can_edit_product', label: 'Edit produk, harga & stok', desc: 'Mengubah harga jual, foto, dan menambah stok.' },
        { key: 'can_delete_product', label: 'Hapus produk', desc: 'Menghapus produk dari sistem secara permanen.', risky: true },
        { key: 'can_give_discount', label: 'Beri diskon', desc: 'Memberi potongan harga saat checkout.' },
        { key: 'can_void_sale', label: 'Batalkan transaksi', desc: 'Membatalkan nota yang sudah dibayar di Laporan Penjualan.', risky: true },
        { key: 'can_view_finance', label: 'Lihat laba rugi', desc: 'Melihat laba, HPP, dan biaya operasional.', risky: true },
        { key: 'can_manage_suppliers', label: 'Supplier / Pemasok', desc: 'Membuat, mengubah, dan menghapus pesanan barang ke supplier.' }
      ];
      const permRow = (p) => (
        <li key={p.key} className="grid grid-cols-1 gap-3 p-4 sm:grid-cols-[minmax(0,1fr)_repeat(3,7rem)] sm:items-center sm:gap-2">
          <div>
            <p className="flex flex-wrap items-center gap-2 text-sm font-semibold text-slate-900">{p.label}{p.risky && <Badge tone="amber">Sensitif</Badge>}</p>
            <p className="text-sm text-slate-600">{p.desc}</p>
          </div>
          <div className="grid grid-cols-3 gap-2 sm:contents">
            {PERMISSION_ROLES.map(r => (
              <div key={r} className="flex flex-col items-center gap-1.5 rounded-xl bg-slate-50 py-2 sm:bg-transparent sm:py-0">
                <span className="text-xs font-medium text-slate-600 sm:hidden">{ROLE_LABELS[r]}</span>
                <Switch checked={!!perm[r][p.key]} onChange={() => toggle(r, p.key, p.label)} label={`${p.label} untuk ${ROLE_LABELS[r]}`} />
              </div>
            ))}
          </div>
        </li>
      );
      return (
        <div className="space-y-5">
          <PageHeader title="Hak Akses Karyawan" desc="Atur fitur untuk tiap peran: Kasir, Supervisor, dan Kepala Toko. Bos selalu punya akses penuh." />
          <Card>
            <div className="hidden grid-cols-[minmax(0,1fr)_repeat(3,7rem)] items-center gap-2 border-b border-slate-200 bg-slate-50 px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-600 sm:grid">
              <span>Fitur</span>
              {PERMISSION_ROLES.map(r => <span key={r} className="text-center">{ROLE_LABELS[r]}</span>)}
            </div>
            <ul className="divide-y divide-slate-100">
              {perms.map(p => permRow(p))}
              <li>
                <button type="button" aria-expanded={attOpen} onClick={() => setAttOpen(v => !v)} className={cx('flex min-h-[64px] w-full items-center justify-between gap-3 p-4 text-left hover:bg-slate-50', focusRing)}>
                  <span>
                    <span className="block text-sm font-semibold text-slate-900">Absensi, Lembur & Reward</span>
                    <span className="block text-sm text-slate-600">Absen pribadi selalu terbuka. Bagian lain diatur satu per satu.</span>
                  </span>
                  <SvgIcon name={attOpen ? 'chevUp' : 'chevDown'} className="h-5 w-5 flex-shrink-0 text-slate-500" />
                </button>
                {attOpen && <ul className="divide-y divide-slate-100 border-t border-slate-100 bg-slate-50/60">{ATTENDANCE_SECTIONS.map(p => permRow(p))}</ul>}
              </li>
            </ul>
          </Card>
        </div>
      );
    }

    // =====================================================================
    // INVESTORS
    // =====================================================================
    // Payouts are plain records (no photo) to keep device storage small; the period can be a month or a whole year
    const payoutPeriodLabel = (p) => p.period_type === 'yearly' ? `Tahun ${p.period}` : monthLabel(p.period);
    const FREQ_LABEL = { monthly: 'Bulanan', yearly: 'Tahunan' };
    const MONTH_NAMES = Array.from({ length: 12 }, (_, i) => new Date(2026, i, 1).toLocaleDateString('id-ID', { month: 'long' }));

    function InvestorsModule({ db, setDb, notify, currentUser }) {
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({ name: '', phone: '', profit_share: 20, frequency: 'monthly' });
      const [payout, setPayout] = useState(null);
      const [openId, setOpenId] = useState(null);
      const [confirmDel, setConfirmDel] = useState(false);
      useEffect(() => setConfirmDel(false), [editing]);
      const removeInvestor = () => {
        setDb(prev => ({ ...prev, investors: prev.investors.filter(i => i.id !== editing.id), investor_payouts: (prev.investor_payouts || []).filter(x => x.investor_id !== editing.id) }));
        notify(`${editing.name} dihapus dari daftar investor.`, 'info');
        setEditing(null);
      };
      const today = dateKey();
      const year = Number(today.slice(0, 4));
      const monthNet = Math.max(0, computeFinancials(db, today.slice(0, 8) + '01', today).netProfit);
      const yearNet = Math.max(0, computeFinancials(db, `${year}-01-01`, today).netProfit);
      const baseFor = (inv) => (inv.frequency === 'yearly' ? yearNet : monthNet);
      const payouts = db.investor_payouts || [];
      const otherShares = db.investors.filter(i => editing === 'new' || !editing || i.id !== editing.id).reduce((a, i) => a + i.profit_share, 0);
      const share = parseFloat(form.profit_share) || 0;
      const shareError = share <= 0 ? 'Masukkan persentase.' : otherShares + share > 100 ? `Total bagi hasil jadi ${otherShares + share}% (maks. 100%).` : null;
      const totalShare = db.investors.reduce((a, i) => a + i.profit_share, 0);
      const paidOf = (id) => payouts.filter(p => p.investor_id === id).reduce((a, p) => a + p.amount, 0);
      const years = [year, year - 1, year - 2];

      const save = () => {
        if (!form.name.trim() || shareError || waError(form.phone)) return;
        const clean = { name: form.name.trim(), phone: form.phone || '', profit_share: share, frequency: form.frequency };
        if (editing === 'new') {
          setDb(prev => ({ ...prev, investors: [...prev.investors, { id: generateId('INV'), status: 'Aktif', ...clean }] }));
          notify(`${clean.name} ditambahkan sebagai investor.`);
        } else {
          setDb(prev => ({ ...prev, investors: prev.investors.map(i => i.id === editing.id ? { ...i, ...clean } : i) }));
          notify(`Data ${clean.name} diperbarui.`);
        }
        setEditing(null);
      };

      const periodValue = (p) => p.period_type === 'yearly' ? String(p.year) : `${p.year}-${pad(p.month)}`;
      const viewer = currentUser.role === 'investor';
      if (viewer) {
        const me = db.investors.find(i => i.id === currentUser.investor_id);
        if (!me) return (
          <div className="space-y-5">
            <PageHeader title="Bagi Hasil Saya" desc="Porsi dan riwayat bagi hasil Anda." />
            <EmptyState icon="investors" title="Akun belum ditautkan" desc="Minta Bos membuka menu Karyawan, memilih akun Anda, lalu memilih data investor yang sesuai." />
          </div>
        );
        const freq = me.frequency || 'monthly';
        const mine = payouts.filter(p => p.investor_id === me.id).sort((a, b) => b.date.localeCompare(a.date));
        return (
          <div className="space-y-5">
            <PageHeader title="Bagi Hasil Saya" desc={`Porsi ${me.profit_share}% dari laba bersih, dibagi ${FREQ_LABEL[freq].toLowerCase()}.`} />
            <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
              <StatCard label={freq === 'yearly' ? `Estimasi bagian ${year} sejauh ini` : 'Estimasi bagian bulan ini'} value={formatIDR(Math.round(baseFor(me) * me.profit_share / 100))} sub={`Laba bersih ${freq === 'yearly' ? 'tahun ini' : 'bulan ini'}: ${formatIDR(baseFor(me))}`} icon="investors" highlight />
              <StatCard label="Porsi saya" value={`${me.profit_share}%`} sub={`Dibagi ${FREQ_LABEL[freq].toLowerCase()}`} icon="users" />
              <StatCard label="Total sudah diterima" value={formatIDR(paidOf(me.id))} sub={`${mine.length} pembayaran`} icon="dollar" tone="amber" />
            </div>
            <Card className="p-4">
              <h3 className="text-base font-bold text-slate-900">Riwayat bagi hasil</h3>
              {mine.length === 0 ? <p className="mt-2 text-sm text-slate-500">Belum ada pembayaran tercatat.</p> : (
                <div className="mt-2 overflow-x-auto">
                  <table className="w-full min-w-[480px] text-left text-sm">
                    <thead className="text-xs font-semibold uppercase tracking-wide text-slate-500">
                      <tr><th scope="col" className="py-1.5 pr-3">Periode</th><th scope="col" className="py-1.5 pr-3">Tanggal bayar</th><th scope="col" className="py-1.5 pr-3">Metode</th><th scope="col" className="py-1.5 text-right">Nominal</th></tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {mine.map(p => (
                        <tr key={p.id}>
                          <td className="py-2 pr-3 font-medium text-slate-900">{payoutPeriodLabel(p)}</td>
                          <td className="py-2 pr-3 text-slate-700">{fmtDateShort(p.date)}</td>
                          <td className="py-2 pr-3 text-slate-600">{p.method}{p.note ? ` · ${p.note}` : ''}</td>
                          <td className="py-2 text-right font-semibold tabular">{formatIDR(p.amount)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </Card>
          </div>
        );
      }
      const duplicate = payout && payouts.some(x => x.investor_id === payout.investor_id && x.period_type === payout.period_type && x.period === periodValue(payout));

      const savePayout = () => {
        if (!payout.amount) return;
        const { month: _m, year: _y, ...rest } = payout;
        const record = { id: generateId('IP'), ...rest, period: periodValue(payout), recorded_by: currentUser.name };
        setDb(prev => ({ ...prev, investor_payouts: [record, ...(prev.investor_payouts || [])] }));
        notify(`Bagi hasil ${payoutPeriodLabel(record)} sebesar ${formatIDR(record.amount)} untuk ${db.investors.find(i => i.id === record.investor_id)?.name} tercatat.`);
        setOpenId(record.investor_id);
        setPayout(null);
      };

      const startPayout = (inv) => {
        const prevMonth = new Date(year, Number(today.slice(5, 7)) - 2, 1);
        setPayout({
          investor_id: inv.id, period_type: inv.frequency || 'monthly',
          month: prevMonth.getMonth() + 1, year: inv.frequency === 'yearly' ? year - 1 : prevMonth.getFullYear(),
          date: today, amount: Math.round(baseFor(inv) * inv.profit_share / 100), method: 'Transfer bank', note: ''
        });
      };

      return (
        <div className="space-y-5">
          <PageHeader title="Portal Investor" desc="Simulasi bagi hasil dan catatan pembayaran ke tiap investor." actions={<Btn icon="plus" onClick={() => { setForm({ name: '', phone: '', profit_share: 10, frequency: 'monthly' }); setEditing('new'); }}>Tambah investor</Btn>} />
          <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
            <StatCard label="Laba bersih bulan ini" value={formatIDR(monthNet)} sub={`Sejak Januari ${year}: ${formatIDR(yearNet)}`} icon="investors" highlight />
            <StatCard label="Total porsi investor" value={`${totalShare}%`} sub={`${100 - totalShare}% untuk pemilik`} icon="users" />
            <StatCard label="Total sudah dibayarkan" value={formatIDR(payouts.reduce((a, p) => a + p.amount, 0))} sub={`${payouts.length} pembayaran tercatat`} icon="dollar" tone="amber" />
          </div>
          <Card>
            <ul className="divide-y divide-slate-100">
              {db.investors.map(inv => {
                const list = payouts.filter(p => p.investor_id === inv.id).sort((a, b) => b.date.localeCompare(a.date));
                const freq = inv.frequency || 'monthly';
                return (
                  <li key={inv.id} className="p-4">
                    <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                      <div>
                        <p className="flex flex-wrap items-center gap-2 font-semibold text-slate-900">{inv.name}<Badge tone="blue">Dibagi {FREQ_LABEL[freq].toLowerCase()}</Badge></p>
                        {inv.phone && <a href={`https://wa.me/${inv.phone.replace(/\D/g, '').replace(/^0/, '62')}`} target="_blank" rel="noreferrer" className={cx('inline-flex min-h-[36px] items-center gap-1 rounded text-sm text-emerald-700 hover:underline', focusRing)}><SvgIcon name="chat" className="h-3.5 w-3.5" />{inv.phone}</a>}
                        <p className="text-sm text-slate-600">Porsi <span className="font-semibold text-brand-800">{inv.profit_share}%</span> · sudah dibayar <span className="font-semibold tabular">{formatIDR(paidOf(inv.id))}</span> ({list.length}×)</p>
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <div className="mr-2 text-right">
                          <p className="text-xs text-slate-500">{freq === 'yearly' ? `Estimasi ${year} sejauh ini` : 'Estimasi bulan ini'}</p>
                          <p className="font-bold text-emerald-700 tabular">{formatIDR(Math.round(baseFor(inv) * inv.profit_share / 100))}</p>
                        </div>
                        <Btn size="sm" icon="plus" onClick={() => startPayout(inv)}>Catat pembayaran</Btn>
                        <IconBtn icon="edit" label={`Edit ${inv.name}`} iconClass="h-4 w-4" onClick={() => { setForm({ name: inv.name, phone: inv.phone || '', profit_share: inv.profit_share, frequency: freq }); setEditing(inv); }} />
                      </div>
                    </div>
                    <button type="button" aria-expanded={openId === inv.id} onClick={() => setOpenId(openId === inv.id ? null : inv.id)}
                      className={cx('mt-2 inline-flex min-h-[36px] items-center gap-1 rounded-lg px-2 text-sm font-semibold text-brand-700 hover:bg-brand-50', focusRing)}>
                      Riwayat pembayaran<SvgIcon name={openId === inv.id ? 'chevUp' : 'chevDown'} className="h-4 w-4" />
                    </button>
                    {openId === inv.id && (
                      <div className="mt-2 overflow-x-auto rounded-xl bg-slate-50 p-3">
                        {list.length === 0 ? <p className="text-sm text-slate-500">Belum ada pembayaran tercatat.</p> : (
                          <table className="w-full min-w-[520px] text-left text-sm">
                            <thead className="text-xs font-semibold uppercase tracking-wide text-slate-500">
                              <tr><th scope="col" className="py-1.5 pr-3">Periode bagi hasil</th><th scope="col" className="py-1.5 pr-3">Tanggal bayar</th><th scope="col" className="py-1.5 pr-3">Metode & catatan</th><th scope="col" className="py-1.5 text-right">Nominal</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200">
                              {list.map(p => (
                                <tr key={p.id}>
                                  <td className="py-2 pr-3 font-medium text-slate-900">{payoutPeriodLabel(p)}</td>
                                  <td className="py-2 pr-3 text-slate-700">{fmtDateShort(p.date)}</td>
                                  <td className="py-2 pr-3 text-slate-600">{p.method}{p.note ? ` · ${p.note}` : ''}</td>
                                  <td className="py-2 text-right font-semibold tabular">{formatIDR(p.amount)}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        )}
                      </div>
                    )}
                  </li>
                );
              })}
            </ul>
          </Card>

          {payout && (
            <Modal title="Catat pembayaran bagi hasil" desc={db.investors.find(i => i.id === payout.investor_id)?.name} onClose={() => setPayout(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setPayout(null)}>Batal</Btn><Btn onClick={savePayout} disabled={!payout.amount}>Simpan catatan</Btn></>}>
              <div className="space-y-4">
                <div>
                  <span className="text-sm font-medium text-slate-700">Bagi hasil untuk periode</span>
                  <div className="mt-1.5"><SegmentedControl size="md" label="Jenis periode" value={payout.period_type} onChange={v => setPayout({ ...payout, period_type: v })} options={[{ value: 'monthly', label: 'Bulanan' }, { value: 'yearly', label: 'Tahunan' }]} /></div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  {payout.period_type === 'monthly' && (
                    <Field label="Bulan"><select value={payout.month} onChange={e => setPayout({ ...payout, month: Number(e.target.value) })} className={inputCls}>{MONTH_NAMES.map((m, i) => <option key={m} value={i + 1}>{m}</option>)}</select></Field>
                  )}
                  <Field label="Tahun"><select value={payout.year} onChange={e => setPayout({ ...payout, year: Number(e.target.value) })} className={inputCls}>{years.map(y => <option key={y} value={y}>{y}</option>)}</select></Field>
                </div>
                {duplicate && <p className="rounded-xl bg-amber-50 p-3 text-sm text-amber-900">Sudah ada pembayaran untuk periode ini. Simpan lagi hanya jika ini pembayaran tambahan.</p>}
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Tanggal dibayar"><input type="date" value={payout.date} max={today} onChange={e => setPayout({ ...payout, date: e.target.value })} className={inputCls} /></Field>
                  <Field label="Metode"><select value={payout.method} onChange={e => setPayout({ ...payout, method: e.target.value })} className={inputCls}><option>Transfer bank</option><option>E-wallet</option><option>Tunai</option></select></Field>
                </div>
                <Field label="Nominal dibayar"><MoneyInput value={payout.amount} onChange={v => setPayout({ ...payout, amount: v })} /></Field>
                <Field label="Catatan" hint="cth. nomor referensi transfer, agar mudah dicocokkan dengan mutasi rekening."><input value={payout.note} onChange={e => setPayout({ ...payout, note: e.target.value })} className={inputCls} placeholder="No. ref 123456" /></Field>
              </div>
            </Modal>
          )}

          {editing && (
            <Modal title={editing === 'new' ? 'Tambah investor' : 'Edit investor'} onClose={() => setEditing(null)}
              footer={confirmDel ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus {editing.name}? Riwayat pembayarannya ikut terhapus.</p>
                <Btn variant="secondary" onClick={() => setConfirmDel(false)}>Batal</Btn>
                <Btn variant="danger" onClick={removeInvestor}>Ya, hapus</Btn>
              </> : <>
                {editing !== 'new' && <IconBtn icon="trash" label={`Hapus ${editing.name}`} className="text-rose-600 hover:bg-rose-50" onClick={() => setConfirmDel(true)} />}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={() => setEditing(null)}>Batal</Btn>
                <Btn onClick={save} disabled={!form.name.trim() || !!shareError || !!waError(form.phone)}>Simpan</Btn>
              </>}>
              <div className="space-y-4">
                <Field label="Nama investor"><input autoFocus value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className={inputCls} /></Field>
                <Field label="Nomor WhatsApp" error={waError(form.phone)} hint="Untuk mengirim kabar bagi hasil."><WaInput value={form.phone} onChange={v => setForm({ ...form, phone: v })} /></Field>
                <Field label="Porsi bagi hasil (%)" error={shareError}>
                  <input type="number" min="0" max="100" step="0.5" value={form.profit_share} onChange={e => setForm({ ...form, profit_share: e.target.value })} className={cx(inputCls, 'tabular')} />
                </Field>
                <div>
                  <span className="text-sm font-medium text-slate-700">Jadwal pembagian</span>
                  <div className="mt-1.5"><SegmentedControl size="md" label="Jadwal pembagian" value={form.frequency} onChange={v => setForm({ ...form, frequency: v })} options={[{ value: 'monthly', label: 'Bulanan' }, { value: 'yearly', label: 'Tahunan' }]} /></div>
                  <p className="mt-1 text-xs text-slate-500">Estimasi dividen: {formatIDR(Math.round((form.frequency === 'yearly' ? yearNet : monthNet) * share / 100))} {form.frequency === 'yearly' ? `(laba ${year} sejauh ini)` : '(laba bulan ini)'}</p>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // SETTINGS
    // =====================================================================
    // Defined outside SettingsModule so inputs keep focus across re-renders
    const Section = ({ title, desc, icon, children }) => (
      <Card className="p-5">
        <div className="flex items-start gap-3">
          {icon && <span className="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><SvgIcon name={icon} className="h-5 w-5" /></span>}
          <div>
            <h3 className="text-base font-bold text-slate-900">{title}</h3>
            {desc && <p className="text-sm text-slate-600">{desc}</p>}
          </div>
        </div>
        <div className="mt-4 space-y-4">{children}</div>
      </Card>
    );

    const SAMPLE_RECEIPT = {
      receipt_no: 'INV-CONTOH-001', date: new Date().toISOString(), cashier: 'Rian Pradipta', customer_name: 'Budi Kurniawan',
      items: [{ name: 'Cappuccino Warm', qty: 2, sell_price: 35000, original_price: 35000 }, { name: 'Blueberry Muffin', qty: 1, sell_price: 22100, original_price: 26000 }],
      subtotal: 92100, discount: 9210, coupon_code: 'PROMOUMKM', coupon_discount: 9210, tax: 8289, total: 91179, payment_method: 'cash', cash_paid: 100000, status: 'completed'
    };

    function SettingsModule({ db, setDb, notify }) {
      const [form, setForm] = useState(() => JSON.parse(JSON.stringify(db.business)));
      const [locating, setLocating] = useState(false);
      const dirty = JSON.stringify(form) !== JSON.stringify(db.business);
      const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));
      const setNested = (group, k, v) => setForm(f => ({ ...f, [group]: { ...f[group], [k]: v } }));

      const preset = CITY_PRESETS.find(c => c.city === form.location.city);
      const nowParts = storeClock(Date.now(), Number(form.location.tz));
      const coordsInvalid = form.location.lat === '' || form.location.lng === '' || !(Math.abs(form.location.lat) <= 90 && Math.abs(form.location.lng) <= 180);
      const preview = coordsInvalid ? null : computePrayerTimes(nowParts.y, nowParts.m, nowParts.d, Number(form.location.lat), Number(form.location.lng), Number(form.location.tz));
      const lastSale = allSalesOf(db).find(isValidSale);
      const sampleSale = { ...SAMPLE_RECEIPT, queue_no: 12, cashier: lastSale?.cashier || SAMPLE_RECEIPT.cashier };

      const useDeviceLocation = () => {
        if (!navigator.geolocation) return notify('Perangkat tidak mendukung deteksi lokasi.', 'warn');
        setLocating(true);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            setForm(f => ({ ...f, location: { ...f.location, city: 'Lokasi toko (GPS)', lat: +latitude.toFixed(5), lng: +longitude.toFixed(5), tz: longitude < 114.7 ? 7 : longitude < 126 ? 8 : 9 } }));
            setLocating(false);
            notify('Lokasi toko terdeteksi. Periksa zona waktu lalu simpan.', 'info');
          },
          () => { setLocating(false); notify('Izin lokasi ditolak atau tidak tersedia. Pilih kota secara manual.', 'warn'); },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      };

      const save = () => {
        if (!form.name.trim()) return notify('Nama toko wajib diisi.', 'warn');
        if (phoneError(form.phone)) return notify('Nomor telepon toko belum benar.', 'warn');
        if (coordsInvalid) return notify('Koordinat lokasi tidak valid.', 'warn');
        setDb(prev => ({
          ...prev,
          business: {
            ...form,
            tax_rate: Math.min(100, Math.max(0, Number(form.tax_rate) || 0)),
            location: { ...form.location, lat: Number(form.location.lat), lng: Number(form.location.lng), tz: Number(form.location.tz) },
            prayer: { ...form.prayer, remind_before: Number(form.prayer.remind_before), hijri_offset: Number(form.prayer.hijri_offset) },
            bank_accounts: form.bank_accounts.filter(b => b.bank.trim() && b.number.trim())
          }
        }));
        notify('Pengaturan toko disimpan.');
      };

      const updateBank = (id, k, v) => setForm(f => ({ ...f, bank_accounts: f.bank_accounts.map(b => b.id === id ? { ...b, [k]: v } : b) }));
      const receiptToggles = [
        ['show_logo', 'Logo toko'], ['show_address', 'Alamat toko'], ['show_phone', 'Nomor telepon'], ['show_cashier', 'Nama kasir yang berjaga'],
        ['show_customer', 'Nama pelanggan'], ['show_discount', 'Diskon & voucher'], ['show_tax', 'Pajak'], ['show_queue', 'Nomor antrian (mulai dari 1 setiap hari)'], ['show_brand', `Tulisan "Dibuat dengan ${APP_NAME}"`]
      ];

      return (
        <div className="max-w-5xl space-y-5 pb-24">
          <PageHeader title="Pengaturan Toko" desc="Profil, struk, pembayaran, jadwal sholat, dan pajak." />

          <Section title="Profil toko" icon="shop">
            <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <Field label="Nama Toko"><input value={form.name} onChange={set('name')} className={inputCls} /></Field>
              <Field label="Nomor Telepon Toko" error={phoneError(form.phone)} hint="Angka saja. Boleh nomor HP atau telepon kantor."><PhoneInput value={form.phone} onChange={v => setForm(f => ({ ...f, phone: v }))} /></Field>
            </div>
            <Field label="Alamat Toko"><input value={form.address} onChange={set('address')} className={inputCls} /></Field>
            <Field label="Target penjualan bulanan"><MoneyInput value={form.monthly_target} onChange={v => setForm(f => ({ ...f, monthly_target: v }))} /></Field>
          </Section>

          <Section title="Struk" desc="Atur isi struk. Pratinjau di sebelah kanan berubah langsung." icon="receipt">
            <div className="grid grid-cols-1 gap-6 lg:grid-cols-[1fr_auto]">
              <div className="space-y-4">
                <ImageUpload label="Logo di struk" value={form.receipt.logo} onChange={v => setNested('receipt', 'logo', v)} mode="contain" options={{ size: 320, type: 'image/png' }}
                  hint="Dicetak hitam-putih di printer thermal. Gunakan logo dengan latar putih." />
                <div>
                  <span className="text-sm font-medium text-slate-700">Ukuran kertas</span>
                  <div className="mt-1.5"><SegmentedControl size="md" label="Ukuran kertas" value={form.receipt.paper} onChange={v => setNested('receipt', 'paper', v)} options={[{ value: '58', label: '58 mm' }, { value: '80', label: '80 mm' }]} /></div>
                  <p className="mt-1 text-xs text-slate-500">{form.receipt.paper === '80' ? '48' : '32'} karakter per baris. Pilih sesuai lebar kertas di printer.</p>
                </div>
                <PrinterSettings sale={sampleSale} business={form} />
                <Field label="Teks pembuka"><input value={form.receipt.header} onChange={e => setNested('receipt', 'header', e.target.value)} className={inputCls} /></Field>
                <Field label="Teks penutup"><input value={form.receipt.footer} onChange={e => setNested('receipt', 'footer', e.target.value)} className={inputCls} /></Field>
                <fieldset>
                  <legend className="text-sm font-medium text-slate-700">Tampilkan di struk</legend>
                  <div className="mt-2 grid grid-cols-1 gap-x-4 gap-y-1 sm:grid-cols-2">
                    {receiptToggles.map(([k, label]) => (
                      <label key={k} className="flex min-h-[40px] cursor-pointer items-center gap-3 rounded-lg px-2 hover:bg-slate-50">
                        <input type="checkbox" checked={!!form.receipt[k]} onChange={e => setNested('receipt', k, e.target.checked)} className="h-4 w-4 rounded accent-brand-700" />
                        <span className="text-sm text-slate-800">{label}</span>
                      </label>
                    ))}
                  </div>
                </fieldset>
              </div>
              <div className="lg:w-[320px]">
                <p className="mb-2 text-sm font-medium text-slate-700">Pratinjau</p>
                <div className="rounded-2xl bg-slate-100 p-4">
                  <ReceiptPaper sale={sampleSale} business={form} printable={false} preview className="shadow-md" />
                </div>
                <p className="mt-2 text-xs text-slate-500">Contoh transaksi dengan diskon, voucher, dan pajak.</p>
              </div>
            </div>
          </Section>

          <Section title="Lokasi & jadwal sholat" desc="Dipakai untuk waktu sholat, pengingat adzan, dan absen GPS." icon="moon">
            <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <Field label="Kota">
                <select value={preset ? preset.city : '__custom'} className={inputCls}
                  onChange={e => { const c = CITY_PRESETS.find(x => x.city === e.target.value); if (c) setForm(f => ({ ...f, location: { ...c } })); }}>
                  {!preset && <option value="__custom">{form.location.city} (koordinat khusus)</option>}
                  {CITY_PRESETS.map(c => <option key={c.city} value={c.city}>{c.city} · {TZ_LABEL[c.tz]}</option>)}
                </select>
              </Field>
              <div className="flex items-end"><Btn variant="secondary" icon="location" onClick={useDeviceLocation} disabled={locating} className="w-full">{locating ? 'Mendeteksi…' : 'Pakai lokasi toko saat ini (GPS)'}</Btn></div>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field label="Lintang"><input type="number" step="0.0001" value={form.location.lat} onChange={e => setForm(f => ({ ...f, location: { ...f.location, lat: e.target.value, city: 'Lokasi khusus' } }))} className={cx(inputCls, 'tabular')} /></Field>
              <Field label="Bujur"><input type="number" step="0.0001" value={form.location.lng} onChange={e => setForm(f => ({ ...f, location: { ...f.location, lng: e.target.value, city: 'Lokasi khusus' } }))} className={cx(inputCls, 'tabular')} /></Field>
              <Field label="Zona waktu"><select value={form.location.tz} onChange={e => setNested('location', 'tz', Number(e.target.value))} className={inputCls}><option value={7}>WIB</option><option value={8}>WITA</option><option value={9}>WIT</option></select></Field>
            </div>
            {preview && (
              <div className="grid grid-cols-3 gap-2 rounded-xl bg-brand-50 p-3 sm:grid-cols-6">
                {[PRAYER_LIST[0], ...MAIN_PRAYERS].map(p => (
                  <div key={p.key} className="text-center"><p className="text-xs text-brand-800">{p.label}</p><p className="text-sm font-bold text-brand-900 tabular">{minToHHMM(preview[p.key])}</p></div>
                ))}
              </div>
            )}
            <div className="space-y-3 border-t border-slate-100 pt-4">
              <div className="flex items-center justify-between gap-4">
                <div><p id="pr-on" className="text-sm font-semibold text-slate-900">Pengingat adzan</p><p className="text-sm text-slate-600">Muncul di layar kasir saat masuk waktu sholat.</p></div>
                <Switch checked={!!form.prayer.enabled} onChange={v => setNested('prayer', 'enabled', v)} labelledBy="pr-on" />
              </div>
              {form.prayer.enabled && <>
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Ingatkan sebelumnya">
                    <select value={form.prayer.remind_before} onChange={e => setNested('prayer', 'remind_before', Number(e.target.value))} className={inputCls}>
                      {[0, 5, 10, 15, 20].map(m => <option key={m} value={m}>{m ? `${m} menit` : 'Tidak'}</option>)}
                    </select>
                  </Field>
                  <Field label="Penyesuaian tanggal Hijriah" hint={hijriLabel(new Date(), Number(form.prayer.hijri_offset))}>
                    <select value={form.prayer.hijri_offset} onChange={e => setNested('prayer', 'hijri_offset', Number(e.target.value))} className={inputCls}>
                      {[-2, -1, 0, 1, 2].map(o => <option key={o} value={o}>{o === 0 ? 'Tidak ada' : `${o > 0 ? '+' : ''}${o} hari`}</option>)}
                    </select>
                  </Field>
                </div>
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-3"><Switch checked={!!form.prayer.sound} onChange={v => setNested('prayer', 'sound', v)} labelledBy="pr-sound" /><span id="pr-sound" className="text-sm text-slate-700">Bunyikan nada pengingat</span></div>
                  <div className="flex gap-2">
                    <Btn variant="ghost" size="sm" icon="volume" onClick={playChime}>Tes suara</Btn>
                    {'Notification' in window && Notification.permission !== 'granted' && (
                      <Btn variant="ghost" size="sm" icon="bell" onClick={() => Notification.requestPermission().then(p => notify(p === 'granted' ? 'Notifikasi diaktifkan.' : 'Izin notifikasi ditolak.', p === 'granted' ? 'success' : 'warn'))}>Izinkan notifikasi</Btn>
                    )}
                  </div>
                </div>
              </>}
            </div>
          </Section>

          <Section title="Pembayaran" desc="QRIS dan rekening yang ditampilkan ke pelanggan." icon="qr">
            <ImageUpload label="Gambar QRIS toko" value={form.qris_image} onChange={v => setForm(f => ({ ...f, qris_image: v }))} mode="contain" aspect="aspect-[3/4]"
              options={{ size: 900, type: 'image/png', maxBytes: 400 * 1024 }} hint="Unggah foto atau screenshot QRIS dari bank/e-wallet Anda. Gambar tidak dipotong agar tetap bisa dipindai." />
            <Field label="NMID QRIS"><input value={form.qris_nmid} onChange={set('qris_nmid')} className={cx(inputCls, 'font-mono')} /></Field>
            <div>
              <p className="text-sm font-medium text-slate-700">Rekening bank</p>
              <ul className="mt-2 space-y-2">
                {form.bank_accounts.map(b => (
                  <li key={b.id} className="grid grid-cols-1 gap-2 rounded-xl border border-slate-200 p-3 sm:grid-cols-[1fr_1fr_1fr_auto]">
                    <input aria-label="Nama bank" placeholder="Bank" value={b.bank} onChange={e => updateBank(b.id, 'bank', e.target.value)} className={inputCls} />
                    <input aria-label="Nomor rekening" placeholder="No. rekening" value={b.number} onChange={e => updateBank(b.id, 'number', e.target.value)} className={cx(inputCls, 'font-mono')} />
                    <input aria-label="Atas nama" placeholder="Atas nama" value={b.owner} onChange={e => updateBank(b.id, 'owner', e.target.value)} className={inputCls} />
                    <IconBtn icon="trash" label={`Hapus rekening ${b.bank}`} onClick={() => setForm(f => ({ ...f, bank_accounts: f.bank_accounts.filter(x => x.id !== b.id) }))} className="text-rose-600 hover:bg-rose-50" />
                  </li>
                ))}
              </ul>
              <Btn variant="secondary" size="sm" icon="plus" className="mt-2" onClick={() => setForm(f => ({ ...f, bank_accounts: [...f.bank_accounts, { id: generateId('B'), bank: '', number: '', owner: '' }] }))}>Tambah rekening</Btn>
            </div>
          </Section>

          <Section title="Pajak" icon="finance">
            <div className="flex items-center justify-between gap-4">
              <div><p id="tax-label" className="text-sm font-semibold text-slate-900">Pajak restoran (PB1)</p><p className="text-sm text-slate-600">Ditambahkan otomatis ke setiap transaksi.</p></div>
              <Switch checked={!!form.tax_active} onChange={v => setForm(f => ({ ...f, tax_active: v }))} labelledBy="tax-label" />
            </div>
            {form.tax_active && <Field label="Tarif pajak (%)" className="max-w-[10rem]"><input type="number" min="0" max="100" value={form.tax_rate} onChange={set('tax_rate')} className={cx(inputCls, 'tabular')} /></Field>}
          </Section>

          <p className="text-sm text-slate-600">Jam kerja, shift, dan aturan absensi kini diatur di menu <span className="font-semibold">Absensi & Lembur → Shift & aturan</span>.</p>

          <Section title="Data aplikasi" icon="refresh" desc="Data saat ini tersimpan di perangkat ini.">
            <Btn variant="ghost" className="text-rose-700 hover:bg-rose-50" icon="trash" onClick={() => {
              if (window.confirm('Hapus semua data di perangkat ini dan kembali ke data contoh?')) { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }
            }}>Reset ke data contoh</Btn>
          </Section>

          {dirty && (
            <div className="sticky bottom-4 z-10 flex items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-lg animate-pop-in">
              <p className="text-sm font-medium text-slate-700">Ada perubahan yang belum disimpan.</p>
              <div className="flex gap-2">
                <Btn variant="ghost" onClick={() => setForm(JSON.parse(JSON.stringify(db.business)))}>Batalkan</Btn>
                <Btn onClick={save}>Simpan</Btn>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =====================================================================
    // SUPPORT & CART DRAWER
    // =====================================================================
    function CustomerSupportModal({ onClose }) {
      const [search, setSearch] = useState('');
      const faqs = [
        { q: 'Bagaimana cara membuka dan menutup kasir?', a: 'Di layar Kasir tekan "Buka kasir" dan isi modal awal di laci. Saat tutup toko, tekan "Tutup kasir", hitung uang fisik, dan aplikasi menunjukkan selisihnya.' },
        { q: 'Bagaimana karyawan absen?', a: 'Karyawan menekan tombol "Absen masuk" di atas layar saat datang dan "Absen pulang" saat selesai. Pulang lewat jam kerja otomatis diajukan sebagai lembur ke Bos.' },
        { q: 'Bagaimana mengatur jadwal sholat?', a: 'Owner membuka Pengaturan Toko → Lokasi & jadwal sholat, lalu memilih kota atau memakai GPS toko. Pengingat adzan muncul otomatis di layar kasir.' },
        { q: 'Bagaimana mencatat kasbon / bayar nanti?', a: 'Pilih pelanggan terdaftar di layar Kasir lalu tekan "Bayar Nanti". Kasbon tercatat di Hutang & Piutang dan bisa diingatkan lewat WhatsApp.' },
        { q: 'Bagaimana jika internet terputus?', a: 'Tetap pakai seperti biasa. Transaksi disimpan di perangkat dan terkirim otomatis saat internet kembali. Tombol status di kanan atas menunjukkan berapa perubahan yang masih menunggu.' },
        { q: 'Bisa masuk saat tidak ada internet?', a: 'Bisa, di perangkat yang pernah dipakai akun itu untuk masuk saat online. Masukkan ID login dan password seperti biasa. Untuk perangkat baru, masuk pertama kali butuh internet.' },
        { q: 'Karyawan lupa password?', a: 'Bos membuka menu Karyawan, memilih nama karyawan, lalu mengisi password baru. Jika Bos yang lupa password, hubungi CS lewat WhatsApp.' },
        { q: 'Bagaimana membatalkan transaksi yang salah?', a: 'Buka Laporan Penjualan → Detail transaksi → Batalkan. Stok otomatis dikembalikan. Kasir butuh izin dari Bos di menu Hak Akses.' }
      ];
      const q = search.trim().toLowerCase();
      const list = faqs.filter(f => !q || f.q.toLowerCase().includes(q) || f.a.toLowerCase().includes(q));
      return (
        <Modal title="Bantuan & Panduan" desc={`Tim ${APP_NAME} siap membantu.`} onClose={onClose} size="lg">
          <div className="flex flex-col gap-3 rounded-xl border border-emerald-200 bg-emerald-50 p-4 sm:flex-row sm:items-center sm:justify-between">
            <div className="flex items-start gap-3"><SvgIcon name="chat" className="mt-0.5 h-5 w-5 flex-shrink-0 text-emerald-700" /><div><p className="text-sm font-semibold text-emerald-900">Chat CS via WhatsApp</p><p className="text-sm text-emerald-800">Untuk kendala sistem & bantuan teknis.</p></div></div>
            <a href={`https://wa.me/${CS_WA}`} target="_blank" rel="noreferrer" className={cx('inline-flex min-h-[44px] items-center justify-center rounded-xl bg-emerald-700 px-4 text-sm font-semibold text-white hover:bg-emerald-800', focusRing)}><SvgIcon name="chat" className="mr-2 h-4 w-4" />Hubungi</a>
          </div>
          <p className="mt-2 text-center text-xs text-slate-500">CS: +62 851-6943-8438 · {APP_NAME} crafted by <a href={MAKER_URL} target="_blank" rel="noreferrer" className={cx('font-semibold text-brand-700 hover:underline', focusRing)}>menjadibos.com</a></p>
          <h4 className="mt-5 text-sm font-bold text-slate-900">Pertanyaan umum</h4>
          <SearchInput id="faq-search" value={search} onChange={setSearch} placeholder="Cari topik bantuan…" className="mt-2" />
          <div className="mt-3 space-y-2">
            {list.length === 0 && <p className="py-4 text-center text-sm text-slate-500">Tidak ada topik yang cocok. Hubungi CS via WhatsApp.</p>}
            {list.map((f, i) => (
              <details key={i} className="group rounded-xl border border-slate-200 open:bg-slate-50">
                <summary className={cx('flex min-h-[48px] cursor-pointer list-none items-center justify-between gap-3 rounded-xl px-4 py-3 text-sm font-semibold text-slate-900', focusRing)}>
                  {f.q}
                  <svg className="h-4 w-4 flex-shrink-0 text-slate-500 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                </summary>
                <p className="px-4 pb-3 text-sm leading-relaxed text-slate-700">{f.a}</p>
              </details>
            ))}
          </div>
        </Modal>
      );
    }

    function CartQuickDrawer({ cart, setCart, products, onClose, onCheckout, notify }) {
      const subtotal = cart.reduce((sum, it) => sum + it.sell_price * it.qty, 0);
      const itemCount = cart.reduce((a, it) => a + it.qty, 0);
      const titleId = useId();
      const [confirmClear, setConfirmClear] = useState(false);
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);
      const changeQty = (it, delta) => {
        if (delta > 0 && unitsSharingStock(cart, products, it.id) >= lineStock(products, it.id)) return notify('Jumlah melebihi stok tersedia.', 'warn');
        setCart(prev => prev.map(c => c.id === it.id ? { ...c, qty: c.qty + delta } : c).filter(c => c.qty > 0));
      };
      const remove = (it) => setCart(prev => prev.filter(c => c.id !== it.id));
      return (
        <div className="fixed inset-0 z-50 !m-0 flex justify-end bg-slate-900/60 animate-fade-in" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div role="dialog" aria-modal="true" aria-labelledby={titleId} className="flex h-full w-full max-w-sm flex-col bg-white shadow-2xl animate-slide-in-right">
            <div className="flex items-center justify-between border-b border-slate-200 px-5 py-4">
              <h3 id={titleId} className="flex items-center gap-2 text-base font-bold text-slate-900">Keranjang <Badge tone="teal"><span className="tabular">{itemCount}</span> item</Badge></h3>
              <IconBtn icon="x" label="Tutup keranjang" onClick={onClose} autoFocus className="-mr-2" />
            </div>
            <div className="flex-1 overflow-y-auto px-5 py-3">
              {cart.length === 0 ? <EmptyState icon="cart" title="Keranjang kosong" desc="Tambahkan menu dari layar kasir." /> : (
                <ul className="divide-y divide-slate-100">
                  {cart.map(it => (
                    <li key={it.id} className="flex gap-3 py-3">
                      <ProductThumb product={products.find(p => p.id === productIdOf(it)) || it} className="h-12 w-12 flex-shrink-0 rounded-lg" textClass="text-xs" />
                      <div className="min-w-0 flex-1">
                        <div className="flex items-start justify-between gap-1">
                          <div className="min-w-0">
                            <p className="truncate text-sm font-semibold text-slate-900">{it.name}</p>
                            <p className="text-xs text-slate-500 tabular">{it.original_price > it.sell_price && <span className="mr-1 line-through">{formatIDR(it.original_price)}</span>}{formatIDR(it.sell_price)} / item</p>
                          </div>
                          <IconBtn icon="trash" label={`Hapus ${it.name}`} iconClass="w-4 h-4" onClick={() => remove(it)} className="-mr-1 -mt-1 h-9 w-9 text-slate-400 hover:bg-rose-50 hover:text-rose-600" />
                        </div>
                        <div className="mt-1 flex items-center justify-between gap-2">
                          <QtyStepper qty={it.qty} name={it.name} onDec={() => changeQty(it, -1)} onInc={() => changeQty(it, 1)} incDisabled={unitsSharingStock(cart, products, it.id) >= lineStock(products, it.id)} />
                          <span className="text-sm font-bold text-slate-900 tabular">{formatIDR(it.qty * it.sell_price)}</span>
                        </div>
                      </div>
                    </li>
                  ))}
                </ul>
              )}
            </div>
            <div className="space-y-3 border-t border-slate-200 p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
              <div className="flex items-baseline justify-between"><span className="text-sm text-slate-600">Subtotal (sebelum pajak)</span><span className="text-lg font-bold text-slate-900 tabular">{formatIDR(subtotal)}</span></div>
              {cart.length > 0 && (confirmClear
                ? <div className="flex gap-2"><Btn variant="secondary" className="flex-1" onClick={() => setConfirmClear(false)}>Batal</Btn><Btn variant="danger" className="flex-1" onClick={() => { setCart([]); setConfirmClear(false); }}>Ya, kosongkan</Btn></div>
                : <Btn variant="ghost" icon="trash" className="w-full" onClick={() => setConfirmClear(true)}>Kosongkan keranjang</Btn>)}
              <Btn className="w-full" onClick={onCheckout} disabled={!cart.length}>Lanjut ke pembayaran</Btn>
            </div>
          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { failed: false }; }
      static getDerivedStateFromError() { return { failed: true }; }
      componentDidCatch(error) { console.error(error); }
      render() {
        if (!this.state.failed) return this.props.children;
        return (
          <div className="flex h-full flex-col items-center justify-center gap-3 p-6 text-center">
            <p className="text-lg font-bold text-slate-900">Terjadi kesalahan di layar ini</p>
            <p className="max-w-sm text-sm text-slate-600">Data toko tetap aman. Muat ulang aplikasi untuk melanjutkan.</p>
            <Btn icon="refresh" onClick={() => window.location.reload()}>Muat ulang</Btn>
          </div>
        );
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><Root /></ErrorBoundary>);

    // Keeps the app and its libraries on the device, so it opens even without internet (needs https or localhost)
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      // Babel runs this after the page may already have finished loading
      const registerSw = () => navigator.serviceWorker.register('sw.js').catch(() => {});
      if (document.readyState === 'complete') registerSw(); else window.addEventListener('load', registerSw);
    }
  </script>
</body>
</html>
