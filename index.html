    const REWARD_TYPES = ['Karyawan Teladan', 'Tepat Waktu', 'Target Penjualan', 'Lembur Ekstra', 'Lainnya'];

    // Live camera only: there is no way to pick a file, so a saved picture cannot stand in for the person
    function SelfieCamera({ label, lines, onDone }) {
      const videoRef = useRef(null);
      const [facing, setFacing] = useState('user');
      const [shot, setShot] = useState('');
      const [ready, setReady] = useState(false);
      const [error, setError] = useState('');
      const [attempt, setAttempt] = useState(0);
      useEffect(() => {
        if (shot) return undefined;
        let stream, stopped = false;
        setReady(false); setError('');
        (async () => {
          if (!navigator.mediaDevices?.getUserMedia) { setError('Perangkat atau browser ini tidak mendukung kamera.'); return; }
          try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 960 } } });
            if (stopped) return stream.getTracks().forEach(t => t.stop());
            videoRef.current.srcObject = stream;
            await videoRef.current.play();
            setReady(true);
          } catch (e) {
            setError(e?.name === 'NotAllowedError' ? 'Izin kamera ditolak. Izinkan kamera di pengaturan browser, lalu coba lagi.'
              : e?.name === 'NotFoundError' ? 'Kamera tidak ditemukan di perangkat ini.'
              : e?.name === 'NotReadableError' ? 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi itu, lalu coba lagi.'
              : 'Kamera tidak bisa dibuka. Coba lagi.');
          }
        })();
        return () => { stopped = true; stream?.getTracks().forEach(t => t.stop()); };
      }, [facing, shot, attempt]);
      const capture = () => { const v = videoRef.current; if (v?.videoWidth) setShot(stampSelfie(v, lines())); };
      return (
        <Modal size="sm" title={`Foto absen ${label}`} desc="Lokasi, jam, dan nama perangkat tercetak di foto. Alamat dari OpenStreetMap." onClose={() => onDone(null)}
          footer={shot ? <>
            <Btn variant="secondary" icon="refresh" onClick={() => setShot('')}>Ulangi</Btn>
            <span className="flex-1" />
            <Btn icon="check" onClick={() => onDone(shot)}>Pakai foto</Btn>
          </> : error ? <>
            <span className="flex-1" />
            <Btn variant="secondary" onClick={() => onDone(null)}>Batal</Btn>
            <Btn icon="refresh" onClick={() => setAttempt(n => n + 1)}>Coba lagi</Btn>
          </> : <>
            <Btn variant="secondary" icon="refresh" onClick={() => setFacing(f => f === 'user' ? 'environment' : 'user')}>{facing === 'user' ? 'Kamera belakang' : 'Kamera depan'}</Btn>
            <span className="flex-1" />
            <Btn icon="photo" disabled={!ready} onClick={capture}>Ambil foto</Btn>
          </>}>
          {shot
            ? <img src={shot} alt={`Hasil foto absen ${label}`} width="720" height="540" className="h-auto w-full rounded-xl" />
            : error
              ? <p className="rounded-xl bg-rose-50 p-3 text-sm font-medium text-rose-800" role="alert">{error}</p>
              : <div className="relative overflow-hidden rounded-xl bg-slate-900">
                  <video ref={videoRef} playsInline muted aria-label="Pratinjau kamera" className={cx('aspect-[4/3] w-full object-cover', facing === 'user' && '-scale-x-100')} />
                  {!ready && <p className="absolute inset-0 flex items-center justify-center text-sm text-white" role="status">Membuka kamera…</p>}
                </div>}
        </Modal>
      );
    }

    // One attendance photo. On the server it needs the sign-in token, so it is fetched instead of linked.
    function SelfiePhoto({ value, label, session }) {
      const [src, setSrc] = useState('');
      const [note, setNote] = useState('');
      useEffect(() => {
        if (value === 'pending') return setNote('Foto belum sampai ke server. Buka aplikasi di perangkat karyawan saat online.');
        if (value.startsWith('data:')) return setSrc(value);
        let url = '', stopped = false;
        fetch(`${CLOUD_API}/api/selfies/${value}`, { headers: { Authorization: `Bearer ${session.token}` } })
          .then(async r => {
            if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error);
            url = URL.createObjectURL(await r.blob());
            if (!stopped) setSrc(url);
          })
          .catch(e => { if (!stopped) setNote(e.message || 'Foto tidak bisa dimuat. Periksa internet.'); });
        return () => { stopped = true; if (url) URL.revokeObjectURL(url); };
      }, [value]);
      return (
        <figure className="min-w-0">
          <figcaption className="mb-1 text-xs font-semibold text-slate-600">{label}</figcaption>
          {src ? <img src={src} alt={`Foto absen ${label}`} width="720" height="540" className="h-auto w-full rounded-lg" />
            : <p className="rounded-lg bg-slate-50 p-3 text-sm text-slate-600">{note || 'Memuat foto…'}</p>}
        </figure>
      );
    }
    function SelfieViewer({ name, records, session, onClose }) {
      return (
        <Modal size="lg" title={`Foto absen ${name}`} desc="Foto terhapus otomatis setelah 3 bulan. Alamat dari OpenStreetMap." onClose={onClose}>

              <li key={r.id}>

                  {r.selfie_in && <SelfiePhoto value={r.selfie_in} label={`Datang ${fmtTime(r.clock_in)}`} session={session} />}
                  {r.selfie_out && <SelfiePhoto value={r.selfie_out} label={`Pulang ${fmtTime(r.clock_out)}`} session={session} />}
                </div>
              </li>
            ))}
          </ul>
        </Modal>
      );
    }

    function AttendanceModule({ db, setDb, notify, currentUser, isOwner, hasPermission, session, todayKey, myAttendance, clockIn, clockOut, clocking, deviceId }) {
      const [selfies, setSelfies] = useState(null);
      const [tab, setTab] = useState(isOwner ? 'today' : 'me');
      const [month, setMonth] = useState(todayKey.slice(0, 7));
      const [rewardForm, setRewardForm] = useState(null);
      const [rejecting, setRejecting] = useState(null);
      const [distanceCheck, setDistanceCheck] = useState(null);
      const [leaveForm, setLeaveForm] = useState(null);
      const leaveOn = (userId, key) => (db.leaves || []).find(l => l.user_id === userId && l.date === key);
      const saveLeave = () => {
        const f = leaveForm;
        if (!f.user_id || f.to < f.from) return;
        const days = [];
        for (let k = f.from; k <= f.to && days.length < 31; k = addDays(k, 1)) days.push(k);
        const t = LEAVE_TYPES[f.type];
        setDb(prev => {
          const taken = new Set((prev.leaves || []).filter(l => l.user_id === f.user_id).map(l => l.date));
          const added = days.filter(d => !taken.has(d)).map(d => ({ id: generateId('LV'), user_id: f.user_id, date: d, type: f.type, note: f.note.trim(), by: currentUser.name }));
          return withStaffNotif({ ...prev, leaves: [...added, ...(prev.leaves || [])] }, f.user_id,
            { icon: 'calendar', tone: t.tone, title: `Anda dicatat ${t.label}`, msg: `${days.length > 1 ? `${fmtDateShort(f.from)} – ${fmtDateShort(f.to)}` : fmtDateShort(f.from)}${f.note.trim() ? ` · ${f.note.trim()}` : ''}`, go: 'attendance' });
        });
        notify(`${db.users.find(u => u.id === f.user_id)?.name} dicatat ${t.label} ${days.length} hari.`);
        setLeaveForm(null);
      };
      const removeLeave = (l) => { setDb(prev => ({ ...prev, leaves: (prev.leaves || []).filter(x => x.id !== l.id) })); notify('Catatan ketidakhadiran dihapus.', 'info'); };
      const work = db.business.work;
      const staff = db.users.filter(u => isStaffRole(u.role) && u.status !== 'Nonaktif');
      const storeDevices = db.business.store_devices || [];
      const pendingCount = db.overtime.filter(o => o.status === 'pending').length;

      const months = monthOptions(db.attendance.reduce((m, a) => a.date < m ? a.date : m, todayKey));
      const updateWork = (patch) => setDb(prev => ({ ...prev, business: { ...prev.business, work: { ...prev.business.work, ...patch } } }));
      const updateShift = (id, patch) => updateWork({ shifts: work.shifts.map(s => s.id === id ? { ...s, ...patch } : s) });
      const updateUser = (id, patch) => setDb(prev => withStaffNotif({ ...prev, users: prev.users.map(u => u.id === id ? { ...u, ...patch } : u) }, id,
        patch.shift_id
          ? { icon: 'clock', tone: 'blue', title: 'Jadwal shift diubah', msg: `Shift Anda sekarang ${work.shifts.find(s => s.id === patch.shift_id)?.name}.`, go: 'attendance' }
          : { icon: 'calendar', tone: 'blue', title: 'Hari libur diubah', msg: `Hari libur mingguan Anda sekarang ${WEEKDAYS[patch.day_off]}.`, go: 'attendance' }));

      const decideOt = (ot, status, note) => {
        const pay = formatIDR(Math.round(ot.minutes / 60 * work.overtime_rate));
        setDb(prev => withStaffNotif({ ...prev, overtime: prev.overtime.map(o => o.id === ot.id ? { ...o, status, decided_by: currentUser.name, decided_at: new Date().toISOString(), owner_note: note || '' } : o) }, ot.user_id,
          status === 'approved'
            ? { icon: 'check', tone: 'green', title: 'Lembur disetujui', msg: `Lembur ${fmtDateShort(ot.date)} selama ${fmtDuration(ot.minutes)} disetujui (${pay}).`, go: 'attendance' }
            : { icon: 'x', tone: 'rose', title: 'Lembur ditolak', msg: `Lembur ${fmtDateShort(ot.date)} ditolak${note ? `: ${note}` : '.'}`, go: 'attendance' }));
        const u = db.users.find(x => x.id === ot.user_id);
        notify(status === 'approved' ? `Lembur ${u?.name} ${fmtDuration(ot.minutes)} disetujui (${formatIDR(Math.round(ot.minutes / 60 * work.overtime_rate))}).` : `Lembur ${u?.name} ditolak.`, status === 'approved' ? 'success' : 'info');
      };

      const giveReward = () => {
        const f = rewardForm;
        if (!f.user_id || !f.amount) return;
        setDb(prev => withStaffNotif({ ...prev, rewards: [{ id: generateId('RW'), user_id: f.user_id, date: todayKey, type: f.type, amount: f.amount, note: f.note, given_by: currentUser.name }, ...prev.rewards] }, f.user_id,
          { icon: 'gift', tone: 'purple', title: `Anda dapat reward ${f.type}`, msg: `${formatIDR(f.amount)} dari ${currentUser.name}${f.note ? ` · ${f.note}` : ''}. Masuk ke gaji bulan ini.`, go: 'attendance' }));
        notify(`Reward ${f.type} untuk ${db.users.find(u => u.id === f.user_id)?.name} tercatat.`);
        setRewardForm(null);
      };

      const exportPayroll = async () => {
        const rows = staff.map(u => { const r = monthlyRecap(db, u, month); return [u.name, shiftOf(u, work).name, r.present, r.lateDays, r.sick, r.permit, r.alpha, r.worked / 60, r.otMinutes / 60, r.otPay, r.reward, u.base_salary || 0, r.total]; });
        const sum = (i) => rows.reduce((a, row) => a + (Number(row[i]) || 0), 0);
        const how = await downloadReport(`Rekap_Gaji_${month}`, {
          title: `Rekap Absensi & Gaji · ${db.business.name}`, subtitle: monthLabel(month),
          sheets: [{ name: 'Rekap Gaji', tables: [{
            columns: [{ header: 'Karyawan', width: 22 }, { header: 'Shift', width: 14 }, { header: 'Hadir (hari)', t: 'int' }, { header: 'Terlambat (hari)', width: 14, t: 'int' }, { header: 'Sakit', width: 8, t: 'int' }, { header: 'Izin', width: 8, t: 'int' }, { header: 'Alpha', width: 8, t: 'int' },
              { header: 'Jam kerja', t: 'dec' }, { header: 'Lembur disetujui (jam)', width: 14, t: 'dec' }, { header: 'Upah lembur', width: 15, t: 'money' }, { header: 'Reward', width: 15, t: 'money' }, { header: 'Gaji pokok', width: 15, t: 'money' }, { header: 'Total dibayar', width: 17, t: 'money' }],
            rows, total: ['Total', '', '', '', '', '', '', '', '', sum(9), sum(10), sum(11), sum(12)]
          }] }]
        });
        notify(reportDone(how, 'Rekap gaji'));
      };

      const checkMyDistance = async () => {
        setDistanceCheck({ loading: true });
        try {
          const c = await getPosition();
          setDistanceCheck({ dist: Math.round(haversineM(c.latitude, c.longitude, db.business.location.lat, db.business.location.lng)), acc: Math.round(c.accuracy) });
        } catch { setDistanceCheck({ error: 'Lokasi tidak bisa dibaca. Izinkan akses lokasi di browser.' }); }
      };

      const tabs = [
        ...(isOwner ? [] : [{ value: 'me', label: 'Absensi saya' }]),
        ...ATTENDANCE_SECTIONS.filter(s => hasPermission(s.key)).map(s => ({ value: s.value, label: s.value === 'overtime' && pendingCount ? `${s.label} (${pendingCount})` : s.label }))

      // Switching a right off while the section is open sends the person back to their own attendance
      useEffect(() => { if (!tabs.some(t => t.value === tab)) setTab(tabs[0].value); }, [tabs.length]);

      const canReward = hasPermission('can_att_rewards') && rewardable.length > 0;

      const ruleSummary = [
        work.attendance_gps && `wajib berada ≤ ${work.attendance_radius} m dari toko`,

        !work.attendance_code && work.attendance_store_device && 'hanya dari perangkat kasir toko',
        work.attendance_selfie && 'foto selfie langsung dari kamera'
      ].filter(Boolean).join(' dan ');

        const myOts = db.overtime.filter(o => o.user_id === currentUser.id && o.date.startsWith(month));
        const myRewards = db.rewards.filter(r => r.user_id === currentUser.id).slice(0, 5);

              </div>
              <div className="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
                <div className="rounded-xl border border-slate-200 p-4">
                  <div className="flex items-center justify-between gap-2">
                    <span className="flex items-center gap-2 text-sm font-medium text-slate-600"><SvgIcon name="login" className="h-4 w-4" />Absen datang</span>
                    {myAttendance && (info.lateMin ? <Badge tone="amber">Terlambat {fmtDuration(info.lateMin)}</Badge> : <Badge tone="green">Tepat waktu</Badge>)}

                  {myAttendance?.clock_out

            </Card>

            <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
              <StatCard label="Hadir" value={`${recap.present} hari`} sub={`${recap.lateDays}× terlambat · sakit ${recap.sick} · izin ${recap.permit} · alpha ${recap.alpha}`} icon="calendar" />
              <StatCard label="Lembur disetujui" value={fmtDuration(recap.otMinutes)} sub={recap.otPending ? `${recap.otPending} menunggu persetujuan` : formatIDR(recap.otPay)} icon="clock" tone="blue" />
              <StatCard label="Reward" value={formatIDR(recap.reward)} icon="gift" tone="purple" />
              <StatCard label="Perkiraan diterima" value={formatIDR(recap.total)} sub="Gaji pokok + lembur + reward" icon="dollar" highlight />

                      <span className="flex items-center gap-2"><SvgIcon name="gift" className="h-4 w-4 text-purple-600" />{r.type} · {fmtDateShort(r.date)}</span>
                      <span className="font-semibold text-purple-700 tabular">{formatIDR(r.amount)}</span>
                    </li>
                  ))}
                </ul>
              </Card>
            </div>
          </div>
        );
      };

      // ---------- Owner views ----------
      const TodayView = () => (
        <div className="space-y-4">
          <div className="flex justify-end">
            <Btn variant="secondary" icon="calendar" onClick={() => setLeaveForm({ user_id: staff[0]?.id || '', type: 'sakit', from: todayKey, to: todayKey, note: '' })}>Liburkan karyawan</Btn>

          {work.shifts.map(sh => {

            return (
              <Card key={sh.id}>
                <div className="flex items-center justify-between border-b border-slate-200 px-4 py-3">
                  <h3 className="text-sm font-bold text-slate-900">{sh.name}</h3>
                  <span className="text-sm text-slate-600 tabular">{sh.start}–{sh.end}</span>
                </div>
                <ul className="divide-y divide-slate-100">
                  {members.map(u => {
                    const rec = db.attendance.find(a => a.user_id === u.id && (a.date === todayKey || !a.clock_out));
                    const info = rec ? attendanceInfo(rec, work, u) : null;
                    const isDayOff = new Date(todayKey + 'T00:00:00').getDay() === Number(u.day_off);
                    const leave = leaveOn(u.id, todayKey);
                    return (
                      <li key={u.id} className="flex flex-col gap-2 p-4 sm:flex-row sm:items-center sm:justify-between">
                        <div className="flex items-center gap-3">
                          <Avatar name={u.name} src={u.photo} />
                          <div>
                            <p className="font-semibold text-slate-900">{u.name}</p>
                            <p className="text-sm text-slate-600">{rec ? `Masuk ${fmtTime(rec.clock_in)}${rec.clock_out ? ` · Pulang ${fmtTime(rec.clock_out)} (${fmtDuration(info.worked)})` : ''}` : isDayOff ? 'Jadwal libur' : 'Belum absen'}</p>
                            {rec?.verify_in && <p className="text-xs text-slate-500">Terverifikasi: {rec.verify_in}</p>}
                          </div>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                          {(rec?.selfie_in || rec?.selfie_out) && <Btn variant="ghost" size="sm" icon="photo" onClick={() => setSelfies({ name: u.name, records: [rec] })}>Foto</Btn>}
                          {leave ? <Badge tone={LEAVE_TYPES[leave.type].tone}>{LEAVE_TYPES[leave.type].label}{leave.note ? ` · ${leave.note}` : ''}</Badge>
                            : !rec ? <Badge tone={isDayOff ? 'slate' : 'rose'}>{isDayOff ? 'Libur' : 'Belum hadir'}</Badge>
                            : info.lateMin ? <Badge tone="amber">Terlambat {fmtDuration(info.lateMin)}</Badge>
                            : <Badge tone="green">Tepat waktu</Badge>}
                          {leave
                            ? <Btn variant="ghost" size="sm" onClick={() => removeLeave(leave)}>Batalkan</Btn>
                            : !rec && <Btn variant="secondary" size="sm" icon="calendar" onClick={() => setLeaveForm({ user_id: u.id, type: 'sakit', from: todayKey, to: todayKey, note: '' })}>Liburkan</Btn>}
                        </div>
                      </li>
                    );
                  })}
                </ul>
              </Card>
            );
          })}
        </div>
      );

      const ScheduleView = () => (
        <div className="space-y-5">
          <Card className="p-5">
            <div className="flex flex-wrap items-start justify-between gap-2">
              <div><h3 className="text-base font-bold text-slate-900">Daftar shift</h3><p className="text-sm text-slate-600">Atur 1 sampai 3 shift. Shift yang melewati tengah malam (cth. 23:00–07:00) didukung.</p></div>
              {work.shifts.length < 3 && <Btn variant="secondary" size="sm" icon="plus" onClick={() => updateWork({ shifts: [...work.shifts, { id: generateId('S'), name: `Shift ${work.shifts.length + 1}`, start: '15:00', end: '23:00' }] })}>Tambah shift</Btn>}
            </div>
            <ul className="mt-4 space-y-2">
              {work.shifts.map(sh => {
                const used = staff.filter(u => shiftOf(u, work).id === sh.id).length;
                return (
                  <li key={sh.id} className="grid grid-cols-2 items-end gap-x-3 gap-y-3 rounded-xl border border-slate-200 p-4 md:grid-cols-[minmax(0,1fr)_9rem_9rem_auto]">
                    <Field label="Nama shift" className="col-span-2 md:col-span-1"><input value={sh.name} onChange={e => updateShift(sh.id, { name: e.target.value })} className={inputCls} /></Field>
                    <Field label="Masuk"><input type="time" value={sh.start} onChange={e => updateShift(sh.id, { start: e.target.value })} className={cx(inputCls, 'tabular')} /></Field>
                    <Field label="Pulang"><input type="time" value={sh.end} onChange={e => updateShift(sh.id, { end: e.target.value })} className={cx(inputCls, 'tabular')} /></Field>
                    <div className="col-span-2 flex min-h-[44px] items-center justify-between gap-2 md:col-span-1 md:justify-end">
                      <Badge tone="slate">{used} karyawan</Badge>
                      {work.shifts.length > 1 && <IconBtn icon="trash" label={`Hapus ${sh.name}`} disabled={used > 0} title={used ? 'Pindahkan karyawan dulu' : `Hapus ${sh.name}`} onClick={() => updateWork({ shifts: work.shifts.filter(s => s.id !== sh.id) })} className="border border-slate-200 text-rose-600 hover:bg-rose-50 disabled:opacity-40" />}
                    </div>
                  </li>
                );
              })}
            </ul>
          </Card>

          <Card>
            <div className="border-b border-slate-200 p-4"><h3 className="text-base font-bold text-slate-900">Jadwal karyawan</h3></div>
            <ul className="divide-y divide-slate-100">
              {staff.map(u => (
                <li key={u.id} className="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between">
                  <span className="flex items-center gap-3"><Avatar name={u.name} src={u.photo} /><span className="font-semibold text-slate-900">{u.name}</span></span>
                  <div className="grid grid-cols-2 gap-2 sm:w-[26rem]">
                    <label><span className="sr-only">Shift {u.name}</span>
                      <select value={shiftOf(u, work).id} onChange={e => updateUser(u.id, { shift_id: e.target.value })} className={inputCls}>
                        {work.shifts.map(s => <option key={s.id} value={s.id}>{s.name} ({s.start}–{s.end})</option>)}
                      </select>
                    </label>
                    <label><span className="sr-only">Hari libur {u.name}</span>
                      <select value={u.day_off ?? 0} onChange={e => updateUser(u.id, { day_off: Number(e.target.value) })} className={inputCls}>
                        {WEEKDAYS.map((d, i) => <option key={d} value={i}>Libur {d}</option>)}
                      </select>
                    </label>
                  </div>
                </li>
              ))}
            </ul>
          </Card>

          <Card className="p-5">
            <h3 className="text-base font-bold text-slate-900">Aturan terlambat & lembur</h3>
            <div className="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-3">
              <Field label="Toleransi telat (menit)"><input type="number" min="0" value={work.late_tolerance} onChange={e => updateWork({ late_tolerance: Number(e.target.value) || 0 })} className={cx(inputCls, 'tabular')} /></Field>
              <Field label="Upah lembur per jam"><MoneyInput value={work.overtime_rate} onChange={v => updateWork({ overtime_rate: v })} /></Field>
              <Field label="Minimal lembur (menit)"><input type="number" min="0" value={work.overtime_min} onChange={e => updateWork({ overtime_min: Number(e.target.value) || 0 })} className={cx(inputCls, 'tabular')} /></Field>
            </div>

            <div className="flex items-start gap-3">

            </div>

              <div className="rounded-xl border border-slate-200 p-4">
                <div className="flex items-center justify-between gap-4">

                  <Switch checked={!!work.attendance_selfie} onChange={v => updateWork({ attendance_selfie: v })} labelledBy="att-selfie" />
                </div>
              </div>
              <div className="rounded-xl border border-slate-200 p-4">
                <div className="flex items-center justify-between gap-4">
                  <div><p id="att-gps"className="text-sm font-semibold text-slate-900">Wajib berada di toko (GPS)</p><p className="text-sm text-slate-600">HP karyawan harus dalam radius tertentu dari lokasi toko ({db.business.location.city}).</p></div>
                  <Switch checked={!!work.attendance_gps} onChange={v => updateWork({ attendance_gps: v })} labelledBy="att-gps" />

              </div>
              <div className="rounded-xl border border-slate-200 p-4">

      const RecapView = () => {

                <p className="flex items-start gap-3 text-sm text-purple-900"><SvgIcon name="gift" className="mt-0.5 h-5 w-5 flex-shrink-0" /><span><span className="font-semibold">{perfect.map(x => x.u.name).join(', ')}</span> tidak pernah terlambat bulan ini. Layak diberi reward Tepat Waktu.</span></p>
                <Btn size="sm" onClick={() => setRewardForm({ user_id: perfect[0].u.id, type: 'Tepat Waktu', amount: 100000, note: `Tidak pernah terlambat ${monthLabel(month)}` })}>Beri reward</Btn>

            <Card>
              <div className="overflow-x-auto">

                      <th scope="col" className="px-4 py-3">Karyawan</th><th scope="col" className="px-4 py-3 text-right">Hadir</th><th scope="col" className="px-4 py-3 text-right">Telat</th><th scope="col" className="px-4 py-3 text-right">Sakit</th><th scope="col" className="px-4 py-3 text-right">Izin</th><th scope="col" className="px-4 py-3 text-right">Alpha</th>
                      <th scope="col" className="px-4 py-3 text-right">Jam kerja</th><th scope="col" className="px-4 py-3 text-right">Lembur</th><th scope="col" className="px-4 py-3 text-right">Upah lembur</th>
                      <th scope="col" className="px-4 py-3 text-right">Reward</th><th scope="col" className="px-4 py-3 text-right">Gaji pokok</th><th scope="col" className="px-4 py-3 text-right">Total</th>
                      <th scope="col" className="px-4 py-3"><span className="sr-only">Foto absen</span></th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {recaps.map(({ u, r }) => (
                      <tr key={u.id} className="hover:bg-slate-50">
                        <td className="px-4 py-3"><div className="flex items-center gap-2"><Avatar name={u.name} src={u.photo} className="h-8 w-8 text-xs" /><div><p className="font-semibold text-slate-900">{u.name}</p><p className="text-xs text-slate-500">{shiftOf(u, work).name}</p></div></div></td>
                        <td className="px-4 py-3 text-right tabular">{r.present}</td>

        <div className="space-y-4">
          {canReward && <div className="flex justify-end"><Btn icon="gift" onClick={() => setRewardForm({ user_id: rewardable[0].id, type: 'Karyawan Teladan', amount: 100000, note: '' })}>Beri reward</Btn></div>}
          <Card>
            {db.rewards.length === 0 ? <EmptyState icon="gift" title="Belum ada reward" desc="Apresiasi karyawan yang rajin agar tim makin semangat." /> : (
              <ul className="divide-y divide-slate-100">
                {db.rewards.map(r => {
                  const u = db.users.find(x => x.id === r.user_id);
                  return (
                    <li key={r.id} className="flex items-center justify-between gap-3 p-4">
                      <div className="flex items-center gap-3">
                        <span className="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-xl bg-purple-50 text-purple-700"><SvgIcon name="gift" className="h-5 w-5" /></span>
                        <div><p className="font-semibold text-slate-900">{r.type} · {u?.name}</p><p className="text-sm text-slate-600">{fmtDateShort(r.date)}{r.note ? ` · ${r.note}` : ''}</p></div>
                      </div>
                      <span className="font-bold text-purple-700 tabular">{formatIDR(r.amount)}</span>
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>
        </div>
      );

      return (
        <div className="space-y-5">
          <PageHeader title="Absensi, Lembur & Reward" desc={isOwner ? 'Pantau kehadiran per shift, atur jadwal, setujui lembur, dan beri apresiasi.' : 'Absen, lihat lembur, dan reward Anda.'} />
          {tabs.length > 1 && <SegmentedControl label="Bagian" size="md" value={tab} onChange={setTab} options={tabs} />}
          {tab === 'me' && MyView()}
          {tab === 'today' && TodayView()}
          {tab === 'schedule' && ScheduleView()}
          {tab === 'recap' && RecapView()}
          {tab === 'overtime' && OvertimeView()}
          {tab === 'rewards' && RewardsView()}

          {selfies && <SelfieViewer {...selfies} session={session} onClose={() => setSelfies(null)} />}
          {rewardForm && (
            <Modal title="Beri reward" onClose={() => setRewardForm(null)}

              <div className="space-y-4">
                <Field label="Karyawan"><select value={rewardForm.user_id} onChange={e => setRewardForm({ ...rewardForm, user_id: e.target.value })} className={inputCls}>{rewardable.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</select></Field>
                <Field label="Jenis reward"><select value={rewardForm.type} onChange={e => setRewardForm({ ...rewardForm, type: e.target.value })} className={inputCls}>{REWARD_TYPES.map(t => <option key={t}>{t}</option>)}</select></Field>
                <Field label="Nominal" hint="Masuk ke rekap gaji bulan ini."><MoneyInput value={rewardForm.amount} onChange={v => setRewardForm({ ...rewardForm, amount: v })} /></Field>
                <Field label="Catatan"><input value={rewardForm.note} onChange={e => setRewardForm({ ...rewardForm, note: e.target.value })} className={inputCls} placeholder="cth. pelayanan ramah, dapat pujian pelanggan" /></Field>
              </div>
