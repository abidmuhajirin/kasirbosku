    const EXPENSE_COLORS = ['bg-brand-600', 'bg-amber-500', 'bg-rose-500', 'bg-indigo-500', 'bg-slate-500'];

    function DashboardOwnerView({ db, go, now }) {
      const today = dateKey(new Date(now));
      const yesterday = addDays(today, -1);
      const monthStart = today.slice(0, 8) + '01';
      const t = computeFinancials(db, today, today);
      const y = computeFinancials(db, yesterday, yesterday);
      const m = computeFinancials(db, monthStart, today);
      const change = y.revenue ? Math.round(((t.revenue - y.revenue) / y.revenue) * 100) : null;

      const lowStock = db.products.filter(p => p.stock <= p.min_stock);
      const kasir = db.users.filter(u => isStaffRole(u.role) && u.status !== 'Nonaktif');
      const pendingOt = db.overtime.filter(o => o.status === 'pending');
      const openSession = db.cashSessions.find(s => !s.closed_at);

      const trend = useMemo(() => Array.from({ length: 7 }, (_, i) => {
        const k = addDays(today, i - 6);
        const f = computeFinancials(db, k, k);
        return { day: new Date(k + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'short' }), omzet: f.revenue, laba: f.grossProfit };
      }), [db.sales, db.offlineQueue, today]);

      const topProducts = useMemo(() => {
        const map = {};
        allSalesOf(db).filter(s => isValidSale(s) && saleDay(s) >= monthStart).forEach(s => s.items.forEach(it => {
          map[it.id] = map[it.id] || { name: it.name, qty: 0, omzet: 0 };
          map[it.id].qty += it.qty; map[it.id].omzet += it.qty * it.sell_price;
        }));
        return Object.values(map).sort((a, b) => b.omzet - a.omzet).slice(0, 5);
      }, [db.sales, db.offlineQueue, monthStart]);

      const expenseByCat = useMemo(() => {
        const mm = {};
        db.expenses.filter(e => e.date >= monthStart).forEach(e => { mm[e.category] = (mm[e.category] || 0) + e.amount; });
        const total = Object.values(mm).reduce((a, v) => a + v, 0);
        return Object.entries(mm).sort((a, b) => b[1] - a[1]).map(([cat, amt], i) => ({ cat, amt, pct: total ? Math.round(amt / total * 100) : 0, color: EXPENSE_COLORS[i % EXPENSE_COLORS.length] }));
      }, [db.expenses, monthStart]);

      const target = db.business.monthly_target || 1;
      const targetPct = Math.min(100, Math.round(m.revenue / target * 100));

      return (
        <div className="space-y-5 animate-fade-in">
          <PageHeader title="Ringkasan Bisnis" desc={`Kondisi toko hari ini dan bulan ${monthLabel(today.slice(0, 7))}.`}
            actions={<Btn variant="secondary" icon="report" onClick={() => go('sales_report')}>Laporan lengkap</Btn>} />

          {(lowStock.length > 0 || pendingOt.length > 0) && (
            <div className="grid gap-3 md:grid-cols-2">
              {lowStock.length > 0 && (
                <div className="flex items-start justify-between gap-3 rounded-2xl border border-amber-300 bg-amber-50 p-4">
                  <div className="flex items-start gap-3">
                    <SvgIcon name="alert" className="mt-0.5 h-5 w-5 flex-shrink-0 text-amber-700" />
                    <div>
                      <p className="text-sm font-semibold text-amber-900">{lowStock.length} produk stoknya menipis</p>
                      <p className="text-sm text-amber-800">{lowStock.map(p => `${p.name} (${p.stock})`).join(', ')}</p>
                    </div>
                  </div>
                  <Btn variant="warning" size="sm" onClick={() => go('products')}>Cek</Btn>
                </div>
              )}
              {pendingOt.length > 0 && (
                <div className="flex items-start justify-between gap-3 rounded-2xl border border-blue-200 bg-blue-50 p-4">
                  <div className="flex items-start gap-3">
                    <SvgIcon name="clock" className="mt-0.5 h-5 w-5 flex-shrink-0 text-blue-700" />
                    <div>
                      <p className="text-sm font-semibold text-blue-900">{pendingOt.length} pengajuan lembur</p>
                      <p className="text-sm text-blue-800">Setujui agar upah lembur masuk rekap gaji.</p>
                    </div>
                  </div>
                  <Btn size="sm" onClick={() => go('attendance')}>Tinjau</Btn>
                </div>
              )}
            </div>
          )}

          <div className="grid grid-cols-2 gap-3 lg:grid-cols-4 lg:gap-4">
            <StatCard label="Penjualan hari ini" value={formatIDR(t.revenue)}
              sub={change == null ? `${t.count} transaksi` : `${change >= 0 ? '▲' : '▼'} ${Math.abs(change)}% dari kemarin · ${t.count} transaksi`}
              subTone={change == null ? undefined : change >= 0 ? 'text-emerald-700' : 'text-rose-600'} icon="dollar" />
            <StatCard label="Penjualan bulan ini" value={formatIDR(m.revenue)} sub={`${m.count} transaksi`} icon="report" tone="blue" />
            <StatCard label="Biaya operasional" value={formatIDR(m.expenses)} sub="Bulan ini" icon="finance" tone="rose" />
            <StatCard label="Laba bersih bulan ini" value={formatIDR(m.netProfit)} sub={`Laba kotor ${formatIDR(m.grossProfit)}`} icon="investors" highlight />
          </div>

          <div className="grid grid-cols-1 gap-5 lg:grid-cols-12">
            <Card className="p-5 lg:col-span-8">
              <div className="flex flex-wrap items-start justify-between gap-2">
                <div>
                  <h3 className="text-base font-bold text-slate-900">Tren 7 hari terakhir</h3>
                  <p className="text-sm text-slate-600">Penjualan bersih (tanpa pajak) dan laba kotor per hari.</p>
                </div>
                <Badge tone="teal">{targetPct}% target bulan ini</Badge>
              </div>
              <div className="mt-3">
                <div className="flex justify-between text-sm text-slate-600">
                  <span>Terkumpul <span className="font-semibold text-slate-900 tabular">{formatIDR(m.revenue)}</span></span>
                  <span>Target <span className="font-semibold text-slate-900 tabular">{formatIDR(target)}</span></span>
                </div>
                <div className="mt-2 h-3 overflow-hidden rounded-full bg-slate-100" role="progressbar" aria-valuenow={targetPct} aria-valuemin={0} aria-valuemax={100} aria-label="Pencapaian target bulanan">
                  <div className="h-full rounded-full bg-brand-700 transition-all duration-500" style={{ width: `${targetPct}%` }} />
                </div>
              </div>
              <div className="mt-5 h-64">
                {ResponsiveContainer ? (
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={trend} margin={{ top: 8, right: 8, left: -8, bottom: 0 }}>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                      <XAxis dataKey="day" axisLine={false} tickLine={false} tick={{ fontSize: 12, fill: '#475569' }} />
                      <YAxis axisLine={false} tickLine={false} tick={{ fontSize: 12, fill: '#475569' }} tickFormatter={v => v >= 1e6 ? `${(v / 1e6).toFixed(1)}jt` : `${Math.round(v / 1000)}rb`} width={48} />
                      <Tooltip formatter={(v, n) => [formatIDR(v), n]} cursor={{ fill: '#f1f5f9' }} contentStyle={{ borderRadius: 12, borderColor: '#e2e8f0', fontSize: 13 }} />
                      <Legend wrapperStyle={{ fontSize: 13 }} iconType="circle" />
                      <Bar dataKey="omzet" fill="#1a4fe6" radius={[6, 6, 0, 0]} name="Penjualan" />
                      <Bar dataKey="laba" fill="#f8cb2e" radius={[6, 6, 0, 0]} name="Laba kotor" />
                    </BarChart>
                  </ResponsiveContainer>
                ) : <p className="text-sm text-slate-500">Grafik tidak dapat dimuat.</p>}
              </div>
            </Card>

            <Card className="p-5 lg:col-span-4">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <h3 className="text-base font-bold text-slate-900">Tim hari ini</h3>
                  <p className="text-sm text-slate-600">Kehadiran & kasir.</p>
                </div>
                <Btn variant="ghost" size="sm" onClick={() => go('attendance')}>Detail</Btn>
              </div>
              <div className={cx('mt-3 flex items-center gap-2 rounded-xl p-3 text-sm', openSession ? 'bg-emerald-50 text-emerald-900' : 'bg-slate-50 text-slate-700')}>
                <SvgIcon name={openSession ? 'unlock' : 'lock'} className="h-4 w-4 flex-shrink-0" />
                {openSession ? <span>Kasir dibuka {fmtTime(openSession.opened_at)} oleh {openSession.opened_by}</span> : <span>Kasir belum dibuka hari ini</span>}
              </div>
              <ul className="mt-3 space-y-2">
                {kasir.map(u => {
                  const rec = db.attendance.find(a => a.user_id === u.id && a.date === today);
                  const info = rec ? attendanceInfo(rec, db.business.work, u) : null;
                  return (
                    <li key={u.id} className="flex items-center justify-between gap-2">
                      <span className="flex min-w-0 items-center gap-2">
                        <Avatar name={u.name} className="h-8 w-8 text-xs" />
                        <span className="truncate text-sm font-medium text-slate-800">{u.name}</span>
                      </span>
                      {!rec ? <Badge tone="slate">Belum absen</Badge>
                        : rec.clock_out ? <Badge tone="blue">Pulang {fmtTime(rec.clock_out)}</Badge>
                        : info.lateMin ? <Badge tone="amber">Telat · {fmtTime(rec.clock_in)}</Badge>
                        : <Badge tone="green">Hadir · {fmtTime(rec.clock_in)}</Badge>}
                    </li>
                  );
                })}
              </ul>
            </Card>
          </div>

          <div className="grid grid-cols-1 gap-5 lg:grid-cols-2">
            <Card className="p-5">
              <h3 className="text-base font-bold text-slate-900">Produk terlaris bulan ini</h3>
              {topProducts.length === 0 ? <EmptyState icon="products" title="Belum ada penjualan bulan ini" /> : (
                <ol className="mt-3 space-y-2">
                  {topProducts.map((p, i) => (
                    <li key={p.name} className="flex items-center gap-3">
                      <span className="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-lg bg-slate-100 text-sm font-bold text-slate-700">{i + 1}</span>
                      <div className="min-w-0 flex-1">
                        <div className="flex justify-between gap-2 text-sm">
                          <span className="truncate font-medium text-slate-900">{p.name}</span>
                          <span className="font-semibold text-slate-900 tabular">{formatIDR(p.omzet)}</span>
                        </div>
                        <div className="mt-1 h-1.5 overflow-hidden rounded-full bg-slate-100">
                          <div className="h-full rounded-full bg-brand-600" style={{ width: `${Math.round(p.omzet / topProducts[0].omzet * 100)}%` }} />
                        </div>
                        <p className="mt-0.5 text-xs text-slate-500 tabular">{p.qty} terjual</p>
                      </div>
                    </li>
                  ))}
                </ol>
              )}
            </Card>

            <Card className="p-5">
              <div className="flex items-start justify-between gap-2">
                <h3 className="text-base font-bold text-slate-900">Pengeluaran bulan ini</h3>
                <Btn variant="ghost" size="sm" onClick={() => go('finance')}>Laba rugi</Btn>
              </div>
              {expenseByCat.length === 0 ? <EmptyState icon="finance" title="Belum ada pengeluaran" /> : (
                <>
                  <div className="mt-4 flex h-3 overflow-hidden rounded-full bg-slate-100" aria-hidden="true">
                    {expenseByCat.map(e => <div key={e.cat} className={e.color} style={{ width: `${e.pct}%` }} />)}
                  </div>
                  <ul className="mt-4 space-y-2">
                    {expenseByCat.map(e => (
                      <li key={e.cat} className="flex items-center justify-between gap-3 rounded-xl bg-slate-50 p-3 text-sm">
                        <span className="flex min-w-0 items-center gap-2">
                          <span className={cx('h-3 w-3 flex-shrink-0 rounded-full', e.color)} aria-hidden="true" />
                          <span className="truncate font-medium text-slate-800">{e.cat}</span>
                          <span className="text-slate-500 tabular">{e.pct}%</span>
                        </span>
                        <span className="font-semibold text-slate-900 tabular">{formatIDR(e.amt)}</span>
                      </li>
                    ))}
                  </ul>
                </>
              )}
            </Card>
          </div>
        </div>
      );
    }

      const [cartTab, setCartTab] = useState('sale');
      // Phones: the cart is a full-screen sheet opened from the bottom button
      const [cartSheet, setCartSheet] = useState(false);
      useEffect(() => {
        if (!cartSheet) return;
        const onKey = (e) => { if (e.key === 'Escape') setCartSheet(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [cartSheet]);
      const [showVoucher, setShowVoucher] = useState(false);
      const [reprint, setReprint] = useState(null);
      const boxBtn = 'inline-flex min-h-[36px] items-center gap-1.5 rounded-lg border border-brand-300 bg-brand-50 px-3 text-sm font-semibold text-brand-700 transition-colors hover:bg-brand-100';

      useEffect(() => { try { localStorage.setItem('kasirbosku_pos_view', view); } catch { /* per-device preference only */ } }, [view]);

      const promos = activePromos(db);
      // Best seller per category = most units sold in the last 30 days
      const bestSellers = useMemo(() => {
        const since = addDays(dateKey(), -29);
        const qty = {};
        allSalesOf(db).forEach(s => { if (isValidSale(s) && saleDay(s) >= since) s.items.forEach(it => { qty[it.id] = (qty[it.id] || 0) + it.qty; }); });
        const best = {};
        db.products.forEach(p => { const n = qty[p.id] || 0; if (n > 0 && (!best[p.category] || n > best[p.category].n)) best[p.category] = { id: p.id, n }; });
        return new Set(Object.values(best).map(b => b.id));
      }, [db.sales, db.offlineQueue, db.products]);
      const openSession = db.cashSessions.find(s => !s.closed_at);
      const selectedCustomer = db.customers.find(c => c.id === selectedCustomerId) || db.customers[0];
      const isWalkIn = !selectedCustomer || selectedCustomer.id === 'cust-1';

      const stockOf = (id) => db.products.find(p => p.id === id)?.stock ?? 0;
      const qtyInCart = (id) => cart.find(c => c.id === id)?.qty || 0;

      const today = dateKey();
      const todaySales = allSalesOf(db).filter(s => isValidSale(s) && saleDay(s) === today);
      const todayRevenue = todaySales.reduce((a, s) => a + s.total, 0);
      const recentSales = allSalesOf(db).sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 20);

      const q = searchQuery.trim().toLowerCase();
      const filteredProducts = db.products.filter(p =>
        (selectedCategory === 'Semua' || p.category === selectedCategory) &&
        (!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q)));

      const addToCart = (product) => {
        if (qtyInCart(product.id) >= product.stock) {
          notify(product.stock <= 0 ? `Stok ${product.name} habis.` : `Stok ${product.name} hanya ${product.stock}.`, 'warn');
          return;
        }
        const info = priceInfo(product, promos);
        setCart(prev => prev.some(c => c.id === product.id)
          ? prev.map(c => c.id === product.id ? { ...c, qty: c.qty + 1 } : c)
          : [...prev, { id: product.id, name: product.name, qty: 1, sell_price: info.price, original_price: info.original }]);
      };

      const updateQty = (id, delta) => {
        if (delta > 0 && qtyInCart(id) >= stockOf(id)) return notify('Jumlah melebihi stok tersedia.', 'warn');
        setCart(prev => prev.map(c => c.id === id ? { ...c, qty: c.qty + delta } : c).filter(c => c.qty > 0));
      };

      // ---------- Totals: subtotal → manual discount → voucher → tax ----------
      const subtotal = cart.reduce((sum, it) => sum + it.sell_price * it.qty, 0);
      const discountInvalid = discountType === 'percent' ? discountValue > 100 : discountValue > subtotal;
      const computedDiscount = discountType === 'percent'
        ? Math.round(subtotal * Math.min(100, Math.max(0, discountValue)) / 100)
        : Math.min(subtotal, Math.max(0, discountValue));
      const afterDiscount = Math.max(0, subtotal - computedDiscount);
      const couponValid = coupon && coupon.active && afterDiscount >= coupon.min_spend;
      const couponDiscount = couponValid ? (coupon.type === 'percent' ? Math.round(afterDiscount * coupon.val / 100) : Math.min(coupon.val, afterDiscount)) : 0;
      const afterCoupon = afterDiscount - couponDiscount;
      const taxRate = db.business.tax_active ? (db.business.tax_rate || 0) : 0;
      const taxAmount = Math.round(afterCoupon * taxRate / 100);
      const grandTotal = afterCoupon + taxAmount;

      useEffect(() => { if (paymentModalOpen) setCashPaid(grandTotal); }, [grandTotal, paymentModalOpen]);

      const cashShort = paymentMethod === 'cash' && cashPaid < grandTotal;
      const quickCash = [...new Set([grandTotal, Math.ceil(grandTotal / 50000) * 50000, Math.ceil(grandTotal / 100000) * 100000])].filter(v => v > 0);

      const applyCoupon = () => {
        const code = couponInput.trim().toUpperCase();
        const found = db.coupons.find(c => c.code === code);
        if (!found || !found.active) return setCouponError('Kode tidak ditemukan atau sudah tidak aktif.');
        if (afterDiscount < found.min_spend) return setCouponError(`Minimal belanja ${formatIDR(found.min_spend)} untuk kode ini.`);
        setCoupon(found); setCouponError(''); setCouponInput('');
      };
      const removeCoupon = () => { setCoupon(null); setCouponError(''); };

      const resetCheckout = () => {
        setCart([]); setDiscountValue(0); setShowDiscount(false); setShowVoucher(false); setCoupon(null); setCouponInput(''); setCouponError(''); setSelectedCustomerId('cust-1');
      };

      const commitSale = (sale, { asDebt } = {}) => {
        setDb(prev => {
          const products = prev.products.map(p => {
            const it = cart.find(c => c.id === p.id);
            return it ? { ...p, stock: Math.max(0, p.stock - it.qty) } : p;
          });
          const customers = prev.customers.map(c => {
            if (c.id !== selectedCustomerId || c.id === 'cust-1') return c;
            return asDebt ? { ...c, debt: (c.debt || 0) + sale.total, visits: c.visits + 1 } : { ...c, total_spent: c.total_spent + sale.total, visits: c.visits + 1 };
          });
          return isOfflineMode
            ? { ...prev, products, customers, offlineQueue: [sale, ...prev.offlineQueue] }
            : { ...prev, products, customers, sales: [sale, ...prev.sales] };
        });
        setReceipt(sale);
        setCartSheet(false);
        resetCheckout();
      };

      const buildSale = (overrides) => ({
        id: generateId('TRX'),
        receipt_no: newReceiptNo(),
        date: new Date().toISOString(),
        total: grandTotal, subtotal, discount: computedDiscount + couponDiscount, tax: taxAmount,
        coupon_code: couponValid ? coupon.code : null, coupon_discount: couponDiscount,
        customer_name: selectedCustomer?.name || 'Pelanggan Umum', customer_id: selectedCustomer?.id || 'cust-1',
        status: 'completed',
        cashier: currentUser.name, cashier_id: currentUser.id,
        session_id: openSession?.id || null,
        sync_status: isOfflineMode ? 'pending_sync' : 'synced',
        items: cart.map(({ id, name, qty, sell_price, original_price }) => ({ id, name, qty, sell_price, original_price })),
        ...overrides
      });

      const handleBayarNanti = () => {
        if (!cart.length || isWalkIn) return;
        const sale = buildSale({ payment_method: 'bayar_nanti', status: 'piutang_unpaid' });
        commitSale(sale, { asDebt: true });
        notify(`Kasbon ${formatIDR(sale.total)} dicatat ke ${sale.customer_name}.`);
      };

      const openPayment = () => {
        if (!cart.length || discountInvalid) return;
        // Payments go into the cash drawer, so the drawer must be opened (with starting cash) first
        if (!openSession) { setOpenAfterSession(true); setSessionModal('open'); return; }
        setPaymentModalOpen(true);
      };

      const finalizePayment = () => {
        if (cashShort) return;
        const sale = buildSale({ payment_method: paymentMethod, cash_paid: paymentMethod === 'cash' ? cashPaid : undefined });
        commitSale(sale);
        setPaymentModalOpen(false);
        notify(isOfflineMode ? `Disimpan offline: ${sale.receipt_no}` : `Pembayaran berhasil: ${sale.receipt_no}`, isOfflineMode ? 'warn' : 'success');
      };

      const handleSessionOpened = () => {
        setSessionModal(null);
        if (openAfterSession) { setOpenAfterSession(false); setPaymentModalOpen(true); }
      };

      const panelHeight = openSession ? 'md:h-[calc(100vh-8rem)] md:min-h-[520px]' : 'md:h-[calc(100vh-13rem)] md:min-h-[520px]';
      const itemCount = cart.reduce((a, c) => a + c.qty, 0);

      const renderItem = (prod) => {
        const inCart = qtyInCart(prod.id);
        const out = prod.stock <= 0;
        const low = !out && prod.stock <= prod.min_stock;
        const info = priceInfo(prod, promos);
        const controls = <MenuControls name={prod.name} inCart={inCart} disabled={out || inCart >= prod.stock} onAdd={() => addToCart(prod)} onRemove={() => updateQty(prod.id, -1)} />;
        const isBest = bestSellers.has(prod.id);
        const addLabel = `Tambah ${prod.name}${isBest ? ' (terlaris)' : ''}, ${formatIDR(info.price)}${info.discounted ? `, diskon ${info.pct}%` : ''}, stok ${prod.stock}`;

        if (view === 'list') {
          return (
            <li key={prod.id} className={cx('flex items-center gap-3 rounded-xl border bg-white p-2 transition-colors', inCart ? 'border-brand-500 bg-brand-50/40' : 'border-slate-200', out && 'opacity-60')}>
              <button type="button" onClick={() => addToCart(prod)} disabled={out} aria-label={addLabel} className={cx('flex min-w-0 flex-1 items-center gap-3 rounded-lg text-left disabled:cursor-not-allowed', focusRing)}>
                <ProductThumb product={prod} className="h-12 w-12 flex-shrink-0 rounded-lg" textClass="text-sm" />
                <span className="min-w-0">
                  <span className="flex items-center gap-1 text-sm font-semibold text-slate-900">{isBest && <StarIcon className="h-4 w-4 flex-shrink-0 text-sun-500" />}<span className="truncate">{prod.name}</span></span>
                  <span className="block text-xs text-slate-500">{prod.sku} · {out ? <span className="font-semibold text-rose-600">Stok habis</span> : low ? <span className="font-semibold text-amber-700">Sisa {prod.stock}</span> : `Stok ${prod.stock}`}{info.discounted && <span className="ml-1 font-semibold text-rose-600">· −{info.pct}%</span>}</span>
                </span>
              </button>
              <PriceTag info={info} className="items-end text-right" />
              {controls}
            </li>
          );
        }

        return (
          <li key={prod.id}>
            <div className={cx('flex h-full flex-col rounded-2xl border bg-white p-2 transition hover:shadow-md', inCart ? 'border-brand-500 ring-1 ring-brand-500' : 'border-slate-200', out && 'opacity-60')}>
              <button type="button" onClick={() => addToCart(prod)} disabled={out} aria-label={addLabel} className={cx('group block w-full rounded-xl text-left disabled:cursor-not-allowed', focusRing)}>
                <div className="relative aspect-square w-full overflow-hidden rounded-xl">
                  <ProductThumb product={prod} textClass="text-3xl" className="h-full w-full transition duration-300 group-hover:scale-105 motion-reduce:transform-none" />
                  {info.discounted && <span className="absolute left-2 top-2 rounded-md bg-rose-600 px-1.5 py-0.5 text-xs font-bold text-white">−{info.pct}%</span>}
                  {out && <span className="absolute inset-0 flex items-center justify-center bg-white/75 text-sm font-bold text-rose-700">Stok habis</span>}
                  {low && <span className="absolute right-2 top-2 rounded-md bg-amber-100 px-1.5 py-0.5 text-xs font-semibold text-amber-900">Sisa {prod.stock}</span>}
                  {isBest && <span className="absolute bottom-2 left-2 inline-flex items-center gap-1 rounded-md bg-sun-400 px-1.5 py-0.5 text-xs font-bold text-slate-900 shadow-sm"><StarIcon className="h-3.5 w-3.5" />Terlaris</span>}
                </div>
                <p className="mt-2 line-clamp-2 px-1 text-sm font-semibold leading-5 text-slate-900">{prod.name}</p>
              </button>
              {/* Wraps so the price is never truncated when the minus control appears */}
              <div className="mt-auto flex flex-wrap items-end justify-between gap-x-1 gap-y-1.5 px-1 pt-2">
                <PriceTag info={info} className="flex-shrink-0" />
                <div className="ml-auto">{controls}</div>
              </div>
            </div>
          </li>
        );
      };

      return (
        <div className="space-y-4">
          {isOfflineMode && (
            <div className="flex items-start gap-3 rounded-2xl border border-amber-300 bg-amber-50 p-3.5 text-sm text-amber-900">
              <SvgIcon name="wifiOff" className="mt-0.5 h-5 w-5 flex-shrink-0" />
              <p><span className="font-semibold">Mode offline.</span> Transaksi disimpan di perangkat dan disinkronkan saat kembali online.</p>
            </div>
          )}

          {/* Only the "not open yet" reminder sits above the catalog; once open, the details live in the cart panel's "Kas & Riwayat" tab */}
          {!openSession && (
            <div className="flex flex-col gap-3 rounded-2xl border border-amber-300 bg-amber-50 p-3.5 sm:flex-row sm:items-center sm:justify-between">
              <div className="flex items-start gap-3">
                <span className="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-xl bg-amber-100 text-amber-800"><SvgIcon name="lock" className="h-5 w-5" /></span>
                <div className="text-sm">
                  <p className="font-semibold text-amber-900">Kasir belum dibuka</p>
                  <p className="text-amber-800">Catat modal awal di laci sebelum menerima pembayaran.</p>
                </div>
              </div>
              <Btn icon="unlock" onClick={() => { setOpenAfterSession(false); setSessionModal('open'); }}>Buka kasir</Btn>
            </div>
          )}

          <div className="grid grid-cols-1 items-start gap-4 md:grid-cols-12 lg:gap-5">
            {/* CATALOG */}
            <Card aria-label="Katalog produk" className={cx('flex flex-col p-4 sm:p-5 md:col-span-7 xl:col-span-8', panelHeight)}>
              <div className="relative">
                <label htmlFor="pos-search" className="sr-only">Cari produk</label>
                <SvgIcon name="search" className="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400" />
                <input id="pos-search" type="search" placeholder="Cari nama menu atau kode SKU…" value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)} className={cx(inputCls, 'bg-slate-50 pl-10 pr-10')} />
                {searchQuery && <IconBtn icon="x" label="Hapus pencarian" iconClass="w-4 h-4" onClick={() => setSearchQuery('')} className="absolute right-0 top-0 h-11 w-11" />}
              </div>

              <div className="mt-3 flex items-center gap-2">
                <div className="-mx-1 flex min-w-0 flex-1 gap-2 overflow-x-auto px-1 pb-1 scrollbar-none" role="group" aria-label="Filter kategori">
                  {db.categories.map(cat => {
                    const count = cat === 'Semua' ? db.products.length : db.products.filter(p => p.category === cat).length;
                    const active = selectedCategory === cat;
                    return (
                      <button key={cat} type="button" aria-pressed={active} onClick={() => setSelectedCategory(cat)}
                        className={cx('inline-flex min-h-[40px] flex-shrink-0 items-center gap-1.5 rounded-xl border px-4 text-sm font-semibold transition-colors', focusRing,
                          active ? 'border-brand-700 bg-brand-700 text-white' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50')}>
                        {cat}
                        <span className={cx('text-xs tabular', active ? 'text-brand-100' : 'text-slate-500')}>{count}</span>
                      </button>
                    );
                  })}
                </div>
                <div role="radiogroup" aria-label="Tampilan menu" className="flex flex-shrink-0 rounded-xl border border-slate-200 bg-slate-50 p-0.5">
                  {[['grid', 'grid', 'Tampilan kotak'], ['list', 'list', 'Tampilan daftar']].map(([v, icon, label]) => (
                    <button key={v} type="button" role="radio" aria-checked={view === v} aria-label={label} title={label} onClick={() => setView(v)}
                      className={cx('flex h-9 w-9 items-center justify-center rounded-lg transition-colors', focusRing, view === v ? 'bg-brand-700 text-white shadow-sm' : 'text-slate-500 hover:text-slate-900')}>
                      <SvgIcon name={icon} className="h-4 w-4" />
                    </button>
                  ))}
                </div>
              </div>

              <div className="mt-3 flex-1 md:overflow-y-auto md:pr-1">
                {filteredProducts.length === 0 ? (
                  <EmptyState icon="search" title="Produk tidak ditemukan"
                    desc={q ? `Tidak ada hasil untuk “${searchQuery}”.` : 'Belum ada produk di kategori ini.'}
                    action={<Btn variant="secondary" size="sm" onClick={() => { setSearchQuery(''); setSelectedCategory('Semua'); }}>Tampilkan semua</Btn>} />
                ) : (
                  <ul className={view === 'list' ? 'space-y-2' : 'grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4'}>
                    {filteredProducts.map(renderItem)}
                  </ul>
                )}
              </div>
            </Card>

            {/* CART */}
            <Card id="cart-panel" aria-label="Panel kasir" role={cartSheet ? 'dialog' : undefined} aria-modal={cartSheet || undefined}
              className={cx('flex-col p-4 sm:p-5 md:sticky md:top-0 md:col-span-5 md:flex xl:col-span-4', panelHeight,
                cartSheet ? 'flex max-md:fixed max-md:inset-0 max-md:z-50 max-md:h-full max-md:rounded-none max-md:border-0 max-md:pb-[max(1rem,env(safe-area-inset-bottom))] max-md:pt-[max(1rem,env(safe-area-inset-top))] animate-pop-in md:animate-none' : 'hidden')}>
              <div className="mb-3 flex items-center justify-between md:hidden">
                <p className="text-base font-bold text-slate-900">Keranjang</p>
                <IconBtn icon="x" label="Tutup keranjang" onClick={() => setCartSheet(false)} />
              </div>
              <div className="flex items-center gap-2">
                <div role="tablist" aria-label="Panel kasir" className="grid flex-1 grid-cols-2 rounded-xl bg-slate-100 p-1">
                  {[['sale', 'Penjualan', itemCount], ['recent', 'Kas & Riwayat', 0]].map(([v, label, count]) => (
                    <button key={v} type="button" role="tab" aria-selected={cartTab === v} onClick={() => setCartTab(v)}
                      className={cx('inline-flex min-h-[38px] items-center justify-center gap-1.5 rounded-lg px-1.5 text-sm font-semibold transition-colors', focusRing,
                        cartTab === v ? 'bg-white text-brand-800 shadow-sm' : 'text-slate-600 hover:text-slate-900')}>
                      <span className="whitespace-nowrap">{label}</span>
                      {count > 0 && <span className="rounded-full bg-sun-400 px-1.5 text-xs font-bold text-slate-900 tabular">{count}</span>}
                    </button>
                  ))}
                </div>
                {cartTab === 'sale' && cart.length > 0 && (confirmClear ? (
                  <div className="flex gap-1">
                    <Btn variant="ghost" size="sm" onClick={() => setConfirmClear(false)}>Batal</Btn>
                    <Btn variant="danger" size="sm" onClick={() => { resetCheckout(); setConfirmClear(false); }}>Kosongkan</Btn>
                  </div>
                ) : <IconBtn icon="trash" label="Kosongkan keranjang" iconClass="h-4 w-4" onClick={() => setConfirmClear(true)} className="h-10 w-10 text-slate-500 hover:bg-rose-50 hover:text-rose-600" />)}
              </div>

              {cartTab === 'recent' ? (
                <div className="mt-3 flex min-h-0 flex-1 flex-col">
                  {openSession && (
                    <div className="mb-3 rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm">
                      <div className="flex items-start justify-between gap-2">
                        <p className="flex items-center gap-1.5 font-semibold text-slate-900"><SvgIcon name="unlock" className="h-4 w-4 text-emerald-700" />Kasir buka {fmtTime(openSession.opened_at)} · {openSession.opened_by}</p>
                        <Btn variant="secondary" size="sm" icon="lock" onClick={() => setSessionModal('close')}>Tutup kasir</Btn>
                      </div>
                      <dl className="mt-2 grid grid-cols-3 gap-2 text-xs">
                        <div><dt className="text-slate-500">Modal</dt><dd className="font-semibold tabular text-slate-900">{formatIDR(openSession.opening_cash)}</dd></div>
                        <div><dt className="text-slate-500">Uang di laci</dt><dd className="font-semibold tabular text-slate-900">{formatIDR(expectedCash(db, openSession))}</dd></div>
                        <div><dt className="text-slate-500">Hari ini</dt><dd className="font-semibold tabular text-slate-900">{todaySales.length} nota · {formatIDR(todayRevenue)}</dd></div>
                      </dl>
                    </div>
                  )}
                  <p className="text-xs text-slate-500">{isOwner ? '20 transaksi terakhir di toko.' : '20 transaksi terakhir yang Anda layani.'} Transaksi lama ada di Laporan Penjualan → Detail.</p>
                  <div className="mt-2 flex-1 overflow-y-auto md:pr-1">
                    {recentSales.length === 0 ? <EmptyState icon="receipt" title="Belum ada transaksi" /> : (
                      <ul className="divide-y divide-slate-100">
                        {recentSales.map(s => (
                          <li key={s.id} className="flex items-center justify-between gap-2 py-2.5">
                            <div className="min-w-0">
                              <p className={cx('truncate font-mono text-xs font-semibold text-slate-900', s.status === 'void' && 'line-through text-slate-400')}>{s.receipt_no}</p>
                              <p className="truncate text-xs text-slate-500">
                                {saleDay(s) === today ? fmtTime(s.date) : fmtDateTime(s.date)} · {PAYMENT_LABELS[s.payment_method]} · {s.customer_name} · {s.cashier_id === currentUser.id ? 'Anda' : s.cashier}
                              </p>
                              {s.status === 'void' && <Badge tone="rose" className="mt-0.5">Dibatalkan</Badge>}
                            </div>
                            <div className="flex flex-shrink-0 items-center gap-2">
                              <span className="text-sm font-bold text-slate-900 tabular">{formatIDR(s.total)}</span>
                              <Btn variant="secondary" size="sm" icon="printer" onClick={() => setReprint(s)} aria-label={`Cetak ulang struk ${s.receipt_no}`}>Cetak</Btn>
                            </div>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                </div>
              ) : <>
              <div className="mt-3 flex items-center gap-2">
                <label htmlFor="pos-customer" className="sr-only">Pelanggan</label>
                <select id="pos-customer" value={selectedCustomerId} onChange={(e) => setSelectedCustomerId(e.target.value)} className={cx(inputCls, 'h-11 flex-1 cursor-pointer')}>
                  {db.customers.map(c => <option key={c.id} value={c.id}>{c.name}{c.debt > 0 ? ` · kasbon ${formatIDR(c.debt)}` : ''}</option>)}
                </select>
                <IconBtn icon="userPlus" label="Tambah pelanggan baru" onClick={() => setQuickCustomer({ name: '', phone: '' })} className="border border-slate-300" />
              </div>

              <div className="mt-3 min-h-[120px] flex-1 overflow-y-auto md:pr-1">
                {cart.length === 0 ? <EmptyState icon="cart" title="Keranjang masih kosong" desc="Ketuk menu di katalog untuk menambahkannya." /> : (
                  <ul className="space-y-2">
                    {cart.map(item => {
                      const product = db.products.find(p => p.id === item.id) || item;
                      return (
                        <li key={item.id} className="flex gap-3 rounded-xl border border-slate-200 p-2">
                          <ProductThumb product={product} className="h-12 w-12 flex-shrink-0 rounded-lg" textClass="text-sm" />
                          <div className="min-w-0 flex-1">
                            <div className="flex items-start justify-between gap-1">
                              <div className="min-w-0">
                                <p className="truncate text-sm font-semibold text-slate-900">{item.name}</p>
                                <p className="text-xs text-slate-500 tabular">
                                  {item.original_price > item.sell_price && <span className="mr-1 line-through">{formatIDR(item.original_price)}</span>}

                            </div>

                              <QtyStepper qty={item.qty} name={item.name} onDec={() => updateQty(item.id, -1)} onInc={() => updateQty(item.id, 1)} incDisabled={item.qty >= stockOf(item.id)} />
                              <span className="text-sm font-bold text-slate-900 tabular">{formatIDR(item.sell_price * item.qty)}</span>
                            </div>
                          </div>

              {/* Discount and voucher stay tucked away as two boxed buttons until needed */}

                      {!showVoucher && !couponValid && (

                      )}
                    </div>
                  )}
                  {showDiscount && (
                    <div className="flex items-center gap-2">
                      <SegmentedControl label="Jenis diskon" value={discountType} onChange={(v) => { setDiscountType(v); setDiscountValue(0); }}
                        options={[{ value: 'percent', label: '%' }, { value: 'fixed', label: 'Rp' }]} />
                      <div className="relative min-w-0 flex-1">
                        {discountType === 'percent' ? <>
                          <input type="number" inputMode="decimal" min="0" max="100" aria-label="Diskon persen" placeholder="Diskon" autoFocus value={discountValue || ''}
                            onChange={(e) => setDiscountValue(Math.max(0, parseFloat(e.target.value) || 0))}

                  {discountInvalid && <p className="text-xs font-medium text-rose-600" role="alert">{discountType === 'percent' ? 'Maksimal 100%.' : 'Diskon melebihi subtotal.'}</p>}
                  {showVoucher && !couponValid && (
                    <form className="flex items-center gap-2" onSubmit={(e) => { e.preventDefault(); applyCoupon(); }}>
                      <label htmlFor="voucher" className="sr-only">Kode voucher atau promo</label>
                      <input id="voucher" autoFocus value={couponInput} onChange={e => { setCouponInput(e.target.value.toUpperCase()); setCouponError(''); }} placeholder="Kode voucher"

                    </form>

                  {coupon && !couponValid && <p className="text-xs font-medium text-amber-700">Voucher {coupon.code} belum berlaku: belanja minimal {formatIDR(coupon.min_spend)}.</p>}
                </div>
              )}

              <dl className={cx('space-y-1.5 text-sm', cart.length > 0 ? 'mt-2' : 'mt-3 border-t border-slate-200 pt-3')}>
                <div className="flex justify-between text-slate-600"><dt>Subtotal</dt><dd className="font-medium text-slate-900 tabular">{formatIDR(subtotal)}</dd></div>
                {computedDiscount > 0 && <div className="flex justify-between text-emerald-700"><dt>Diskon{discountType === 'percent' ? ` (${discountValue}%)` : ''}</dt><dd className="font-medium tabular">− {formatIDR(computedDiscount)}</dd></div>}
                {couponValid && (
                  <div className="flex items-center justify-between gap-2 rounded-lg bg-emerald-50 px-2 py-1 text-emerald-800">
                    <dt className="flex items-center gap-1.5"><SvgIcon name="receipt" className="h-4 w-4" />Voucher <span className="font-mono font-bold">{coupon.code}</span>
                      <button type="button" onClick={() => { removeCoupon(); setShowVoucher(false); }} aria-label={`Hapus voucher ${coupon.code}`} className={cx('rounded p-0.5 hover:bg-emerald-100', focusRing)}><SvgIcon name="x" className="h-3.5 w-3.5" /></button>
                    </dt>
                    <dd className="font-semibold tabular">− {formatIDR(couponDiscount)}</dd>

                {taxRate > 0 && <div className="flex justify-between text-slate-600"><dt>Pajak ({taxRate}%)</dt><dd className="font-medium text-slate-900 tabular">{formatIDR(taxAmount)}</dd></div>}
                <div className="flex items-baseline justify-between border-t border-dashed border-slate-300 pt-2">
                  <dt className="text-base font-bold text-slate-900">Total</dt>
                  <dd className="text-xl font-bold text-brand-800 tabular">{formatIDR(grandTotal)}</dd>
                </div>
              </dl>

              <div className="mt-3 flex gap-2">
                <Btn variant="secondary" className="flex-1" disabled={!cart.length || isWalkIn || discountInvalid} onClick={handleBayarNanti} aria-describedby={isWalkIn ? 'kasbon-hint' : undefined}>Bayar Nanti</Btn>
                <Btn variant="success" className="flex-[2]" disabled={!cart.length || discountInvalid} onClick={openPayment}>Bayar {formatIDR(grandTotal)}</Btn>
              </div>
              {isWalkIn && cart.length > 0 && <p id="kasbon-hint" className="mt-2 text-xs text-slate-500">Kasbon hanya untuk pelanggan terdaftar.</p>}
              </>}
            </Card>
          </div>

          {/* Pinned just above the bottom menu; the spacer keeps the last products clear of it */}
          <div className="h-16 md:hidden" aria-hidden="true" />
          <div className="fixed inset-x-0 bottom-[calc(56px+env(safe-area-inset-bottom))] z-20 border-t border-slate-200 bg-white/95 p-3 backdrop-blur md:hidden">
            <Btn className="w-full" icon="cart" onClick={() => setCartSheet(true)}>
              {cart.length ? `Lihat keranjang · ${itemCount} item · ${formatIDR(grandTotal)}` : 'Lihat keranjang · Kas & Riwayat'}
            </Btn>
          </div>

          {paymentModalOpen && (
            <Modal title="Pembayaran" desc={`Total tagihan ${formatIDR(grandTotal)}`} onClose={() => setPaymentModalOpen(false)}
              footer={<>
                <Btn variant="secondary" onClick={() => setPaymentModalOpen(false)}>Kembali</Btn>
                <Btn className="flex-1" disabled={cashShort} onClick={finalizePayment} icon="check">Konfirmasi {formatIDR(grandTotal)}</Btn>
              </>}>
              <div role="radiogroup" aria-label="Metode pembayaran" className="grid grid-cols-3 gap-2">
                {[{ key: 'qris', label: 'QRIS', icon: 'qr' }, { key: 'cash', label: 'Tunai', icon: 'cash' }, { key: 'transfer', label: 'Transfer', icon: 'bank' }].map(m => (
                  <button key={m.key} type="button" role="radio" aria-checked={paymentMethod === m.key} onClick={() => setPaymentMethod(m.key)}
                    className={cx('flex min-h-[72px] flex-col items-center justify-center gap-1.5 rounded-xl border-2 text-sm font-semibold transition-colors', focusRing,
                      paymentMethod === m.key ? 'border-brand-700 bg-brand-50 text-brand-900' : 'border-slate-200 text-slate-700 hover:bg-slate-50')}>
                    <SvgIcon name={m.icon} className="h-6 w-6" />{m.label}
                  </button>
                ))}
              </div>

              {paymentMethod === 'qris' && (
                <div className="mt-4 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-center">
                  {db.business.qris_image ? (
                    <div className="mx-auto w-52 rounded-2xl border border-slate-200 bg-white p-2.5">
                      <img src={db.business.qris_image} alt={`Kode QRIS ${db.business.name}`} className="w-full object-contain" />
                    </div>
                  ) : (
                    <div className="mx-auto flex h-48 w-48 flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-300 bg-white p-4 text-slate-500">
                      <SvgIcon name="qr" className="h-10 w-10" />
                      <p className="mt-2 text-sm font-semibold">QRIS belum diunggah</p>
                      <p className="text-xs">Bos dapat mengunggah di Pengaturan Toko.</p>
                    </div>
                  )}
                  <p className="mt-3 text-sm font-semibold text-slate-900">{db.business.name}</p>
                  {db.business.qris_nmid && <p className="text-xs text-slate-500">NMID {db.business.qris_nmid}</p>}
                  <p className="mt-2 text-sm text-slate-600">Konfirmasi setelah pembayaran masuk di aplikasi bank/e-wallet toko.</p>
                </div>
              )}

              {paymentMethod === 'cash' && (
                <div className="mt-4 space-y-3">
                  <Field label="Uang diterima" error={cashShort ? `Kurang ${formatIDR(grandTotal - cashPaid)}` : null}>
                    <MoneyInput value={cashPaid} onChange={setCashPaid} className="text-lg" />
                  </Field>
                  <div className="flex flex-wrap gap-2">
                    {quickCash.map((v, i) => { const on = cashPaid === v; return <Btn key={v} variant={on ? 'primary' : 'secondary'} size="sm" icon={on ? 'check' : undefined} aria-pressed={on} onClick={() => setCashPaid(v)} className="tabular">{i === 0 ? 'Uang pas' : formatIDR(v)}</Btn>; })}
                  </div>
                  <div className="flex items-center justify-between rounded-xl bg-emerald-50 p-3">
                    <span className="text-sm font-medium text-emerald-900">Kembalian</span>
                    <span className="text-lg font-bold text-emerald-800 tabular">{formatIDR(Math.max(0, cashPaid - grandTotal))}</span>
                  </div>
                </div>
              )}

              {paymentMethod === 'transfer' && (
                db.business.bank_accounts.length === 0 ? <p className="mt-4 text-sm text-slate-600">Belum ada rekening. Tambahkan di Pengaturan Toko.</p> : (
                  <ul className="mt-4 space-y-2">
                    {db.business.bank_accounts.map(b => (
                      <li key={b.id} className="flex items-center justify-between gap-3 rounded-xl border border-slate-200 p-3">
                        <div><p className="text-sm font-semibold text-slate-900">{b.bank}</p><p className="text-xs text-slate-500">a.n. {b.owner}</p></div>
                        <span className="font-mono text-sm font-bold text-brand-800">{b.number}</span>
                      </li>
                    ))}
                  </ul>
                )
              )}
            </Modal>
          )}

          {receipt && <ReceiptModal sale={receipt} business={db.business} customers={db.customers} onClose={() => setReceipt(null)} />}
          {reprint && <ReceiptModal sale={reprint} business={db.business} customers={db.customers} title={`Cetak ulang ${reprint.receipt_no}`} onClose={() => setReprint(null)} />}

          {sessionModal === 'open' && (
            <OpenSessionModal db={db} setDb={setDb} notify={notify} currentUser={currentUser}
              onClose={() => { setSessionModal(null); setOpenAfterSession(false); }} onOpened={handleSessionOpened} continuing={openAfterSession} />
          )}
          {sessionModal === 'close' && openSession && (
            <CloseSessionModal db={db} setDb={setDb} notify={notify} currentUser={currentUser} session={openSession} onClose={() => setSessionModal(null)} />
          )}

          {quickCustomer && (
            <Modal title="Pelanggan baru" onClose={() => setQuickCustomer(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setQuickCustomer(null)}>Batal</Btn>
                <Btn disabled={!quickCustomer.name.trim() || !!waError(quickCustomer.phone)} onClick={() => {
                  const c = { id: 'cust-' + Date.now(), name: quickCustomer.name.trim(), phone: quickCustomer.phone || '-', total_spent: 0, debt: 0, visits: 0 };
                  setDb(prev => ({ ...prev, customers: [...prev.customers, c] }));
                  setSelectedCustomerId(c.id);
                  setQuickCustomer(null);
                  notify(`${c.name} ditambahkan dan dipilih.`);
                }}>Simpan & pilih</Btn></>}>
              <div className="space-y-4">
                <Field label="Nama"><input autoFocus value={quickCustomer.name} onChange={e => setQuickCustomer({ ...quickCustomer, name: e.target.value })} className={inputCls} /></Field>
                <Field label="Nomor WhatsApp" error={waError(quickCustomer.phone)} hint="Opsional. Angka saja, diawali 08."><WaInput value={quickCustomer.phone} onChange={v => setQuickCustomer({ ...quickCustomer, phone: v })} /></Field>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    function OpenSessionModal({ db, setDb, notify, currentUser, onClose, onOpened, continuing }) {
      const last = [...db.cashSessions].reverse().find(s => s.closed_at);
      const [amount, setAmount] = useState(last ? last.counted_cash : 200000);
      const open = () => {
        const s = { id: generateId('SES'), opened_by: currentUser.name, opened_at: new Date().toISOString(), opening_cash: amount };
        setDb(prev => ({ ...prev, cashSessions: [...prev.cashSessions, s] }));
        notify(`Kasir dibuka dengan modal ${formatIDR(amount)}.`);
        onOpened();
      };
      return (
        <Modal title="Buka kasir" desc={continuing ? 'Buka kasir dulu sebelum menerima pembayaran.' : 'Hitung uang di laci sebelum mulai berjualan.'} onClose={onClose}
          footer={<><span className="flex-1" /><Btn variant="secondary" onClick={onClose}>Batal</Btn><Btn icon="unlock" onClick={open}>{continuing ? 'Buka & lanjut bayar' : 'Buka kasir'}</Btn></>}>
          <Field label="Modal awal di laci" hint={last ? `Uang terhitung saat tutup terakhir: ${formatIDR(last.counted_cash)}` : 'Uang kembalian yang tersedia di laci.'}>
            <MoneyInput autoFocus value={amount} onChange={setAmount} className="text-lg" />
          </Field>
        </Modal>
      );
    }

    function CloseSessionModal({ db, setDb, notify, currentUser, session, onClose }) {
      const expected = expectedCash(db, session);
      const [counted, setCounted] = useState(expected);
      const [note, setNote] = useState('');
      const diff = counted - expected;
      const sessionSales = allSalesOf(db).filter(s => isValidSale(s) && s.session_id === session.id);
      const byMethod = ['cash', 'qris', 'transfer', 'bayar_nanti'].map(m => ({ m, total: sessionSales.filter(s => s.payment_method === m).reduce((a, s) => a + s.total, 0) }));
      const needsNote = diff !== 0 && !note.trim();

      const close = () => {
        if (needsNote) return;
        setDb(prev => ({ ...prev, cashSessions: prev.cashSessions.map(s => s.id === session.id ? { ...s, closed_at: new Date().toISOString(), closed_by: currentUser.name, expected_cash: expected, counted_cash: counted, difference: diff, note, sales_count: sessionSales.length } : s) }));
        notify(diff === 0 ? 'Kasir ditutup. Uang di laci sesuai.' : `Kasir ditutup dengan selisih ${diff > 0 ? '+' : '−'}${formatIDR(Math.abs(diff))}.`, diff === 0 ? 'success' : 'warn');
        onClose();
      };

      return (
        <Modal title="Tutup kasir" desc={`Dibuka ${fmtTime(session.opened_at)} oleh ${session.opened_by} · ${sessionSales.length} transaksi`} onClose={onClose}
          footer={<><span className="flex-1" /><Btn variant="secondary" onClick={onClose}>Batal</Btn><Btn icon="lock" onClick={close} disabled={needsNote}>Tutup kasir</Btn></>}>
          <dl className="space-y-1.5 text-sm">
            {byMethod.map(({ m, total }) => (
              <div key={m} className="flex justify-between text-slate-600"><dt>Penjualan {PAYMENT_LABELS[m]}</dt><dd className="font-medium text-slate-900 tabular">{formatIDR(total)}</dd></div>
            ))}
            <div className="flex justify-between border-t border-slate-200 pt-2 text-slate-600"><dt>Modal awal</dt><dd className="tabular">{formatIDR(session.opening_cash)}</dd></div>
            <div className="flex justify-between font-semibold text-slate-900"><dt>Seharusnya di laci</dt><dd className="tabular">{formatIDR(expected)}</dd></div>
          </dl>
          <div className="mt-4 space-y-4">
            <Field label="Uang fisik yang dihitung"><MoneyInput autoFocus value={counted} onChange={setCounted} className="text-lg" /></Field>
            <div className={cx('flex items-center justify-between rounded-xl p-3 text-sm font-semibold', diff === 0 ? 'bg-emerald-50 text-emerald-900' : diff < 0 ? 'bg-rose-50 text-rose-900' : 'bg-amber-50 text-amber-900')}>
              <span>{diff === 0 ? 'Sesuai' : diff < 0 ? 'Kurang' : 'Lebih'}</span>
              <span className="tabular">{diff === 0 ? formatIDR(0) : `${diff > 0 ? '+' : '−'}${formatIDR(Math.abs(diff))}`}</span>
            </div>
            {diff !== 0 && (
              <Field label="Keterangan selisih" error={needsNote ? 'Wajib diisi jika ada selisih.' : null}>
                <input value={note} onChange={e => setNote(e.target.value)} className={inputCls} placeholder="cth. salah beri kembalian" />
              </Field>
            )}
          </div>
        </Modal>
      );
    }

    // =====================================================================
    // SALES REPORT
    // =====================================================================
    const RANGES = [
      { value: 'today', label: 'Hari ini' }, { value: 'yesterday', label: 'Kemarin' }, { value: '7d', label: '7 hari' },
      { value: '30d', label: '30 hari' }, { value: 'month', label: 'Bulan ini' }, { value: 'custom', label: 'Pilih tanggal' }
    ];
    function rangeBounds(id, from, to) {
      const today = dateKey();
      switch (id) {
        case 'today': return [today, today];
        case 'yesterday': return [addDays(today, -1), addDays(today, -1)];
        case '7d': return [addDays(today, -6), today];
        case '30d': return [addDays(today, -29), today];
        case 'month': return [today.slice(0, 8) + '01', today];
        default: return [from || today, to || today];
      }
    }

    function SalesReportModule({ db, setDb, notify, currentUser, hasPermission, isOwner }) {
      const [range, setRange] = useState('today');
      const [customFrom, setCustomFrom] = useState(addDays(dateKey(), -6));
      const [customTo, setCustomTo] = useState(dateKey());
      const [cashierFilter, setCashierFilter] = useState('all');
      const [methodFilter, setMethodFilter] = useState('all');
      const [search, setSearch] = useState('');
      const [showVoid, setShowVoid] = useState(false);
      const [limit, setLimit] = useState(30);
      const [detail, setDetail] = useState(null);
      const [reprint, setReprint] = useState(null);
      const [voiding, setVoiding] = useState(null);
      const [voidReason, setVoidReason] = useState('');
      const [productSort, setProductSort] = useState({ key: 'qty', dir: 'desc' });
      const [txSort, setTxSort] = useState({ key: 'date', dir: 'desc' });

      const [from, to] = rangeBounds(range, customFrom, customTo);
      const singleDay = from === to;

      // Everyone sees the whole store's sales and can narrow them to one cashier
      const scoped = allSalesOf(db).filter(s => {
        const k = saleDay(s);
        if (k < from || k > to) return false;
        if (cashierFilter === 'me' && s.cashier_id !== currentUser.id) return false;
        if (cashierFilter !== 'all' && cashierFilter !== 'me' && s.cashier_id !== cashierFilter) return false;
        if (methodFilter !== 'all' && s.payment_method !== methodFilter) return false;
        return true;
      });
      const valid = scoped.filter(isValidSale);
      const voided = scoped.filter(s => !isValidSale(s));

      const gross = valid.reduce((a, s) => a + s.total, 0);
      const net = valid.reduce((a, s) => a + s.total - (s.tax || 0), 0);
      const discount = valid.reduce((a, s) => a + (s.discount || 0), 0);
      const itemsSold = valid.reduce((a, s) => a + s.items.reduce((b, it) => b + it.qty, 0), 0);
      const avg = valid.length ? Math.round(gross / valid.length) : 0;
      const hpp = valid.reduce((a, s) => a + saleCost(s, db.products), 0);

      const chartData = useMemo(() => {
        if (singleDay) {
          return Array.from({ length: 18 }, (_, i) => {
            const h = 6 + i;
            return { label: `${pad(h)}`, total: valid.filter(s => new Date(s.date).getHours() === h).reduce((a, s) => a + s.total, 0) };
          });
        }
        const out = [];
        for (let k = from; k <= to && out.length < 93; k = addDays(k, 1)) {
          out.push({ label: new Date(k + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }), total: valid.filter(s => saleDay(s) === k).reduce((a, s) => a + s.total, 0) });
        }
        return out;
      }, [scoped.length, from, to, gross]);

      const productRows = useMemo(() => {
        const map = {};
        valid.forEach(s => s.items.forEach(it => {
          map[it.id] = map[it.id] || { id: it.id, name: it.name, qty: 0, omzet: 0 };
          map[it.id].qty += it.qty; map[it.id].omzet += it.qty * it.sell_price;
        }));
        return Object.values(map);
      }, [scoped.length, gross]);
      const productTotal = productRows.reduce((a, p) => a + p.omzet, 0) || 1;
      const sortedProducts = sortBy(productRows, productSort, { qty: p => p.qty, omzet: p => p.omzet, share: p => p.omzet, name: p => p.name.toLowerCase() });

      const byMethod = Object.keys(PAYMENT_LABELS).map(m => {
        const list = valid.filter(s => s.payment_method === m);
        return { m, count: list.length, total: list.reduce((a, s) => a + s.total, 0) };
      }).filter(x => x.count);

      const byCashier = db.users.map(u => {
        const list = valid.filter(s => s.cashier_id === u.id);
        return { u, count: list.length, total: list.reduce((a, s) => a + s.total, 0) };
      }).filter(x => x.count);

      const qs = search.trim().toLowerCase();
      const txList = sortBy((showVoid ? scoped : valid)
        .filter(s => !qs || s.receipt_no.toLowerCase().includes(qs) || s.customer_name.toLowerCase().includes(qs) || s.items.some(it => it.name.toLowerCase().includes(qs))),
        txSort, { date: s => new Date(s.date).getTime(), total: s => s.total });

      const exportReport = () => {
        downloadCsv(`Laporan_Penjualan_${from}_${to}.csv`, [
          [`Laporan Penjualan ${db.business.name}`], [`Periode ${from} s/d ${to}`], [],
          ['Waktu', 'No Nota', 'Kasir', 'Pelanggan', 'Metode', 'Subtotal', 'Diskon', 'Voucher', 'Pajak', 'Total', 'Status', 'Item'],
          ...txList.map(s => [fmtDateTime(s.date), s.receipt_no, s.cashier, s.customer_name, PAYMENT_LABELS[s.payment_method], s.subtotal, s.discount || 0, s.coupon_code || '', s.tax || 0, s.total, s.status === 'void' ? 'Batal' : 'Selesai', s.items.map(it => `${it.name} x${it.qty}`).join('; ')]),
          [], ['Produk', 'Qty', 'Omzet', 'Porsi'], ...sortedProducts.map(p => [p.name, p.qty, p.omzet, `${Math.round(p.omzet / productTotal * 100)}%`])
        ]);
        notify('Laporan penjualan diunduh (CSV, bisa dibuka di Excel).');
      };

      const canVoid = hasPermission('can_void_sale');
      const voidSale = (sale, reason) => {
        setDb(prev => {
          const mark = list => list.map(s => s.id === sale.id ? { ...s, status: 'void', void_reason: reason, voided_by: currentUser.name, voided_at: new Date().toISOString(), void_request: s.void_request ? { ...s.void_request, status: 'approved', decided_by: currentUser.name, decided_at: new Date().toISOString() } : undefined } : s);
          const stamp = `${dateKey()} ${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
          return {
            ...prev,
            sales: mark(prev.sales),
            offlineQueue: mark(prev.offlineQueue),
            products: prev.products.map(p => { const it = sale.items.find(i => i.id === p.id); return it ? { ...p, stock: p.stock + it.qty } : p; }),
            customers: sale.payment_method === 'bayar_nanti' ? prev.customers.map(c => (c.id === sale.customer_id || c.name === sale.customer_name) ? { ...c, debt: Math.max(0, c.debt - sale.total) } : c) : prev.customers,
            stockHistory: [...sale.items.map(it => ({ id: generateId('SH'), date: stamp, sku: prev.products.find(p => p.id === it.id)?.sku || '-', name: it.name, qtyChange: `+${it.qty}`, type: `Pembatalan ${sale.receipt_no}`, user: currentUser.name })), ...prev.stockHistory]
          };
        });
        // Tell the cashier whose sale it was (or who asked for the cancellation)
        const affected = sale.void_request?.by_id || (sale.cashier_id !== currentUser.id ? sale.cashier_id : null);
        if (affected) setDb(prev => withStaffNotif(prev, affected, sale.void_request?.by_id
          ? { icon: 'check', tone: 'green', title: 'Pengajuan pembatalan disetujui', msg: `${sale.receipt_no} (${formatIDR(sale.total)}) sudah dibatalkan oleh ${currentUser.name}.`, go: 'sales_report' }
          : { icon: 'ban', tone: 'rose', title: 'Transaksi Anda dibatalkan', msg: `${sale.receipt_no} (${formatIDR(sale.total)}) dibatalkan oleh ${currentUser.name}: ${reason}`, go: 'sales_report' }));
        notify(`${sale.receipt_no} dibatalkan. Stok dikembalikan.`, 'warn');
        setVoiding(null); setDetail(null); setVoidReason('');
      };
      const confirmVoid = () => { if (voidReason.trim()) voidSale(voiding, voidReason.trim()); };
      const markRequest = (sale, patch) => setDb(prev => {
        const mark = list => list.map(s => s.id === sale.id ? { ...s, void_request: { ...(s.void_request || {}), ...patch } } : s);
        return { ...prev, sales: mark(prev.sales), offlineQueue: mark(prev.offlineQueue) };
      });
      const requestVoid = () => {
        if (!voidReason.trim()) return;
        markRequest(voiding, { reason: voidReason.trim(), by: currentUser.name, by_id: currentUser.id, at: new Date().toISOString(), status: 'pending' });
        notify(`Pengajuan pembatalan ${voiding.receipt_no} dikirim ke Bos.`, 'info');
        setVoiding(null); setDetail(null); setVoidReason('');
      };
      const rejectRequest = (sale) => {
        markRequest(sale, { status: 'rejected', decided_by: currentUser.name, decided_at: new Date().toISOString() });
        if (sale.void_request?.by_id) setDb(prev => withStaffNotif(prev, sale.void_request.by_id, { icon: 'x', tone: 'rose', title: 'Pengajuan pembatalan ditolak', msg: `${sale.receipt_no} tetap tercatat sebagai penjualan.`, go: 'sales_report' }));
        notify(`Pengajuan pembatalan ${sale.receipt_no} ditolak.`, 'info');
      };
      const pendingRequests = isOwner ? allSalesOf(db).filter(s => s.status !== 'void' && s.void_request?.status === 'pending') : [];
      const VOID_REASONS = ['Salah input', 'Pelanggan batal pesan', 'Pelanggan salah sebut pesanan', 'Pembayaran gagal'];

      const sessions = [...db.cashSessions].filter(s => { const k = dateKey(new Date(s.opened_at)); return k >= from && k <= to; }).reverse();

      return (
        <div className="space-y-5">
          <PageHeader title="Laporan Penjualan" desc="Semua transaksi toko. Pilih kasir untuk melihat penjualan satu orang."
            actions={<Btn variant="secondary" icon="download" onClick={exportReport} disabled={!scoped.length}>Export Excel (CSV)</Btn>} />

          {pendingRequests.length > 0 && (
            <Card className="border-amber-300 bg-amber-50/40 p-4">
              <h3 className="flex items-center gap-2 text-base font-bold text-slate-900"><SvgIcon name="alert" className="h-5 w-5 text-amber-600" />Pengajuan pembatalan dari kasir ({pendingRequests.length})</h3>
              <ul className="mt-2 divide-y divide-amber-100">
                {pendingRequests.map(s => (
                  <li key={s.id} className="flex flex-col gap-2 py-3 sm:flex-row sm:items-center sm:justify-between">
                    <div className="min-w-0 text-sm">
                      <p className="font-semibold text-slate-900"><span className="font-mono">{s.receipt_no}</span> · {formatIDR(s.total)} · {fmtDateTime(s.date)}</p>
                      <p className="text-slate-600">Diajukan {s.void_request.by}, {fmtDateTime(s.void_request.at)}</p>
                      <p className="text-slate-900">Alasan dibatalkan: <span className="font-medium">“{s.void_request.reason}”</span></p>
                    </div>
                    <div className="flex flex-shrink-0 gap-2">
                      <Btn variant="ghost" size="sm" onClick={() => setDetail(s)}>Lihat</Btn>
                      <Btn variant="secondary" size="sm" onClick={() => rejectRequest(s)}>Tolak</Btn>
                      <Btn variant="danger" size="sm" onClick={() => voidSale(s, s.void_request.reason)}>Setujui pembatalan</Btn>
                    </div>
                  </li>
                ))}
              </ul>
            </Card>
          )}

          <Card className="space-y-3 p-4">
            <SegmentedControl label="Periode" size="md" value={range} onChange={(v) => { setRange(v); setLimit(30); }} options={RANGES} />
            <div className="flex flex-wrap items-end gap-3">
              {range === 'custom' && <>
                <Field label="Dari"><input type="date" value={customFrom} max={customTo} onChange={e => setCustomFrom(e.target.value)} className={inputCls} /></Field>
                <Field label="Sampai"><input type="date" value={customTo} min={customFrom} max={dateKey()} onChange={e => setCustomTo(e.target.value)} className={inputCls} /></Field>
              </>}
              <Field label="Kasir">
                <select value={cashierFilter} onChange={e => setCashierFilter(e.target.value)} className={inputCls}>
                  <option value="all">Semua kasir</option>
                  {!isOwner && <option value="me">Penjualan saya</option>}
                  {db.users.filter(u => u.role !== 'investor').map(u => <option key={u.id} value={u.id}>{u.name}{u.id === currentUser.id ? ' (saya)' : ''}</option>)}
                </select>
              </Field>
              <Field label="Metode bayar">
                <select value={methodFilter} onChange={e => setMethodFilter(e.target.value)} className={inputCls}>
                  <option value="all">Semua metode</option>
                  {Object.entries(PAYMENT_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                </select>
              </Field>
              <p className="pb-3 text-sm text-slate-500">{singleDay ? fmtDateShort(from) : `${fmtDateShort(from)} – ${fmtDateShort(to)}`}</p>
            </div>
          </Card>

          <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
            <StatCard label="Penjualan (termasuk pajak)" value={formatIDR(gross)} sub={`Bersih ${formatIDR(net)}`} icon="dollar" />
            <StatCard label="Transaksi" value={valid.length} sub={voided.length ? `${voided.length} dibatalkan` : `Rata-rata ${formatIDR(avg)}`} icon="receipt" tone="blue" />
            <StatCard label="Item terjual" value={itemsSold} sub={`${productRows.length} jenis produk`} icon="products" tone="purple" />
            {isOwner
              ? <StatCard label="Laba kotor" value={formatIDR(net - hpp)} sub={`HPP ${formatIDR(hpp)}${discount ? ` · Diskon ${formatIDR(discount)}` : ''}`} icon="investors" tone="amber" />
              : <StatCard label="Diskon diberikan" value={formatIDR(discount)} icon="incentives" tone="amber" />}
          </div>

          <div className="grid grid-cols-1 gap-5 lg:grid-cols-12">
            <Card className="p-5 lg:col-span-8">
              <h3 className="text-base font-bold text-slate-900">{singleDay ? 'Penjualan per jam' : 'Penjualan per hari'}</h3>
              <div className="mt-4 h-60">
                {valid.length === 0 ? <EmptyState icon="report" title="Belum ada penjualan di periode ini" /> : ResponsiveContainer && (
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={chartData} margin={{ top: 8, right: 8, left: -8, bottom: 0 }}>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                      <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{ fontSize: 12, fill: '#475569' }} interval="preserveStartEnd" />
                      <YAxis axisLine={false} tickLine={false} tick={{ fontSize: 12, fill: '#475569' }} tickFormatter={v => v >= 1e6 ? `${(v / 1e6).toFixed(1)}jt` : `${Math.round(v / 1000)}rb`} width={48} />
                      <Tooltip formatter={(v) => [formatIDR(v), 'Penjualan']} labelFormatter={(l) => singleDay ? `Pukul ${l}.00` : l} cursor={{ fill: '#f1f5f9' }} contentStyle={{ borderRadius: 12, borderColor: '#e2e8f0', fontSize: 13 }} />
                      <Bar dataKey="total" fill="#1a4fe6" radius={[6, 6, 0, 0]} />
                    </BarChart>
                  </ResponsiveContainer>
                )}
              </div>
            </Card>

            <Card className="p-5 lg:col-span-4">
              <h3 className="text-base font-bold text-slate-900">Metode pembayaran</h3>
              {byMethod.length === 0 ? <p className="mt-3 text-sm text-slate-500">Belum ada data.</p> : (
                <ul className="mt-3 space-y-3">
                  {byMethod.map(x => (
                    <li key={x.m}>
                      <div className="flex justify-between text-sm"><span className="font-medium text-slate-800">{PAYMENT_LABELS[x.m]} <span className="text-slate-500">· {x.count}</span></span><span className="font-semibold tabular">{formatIDR(x.total)}</span></div>
                      <div className="mt-1 h-2 overflow-hidden rounded-full bg-slate-100"><div className="h-full rounded-full bg-brand-500" style={{ width: `${Math.round(x.total / gross * 100)}%` }} /></div>
                    </li>
                  ))}
                </ul>
              )}
              {byCashier.length > 0 && <>
                <h3 className="mt-6 text-base font-bold text-slate-900">Per kasir</h3>
                <ul className="mt-3 space-y-2">
                  {byCashier.map(x => (
                    <li key={x.u.id} className="flex items-center justify-between gap-2 text-sm">
                      <span className="flex min-w-0 items-center gap-2"><Avatar name={x.u.name} className="h-7 w-7 text-xs" /><span className="truncate">{x.u.name}</span></span>
                      <span className="text-right"><span className="block font-semibold tabular">{formatIDR(x.total)}</span><span className="text-xs text-slate-500">{x.count} nota</span></span>
                    </li>
                  ))}
                </ul>
              </>}
            </Card>
          </div>

          <Card>
            <div className="flex items-center justify-between gap-2 border-b border-slate-200 p-4">
              <h3 className="text-base font-bold text-slate-900">Penjualan per produk</h3>
              <span className="text-xs text-slate-500">Klik judul kolom untuk mengurutkan</span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full min-w-[520px] text-left text-sm">
                <thead className="bg-slate-50 text-xs">
                  <tr>
                    <SortTh label="Produk" k="name" sort={productSort} setSort={setProductSort} defaultDir="asc" />
                    <SortTh label="Terjual" k="qty" sort={productSort} setSort={setProductSort} align="right" />
                    <SortTh label="Omzet" k="omzet" sort={productSort} setSort={setProductSort} align="right" />
                    <SortTh label="Porsi" k="share" sort={productSort} setSort={setProductSort} align="right" />
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {sortedProducts.slice(0, 50).map(p => {
                    const prod = db.products.find(x => x.id === p.id) || { name: p.name };
                    const share = Math.round(p.omzet / productTotal * 100);
                    return (
                      <tr key={p.id} className="hover:bg-slate-50">
                        <td className="px-4 py-2.5"><div className="flex items-center gap-3"><ProductThumb product={prod} className="h-9 w-9 rounded-lg" textClass="text-xs" /><span className="font-medium text-slate-900">{p.name}</span></div></td>
                        <td className="px-4 py-2.5 text-right tabular">{p.qty}</td>
                        <td className="px-4 py-2.5 text-right font-semibold tabular">{formatIDR(p.omzet)}</td>
                        <td className="px-4 py-2.5 text-right">
                          <span className="inline-flex items-center gap-2">
                            <span className="hidden h-1.5 w-16 overflow-hidden rounded-full bg-slate-100 sm:inline-block"><span className="block h-full rounded-full bg-brand-500" style={{ width: `${share}%` }} /></span>
                            <span className="w-9 text-slate-600 tabular">{share}%</span>
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {productRows.length === 0 && <EmptyState icon="products" title="Belum ada produk terjual" />}
            </div>
          </Card>

          <Card>
            <div className="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row sm:items-center sm:justify-between">
              <h3 className="text-base font-bold text-slate-900">Daftar transaksi <span className="font-normal text-slate-500">({txList.length})</span></h3>
              <div className="flex flex-wrap items-center gap-3">
                <SearchInput id="tx-search" value={search} onChange={setSearch} placeholder="Cari nota, pelanggan, produk…" className="w-full sm:w-72" />
                <label className="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" checked={showVoid} onChange={e => setShowVoid(e.target.checked)} className="h-4 w-4 rounded accent-brand-700" />Tampilkan yang dibatalkan</label>
              </div>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full min-w-[720px] text-left text-sm">
                <thead className="bg-slate-50 text-xs">
                  <tr>
                    <SortTh label="Waktu" k="date" sort={txSort} setSort={setTxSort} />
                    <th scope="col" className="px-4 py-3 font-semibold uppercase tracking-wide text-slate-600">Nota</th>
                    <th scope="col" className="px-4 py-3 font-semibold uppercase tracking-wide text-slate-600">Kasir</th>
                    <th scope="col" className="px-4 py-3 font-semibold uppercase tracking-wide text-slate-600">Pelanggan</th>
                    <th scope="col" className="px-4 py-3 font-semibold uppercase tracking-wide text-slate-600">Metode</th>
                    <SortTh label="Total" k="total" sort={txSort} setSort={setTxSort} align="right" />
                    <th scope="col" className="px-4 py-3"><span className="sr-only">Aksi</span></th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {txList.slice(0, limit).map(s => (
                    <tr key={s.id} className={cx('hover:bg-slate-50', s.status === 'void' && 'text-slate-400')}>
                      <td className="whitespace-nowrap px-4 py-2.5 tabular">{singleDay ? fmtTime(s.date) : fmtDateTime(s.date)}</td>
                      <td className="px-4 py-2.5">
                        <span className={cx('font-mono text-xs font-semibold', s.status === 'void' && 'line-through')}>{s.receipt_no}</span>
                        {s.status === 'void' && <Badge tone="rose" className="ml-2">Batal</Badge>}
                        {s.status !== 'void' && s.void_request?.status === 'pending' && <Badge tone="amber" className="ml-2">Diajukan batal</Badge>}
                        {s.status !== 'void' && s.void_request?.status === 'rejected' && <Badge tone="slate" className="ml-2">Batal ditolak</Badge>}
                        {s.sync_status === 'pending_sync' && <Badge tone="amber" className="ml-2">Belum sinkron</Badge>}
                      </td>
                      <td className="px-4 py-2.5">{s.cashier}</td>
                      <td className="px-4 py-2.5">{s.customer_name}</td>
                      <td className="px-4 py-2.5"><Badge tone={s.payment_method === 'bayar_nanti' ? 'amber' : 'slate'}>{PAYMENT_LABELS[s.payment_method]}</Badge></td>
                      <td className="px-4 py-2.5 text-right font-semibold tabular">{formatIDR(s.total)}</td>
                      <td className="px-4 py-2.5 text-right"><Btn variant="ghost" size="sm" onClick={() => setDetail(s)} aria-label={`Detail ${s.receipt_no}`}>Detail</Btn></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {txList.length === 0 && <EmptyState icon="receipt" title="Tidak ada transaksi" desc="Coba ubah periode atau filter." />}
              {txList.length > limit && <div className="p-4 text-center"><Btn variant="secondary" onClick={() => setLimit(l => l + 30)}>Tampilkan lebih banyak</Btn></div>}
            </div>
          </Card>

          {isOwner && sessions.length > 0 && (
            <Card>
              <div className="border-b border-slate-200 p-4"><h3 className="text-base font-bold text-slate-900">Riwayat buka/tutup kasir</h3></div>
              <ul className="divide-y divide-slate-100">
                {sessions.map(s => (
                  <li key={s.id} className="flex flex-col gap-1 p-4 text-sm sm:flex-row sm:items-center sm:justify-between">
                    <div>
                      <p className="font-semibold text-slate-900">{fmtDateTime(s.opened_at)} · {s.opened_by}</p>
