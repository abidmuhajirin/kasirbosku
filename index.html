                <div className="h-full rounded-full bg-emerald-500 transition-[width] duration-1000 ease-linear" style={{ width: `${(state.left / 30) * 100}%` }} />
              </div>
              <p className="mt-2 text-center text-sm text-slate-600">Berganti dalam {state.left} detik</p>
            </Modal>
          )}
        </>
      );
    }

    function Root() {
      const [session, setSession] = useState(() => CLOUD_API ? loadSession() : null);
      const [notice, setNotice] = useState('');
      const inApp = !CLOUD_API || !!session;
      // The app's top bar is white; the sign-in screen sits on the light grey page
      useEffect(() => setThemeColor(inApp ? '#ffffff' : '#f6f8fc'), [inApp]);
      if (!CLOUD_API) return <App />;
      if (!session) return <AuthScreen notice={notice} onLogin={(s) => { writeLocal(SESSION_KEY, s); try { sessionStorage.setItem('kasirbosku_just_signed_in', '1'); } catch {} setNotice(''); setSession(s); }} />;
      // The server ended the session (account removed or deactivated): this device must not open it offline either
      const end = (msg) => {
        if (msg) vaultForget(session.user.username);
        writeLocal(SESSION_KEY, null); setNotice(msg || ''); setSession(null);
      };
      // Token refresh and name/role changes made by the Bos on another device
      const update = (u) => setSession(cur => {
        if (!cur) return cur;
        const next = { ...cur, token: u.token || cur.token, user: u.user ? { ...cur.user, ...u.user } : cur.user, tenant: u.tenant ? { ...cur.tenant, ...u.tenant } : cur.tenant };
        if (JSON.stringify(next) === JSON.stringify(cur)) return cur;
        writeLocal(SESSION_KEY, next);
        if (next.token !== cur.token) vaultRefresh(next);
        return next;
      });
      return <CloudApp key={`${session.tenant.id}:${session.user.id}`} session={session} onSessionUpdate={update} onLogout={end} />;
    }

    function CloudApp({ session, onSessionUpdate, onLogout }) {
      const [saved, setSaved] = useState(null);
      useEffect(() => {
        readSavedDb(session.tenant.id).then(setSaved);
        navigator.storage?.persist?.().catch(() => {});
      }, []);
      if (!saved) return <p className="flex h-full items-center justify-center text-sm text-slate-600" role="status">Memuat data toko…</p>;
      return <App session={session} saved={saved} onSessionUpdate={onSessionUpdate} onLogout={onLogout} />;
    }

    // =====================================================================
    // APP
    // =====================================================================
    function App({ session = null, saved, onSessionUpdate, onLogout }) {
      const cloud = !!session;
      const [db, setDbRaw] = useState(() => cloud ? loadCloudDb(saved) : loadDb());
      // What this user changed, kept per resulting state; written to the log once React commits that state
      const pendingLog = useRef(new Map());
      const setDb = useCallback((update) => setDbRaw(prev => {
        const next = typeof update === 'function' ? update(prev) : update;
        if (next !== prev) { try { const lines = describeChanges(prev, next); if (lines.length) pendingLog.current.set(next, lines); } catch { /* the log never blocks a change */ } }
        return next;
      }), []);
      const [currentUserId, setCurrentUserId] = useState(cloud ? session.user.id : 'usr-1');
      // Right after the first sign-in the account is known only from the session
      const currentUser = db.users.find(u => u.id === currentUserId) || (cloud ? { ...session.user, status: 'Aktif' } : db.users[0]);
      const isOwner = currentUser.role === 'owner';
      const isInvestor = currentUser.role === 'investor';

      const [activeTab, setActiveTab] = useState(isInvestor ? 'dashboard' : 'pos');
      const [isOfflineMode, setIsOfflineMode] = useState(false);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [showCSModal, setShowCSModal] = useState(false);
      const [showCartDrawer, setShowCartDrawer] = useState(false);
      const [showNotifMenu, setShowNotifMenu] = useState(false);
      const [showPrayer, setShowPrayer] = useState(false);
      const [adzanAlert, setAdzanAlert] = useState(null);
      const [cart, setCart] = useState([]);
      const [now, setNow] = useState(Date.now());

      useEffect(() => { const t = setInterval(() => setNow(Date.now()), 15000); return () => clearInterval(t); }, []);

      const toastTimer = useRef();
      const notify = useCallback((msg, type = 'success') => {
        clearTimeout(toastTimer.current);
        setToast({ msg, type, key: Date.now() });
        toastTimer.current = setTimeout(() => setToast(null), 4500);
      }, []);

      const loggedUser = useRef(null);
      useEffect(() => {
        const m = pendingLog.current;
        if (!m.size) return;
        const seen = new Set(), lines = [];
        m.forEach(list => list.forEach(l => { const k = l.action + '|' + l.detail; if (!seen.has(k)) { seen.add(k); lines.push(l); } }));
        m.clear();
        appendLog(cloud ? session.tenant.id : null, loggedUser.current, lines);
      }, [db]);

      const quotaWarned = useRef(false);
      const dbSave = useRef({ busy: false, next: null });
      useEffect(() => {
        if (cloud) {
          // Writes one at a time; while one runs, only the newest waiting copy matters
          const q = dbSave.current;
          q.next = JSON.stringify(db);
          if (q.busy) return;
          q.busy = true;
          (async () => {
            while (q.next) {
              const copy = q.next;
              q.next = null;
              try { await deviceSet(cloudKey(session.tenant.id, 'db'), copy); quotaWarned.current = false; }
              catch {
                if (!quotaWarned.current) { quotaWarned.current = true; notify('Penyimpanan perangkat penuh. Data di server tetap aman, tetapi aplikasi butuh internet saat dibuka lagi.', 'warn'); }
              }
            }
            q.busy = false;
          })();
          return;
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); quotaWarned.current = false; }
        catch (e) {
          // Only a full quota is actionable; blocked storage (private mode, sandboxed preview) just means no persistence
          const full = e && (e.name === 'QuotaExceededError' || e.code === 22);
          if (full && !quotaWarned.current) { quotaWarned.current = true; notify('Penyimpanan perangkat penuh. Kurangi foto produk agar data baru bisa tersimpan.', 'warn'); }
        }
      }, [db]);

      // License: remembered on the device so an expired store stays locked offline too
      const [license, setLicense] = useState(() => cloud ? (readLocal(licenseKey(session.tenant.id), null) || {}) : {});
      const onLicense = useCallback((info) => setLicense(cur => {
        const next = { ...cur, ...info };
        if (JSON.stringify(next) === JSON.stringify(cur)) return cur;
        writeLocal(licenseKey(session.tenant.id), next);
        return next;
      }), []);
      const sync = useCloudSync({ session, db, setDb: setDbRaw, notify, onSessionUpdate, onSessionEnd: onLogout, onLicense, readOnly: session?.user.role === 'investor' });
      const daysLeft = licenseDaysLeft(license);
      const licenseLocked = cloud && (license.blocked || (daysLeft !== null && daysLeft <= 0 && license.expires_at && new Date(license.expires_at).getTime() <= trueNow()));
      useEffect(() => {
        document.documentElement.classList.toggle('license-locked', !!licenseLocked);
        return () => document.documentElement.classList.remove('license-locked');
      }, [licenseLocked]);
      const [confirmLogout, setConfirmLogout] = useState(false);
      useEffect(() => {
        if (cloud && sessionStorage.getItem('kasirbosku_just_signed_in')) {
          sessionStorage.removeItem('kasirbosku_just_signed_in');
          appendLog(session.tenant.id, { id: session.user.id, name: session.user.name, role: session.user.role }, [{ kind: 'akun', action: 'Masuk ke aplikasi', detail: navigator.userAgent.includes('Android') ? 'Android' : navigator.userAgent.includes('iPhone') || navigator.userAgent.includes('iPad') ? 'iOS' : 'Komputer' }]);
        }
      }, []);
      const logout = () => { if (cloud) appendLog(session.tenant.id, { id: currentUser.id, name: currentUser.name, role: currentUser.role }, [{ kind: 'akun', action: 'Keluar dari aplikasi', detail: '' }]); onLogout(); };

      const hasPermission = (k) => isOwner || (isInvestor ? k === 'can_view_finance' : !!(db.permissions[currentUser.role] || db.permissions.kasir || {})[k]);
      const canAccess = (item) => isInvestor ? INVESTOR_TABS.has(item.id) : (!item.ownerOnly || isOwner) && (!item.perm || hasPermission(item.perm));
      const homeTab = isInvestor ? 'dashboard' : 'pos';
      const activeItem = NAV_ITEMS.find(i => i.id === activeTab) || NAV_ITEMS[1];
      useEffect(() => { if (!canAccess(activeItem)) setActiveTab(homeTab); }, [currentUserId, db.permissions, currentUser.role]);
      // The app scrolls inside its panels, never the page. On Android (full screen) the keyboard can push the
      // whole page up and leave the header half hidden after it closes; this moves it back.
      useEffect(() => {
        let t;
        const reset = () => { clearTimeout(t); t = setTimeout(() => {
          const a = document.activeElement;
          if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
          if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; }
        }, 150); };
        window.addEventListener('focusout', reset);
        window.visualViewport?.addEventListener('resize', reset);
        return () => { clearTimeout(t); window.removeEventListener('focusout', reset); window.visualViewport?.removeEventListener('resize', reset); };
      }, []);
      // The menu closes at once; the new page renders as a low-priority update so a slow tablet never stalls the tap
      const go = (id) => { const item = NAV_ITEMS.find(i => i.id === id); if (item && !canAccess(item)) return; setSidebarOpen(false); React.startTransition(() => setActiveTab(id)); };

      useEffect(() => {
        if (!sidebarOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') setSidebarOpen(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [sidebarOpen]);

      const notifRef = useRef(null);
      useEffect(() => {
        if (!showNotifMenu) return;
        const onDown = (e) => { if (notifRef.current && !notifRef.current.contains(e.target)) setShowNotifMenu(false); };
        const onKey = (e) => { if (e.key === 'Escape') setShowNotifMenu(false); };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('keydown', onKey);
        return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
      }, [showNotifMenu]);

      // ---------- Prayer schedule & reminders ----------
      const { location, prayer: prayerCfg } = db.business;
      const clock = storeClock(now, location.tz);
      const storeDayKey = `${clock.y}-${pad(clock.m)}-${pad(clock.d)}`;
      const prayerTimes = useMemo(
        () => computePrayerTimes(clock.y, clock.m, clock.d, location.lat, location.lng, location.tz),
        [storeDayKey, location.lat, location.lng, location.tz]
      );
      const isFriday = clock.weekday === 5;
      const prayerLabel = (p) => p.key === 'dzuhur' && isFriday ? 'Jumat' : p.label;
      const nextPrayer = useMemo(() => {
        const upcoming = MAIN_PRAYERS.find(p => prayerTimes[p.key] > clock.minutes);
        if (upcoming) return { ...upcoming, label: prayerLabel(upcoming), time: prayerTimes[upcoming.key], inMin: prayerTimes[upcoming.key] - clock.minutes };
        const subuh = MAIN_PRAYERS[0];
        return { ...subuh, time: prayerTimes.subuh, inMin: prayerTimes.subuh + 1440 - clock.minutes };
      }, [prayerTimes, clock.minutes]);
      const hijri = hijriLabel(new Date(now), prayerCfg.hijri_offset);

      const firedRef = useRef(new Set());
      useEffect(() => {
        if (!prayerCfg.enabled) return;
        MAIN_PRAYERS.forEach(p => {
          const t = prayerTimes[p.key];
          const key = `${storeDayKey}-${p.key}`;
          const label = prayerLabel(p);
          if (clock.minutes >= t && clock.minutes < t + 10 && !firedRef.current.has(key)) {
            firedRef.current.add(key); firedRef.current.add(key + '-pre');
            setAdzanAlert({ label, time: t });
            if (prayerCfg.sound) playChime();
            if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
              new Notification(`Waktunya sholat ${label}`, { body: `${minToHHMM(t)} ${TZ_LABEL[location.tz]} · ${location.city}` });
            }
          } else if (prayerCfg.remind_before > 0 && clock.minutes >= t - prayerCfg.remind_before && clock.minutes < t && !firedRef.current.has(key + '-pre')) {
            firedRef.current.add(key + '-pre');
            notify(`${t - clock.minutes} menit lagi masuk waktu ${label} (${minToHHMM(t)}).`, 'info');
          }
        });
      }, [clock.minutes, storeDayKey, prayerTimes, prayerCfg.enabled, prayerCfg.remind_before, prayerCfg.sound]);

      // ---------- Attendance (clock in / out) ----------
      const todayKey = dateKey(new Date(now));
      const work = db.business.work;
      const deviceId = useMemo(getDeviceId, []);
      const [clocking, setClocking] = useState(false);
      // An open record from the last 20 h wins, so a night-shift worker can clock out after midnight
      const myAttendance = db.attendance.find(a => a.user_id === currentUser.id && !a.clock_out && now - new Date(a.clock_in) < 20 * 3600e3)
        || db.attendance.find(a => a.user_id === currentUser.id && a.date === todayKey);

      const onStoreDevice = (db.business.store_devices || []).includes(deviceId);
      const attCodeOn = !!(work.attendance_code && db.business.attendance_secret);
      const [codeAsk, setCodeAsk] = useState(null);
      const askAttendanceCode = () => new Promise(resolve => setCodeAsk({ resolve }));

      // Anti-cheat: store device, the rotating code from the store screen, and/or the store's GPS radius.
      // Every record keeps how it was verified so the Bos can check.
      const [selfieAsk, setSelfieAsk] = useState(null);
      const [deviceLabel, setDeviceLabel] = useState('');
      useEffect(() => { deviceName().then(setDeviceLabel); }, []);
      const selfiePrefix = cloud ? `${cloudKey(session.tenant.id, 'selfie')}:` : '';
      const selfieState = useRef({ busy: false, memory: new Map(), warned: false });
      const latestToken = useRef(session?.token);
      latestToken.current = session?.token;
      // Sends waiting photos. One taken without signal stays on this device and goes out when the internet is back.
      const flushSelfies = useCallback(async () => {
        const st = selfieState.current;
        if (!cloud || st.busy) return;
        st.busy = true;
        try {
          const legacy = cloudKey(session.tenant.id, 'selfies');
          for (const item of readLocal(legacy, []) || []) await deviceSet(selfiePrefix + item.key, item);
          writeLocal(legacy, null);
          const stored = await deviceList(selfiePrefix).catch(() => []);
          for (const item of new Map([...stored, ...st.memory.values()].map(x => [x.key, x])).values()) {
            const blob = await (await fetch(item.photo)).blob();
            const { id } = await apiFetch('/api/selfies', { token: latestToken.current, method: 'POST', blob });
            setDb(prev => ({ ...prev, attendance: prev.attendance.map(a => a.id === item.att ? { ...a, [item.field]: id } : a) }));
            st.memory.delete(item.key);
            await deviceDel(selfiePrefix + item.key).catch(() => {});
          }
          st.warned = false;
        } catch (e) {
          // No connection is expected and retried quietly; anything else would otherwise stay invisible
          if (e.status !== 0 && !st.warned) { st.warned = true; notify(`Foto absen belum terkirim: ${e.message}`, 'warn'); }
        } finally { st.busy = false; }
      }, [cloud]);
      useEffect(() => {
        flushSelfies();
        const timer = setInterval(flushSelfies, 60000);
        window.addEventListener('online', flushSelfies);
        return () => { clearInterval(timer); window.removeEventListener('online', flushSelfies); };
      }, [flushSelfies]);
      // Resolves with the photo, or null when the person cancels
      const takeSelfie = (label, v) => new Promise(resolve => setSelfieAsk({ label, coords: v.coords, address: v.address, resolve }));
      const keepSelfie = (att, field, photo) => {
        if (!cloud) return photo;
        const item = { key: generateId('SF'), att, field, photo };
        // Memory carries it through this session even if the device refuses to store it
        selfieState.current.memory.set(item.key, item);
        deviceSet(selfiePrefix + item.key, item).catch(() => {}).finally(flushSelfies);
        return 'pending';
      };
      const findAddress = async (coords) => {
        if (!cloud || !coords) return '';
        try { return (await apiFetch(`/api/address?lat=${coords.latitude}&lng=${coords.longitude}`, { token: latestToken.current })).address; }
        catch { return ''; }
      };
      const verifyPresence = async () => {
        const notes = [];
        let coords = null;
        if (onStoreDevice) {
          if (work.attendance_store_device || attCodeOn) notes.push('perangkat toko');
        } else if (attCodeOn) {
          const code = await askAttendanceCode();
          if (code == null) return null;
          if (!(await attendanceCodeValid(db.business.attendance_secret, code))) {
            notify('Kode absen salah atau sudah berganti. Lihat kode terbaru di layar kasir toko.', 'warn');
            return null;
          }
          notes.push('kode layar kasir');
        } else if (work.attendance_store_device) {
          notify('Absen hanya bisa dari perangkat kasir toko. Minta Bos mendaftarkan perangkat ini.', 'warn');
          return null;
        }
        if (work.attendance_gps) {
          setClocking(true);
          try {
            const c = await getPosition();
            coords = c;
            const dist = Math.round(haversineM(c.latitude, c.longitude, location.lat, location.lng));
            if (dist > work.attendance_radius + Math.min(c.accuracy || 0, 100)) {
              notify(`Anda sekitar ${dist} m dari toko. Absen hanya bisa dalam radius ${work.attendance_radius} m.`, 'warn');
              return null;
            }
            notes.push(`GPS ${dist} m dari toko`);
          } catch {
            notify('Lokasi tidak terbaca. Nyalakan GPS dan izinkan akses lokasi untuk absen.', 'warn');
            return null;
          } finally { setClocking(false); }
        }
        const skew = Math.round(Math.abs(clockOffset) / 60000);
        if (skew >= 5) notes.push(`jam HP selisih ${skew} menit, dicatat dengan jam server`);
        let address = '';
        if (work.attendance_selfie) {
          notes.push('foto selfie');
          setClocking(true);
          try {
            if (!coords) coords = await getPosition();
            address = await findAddress(coords);
          } catch { /* the photo says the location was not read */ } finally { setClocking(false); }
        }
        return { method: notes.length ? notes.join(' · ') : 'Tanpa verifikasi', coords, address };
      };

      const clockIn = async () => {
        const v = await verifyPresence();
        if (!v) return;
        const photo = work.attendance_selfie ? await takeSelfie('datang', v) : null;
        if (work.attendance_selfie && !photo) return;
        const shift = shiftOf(currentUser, work);
        const id = generateId('ATT');
        const rec = { id, user_id: currentUser.id, date: dateKey(new Date(trueNow())), shift_id: shift.id, clock_in: new Date(trueNow()).toISOString(), clock_out: null, device_id: deviceId, verify_in: v.method, ...(photo ? { selfie_in: keepSelfie(id, 'selfie_in', photo) } : {}) };
        setDb(prev => ({ ...prev, attendance: [...prev.attendance, rec] }));
        const { lateMin } = attendanceInfo(rec, work, currentUser);
        notify(lateMin ? `Absen masuk ${fmtTime(rec.clock_in)} (${shift.name}) — terlambat ${fmtDuration(lateMin)}.` : `Absen masuk ${shift.name} tercatat ${fmtTime(rec.clock_in)}. Selamat bekerja!`, lateMin ? 'warn' : 'success');
      };

      // Leaving before the shift ends needs a reason, which the Bos sees in the attendance recap
      const [earlyAsk, setEarlyAsk] = useState(null);
      const clockOut = async (reason) => {
        if (!myAttendance) return;
        if (typeof reason !== 'string') {
          const probe = attendanceInfo({ ...myAttendance, clock_out: new Date(trueNow()).toISOString() }, work, currentUser);
          if (probe.otMin < 0) { setEarlyAsk({ minutes: -probe.otMin }); return; }
        }
        const v = await verifyPresence();
        if (!v) return;
        const photo = work.attendance_selfie ? await takeSelfie('pulang', v) : null;
        if (work.attendance_selfie && !photo) return;
        const outIso = new Date(trueNow()).toISOString();
        const { otMin } = attendanceInfo({ ...myAttendance, clock_out: outIso }, work, currentUser);
        const ot = otMin >= work.overtime_min
          ? { id: generateId('OT'), user_id: currentUser.id, date: myAttendance.date, minutes: otMin, status: 'pending', note: 'Lembur otomatis dari absen pulang', decided_by: null }
          : null;
        const selfieOut = photo ? keepSelfie(myAttendance.id, 'selfie_out', photo) : null;
        setDb(prev => ({
          ...prev,
          attendance: prev.attendance.map(a => a.id === myAttendance.id ? { ...a, clock_out: outIso, verify_out: v.method, ...(photo ? { selfie_out: selfieOut } : {}), ...(typeof reason === 'string' ? { early_reason: reason } : {}) } : a),
          overtime: ot ? [...prev.overtime, ot] : prev.overtime
        }));
        notify(ot ? `Absen pulang tercatat. Lembur ${fmtDuration(otMin)} diajukan ke Bos.` : `Absen pulang tercatat ${fmtTime(outIso)}. Terima kasih!`);
      };

      // ---------- Offline sync ----------
      const syncOfflineData = () => {
        if (!db.offlineQueue.length) return notify('Tidak ada transaksi offline yang perlu disinkronkan.', 'info');
        if (isOfflineMode) return notify('Masih offline. Kembali online sebelum sinkronisasi.', 'warn');
        const count = db.offlineQueue.length;
        setDb(prev => ({ ...prev, sales: [...prev.offlineQueue.map(s => ({ ...s, sync_status: 'synced' })), ...prev.sales], offlineQueue: [] }));
        notify(`${count} transaksi offline berhasil disinkronkan.`);
      };

      // ---------- Live notifications ----------
      const lowStock = db.products.filter(isLowStock);
      const pendingOt = db.overtime.filter(o => o.status === 'pending');
      const pendingVoids = allSalesOf(db).filter(s => s.status !== 'void' && s.void_request?.status === 'pending');
      const myNotifs = isOwner ? [] : (db.staff_notifications || []).filter(n => n.user_id === currentUser.id).slice(0, 15);
      const licenseSoon = cloud && !licenseLocked && daysLeft !== null && daysLeft <= (license.plan === 'trial' ? 3 : 7);
      const notifications = [
        ...(licenseSoon ? [{ id: 'lic', icon: 'alert', tone: 'rose', title: 'Lisensi segera berakhir', msg: `Lisensi ${LICENSE_PLAN_LABELS[license.plan] || ''} berakhir ${daysLeft <= 1 ? 'besok' : `${daysLeft} hari lagi`} (${fmtDateShort(license.expires_at)}). Hubungi admin untuk perpanjangan.` }] : []),
        ...myNotifs,
        ...lowStock.map(p => ({ id: 'ls-' + p.id, icon: 'alert', tone: 'amber', title: p.stock <= 0 ? 'Stok habis' : 'Stok menipis', msg: `${p.name} tersisa ${p.stock} ${p.unit}.`, go: 'products' })),
        ...(isOwner && pendingVoids.length ? [{ id: 'void', icon: 'ban', tone: 'rose', title: 'Pengajuan pembatalan', msg: `${pendingVoids.length} transaksi menunggu persetujuan pembatalan.`, go: 'sales_report' }] : []),
        ...(isOwner && pendingOt.length ? [{ id: 'ot', icon: 'clock', tone: 'blue', title: 'Lembur menunggu persetujuan', msg: `${pendingOt.length} pengajuan lembur perlu ditinjau.`, go: 'attendance' }] : []),
        ...(db.offlineQueue.length ? [{ id: 'off', icon: 'wifiOff', tone: 'rose', title: 'Belum tersinkron', msg: `${db.offlineQueue.length} transaksi masih tersimpan di perangkat.` }] : []),
        ...(!isOwner && !myAttendance && !(db.leaves || []).some(l => l.user_id === currentUser.id && l.date === todayKey) ? [{ id: 'att', icon: 'login', tone: 'teal', title: 'Belum absen masuk', msg: 'Jangan lupa absen sebelum mulai melayani.', go: 'attendance' }] : [])
      ];
      const notifSignature = notifications.map(n => n.id + n.msg).join('|');
      const [seenSignature, setSeenSignature] = useState('');
      const hasUnread = notifications.length > 0 && notifSignature !== seenSignature;

      const totalCartCount = cart.reduce((acc, c) => acc + c.qty, 0);

      const switchUser = (id) => {
        const u = db.users.find(x => x.id === id);
        if (!u) return;
        setCurrentUserId(id);
        notify(`Masuk sebagai ${u.name} (${ROLE_LABELS[u.role]})`, 'info');
      };

      const syncClick = () => {
        const st = sync.status;
        sync.syncNow();
        notify(st.phase === 'offline' ? `Belum ada koneksi. ${st.pending} perubahan tersimpan di perangkat dan terkirim otomatis saat online.`
          : st.phase === 'error' ? `Sinkron gagal: ${st.error}`
          : st.pending ? `Mengirim ${st.pending} perubahan…` : 'Semua data sudah tersimpan di server.', st.phase === 'offline' || st.phase === 'error' ? 'warn' : 'info');
      };

      // Login IDs are unique across stores; the server says whether one is free (null = demo mode, nothing to check)
      const checkUsername = cloud ? (username, id) => apiFetch(`/api/username-available?u=${encodeURIComponent(username)}&id=${encodeURIComponent(id || '')}`, { token: session.token }).then(r => r.available) : null;
      // Investor screens are read-only; any edit attempt explains why instead of silently failing
      const pageSetDb = isInvestor ? () => notify('Akun investor hanya bisa melihat data.', 'info') : setDb;
      const pageProps = { db, setDb: pageSetDb, notify, currentUser, hasPermission, isOwner, checkUsername };
      const greetingName = currentUser.name.replace(/^(Hj?\.)\s*/, '').split(' ')[0];
      loggedUser.current = { id: currentUser.id, name: currentUser.name, role: currentUser.role };

      // First sign-in on this device: wait for the store's data before showing the app
      if (cloud && db.users.length === 0) {
        const waiting = sync.status.phase === 'syncing';
        return (
          <div className="flex h-full items-center justify-center bg-[#f6f8fc] p-6">
            <div className="max-w-sm text-center" role="status">
              <BrandMark className="mx-auto h-12 w-12" iconClass="h-7 w-7" />
              <p className="mt-4 text-lg font-bold text-slate-900">{waiting ? 'Menyiapkan data toko…' : 'Data toko belum bisa diambil'}</p>
              <p className="mt-1 text-sm text-slate-600">{waiting ? 'Sebentar, data sedang diunduh dari server.' : sync.status.error}</p>
              {!waiting && (
                <div className="mt-4 flex justify-center gap-2">
                  <Btn icon="refresh" onClick={() => sync.syncNow()}>Coba lagi</Btn>
                  <Btn variant="secondary" onClick={() => onLogout()}>Keluar</Btn>
                </div>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="relative flex h-full overflow-hidden bg-[#f6f8fc] text-slate-900">
          {licenseLocked && <LicenseLockedNotice message={license.message} storeName={db.business.name || session.tenant.name} storeCode={session.tenant.code} checking={sync.status.phase === 'syncing'} onRetry={() => sync.syncNow()} onLogout={logout} />}
          <a href="#main" className="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[60] focus:rounded-xl focus:bg-white focus:px-4 focus:py-2 focus:font-semibold focus:shadow-lg">Lewati ke konten</a>

          {codeAsk && <AttendanceCodePrompt onDone={(c) => { codeAsk.resolve(c); setCodeAsk(null); }} />}
          {selfieAsk && <SelfieCamera label={selfieAsk.label} lines={() => [
            `${currentUser.name} · Absen ${selfieAsk.label}`,
            `${fmtDateTime(new Date(trueNow()).toISOString())} · ${db.business.name}`,
            ...(selfieAsk.address ? [selfieAsk.address] : []),
            selfieAsk.coords ? `Koordinat ${selfieAsk.coords.latitude.toFixed(5)}, ${selfieAsk.coords.longitude.toFixed(5)}` : 'Lokasi tidak terbaca',
            `Perangkat ${deviceLabel || deviceId}`
          ]} onDone={(photo) => { selfieAsk.resolve(photo); setSelfieAsk(null); }} />}
          {earlyAsk && <EarlyLeaveModal minutes={earlyAsk.minutes} shiftEnd={shiftOf(currentUser, work).end} onClose={() => setEarlyAsk(null)} onConfirm={(r) => { setEarlyAsk(null); clockOut(r); }} />}

          {confirmLogout && (
            <Modal title="Keluar dari akun?" desc={`${sync.status.pending} perubahan belum terkirim ke server.`} onClose={() => setConfirmLogout(false)}
              footer={<><Btn variant="secondary" onClick={() => setConfirmLogout(false)}>Batal</Btn><Btn variant="danger" onClick={logout}>Tetap keluar</Btn></>}>
              <p className="text-sm text-slate-600">Perubahan itu tetap tersimpan di perangkat ini dan terkirim saat ada yang masuk lagi di perangkat ini dengan internet.</p>
            </Modal>
          )}

          {/* TOAST */}
          <div aria-live="polite" className="pointer-events-none fixed inset-x-4 top-4 z-[70] flex justify-end sm:left-auto">
            {toast && (
              <div key={toast.key} role="status" className={cx(
                'pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-2xl border p-3.5 text-sm shadow-xl animate-pop-in',
                toast.type === 'warn' ? 'border-amber-300 bg-amber-50 text-amber-900'
                  : toast.type === 'info' ? 'border-slate-700 bg-slate-900 text-white'
                  : 'border-brand-800 bg-brand-700 text-white')}>
                <SvgIcon name={toast.type === 'warn' ? 'alert' : toast.type === 'info' ? 'info' : 'check'} className="mt-0.5 h-5 w-5 flex-shrink-0" />
                <span className="flex-1 font-medium leading-snug">{toast.msg}</span>
                <button type="button" aria-label="Tutup notifikasi" onClick={() => setToast(null)} className={cx('-m-1 rounded-lg p-1 opacity-80 hover:opacity-100', focusRing)}>
                  <SvgIcon name="x" className="h-4 w-4" />
                </button>
              </div>
            )}
          </div>

          {sidebarOpen && <div onClick={() => setSidebarOpen(false)} className="fixed inset-0 z-40 bg-slate-900/50 animate-fade-in xl:hidden" aria-hidden="true" />}

          {/* SIDEBAR */}
          <aside aria-label="Navigasi utama"
            className={cx('fixed inset-y-0 left-0 z-40 flex w-72 flex-shrink-0 flex-col bg-brand-700 text-white shadow-xl transition-transform duration-200 ease-out xl:static xl:w-64 xl:translate-x-0 xl:shadow-none',
              sidebarOpen ? 'translate-x-0' : '-translate-x-full')}>
            <div className="flex items-center justify-between gap-3 border-b border-white/10 p-4">
              <div className="flex min-w-0 items-center gap-3">
                <BrandMark light />
                <div className="min-w-0">
                  <p className="flex min-w-0 items-center gap-1.5 text-base font-extrabold tracking-tight"><span className="truncate">Kasir<span className="text-sun-300">Bosku</span></span>{cloud && <PlanBadge plan={license.plan} />}</p>
                  <p className="truncate text-xs text-brand-100">{db.business.name}</p>
                </div>
              </div>
              <button type="button" aria-label="Tutup menu" title="Tutup menu" onClick={() => setSidebarOpen(false)}
                className="inline-flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-xl text-brand-100 transition-colors hover:bg-white/10 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white xl:hidden">
                <SvgIcon name="x" className="h-5 w-5" />
              </button>
            </div>

            <nav className="flex-1 overflow-y-auto overscroll-contain px-3 py-4 scrollbar-none">
              {NAV.map(group => {
                const items = group.items.filter(canAccess);
                if (!items.length) return null;
                return (
                  <div key={group.section} className="mb-4">
                    <p className="px-3 pb-1.5 text-xs font-semibold uppercase tracking-wider text-brand-200">{group.section}</p>
                    <ul className="space-y-0.5">
                      {items.map(item => {
                        const badge = item.id === 'pos' && totalCartCount ? totalCartCount
                          : item.id === 'attendance' && isOwner && pendingOt.length ? pendingOt.length
                          : item.id === 'sales_report' && isOwner && pendingVoids.length ? pendingVoids.length : null;
                        return <li key={item.id}><SidebarItem item={item} active={activeTab === item.id} onClick={() => go(item.id)} badge={badge} /></li>;
                      })}
                    </ul>
                  </div>
                );
              })}
            </nav>

            <div className="space-y-2 border-t border-white/10 p-3">
              {!isInvestor && <button type="button" onClick={() => setShowCSModal(true)}
                className="flex w-full min-h-[44px] items-center gap-3 rounded-xl px-3 py-2 text-left text-sm text-white transition-colors hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
                <SvgIcon name="help" className="h-5 w-5 text-sun-300" />
                <span className="font-medium">Bantuan & Panduan</span>
              </button>}
              {license.expires_at
                ? <p className="px-3 text-[11px] text-brand-200 tabular">Expires on {new Date(license.expires_at).toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' })}</p>
                : <p className="px-3 text-[11px] text-brand-200">crafted by <a href={MAKER_URL} target="_blank" rel="noreferrer" className="font-semibold text-white hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">menjadibos.com</a></p>}
              {cloud ? (
                <div className="flex items-center gap-2.5 rounded-xl bg-white/10 py-1.5 pl-2 pr-1 ring-1 ring-white/15">
                  <Avatar name={currentUser.name} src={currentUser.photo} className="h-8 w-8 text-xs ring-2 ring-white/40" />
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-sm font-semibold leading-tight">{currentUser.name}</p>
                    <p className="text-xs leading-tight text-brand-100">{ROLE_LABELS[currentUser.role]}</p>
                  </div>
                  <button type="button" aria-label="Keluar" title="Keluar" onClick={() => sync.status.pending ? setConfirmLogout(true) : logout()}
                    className="inline-flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-lg text-brand-100 transition-colors hover:bg-white/15 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
                    <SvgIcon name="logout" className="h-5 w-5" />
                  </button>
                </div>
              ) : (
                <div className="rounded-xl bg-white/10 p-2.5 ring-1 ring-white/15">
                  <label className="block">
                    <span className="text-xs font-medium text-brand-100">Ganti pengguna (mode demo)</span>
                    <select value={currentUserId} onChange={(e) => switchUser(e.target.value)}
                      className="mt-1 w-full min-h-[40px] cursor-pointer rounded-lg border border-slate-300 bg-white px-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500">
                      {db.users.filter(u => u.status !== 'Nonaktif').map(u => <option key={u.id} value={u.id}>{u.name} · {ROLE_LABELS[u.role]}</option>)}
                    </select>
                  </label>
                </div>
              )}
            </div>
          </aside>

          {/* MAIN */}
          <div className="flex min-w-0 flex-1 flex-col overflow-hidden">
            {/* On phones the cashier screen drops the top bar for more room; the bottom bar still has every menu */}
            <header className={cx('z-20 flex h-16 flex-shrink-0 items-center justify-between gap-2 border-b border-slate-200 bg-white px-3 sm:px-6', activeTab === 'pos' && 'max-md:hidden')}>
              <div className="flex min-w-0 items-center gap-2">
                <IconBtn icon="menu" label="Buka menu" onClick={() => setSidebarOpen(true)} className="xl:hidden" />
                <div className="min-w-0">
                  <h1 className="line-clamp-2 text-sm font-bold leading-tight text-slate-900 sm:truncate sm:text-lg">{activeItem.label}</h1>
                  <p className="hidden truncate text-xs text-slate-500 md:block">
                    Halo, {greetingName} · {fmtDateLong(new Date(now))}{hijri && <> · <span className="text-brand-800">{hijri}</span></>}
                  </p>
                </div>
              </div>

              <div className="flex flex-shrink-0 items-center gap-1 sm:gap-2">
                {/* Next prayer */}
                {prayerCfg.enabled && (
                  <button type="button" onClick={() => setShowPrayer(true)}
                    aria-label={`Jadwal sholat. Berikutnya ${nextPrayer.label} pukul ${minToHHMM(nextPrayer.time)}, ${fmtDuration(nextPrayer.inMin)} lagi`}
                    className={cx('inline-flex min-h-[40px] items-center gap-1.5 rounded-xl border border-brand-200 bg-brand-50 px-2 text-xs font-semibold text-brand-900 hover:bg-brand-100 sm:gap-2 sm:px-2.5', focusRing)}>
                    <SvgIcon name="moon" className="h-4 w-4" />
                    <span className="tabular"><span className="hidden sm:inline">{nextPrayer.label} </span>{minToHHMM(nextPrayer.time)}</span>
                    <span className="hidden font-medium text-brand-700 xl:inline">· {fmtDuration(nextPrayer.inMin)} lagi</span>
                  </button>
                )}

                {/* Attendance code on the store's own screen */}
                {attCodeOn && onStoreDevice && <AttendanceCodeChip secret={db.business.attendance_secret} />}

                {/* Attendance quick action for staff */}
                {!isOwner && !isInvestor && (
                  !myAttendance
                    ? <Btn size="sm" icon="login" onClick={clockIn} disabled={clocking} className="min-h-[40px]" aria-label="Absen masuk"><span className="hidden sm:inline">Absen masuk</span></Btn>
                    : !myAttendance.clock_out
                      ? <Btn size="sm" variant="secondary" icon="logout" onClick={clockOut} disabled={clocking} className="min-h-[40px]" aria-label={`Absen pulang. Masuk pukul ${fmtTime(myAttendance.clock_in)}`}><span className="hidden sm:inline">Absen pulang</span></Btn>
                      : <span className="hidden min-h-[40px] items-center gap-1.5 rounded-xl border border-emerald-200 bg-emerald-50 px-2.5 text-xs font-semibold text-emerald-800 sm:inline-flex" title={`Datang ${fmtTime(myAttendance.clock_in)} · pulang ${fmtTime(myAttendance.clock_out)}`}><SvgIcon name="check" className="h-4 w-4" />Sudah absen</span>
                )}

                {cloud ? <SyncChip status={sync.status} onClick={syncClick} /> : (
                <button type="button" aria-pressed={isOfflineMode}
                  aria-label={isOfflineMode ? 'Mode offline aktif. Klik untuk kembali online' : 'Online. Klik untuk beralih ke mode offline'}
                  onClick={() => { setIsOfflineMode(v => !v); notify(isOfflineMode ? 'Kembali online.' : 'Mode offline aktif. Transaksi disimpan di perangkat.', isOfflineMode ? 'success' : 'warn'); }}
                  className={cx('inline-flex min-h-[40px] min-w-[40px] items-center justify-center gap-2 rounded-xl border px-3 text-xs font-semibold transition-colors', focusRing,
                    isOfflineMode ? 'border-amber-300 bg-amber-50 text-amber-900' : 'border-emerald-200 bg-emerald-50 text-emerald-800')}>
                  <span className={cx('h-2 w-2 rounded-full', isOfflineMode ? 'bg-amber-500' : 'bg-emerald-500')} aria-hidden="true" />
                  <span className="hidden lg:inline">{isOfflineMode ? 'Offline' : 'Online'}</span>
                </button>
                )}

                {db.offlineQueue.length > 0 && (
                  <Btn variant="danger" size="sm" icon="refresh" onClick={syncOfflineData} aria-label={`Sinkronkan ${db.offlineQueue.length} transaksi offline`}>
                    <span className="tabular">{db.offlineQueue.length}</span>
                  </Btn>
                )}

                <RefreshButton />

                {!isInvestor && <div className="relative" ref={notifRef}>
                  <button type="button" aria-label={`Notifikasi, ${notifications.length} item${hasUnread ? ', ada yang baru' : ''}`} aria-expanded={showNotifMenu}
                    onClick={() => { setShowNotifMenu(v => !v); setSeenSignature(notifSignature); }}
                    className={cx('relative inline-flex h-11 w-11 items-center justify-center rounded-xl text-slate-600 hover:bg-slate-100 hover:text-slate-900', focusRing)}>
                    <SvgIcon name="bell" className="h-5 w-5" />
                    {hasUnread && <span className="absolute right-2.5 top-2.5 h-2.5 w-2.5 rounded-full bg-rose-500 ring-2 ring-white" aria-hidden="true" />}
                  </button>
                  {showNotifMenu && (
                    <div className="absolute right-0 z-50 mt-2 w-[min(22rem,calc(100vw-1.5rem))] rounded-2xl border border-slate-200 bg-white p-2 shadow-xl animate-pop-in">
                      <p className="px-2 py-1.5 text-sm font-bold text-slate-900">Notifikasi</p>
                      {notifications.length === 0 ? <p className="px-2 py-6 text-center text-sm text-slate-500">Semua aman. Tidak ada notifikasi.</p> : (
                        <ul className="max-h-80 space-y-1 overflow-y-auto">
                          {notifications.map(n => (
                            <li key={n.id}>
                              <button type="button" disabled={!n.go} onClick={() => { if (n.go) { go(n.go); setShowNotifMenu(false); } }}
                                className={cx('flex w-full gap-3 rounded-xl p-2.5 text-left hover:bg-slate-50 disabled:cursor-default', focusRing)}>
                                <span className={cx('mt-0.5 flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg', BADGE_TONES[n.tone].replace(/ring-\S+/g, ''))}>
                                  <SvgIcon name={n.icon} className="h-4 w-4" />
                                </span>
                                <span className="min-w-0">
                                  <span className="block text-sm font-semibold text-slate-900">{n.title}</span>
                                  <span className="block text-sm text-slate-600">{n.msg}</span>
                                  {n.date && <span className="mt-0.5 block text-xs text-slate-500">{fmtDateTime(n.date)}</span>}
                                </span>
                              </button>
                            </li>
                          ))}
                        </ul>
                      )}
                    </div>
                  )}
                </div>}

                <button type="button" aria-label={`Keranjang, ${totalCartCount} item`} onClick={() => setShowCartDrawer(true)}
                  className={cx('relative hidden h-11 w-11 items-center justify-center rounded-xl text-slate-600 hover:bg-slate-100 hover:text-slate-900', !isInvestor && 'sm:inline-flex', focusRing)}>
                  <SvgIcon name="cart" className="h-5 w-5" />
                  {totalCartCount > 0 && <span className="absolute right-0.5 top-0.5 flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-sun-400 px-1 text-xs font-bold text-slate-900 ring-2 ring-white tabular" aria-hidden="true">{totalCartCount}</span>}
                </button>
              </div>
            </header>

            <main id="main" tabIndex={-1} className="flex-1 overflow-y-auto outline-none">
              {/* Keyed by user so page-local state (e.g. owner-only tabs) never leaks across a user switch */}
              <div key={currentUserId} className="mx-auto max-w-[1600px] space-y-5 p-4 sm:p-6">
                {licenseSoon && isOwner && <LicenseReminder days={daysLeft} plan={license.plan} expiresAt={license.expires_at} storeName={db.business.name} storeCode={session.tenant.code} />}
                {activeTab === 'pos' && !isInvestor && <POSMainView {...pageProps} cart={cart} setCart={setCart} isOfflineMode={isOfflineMode} />}
                {activeTab === 'dashboard' && (isOwner || isInvestor) && <DashboardOwnerView db={db} go={go} now={now} />}
                {activeTab === 'sales_report' && <SalesReportModule {...pageProps} />}
                {activeTab === 'products' && <ProductsModule {...pageProps} session={session} />}
                {activeTab === 'customers' && <CustomersModule {...pageProps} />}
                {activeTab === 'purchases' && isOwner && <PurchasesModule {...pageProps} />}
                {activeTab === 'attendance' && <AttendanceModule {...pageProps} session={session} todayKey={todayKey} myAttendance={myAttendance} clockIn={clockIn} clockOut={clockOut} clocking={clocking} deviceId={deviceId} />}
                {activeTab === 'finance' && hasPermission('can_view_finance') && <FinanceModule {...pageProps} />}
                {activeTab === 'debts' && <DebtsModule {...pageProps} />}
                {activeTab === 'incentives' && <IncentivesModule {...pageProps} />}
                {activeTab === 'employees' && isOwner && <EmployeeManagementModule {...pageProps} />}
                {activeTab === 'permissions' && isOwner && <PermissionsMatrixModule {...pageProps} />}
                {activeTab === 'investors' && (isOwner || isInvestor) && <InvestorsModule {...pageProps} />}
                {activeTab === 'settings' && isOwner && <SettingsModule {...pageProps} />}
                {activeTab === 'activity' && isOwner && <ActivityLogModule db={db} session={session} />}
              </div>
            </main>

            {/* MOBILE BOTTOM NAV */}
            <nav aria-label="Navigasi cepat" className="z-30 flex flex-shrink-0 items-stretch justify-around border-t border-slate-200 bg-white pb-[env(safe-area-inset-bottom)] md:hidden">
              {(isInvestor ? [
                { id: 'dashboard', label: 'Dashboard', icon: 'dashboard' },
                { id: 'sales_report', label: 'Laporan', icon: 'report' },
                { id: 'finance', label: 'Laba Rugi', icon: 'finance' }
              ] : [
                { id: 'pos', label: 'Kasir', icon: 'cart' },
                { id: 'sales_report', label: 'Laporan', icon: 'report' },
                isOwner ? { id: 'dashboard', label: 'Dashboard', icon: 'dashboard' } : { id: 'attendance', label: 'Absensi', icon: 'clock' }
              ]).map(t => (
                <button key={t.id} type="button" aria-current={activeTab === t.id ? 'page' : undefined} onClick={() => go(t.id)}
                  className={cx('flex min-h-[56px] flex-1 flex-col items-center justify-center gap-0.5 text-xs font-semibold', focusRing, activeTab === t.id ? 'text-brand-700' : 'text-slate-500')}>
                  <SvgIcon name={t.icon} className="h-5 w-5" />
                  <span>{t.label}</span>
                </button>
              ))}
              <button type="button" onClick={() => setSidebarOpen(true)} className={cx('flex min-h-[56px] flex-1 flex-col items-center justify-center gap-0.5 text-xs font-semibold text-slate-500', focusRing)}>
                <SvgIcon name="menu" className="h-5 w-5" />
                <span>Menu</span>
              </button>
            </nav>
          </div>

          {showCSModal && <CustomerSupportModal onClose={() => setShowCSModal(false)} />}
          {showCartDrawer && <CartQuickDrawer cart={cart} setCart={setCart} notify={notify} products={db.products} onClose={() => setShowCartDrawer(false)} onCheckout={() => { setShowCartDrawer(false); go('pos'); }} />}

          {showPrayer && (
            <PrayerScheduleModal
              times={prayerTimes} clockMinutes={clock.minutes} nextKey={nextPrayer.key} isFriday={isFriday}
              location={location} hijri={hijri} now={now} enabled={prayerCfg.enabled}
              onClose={() => setShowPrayer(false)}
              onSettings={isOwner ? () => { setShowPrayer(false); go('settings'); } : null}
            />
          )}

          {adzanAlert && (
            <Modal title={`Waktunya sholat ${adzanAlert.label}`} onClose={() => setAdzanAlert(null)} size="sm"
              footer={<Btn className="flex-1" onClick={() => setAdzanAlert(null)} autoFocus>Baik</Btn>}>
              <div className="flex flex-col items-center py-2 text-center">
                <span className="flex h-16 w-16 items-center justify-center rounded-full bg-brand-50 text-brand-700"><SvgIcon name="moon" className="h-8 w-8" /></span>
                <p className="mt-3 text-3xl font-bold text-slate-900 tabular">{minToHHMM(adzanAlert.time)} <span className="text-base font-semibold text-slate-500">{TZ_LABEL[location.tz]}</span></p>
                <p className="mt-1 text-sm text-slate-600">{location.city} · {hijri}</p>
                <p className="mt-3 text-sm text-slate-600">Selesaikan transaksi yang sedang berjalan, lalu silakan menunaikan sholat.</p>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    function SidebarItem({ item, active, onClick, badge }) {
      return (
        <button type="button" onClick={onClick} aria-current={active ? 'page' : undefined}
          className={cx('flex w-full min-h-[44px] items-center justify-between gap-2 rounded-xl px-3 text-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white',
            active ? 'bg-white font-semibold text-brand-800 shadow-sm' : 'text-brand-50 hover:bg-white/10 hover:text-white')}>
          <span className="flex items-center gap-3">
            <SvgIcon name={item.icon} className={cx('h-5 w-5', active ? 'text-brand-600' : 'text-brand-200')} />
            {item.label}
          </span>
          {badge != null && <span className={cx('rounded-full px-2 py-0.5 text-xs font-bold tabular', active ? 'bg-sun-400 text-slate-900' : 'bg-sun-300 text-slate-900')}>{badge}</span>}
        </button>
      );
    }

    function PrayerScheduleModal({ times, clockMinutes, nextKey, isFriday, location, hijri, now, enabled, onClose, onSettings }) {
      return (
        <Modal title="Jadwal sholat hari ini" desc={`${location.city} · ${TZ_LABEL[location.tz]}`} onClose={onClose} size="sm"

            <p className="text-sm font-semibold text-brand-900">{hijri}</p>

                  <span className={cx('text-base font-bold tabular', isNext ? 'text-white' : passed ? 'text-slate-400' : 'text-slate-900')}>{minToHHMM(t)}</span>
                </li>

            })}
          </ul>
          <p className="mt-3 text-xs text-slate-500">Dihitung dari koordinat toko dengan kriteria Kemenag RI (Subuh 20°, Isya 18°). Bisa berbeda ±2 menit dari jadwal masjid setempat.{!enabled && ' Pengingat adzan sedang dimatikan.'}</p>
        </Modal>
      );
    }

    // =====================================================================
    // RECEIPT (shared by POS and Sales Report)
    // =====================================================================
    // One renderer for real receipts and the live preview in Settings, so the preview never drifts
    function ReceiptPaper({ sale, business, printable = true, preview = false, className }) {
      const r = business.receipt || {};
      const manualDiscount = (sale.discount || 0) - (sale.coupon_discount || 0);
      return (
        <div className={cx(printable && 'print-area receipt', 'mx-auto w-full rounded-xl border border-dashed border-slate-300 bg-white p-4 font-mono text-xs leading-relaxed text-slate-800', r.paper === '80' ? 'max-w-[300px]' : 'max-w-[230px]', className)}>
          <div className="space-y-0.5 text-center">
            {r.show_logo && (r.logo
              ? <img src={r.logo} alt="" className="mx-auto mb-1 h-12 max-w-[70%] object-contain grayscale" />
              : preview && (
                <span className="mx-auto mb-1 flex h-12 w-12 flex-col items-center justify-center rounded-lg border border-dashed border-slate-400 text-slate-500" title="Logo Anda tampil di sini">
                  <SvgIcon name="shop" className="h-5 w-5" /><span className="font-sans text-[9px] font-semibold">LOGO</span>
                </span>
              ))}
            <p className="text-sm font-bold">{business.name}</p>
            {r.show_address && business.address && <p>{business.address}</p>}
            {r.show_phone && business.phone && <p>Telp {business.phone}</p>}
            {r.header && <p className="pt-1">{r.header}</p>}
          </div>
          <div className="my-2 border-t border-dashed border-slate-300" />
          <p>{sale.receipt_no}{sale.status === 'void' ? ' (BATAL)' : ''}</p>
          <p>{fmtDateTime(sale.date)}</p>
          {r.show_cashier && <p>Kasir: {sale.cashier}</p>}
          {r.show_customer && sale.customer_name && sale.customer_name !== 'Pelanggan Umum' && <p>Pelanggan: {sale.customer_name}</p>}
          <div className="my-2 border-t border-dashed border-slate-300" />
          {sale.items.map((it, idx) => (
            <div key={idx} className="mb-1">
              <p>{it.name}</p>
              <div className="flex justify-between gap-2">
                <span>{it.qty} × {formatIDR(it.sell_price)}{r.show_discount && it.original_price > it.sell_price && <span className="text-slate-500 line-through"> {formatIDR(it.original_price)}</span>}</span>
                <span>{formatIDR(it.sell_price * it.qty)}</span>
              </div>
            </div>
          ))}
          <div className="my-2 border-t border-dashed border-slate-300" />
          <div className="flex justify-between"><span>Subtotal</span><span>{formatIDR(sale.subtotal)}</span></div>
          {r.show_discount && manualDiscount > 0 && <div className="flex justify-between"><span>Diskon</span><span>-{formatIDR(manualDiscount)}</span></div>}
          {r.show_discount && sale.coupon_discount > 0 && <div className="flex justify-between"><span>Voucher {sale.coupon_code}</span><span>-{formatIDR(sale.coupon_discount)}</span></div>}
          {r.show_tax && sale.tax > 0 && <div className="flex justify-between"><span>Pajak</span><span>{formatIDR(sale.tax)}</span></div>}
          {sale.deposit_used > 0 && <div className="flex justify-between"><span>Potong Deposit</span><span>-{formatIDR(sale.deposit_used)}</span></div>}
          {sale.deposit_in > 0 && <div className="flex justify-between"><span>+ Deposit</span><span>{formatIDR(sale.deposit_in)}</span></div>}
          <div className="mt-1 flex justify-between text-sm font-bold"><span>TOTAL</span><span>{formatIDR(sale.total)}</span></div>
          {sale.cash_paid != null && <>
            <div className="flex justify-between"><span>{PAYMENT_LABELS[sale.payment_method]}</span><span>{formatIDR(sale.cash_paid)}</span></div>
            <div className="flex justify-between"><span>Kembali</span><span>{formatIDR(sale.cash_paid - sale.total)}</span></div>
          </>}
          <p className="mt-1">Bayar: <span className={sale.kasbon_status === 'paid' ? 'font-bold' : undefined}>{paymentLabel(sale)}</span></p>
          {sale.deposit_balance != null && <p>Saldo Deposit: {formatIDR(sale.deposit_balance)}</p>}
          {r.show_queue && sale.queue_no && <>
            <div className="my-2 border-t border-dashed border-slate-300" />
            <p className="text-center">No. Antrian</p>
            <p className="text-center text-2xl font-bold leading-tight">{sale.queue_no}</p>
          </>}
          {r.footer && <p className="mt-2 text-center">{r.footer}</p>}
          {r.show_brand && <p className="mt-2 text-center text-[10px] text-slate-500">Dibuat dengan {APP_NAME}</p>}
        </div>
      );
    }

    // ---------- Receipt as text (thermal printers, WhatsApp) ----------
    // Characters per line on common thermal paper with the printer's standard font
    const RECEIPT_COLS = { '58': 32, '80': 48 };
    // Thermal printers only know plain ASCII; Rp amounts use a normal space
    const plainText = (v) => String(v ?? '').replace(/\u00a0/g, ' ').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[×]/g, 'x').replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[^\x20-\x7e]/g, '');
    const money = (v) => plainText(formatIDR(v));
    function wrapText(text, cols) {
      const out = [];
      for (const para of plainText(text).split('\n')) {
        let line = '';
        for (const word of para.split(' ')) {
          if (!line) line = word;
          else if ((line + ' ' + word).length <= cols) line += ' ' + word;
          else { out.push(line); line = word; }
          while (line.length > cols) { out.push(line.slice(0, cols)); line = line.slice(cols); }
        }
        out.push(line);
      }
      return out;
    }
    const twoCols = (left, right, cols) => {
      left = plainText(left); right = plainText(right);
      const space = cols - left.length - right.length;
      return space >= 1 ? left + ' '.repeat(space) + right : [left, ' '.repeat(Math.max(0, cols - right.length)) + right];
    };

    // The same content and switches as <ReceiptPaper>, as lines: { text, align: 'left'|'center', bold, big }
    function receiptLines(sale, business, cols) {
      const r = business.receipt || {};
      const L = [];
      const add = (text, o = {}) => (Array.isArray(text) ? text : [text]).forEach(t => L.push({ text: t, align: 'left', ...o }));
      const center = (text, o) => wrapText(text, cols).forEach(t => add(t, { align: 'center', ...o }));
      const rule = () => add('-'.repeat(cols));
      const row = (a, b, o) => add(twoCols(a, b, cols), o);
      const manualDiscount = (sale.discount || 0) - (sale.coupon_discount || 0);
      center(business.name, { bold: true, big: true });
      if (r.show_address && business.address) center(business.address);
      if (r.show_phone && business.phone) center(`Telp ${business.phone}`);
      if (r.header) center(r.header);
      rule();
      add(`${sale.receipt_no}${sale.status === 'void' ? ' (BATAL)' : ''}`);
      add(plainText(fmtDateTime(sale.date)));
      if (r.show_cashier) add(wrapText(`Kasir: ${sale.cashier}`, cols));
      if (r.show_customer && sale.customer_name && sale.customer_name !== 'Pelanggan Umum') add(wrapText(`Pelanggan: ${sale.customer_name}`, cols));
      rule();
      for (const it of sale.items) {
        add(wrapText(it.name, cols));
        row(`${it.qty} x ${money(it.sell_price)}`, money(it.sell_price * it.qty));
      }
      rule();
      row('Subtotal', money(sale.subtotal));
      if (r.show_discount && manualDiscount > 0) row('Diskon', '-' + money(manualDiscount));
      if (r.show_discount && sale.coupon_discount > 0) row(`Voucher ${sale.coupon_code}`, '-' + money(sale.coupon_discount));
      if (r.show_tax && sale.tax > 0) row('Pajak', money(sale.tax));
      if (sale.deposit_used > 0) row('Potong Deposit', '-' + money(sale.deposit_used));
      if (sale.deposit_in > 0) row('+ Deposit', money(sale.deposit_in));
      row('TOTAL', money(sale.total), { bold: true });
      if (sale.cash_paid != null) { row(PAYMENT_LABELS[sale.payment_method], money(sale.cash_paid)); row('Kembali', money(sale.cash_paid - sale.total)); }
      add(`Bayar: ${paymentLabel(sale)}`);
      if (sale.deposit_balance != null) add(wrapText(`Saldo Deposit: ${money(sale.deposit_balance)}`, cols));
      if (r.show_queue && sale.queue_no) { rule(); center('No. Antrian'); center(String(sale.queue_no), { bold: true, big: true }); }
      if (r.footer) { add(''); center(r.footer); }
      if (r.show_brand) { add(''); center(`Dibuat dengan ${APP_NAME}`); }
      return L;
    }

    // ESC/POS bytes understood by almost every 58/80 mm thermal printer
    async function escposReceipt(sale, business) {
      const paper = business.receipt?.paper === '80' ? '80' : '58';
      const cols = RECEIPT_COLS[paper];
      const bytes = [];
      const push = (...b) => b.forEach(x => Array.isArray(x) || x instanceof Uint8Array ? bytes.push(...x) : bytes.push(x));
      const text = (t) => push(...new TextEncoder().encode(t));
      push(0x1b, 0x40); // reset
      if (business.receipt?.show_logo && business.receipt?.logo) {
        try { push(0x1b, 0x61, 1); push(await logoRaster(business.receipt.logo, paper === '80' ? 576 : 384)); push(0x0a); } catch { /* print without logo */ }
      }
      for (const l of receiptLines(sale, business, cols)) {
        push(0x1b, 0x61, l.align === 'center' ? 1 : 0);
        push(0x1b, 0x45, l.bold ? 1 : 0);
        // Double height only, so a line still fits the same number of characters
        push(0x1d, 0x21, l.big ? 0x01 : 0x00);
        text(l.text); push(0x0a);
      }
      push(0x1b, 0x45, 0, 0x1d, 0x21, 0);
      push(0x0a, 0x0a, 0x0a, 0x1d, 0x56, 0x42, 0x00); // feed, then cut if the printer has a cutter
      return new Uint8Array(bytes);
    }

    // Logo as a 1-bit raster image (GS v 0), at most half the paper width
    function logoRaster(src, paperDots) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            const w = Math.max(8, Math.min(Math.floor(paperDots / 2 / 8) * 8, Math.ceil(img.width / 8) * 8));
            const h = Math.max(1, Math.round(img.height * w / img.width));
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
            const px = ctx.getImageData(0, 0, w, h).data;
            const rowBytes = w / 8, data = new Uint8Array(rowBytes * h);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
              const i = (y * w + x) * 4;
              if (px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11 < 150) data[y * rowBytes + (x >> 3)] |= 0x80 >> (x & 7);
            }
            resolve([0x1d, 0x76, 0x30, 0x00, rowBytes & 0xff, rowBytes >> 8, h & 0xff, h >> 8, ...data]);
          } catch (e) { reject(e); }
        };
        img.onerror = reject;
        img.src = src;
      });
    }

    // ---------- Printer connection (remembered per device) ----------
    const PRINTER_KEY = 'kasirbosku_printer';
    const isAndroid = /Android/i.test(navigator.userAgent);
    const PRINTER_METHODS = [
      { id: 'bluetooth', label: 'Bluetooth langsung', desc: 'Printer Bluetooth yang mendukung BLE. Chrome di Android, Windows, atau Mac.', ok: () => !!navigator.bluetooth },
      { id: 'rawbt', label: 'Bluetooth lewat aplikasi RawBT', desc: 'Untuk hampir semua printer Bluetooth murah di Android. Pasang aplikasi RawBT dari Play Store, lalu sambungkan printer di sana sekali.', ok: () => isAndroid },
      { id: 'usb', label: 'USB langsung', desc: 'Printer USB (di HP pakai kabel OTG). Chrome di Android atau komputer.', ok: () => !!navigator.usb },
      { id: 'browser', label: 'Printer terpasang (dialog cetak)', desc: 'Printer yang sudah terpasang di komputer/HP, termasuk printer USB berdriver di Windows dan AirPrint di iPhone.', ok: () => true }
    ];
    const loadPrinter = () => readLocal(PRINTER_KEY, null);
    // Bluetooth service ids used by common thermal printers
    const BT_SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455', '0000ff00-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000fee7-0000-1000-8000-00805f9b34fb'];
    const printerLink = { bt: null, usb: null }; // open connections, reused while the app is open

    async function btWrite(bytes) {
      let ch = printerLink.bt;
      if (!ch || !ch.service.device.gatt.connected) {
        const device = ch?.service.device.gatt ? ch.service.device : await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BT_SERVICES });
        const server = await device.gatt.connect();
        ch = null;
        for (const svc of await server.getPrimaryServices()) {
          for (const c of await svc.getCharacteristics()) if (c.properties.writeWithoutResponse || c.properties.write) { ch = c; break; }
          if (ch) break;
        }
        if (!ch) throw new Error('Printer ini tidak bisa menerima data lewat Bluetooth langsung. Coba cara RawBT.');
        printerLink.bt = ch;
        writeLocal(PRINTER_KEY, { ...(loadPrinter() || {}), method: 'bluetooth', name: device.name || 'Printer Bluetooth' });
      }
      for (let i = 0; i < bytes.length; i += 180) {
        const part = bytes.slice(i, i + 180);
        if (ch.properties.writeWithoutResponse) await ch.writeValueWithoutResponse(part); else await ch.writeValue(part);
        await new Promise(r => setTimeout(r, 20));
      }
    }

    async function usbWrite(bytes) {
      let link = printerLink.usb;
      if (!link) {
        const device = await navigator.usb.requestDevice({ filters: [] });
        await device.open();
        if (device.configuration === null) await device.selectConfiguration(1);
        let found = null;
        for (const itf of device.configuration.interfaces) {
          for (const alt of itf.alternates) {
            const ep = alt.endpoints.find(e => e.direction === 'out');
            if (ep) { found = { itf: itf.interfaceNumber, ep: ep.endpointNumber }; break; }
          }
          if (found) break;
        }
        if (!found) throw new Error('Perangkat USB ini bukan printer.');
        try { await device.claimInterface(found.itf); }
        catch { throw new Error('Printer sedang dipakai driver komputer. Pilih cara "Printer terpasang (dialog cetak)".'); }
        link = printerLink.usb = { device, ...found };
        writeLocal(PRINTER_KEY, { ...(loadPrinter() || {}), method: 'usb', name: device.productName || 'Printer USB' });
      }
      await link.device.transferOut(link.ep, bytes);
    }

    function rawbtSend(bytes) {
      let bin = '';
      for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
      // Opens RawBT (or its Play Store page if it is not installed yet)
      window.location.href = `intent:base64,${btoa(bin)}#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;`;
    }

    // Normal print dialog, with the page sized exactly to the receipt so nothing is cut or scaled down
    function browserPrint(paper) {
      const el = document.querySelector('.print-area.receipt');
      const widthMm = paper === '80' ? 80 : 58;
      const heightMm = el ? Math.ceil(el.scrollHeight / 3.78 * (widthMm / (el.offsetWidth / 3.78))) + 8 : 200;
      const style = document.createElement('style');
      style.textContent = `@media print { @page { size: ${widthMm}mm ${heightMm}mm; margin: 0; }
        .print-area.receipt { width: ${widthMm}mm !important; max-width: none !important; padding: 2mm ${paper === '80' ? 4 : 3}mm !important; border: 0 !important; border-radius: 0 !important; font-size: ${paper === '80' ? 11 : 9}pt !important; } }`;
      document.head.appendChild(style);
      const done = () => { style.remove(); window.removeEventListener('afterprint', done); };
      window.addEventListener('afterprint', done);
      window.print();
      setTimeout(done, 60000);
    }

    async function printReceipt(sale, business, method) {
      const paper = business.receipt?.paper === '80' ? '80' : '58';
      if (method === 'browser') return browserPrint(paper);
      const bytes = await escposReceipt(sale, business);
      if (method === 'bluetooth') return btWrite(bytes);
      if (method === 'usb') return usbWrite(bytes);
      if (method === 'rawbt') return rawbtSend(bytes);
    }

    function PrinterSetupModal({ onClose, onChosen }) {
      const current = loadPrinter();
      const methods = PRINTER_METHODS.filter(m => m.ok());
      return (
        <Modal title="Pilih cara mencetak" desc="Disimpan di perangkat ini saja. Ukuran kertas diatur di Pengaturan Toko → Struk." onClose={onClose} size="sm"
          footer={<Btn variant="secondary" className="flex-1" onClick={onClose}>Batal</Btn>}>
          <ul className="space-y-2">
            {methods.map(m => (
              <li key={m.id}>
                <button type="button" onClick={() => { writeLocal(PRINTER_KEY, { method: m.id, name: m.label }); onChosen(m.id); }}
                  className={cx('w-full rounded-xl border p-3 text-left transition-colors hover:border-brand-500 hover:bg-brand-50', focusRing, current?.method === m.id ? 'border-brand-600 bg-brand-50' : 'border-slate-200')}>
                  <span className="block text-sm font-semibold text-slate-900">{m.label}{current?.method === m.id && <Badge tone="teal" className="ml-2 align-middle">Dipakai</Badge>}</span>
                  <span className="mt-0.5 block text-xs text-slate-600">{m.desc}</span>
                </button>
              </li>
            ))}
          </ul>
          {!navigator.bluetooth && !isAndroid && <p className="mt-3 text-xs text-slate-500">Di iPhone/iPad, cetak lewat printer yang mendukung AirPrint, atau pakai aplikasi printer thermal yang menyediakan fitur cetak.</p>}
        </Modal>
      );
    }

    // The receipt drawn as a picture that looks like the on-screen preview (for sharing on WhatsApp)
    async function receiptImageFile(sale, business) {
      const cols = RECEIPT_COLS['58'];
      const S = 2, font = 22 * S, lineH = Math.round(font * 1.45), pad = 28 * S;
      const mono = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace';
      const probe = document.createElement('canvas').getContext('2d');
      probe.font = `${font}px ${mono}`;
      const charW = probe.measureText('M').width;
      const W = Math.ceil(charW * cols + pad * 2);
      const lines = receiptLines(sale, business, cols);
      let logo = null;
      if (business.receipt?.show_logo && business.receipt?.logo) {
        logo = await new Promise(res => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => res(null); i.src = business.receipt.logo; });
      }
      const logoH = logo ? Math.min(110 * S, logo.height * Math.min(1, (W * 0.5) / logo.width)) : 0;
      const H = pad * 2 + (logo ? logoH + 12 * S : 0) + lines.reduce((a, l) => a + (l.big ? lineH * 1.25 : lineH), 0);
      const c = document.createElement('canvas'); c.width = W; c.height = Math.ceil(H);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, c.height);
      let y = pad;
      if (logo) {
        const lw = logo.width * (logoH / logo.height);
        ctx.filter = 'grayscale(1)';
        ctx.drawImage(logo, (W - lw) / 2, y, lw, logoH);
        ctx.filter = 'none';
        y += logoH + 12 * S;
      }
      ctx.fillStyle = '#1e293b'; ctx.textBaseline = 'top';
      for (const l of lines) {
        const size = l.big ? Math.round(font * 1.2) : font;
        ctx.font = `${l.bold || l.big ? 'bold ' : ''}${size}px ${mono}`;
        const text = l.text.trimEnd();
        if (/^-+$/.test(text)) {
          // dashed rule, like the preview
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = S; ctx.setLineDash([6 * S, 5 * S]);
          ctx.beginPath(); ctx.moveTo(pad, y + lineH / 2); ctx.lineTo(W - pad, y + lineH / 2); ctx.stroke(); ctx.setLineDash([]);
        } else if (l.align === 'center') {
          ctx.textAlign = 'center'; ctx.fillText(text, W / 2, y);
        } else {
          ctx.textAlign = 'left';
          // keep the receipt's columns: draw character runs at fixed positions
          ctx.fillText(l.text, pad, y);
        }
        y += l.big ? lineH * 1.25 : lineH;
      }
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));
      return new File([blob], `Struk-${sale.receipt_no}.jpg`, { type: 'image/jpeg' });
    }

    // The message that goes with every receipt sent to a customer
    function receiptThanks(sale, business) {
      return [`Terima kasih telah berbelanja di ${business.name}.`, `No. invoice: ${sale.receipt_no}`, `Total: ${formatIDR(sale.total)}`].join('\n');
    }

    // Phone: the system share sheet (pick WhatsApp, then the customer).
    // `file` must already be made: Android only allows sharing straight from the tap, so nothing slow may run before navigator.share.
    // Computer: the picture is saved and copied, and the customer's chat opens so it can be pasted.
    async function shareReceiptImage(file, sale, business, phone) {
      const caption = receiptThanks(sale, business);
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], text: caption }); return 'shared'; }
        catch (e) {
          if (e && e.name === 'AbortError') return 'cancelled';
          if (e && e.name === 'NotAllowedError') return 'retry';
          throw e;
        }
      }
      const url = URL.createObjectURL(file);
      const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      let copied = false;
      try {
        if (window.ClipboardItem && navigator.clipboard?.write) {
          const c = document.createElement('canvas'); const img = await createImageBitmap(file);
          c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0);
          const png = await new Promise(res => c.toBlob(res, 'image/png'));
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
          copied = true;
        }
      } catch {}
      if (phone) window.open(`https://wa.me/${phone}?text=${encodeURIComponent(caption)}`, '_blank', 'noopener');
      return copied ? 'copied' : 'downloaded';
    }

    const LOG_TONES = { penjualan: 'bg-emerald-50 text-emerald-700', kas: 'bg-amber-50 text-amber-700', produk: 'bg-brand-50 text-brand-700', absensi: 'bg-violet-50 text-violet-700', keuangan: 'bg-rose-50 text-rose-700', akun: 'bg-slate-100 text-slate-600' };
    const LOG_ICONS = { penjualan: 'receipt', kas: 'cash', produk: 'products', pelanggan: 'customers', absensi: 'clock', karyawan: 'users', keuangan: 'finance', pembelian: 'purchases', promo: 'incentives', pengaturan: 'settings', akun: 'login' };

    // Entries written before "Deposit" replaced the old term
    const newTerms = (text) => text.replace(/ninggal uang/gi, 'Deposit');
    function ActivityLogModule({ db, session }) {
      const cloud = !!session;
      const [logs, setLogs] = useState([]);
      const [more, setMore] = useState(false);
      const [loading, setLoading] = useState(cloud);
      const [error, setError] = useState('');
      const [user, setUser] = useState('');
      const [kind, setKind] = useState('');
      const [search, setSearch] = useState('');
      const [range, setRange] = useState('today');
      const [customFrom, setCustomFrom] = useState(addDays(dateKey(), -6));
      const [customTo, setCustomTo] = useState(dateKey());
      const [from, to] = rangeBounds(range, customFrom, customTo);
      const startIso = new Date(from + 'T00:00:00').toISOString();
      const endIso = new Date(addDays(to, 1) + 'T00:00:00').toISOString();
      const latest = useRef(0);
      // Entries still on this device (not sent yet, or the whole log in demo mode)
      const local = (readLocal(logQueueKey(cloud ? session.tenant.id : null), []) || []).slice().reverse();

      const load = async (before) => {
        if (!cloud) return;
        const req = ++latest.current;
        setLoading(true); setError('');
        try {
          const qs = new URLSearchParams({ limit: '100', before: before || endIso, after: startIso, ...(user ? { user } : {}), ...(kind ? { kind } : {}) });
          const r = await apiFetch(`/api/logs?${qs}`, { token: session.token });
          if (req !== latest.current) return;
          setLogs(prev => before ? [...prev, ...r.logs] : r.logs);
          setMore(r.more);
        } catch (e) { if (req === latest.current) setError(e.status === 0 ? 'Log di server butuh internet. Yang tampil hanya catatan di perangkat ini.' : e.message); }
        finally { if (req === latest.current) setLoading(false); }
      };
      useEffect(() => { load(); }, [user, kind, startIso, endIso]);

      const q = search.trim().toLowerCase();
      const pendingIds = new Set(local.map(l => l.id));
      const all = [...local.filter(l => (!user || l.user_id === user) && (!kind || l.kind === kind) && l.at >= startIso && l.at < endIso), ...logs.filter(l => !pendingIds.has(l.id))]
        .filter(l => !q || `${l.action} ${l.detail} ${l.user_name}`.toLowerCase().includes(q))
        .sort((a, b) => String(b.at).localeCompare(String(a.at)));
      const groups = [];
      all.forEach(l => { const d = dateKey(new Date(l.at)); const g = groups[groups.length - 1]; if (g && g.day === d) g.items.push(l); else groups.push({ day: d, items: [l] }); });

            )}
            <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
              <Field label="Orang"><select value={user} onChange={e => setUser(e.target.value)} className={inputCls}><option value="">Semua orang</option>{db.users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</select></Field>
              <Field label="Jenis"><select value={kind} onChange={e => setKind(e.target.value)} className={inputCls}><option value="">Semua jenis</option>{Object.entries(LOG_KINDS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></Field>

            </div>
            {error && <p className="mt-3 text-sm font-medium text-amber-700" role="status">{error}</p>}

          {all.length === 0 ? (
            <Card className="p-4"><EmptyState icon="history" title={loading ? 'Memuat log…' : 'Tidak ada aktivitas di periode ini'} desc={loading ? '' : 'Coba pilih periode lain.'} /></Card>
          ) : groups.map(g => (

              <h3 className="border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-900">{fmtDateLong(new Date(g.day + 'T12:00:00'))}</h3>

                {g.items.map(l => (

                    <div className="min-w-0 flex-1">
                      <p className="text-sm font-medium text-slate-900">{newTerms(l.action)}</p>

    // =====================================================================
    // DASHBOARD (OWNER)
