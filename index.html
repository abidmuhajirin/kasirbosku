    const EMPTY_PRODUCT = { name: '', sku: '', category: 'Coffee', buy_price: 10000, sell_price: 25000, promo_price: 0, stock: 20, min_stock: 5, unit: 'Pcs', img: '', variants: [] };

    // ---------- Bulk product import: Excel/CSV, with an optional ZIP of photos named after each SKU ----------
    const IMPORT_MAX_ROWS = 2000;
    const IMPORT_BATCH = 50;
    const IMPORT_MAX_FILE = 5 * 1024 * 1024;
    const IMPORT_MAX_ZIP = 100 * 1024 * 1024;
    const IMPORT_COLUMNS = [
      { key: 'name', header: 'Nama produk', required: true, aliases: ['nama', 'produk', 'nama barang'], width: 34 },
      { key: 'sku', header: 'SKU', aliases: ['kode', 'kode produk', 'barcode'], width: 16 },
      { key: 'category', header: 'Kategori', required: true, width: 18 },
      { key: 'buy_price', header: 'Harga beli', aliases: ['hpp', 'modal'], width: 14 },
      { key: 'sell_price', header: 'Harga jual', required: true, aliases: ['harga'], width: 14 },
      { key: 'promo_price', header: 'Harga promo', aliases: ['harga coret'], width: 14 },
      { key: 'stock', header: 'Stok', aliases: ['jumlah stok'], width: 10 },
      { key: 'min_stock', header: 'Stok minimum', aliases: ['stok min', 'min stok', 'minimal stok'], width: 14 },
      { key: 'unit', header: 'Satuan', width: 10 },
      { key: 'no_stock', header: 'Tanpa stok', width: 12 }
    ];
    // The template's sample row. Left in the file, it is skipped, so it never lands in the catalog.
    const IMPORT_EXAMPLE_NAME = 'Contoh Es Kopi Susu';
    const importExample = (db) => [IMPORT_EXAMPLE_NAME, 'CONTOH-001', db.categories.find(c => c !== 'Semua') || 'Minuman', 8000, 18000, 15000, 50, 5, 'Cup', 'Tidak'];
    const importHeader = (c) => c.required ? `${c.header} *` : c.header;
    const headerKey = (text) => String(text ?? '').replace(/\*/g, '').trim().toLowerCase();
    // Spreadsheet text that starts with these runs as a formula when the report is opened
    const safeCell = (v) => /^[=+\-@]/.test(String(v ?? '')) ? `'${v}` : v;

    function excelCellText(v) {
      if (v == null) return '';
      if (typeof v === 'object') {
        if (v instanceof Date) return dateKey(v);
        if (v.richText) return v.richText.map(t => t.text).join('');
        if ('result' in v) return excelCellText(v.result);
        if ('text' in v) return String(v.text);
        return '';
      }
      return v;
    }
    function parseCsv(text) {
      const firstLine = text.slice(0, text.indexOf('\n') + 1 || undefined);
      const sep = [';', ',', '\t'].sort((a, b) => firstLine.split(b).length - firstLine.split(a).length)[0];
      const rows = [];
      let row = [], cell = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quoted) {
          if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (c === '"') quoted = false;
          else cell += c;
        } else if (c === '"' && cell === '') quoted = true;
        else if (c === sep) { row.push(cell); cell = ''; }
        else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
        else if (c !== '\r') cell += c;
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      return rows;
    }
    async function readImportRows(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      if (file.size > IMPORT_MAX_FILE) throw new Error('File terlalu besar. Maksimal 5 MB.');
      if (ext === 'csv' || ext === 'txt') {
        const buf = await file.arrayBuffer();
        const utf8 = new TextDecoder('utf-8').decode(buf);
        return parseCsv((utf8.includes('�') ? new TextDecoder('windows-1252').decode(buf) : utf8).replace(/^﻿/, ''));
      }
      if (ext !== 'xlsx') throw new Error('Format file harus .xlsx atau .csv. File .xls lama perlu disimpan ulang sebagai .xlsx.');
      try { if (!window.ExcelJS) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'); }
      catch { throw new Error('Membaca Excel butuh internet untuk pertama kali. Coba lagi saat online, atau pakai file CSV.'); }
      const wb = new window.ExcelJS.Workbook();
      try { await wb.xlsx.load(await file.arrayBuffer()); }
      catch { throw new Error('File Excel tidak bisa dibaca. Pastikan file tidak rusak dan tidak dikunci password.'); }
      const ws = wb.getWorksheet('Produk') || wb.worksheets[0];
      if (!ws) throw new Error('File Excel tidak punya sheet.');
      const rows = [];
      ws.eachRow({ includeEmpty: true }, (r) => { rows[r.number - 1] = r.values.slice(1).map(excelCellText); });
      return Array.from(rows, r => r || []);
    }

    // "Rp 25.000", "25,000" and 25000 are the same number; returns null when it is not a number
    function importNumber(v) {
      if (typeof v === 'number') return Number.isFinite(v) ? v : null;
      const s = String(v ?? '').replace(/rp\.?/i, '').replace(/\s/g, '');
      if (/^\d+$/.test(s)) return Number(s);
      if (/^\d{1,3}([.,]\d{3})+$/.test(s)) return Number(s.replace(/[.,]/g, ''));
      if (/^\d+[.,]\d{1,2}$/.test(s)) return Number(s.replace(',', '.'));
      return null;
    }
    function checkImportRows(table, db, isOwner) {
      const headerAt = table.slice(0, 5).findIndex(r => (r || []).some(c => IMPORT_COLUMNS.some(col => col.key === 'name' && [col.header.toLowerCase(), ...col.aliases].includes(headerKey(c)))));
      if (headerAt < 0) throw new Error('Kolom "Nama produk" tidak ditemukan. Pakai template yang disediakan.');
      const columnOf = {};
      table[headerAt].forEach((c, i) => {
        const col = IMPORT_COLUMNS.find(x => [x.header.toLowerCase(), ...(x.aliases || [])].includes(headerKey(c)));
        if (col && columnOf[col.key] === undefined) columnOf[col.key] = i;
      });
      const missing = IMPORT_COLUMNS.filter(c => c.required && columnOf[c.key] === undefined).map(c => c.header);
      if (missing.length) throw new Error(`Kolom wajib tidak ada: ${missing.join(', ')}.`);

      const rows = table.map((r, i) => ({ r: r || [], line: i + 1 })).slice(headerAt + 1).filter(({ r }) => r.some(c => String(c ?? '').trim() !== '') && String(r[columnOf.name] ?? '').trim() !== IMPORT_EXAMPLE_NAME);
      if (!rows.length) throw new Error('File belum berisi produk.');
      if (rows.length > IMPORT_MAX_ROWS) throw new Error(`Maksimal ${IMPORT_MAX_ROWS} produk per file. File ini berisi ${rows.length}.`);

      const skuInFile = new Map();
      const skuInStore = new Map(db.products.map(p => [p.sku.toUpperCase(), p]));
      const nameInStore = new Set(db.products.map(p => p.name.trim().toLowerCase()));
      const categories = db.categories.filter(c => c !== 'Semua');
      return rows.map(({ r, line }) => {
        const get = (k) => columnOf[k] === undefined ? '' : r[columnOf[k]];
        const text = (k) => String(get(k) ?? '').trim();
        const errors = [], warnings = [];
        const name = text('name');
        if (!name) errors.push('Nama produk kosong.');
        else if (name.length > 80) errors.push('Nama produk lebih dari 80 karakter.');
        else if (nameInStore.has(name.toLowerCase())) warnings.push('Nama sama dengan produk yang sudah ada.');

        const sku = text('sku').toUpperCase();
        if (sku.length > 30) errors.push('SKU lebih dari 30 karakter.');
        else if (sku && skuInStore.has(sku)) errors.push(`SKU ${sku} sudah dipakai "${skuInStore.get(sku).name}".`);
        else if (sku && skuInFile.has(sku)) errors.push(`SKU ${sku} dobel dengan baris ${skuInFile.get(sku)}.`);
        else if (sku) skuInFile.set(sku, line);

        const rawCat = text('category');
        const known = categories.find(c => c.toLowerCase() === rawCat.toLowerCase());
        let newCategory = false;
        if (!rawCat) errors.push('Kategori kosong.');
        else if (rawCat.length > 40) errors.push('Kategori lebih dari 40 karakter.');
        else if (!known && !isOwner) errors.push(`Kategori "${rawCat}" belum ada. Minta Bos menambahkannya.`);
        else if (!known) { newCategory = true; warnings.push(`Kategori baru "${rawCat}" akan dibuat.`); }

        const money = (k, label) => {
          if (text(k) === '') return 0;
          const n = importNumber(get(k));
          if (n === null || n < 0) { errors.push(`${label} bukan angka yang benar.`); return 0; }
          return Math.round(n);
        };
        const count = (k, label) => {
          if (text(k) === '') return 0;
          const n = importNumber(get(k));
          if (n === null || n < 0 || !Number.isInteger(n)) { errors.push(`${label} harus bilangan bulat 0 atau lebih.`); return 0; }
          return n;
        };
        const buy = money('buy_price', 'Harga beli');
        const sell = money('sell_price', 'Harga jual');
        const promo = money('promo_price', 'Harga promo');
        if (text('sell_price') === '') errors.push('Harga jual kosong.');
        else if (sell <= 0 && !errors.some(e => e.startsWith('Harga jual'))) errors.push('Harga jual harus lebih dari 0.');
        if (sell > 0 && sell < buy) warnings.push('Harga jual lebih rendah dari harga beli.');
        if (promo > 0 && promo >= sell) errors.push('Harga promo harus lebih rendah dari harga jual.');

        const flag = text('no_stock').toLowerCase();
        if (flag && !['ya', 'y', 'tidak', 't', 'true', 'false', '1', '0'].includes(flag)) errors.push('Tanpa stok harus diisi Ya atau Tidak.');
        const noStock = ['ya', 'y', 'true', '1'].includes(flag);
        const stock = count('stock', 'Stok');
        const minStock = count('min_stock', 'Stok minimum');
        const unit = text('unit') || 'Pcs';
        if (unit.length > 20) errors.push('Satuan lebih dari 20 karakter.');

        return {
          line, errors, warnings, newCategory,
          data: { name, sku, category: known || rawCat, buy_price: buy, sell_price: sell, promo_price: promo, stock: noStock ? 0 : stock, min_stock: noStock ? 0 : minStock, unit, no_stock: noStock }
        };
      });
    }
    async function readPhotoZip(file) {
      if (file.size > IMPORT_MAX_ZIP) throw new Error('ZIP terlalu besar. Maksimal 100 MB.');
      try { if (!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'); }
      catch { throw new Error('Membaca ZIP butuh internet untuk pertama kali.'); }
      let zip;
      try { zip = await window.JSZip.loadAsync(file); } catch { throw new Error('File ZIP tidak bisa dibaca.'); }
      const photos = new Map();
      zip.forEach((path, entry) => {
        const base = path.split('/').pop();
        const m = base.match(/^(.+)\.(jpe?g|png|webp)$/i);
        if (!entry.dir && m && !path.startsWith('__MACOSX') && !base.startsWith('.')) photos.set(m[1].trim().toUpperCase(), { entry, base, type: `image/${m[2].toLowerCase().replace('jpg', 'jpeg')}` });
      });
      if (!photos.size) throw new Error('ZIP tidak berisi foto JPG, PNG, atau WEBP.');
      return photos;
    }
    async function downloadImportTemplate(db, how) {
      const headers = IMPORT_COLUMNS.map(importHeader);
      const csvRows = [headers, importExample(db)];
      if (how === 'csv') return downloadCsv('Template_Produk_KasirBosku.csv', csvRows, ';');
      try {
        if (!window.ExcelJS) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
        const wb = new window.ExcelJS.Workbook();
        const ws = wb.addWorksheet('Produk', { views: [{ state: 'frozen', ySplit: 1 }] });
        ws.columns = IMPORT_COLUMNS.map((c, i) => ({ header: headers[i], width: c.width }));
        ws.getRow(1).eachCell(c => { c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1A4FE6' } }; c.alignment = { vertical: 'middle' }; });
        ws.getRow(1).height = 22;
        ws.getRow(2).values = importExample(db);
        ws.getRow(2).font = { italic: true, color: { argb: 'FF64748B' } };
        const cats =db.categories.filter(c => c !== 'Semua' && !/[",]/.test(c)).join(',');
        for (let r = 2; r <= IMPORT_MAX_ROWS + 1; r++) {
          if (cats && cats.length < 250) ws.getCell(r, 3).dataValidation = { type: 'list', allowBlank: true, showErrorMessage: false, formulae: [`"${cats}"`] };
          ws.getCell(r, 10).dataValidation = { type: 'list', allowBlank: true, formulae: ['"Ya,Tidak"'] };
        }
        const guide = wb.addWorksheet('Petunjuk');
        guide.columns = [{ width: 18 }, { width: 80 }];
        [['Kolom', 'Cara mengisi'],
          ['Baris contoh', `Baris "${IMPORT_EXAMPLE_NAME}" hanya contoh dan tidak ikut diimpor. Boleh dibiarkan atau ditimpa.`],
          ['Nama produk *', 'Wajib. Maksimal 80 karakter.'],
          ['SKU', 'Boleh kosong, aplikasi membuatkan. Tidak boleh sama dengan SKU lain. Nama foto di ZIP mengikuti SKU, contoh KOP-001.jpg.'],
          ['Kategori *', 'Wajib. Kategori yang belum ada dibuat otomatis kalau diimpor oleh Bos.'],
          ['Harga beli', 'Angka saja. Dipakai sebagai HPP.'],
          ['Harga jual *', 'Wajib, lebih dari 0.'],
          ['Harga promo', 'Boleh kosong. Harus lebih rendah dari harga jual.'],
          ['Stok', 'Bilangan bulat. Kosong berarti 0.'],
          ['Stok minimum', 'Batas peringatan stok menipis.'],
          ['Satuan', 'Contoh Pcs, Cup, Porsi. Kosong berarti Pcs.'],
          ['Tanpa stok', 'Ya untuk produk yang dijual tanpa menghitung stok, Stok diabaikan.'],
          ['Varian', 'Tidak lewat file ini. Tambahkan dari Edit produk setelah diimpor.']
        ].forEach((row, i) => { const r = guide.addRow(row); r.alignment = { wrapText: true, vertical: 'top' }; if (!i) r.font = { bold: true }; });
        const blob = new Blob([await wb.xlsx.writeBuffer()], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'Template_Produk_KasirBosku.xlsx';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        return 'xlsx';
      } catch {
        downloadCsv('Template_Produk_KasirBosku.csv', csvRows, ';');
        return 'csv';
      }
    }

    function ProductImportModal({ db, setDb, notify, currentUser, isOwner, session, onClose }) {
      const [step, setStep] = useState('pick'); // pick, check, run, done
      const [file, setFile] = useState(null);
      const [rows, setRows] = useState([]);
      const [photos, setPhotos] = useState(null);
      const [zipName, setZipName] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState('');
      const [progress, setProgress] = useState(0);
      const [result, setResult] = useState(null);

      const valid = rows.filter(r => !r.errors.length);
      const problems = rows.filter(r => r.errors.length);
      const warned = valid.filter(r => r.warnings.length);
      const withPhoto = photos ? valid.filter(r => r.data.sku && photos.has(r.data.sku)).length : 0;
      const unusedPhotos = photos ? [...photos.keys()].filter(k => !valid.some(r => r.data.sku === k)) : [];

      const pickTable = (f) => { if (f) { setError(''); setFile(f); } };
      const checkFile = async () => {
        setError(''); setBusy('Memeriksa file…');
        try { setRows(checkImportRows(await readImportRows(file), db, isOwner)); setStep('check'); }
        catch (e) { setError(e.message); }
        finally { setBusy(''); }
      };
      const pickZip = async (f) => {
        if (!f) return;
        setError(''); setBusy('Membaca foto…');
        try { setPhotos(await readPhotoZip(f)); setZipName(f.name); }
        catch (e) { setError(e.message); }
        finally { setBusy(''); }
      };
      const photoFor = async (sku) => {
        const p = photos?.get(sku);
        if (!p) return '';
        const blob = await p.entry.async('blob');
        const dataUrl = await imageFileToDataUrl(new File([blob], p.base, { type: p.type }), { size: 480, mode: 'cover', maxBytes: 60 * 1024 });
        if (!session) return dataUrl;
        // Sent now, so hundreds of photos never have to wait in the device's storage
        try {
          const { url } = await apiFetch('/api/files', { token: session.token, method: 'POST', blob: await (await fetch(dataUrl)).blob() });
          return url;
        } catch { return dataUrl; }
      };

      const run = async () => {
        setStep('run'); setProgress(0); setError('');
        const failed = problems.map(r => ({ line: r.line, name: r.data.name, reason: r.errors.join(' ') }));
        const photoNotes = [];
        const taken = new Set(db.products.map(p => p.sku.toUpperCase()));
        valid.forEach(r => r.data.sku && taken.add(r.data.sku));
        const freshSku = () => { let k; do { k = `SKU-${Math.floor(10000 + Math.random() * 90000)}`; } while (taken.has(k)); taken.add(k); return k; };
        const newCats = [...new Set(valid.filter(r => r.newCategory).map(r => r.data.category))]
          .filter((c, i, list) => list.findIndex(x => x.toLowerCase() === c.toLowerCase()) === i);
        const stamp = (() => { const d = new Date(); return `${dateKey(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; })();
        let added = 0;
        for (let i = 0; i < valid.length; i += IMPORT_BATCH) {
          const batch = valid.slice(i, i + IMPORT_BATCH);
          const products = [];
          for (const r of batch) {
            let img = '';
            try { img = await photoFor(r.data.sku); }
            catch { photoNotes.push({ line: r.line, name: r.data.name, reason: 'Produk masuk tanpa foto: foto tidak bisa dibaca.' }); }
            const { sku, category, ...rest } = r.data;
            const finalCategory = newCats.find(c => c.toLowerCase() === category.toLowerCase()) || category;
            products.push({ ...rest, id: generateId('P'), sku: sku || freshSku(), category: finalCategory, img, variants: [] });
          }
          const history = products.filter(p => !p.no_stock && p.stock > 0).map(p => ({ id: generateId('SH'), date: stamp, sku: p.sku, name: p.name, qtyChange: `+${p.stock}`, type: 'Stok awal impor massal', user: currentUser.name }));
          setDb(prev => ({
            ...prev,
            categories: i === 0 && newCats.length ? [...prev.categories, ...newCats] : prev.categories,
            products: [...[...products].reverse(), ...prev.products],
            stockHistory: [...history, ...prev.stockHistory]
          }));
          added += products.length;
          setProgress(Math.round(added / valid.length * 100));
          await new Promise(r => setTimeout(r, 30));
        }
        setResult({ added, failed, photoNotes, photos: withPhoto - photoNotes.length, newCats });
        setStep('done');
        notify(`${added} produk ditambahkan ke katalog.`);
      };

      const downloadFailed = () => downloadCsv('Laporan_Impor_Gagal.csv', [
        ['Baris', 'Produk', 'Alasan'],
        ...[...result.failed, ...result.photoNotes].map(f => [f.line, safeCell(f.name), f.reason])
      ], ';');

      const rowTable = (list, tone) => (
        <div className="overflow-x-auto rounded-xl border border-slate-200">
          <table className="w-full text-left text-sm">
            <thead className="bg-slate-50 text-xs text-slate-600">
              <tr><th scope="col" className="px-3 py-2 font-semibold">Baris</th><th scope="col" className="px-3 py-2 font-semibold">Produk</th><th scope="col" className="px-3 py-2 font-semibold">Keterangan</th></tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {list.slice(0, 200).map(r => (
                <tr key={r.line}>
                  <td className="px-3 py-2 align-top tabular">{r.line}</td>
                  <td className="px-3 py-2 align-top font-medium text-slate-900">{r.name || '(tanpa nama)'}</td>
                  <td className={cx('px-3 py-2 align-top', tone)}>{r.reason}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {list.length > 200 && <p className="border-t border-slate-100 p-2 text-xs text-slate-500">200 baris pertama dari {list.length}.</p>}
        </div>
      );
      const filePicker = (id, accept, onPick, label) => (
        <label htmlFor={id} className={cx('inline-flex min-h-[44px] cursor-pointer items-center gap-2 rounded-xl border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus-within:ring-2 focus-within:ring-brand-600 focus-within:ring-offset-2', busy && 'pointer-events-none opacity-60')}>
          <SvgIcon name="upload" className="h-4 w-4" />{label}
          <input id={id} type="file" accept={accept} className="sr-only" disabled={!!busy} onChange={e => { onPick(e.target.files[0]); e.target.value = ''; }} />
        </label>
      );
      const stat = (label, value, tone) => (
        <div className="rounded-xl bg-slate-50 p-3"><p className="text-xs text-slate-600">{label}</p><p className={cx('text-xl font-bold tabular', tone || 'text-slate-900')}>{value}</p></div>
      );

      const zipSection = (
        <>
          <p className="text-sm font-semibold text-slate-900">{step === 'pick' ? '3. Foto produk (opsional)' : 'Foto produk (opsional)'}</p>
          <p className="mt-0.5 text-sm text-slate-600">Unggah ZIP berisi foto dengan nama file sama seperti SKU, contoh KOP-001.jpg.</p>
          <div className="mt-2 flex flex-wrap items-center gap-3">
            {filePicker('import-zip', '.zip', pickZip, photos ? 'Ganti ZIP' : 'Pilih ZIP')}
            {photos && <span className="min-w-0 break-all text-sm text-slate-700">{step === 'pick' ? `${zipName}: ${photos.size} foto` : `${zipName}: ${withPhoto} foto cocok${unusedPhotos.length ? `, ${unusedPhotos.length} tidak terpakai` : ''}`}</span>}
          </div>
        </>
      );
      const footer = step === 'pick' ? <>
          <span className="flex-1" />
          <Btn variant="secondary" onClick={onClose}>Tutup</Btn>
          <Btn icon="check" disabled={!file || !!busy} onClick={checkFile}>Periksa file</Btn>
        </>
        : step === 'check' ? <>
          <Btn variant="secondary" onClick={() => { setStep('pick'); setRows([]); setFile(null); setError(''); }}>Ganti file</Btn>
          <span className="flex-1" />
          <Btn icon="check" disabled={!valid.length || !!busy} onClick={run}>Impor {valid.length} produk</Btn>
        </> : step === 'done' ? <>
          {result.failed.length + result.photoNotes.length > 0 && <Btn variant="secondary" icon="download" onClick={downloadFailed}>Unduh laporan</Btn>}
          <span className="flex-1" /><Btn onClick={onClose}>Selesai</Btn>
        </> : null;

      return (
        <Modal size="lg" title="Impor produk massal" desc={step === 'check' ? file?.name : 'Tambah banyak produk sekaligus dari file Excel atau CSV.'} onClose={step === 'run' ? () => {} : onClose} footer={footer}>
          {error && <p className="mb-3 rounded-xl bg-rose-50 p-3 text-sm font-medium text-rose-800" role="alert">{error}</p>}
          {busy && <p className="mb-3 text-sm text-slate-600" role="status">{busy}</p>}

          {step === 'pick' && (
            <ol className="space-y-5">
              <li>
                <p className="text-sm font-semibold text-slate-900">1. Unduh template</p>
                <p className="mt-0.5 text-sm text-slate-600">Kolom wajib bertanda bintang. Baris pertama hanya contoh dan tidak ikut diimpor. Varian ditambahkan dari Edit produk setelah impor.</p>
                <div className="mt-2 flex flex-wrap gap-2">
                  <Btn variant="secondary" icon="download" onClick={async () => { const how = await downloadImportTemplate(db, 'xlsx'); if (how === 'csv') notify('Template diunduh sebagai CSV (Excel butuh internet).', 'info'); }}>Template Excel</Btn>
                  <Btn variant="secondary" icon="download" onClick={() => downloadImportTemplate(db, 'csv')}>Template CSV</Btn>
                </div>
              </li>
              <li>
                <p className="text-sm font-semibold text-slate-900">2. Unggah file yang sudah diisi</p>
                <p className="mt-0.5 text-sm text-slate-600">Format .xlsx atau .csv, maksimal {IMPORT_MAX_ROWS} produk. Belum ada yang tersimpan sampai kamu konfirmasi.</p>
                <div className="mt-2 flex flex-wrap items-center gap-3">
                  {filePicker('import-table', '.xlsx,.csv', pickTable, file ? 'Ganti file' : 'Pilih file')}
                  {file && <span className="min-w-0 break-all text-sm text-slate-700">{file.name}</span>}
                </div>
              </li>
              <li>{zipSection}</li>
            </ol>
          )}

          {step === 'check' && (
            <div className="space-y-4">
              <div className="grid grid-cols-3 gap-2">
                {stat('Total baris', rows.length)}
                {stat('Siap diimpor', valid.length, 'text-emerald-700')}
                {stat('Bermasalah', problems.length, problems.length ? 'text-rose-600' : undefined)}
              </div>
              <section className="rounded-xl border border-slate-200 p-3">{zipSection}</section>
              {problems.length > 0 && (
                <section>
                  <h4 className="mb-1.5 text-sm font-bold text-rose-700">Tidak akan diimpor ({problems.length})</h4>
                  {rowTable(problems.map(r => ({ line: r.line, name: r.data.name, reason: r.errors.join(' ') })), 'text-rose-700')}
                </section>
              )}
              {warned.length > 0 && (
                <section>
                  <h4 className="mb-1.5 text-sm font-bold text-amber-800">Tetap diimpor, mohon dicek ({warned.length})</h4>
                  {rowTable(warned.map(r => ({ line: r.line, name: r.data.name, reason: r.warnings.join(' ') })), 'text-amber-800')}
                </section>
              )}
              {valid.length === 0 && <p className="text-sm text-slate-600">Belum ada baris yang bisa diimpor. Perbaiki file lalu pilih Ganti file.</p>}
            </div>
          )}

          {step === 'run' && (
            <div className="py-6" role="status">
              <p className="text-sm font-semibold text-slate-900">Memasukkan produk… {progress}%</p>
              <div className="mt-2 h-2 overflow-hidden rounded-full bg-slate-100"><div className="h-full rounded-full bg-brand-600 transition-[width]" style={{ width: `${progress}%` }} /></div>
              <p className="mt-2 text-sm text-slate-600">Jangan tutup aplikasi sampai selesai.</p>
            </div>
          )}

          {step === 'done' && (
            <div className="space-y-4">
              <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
                {stat('Berhasil ditambahkan', result.added, 'text-emerald-700')}
                {stat('Gagal', result.failed.length, result.failed.length ? 'text-rose-600' : undefined)}
                {photos && stat('Foto terpasang', result.photos)}
              </div>
              {result.newCats.length > 0 && <p className="text-sm text-slate-700">Kategori baru: {result.newCats.join(', ')}.</p>}
              {result.failed.length > 0 && (
                <section>
                  <h4 className="mb-1.5 text-sm font-bold text-rose-700">Alasan gagal</h4>
                  {rowTable(result.failed, 'text-rose-700')}
                </section>
              )}
              {result.photoNotes.length > 0 && rowTable(result.photoNotes, 'text-amber-800')}
            </div>
          )}
        </Modal>
      );
    }

    function ProductsModule({ db, setDb, notify, currentUser, hasPermission, isOwner, session }) {
      const [importing, setImporting] = useState(false);
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState(EMPTY_PRODUCT);
      const [showHistory, setShowHistory] = useState(false);
      const [historyQuery, setHistoryQuery] = useState('');
      const hq = historyQuery.trim().toLowerCase();
      const filteredHistory = db.stockHistory.filter(l => !hq || [l.name, l.sku, l.type, l.user, l.date].some(v => String(v || '').toLowerCase().includes(hq)));
      const [confirmDelete, setConfirmDelete] = useState(false);
      const [search, setSearch] = useState('');
      const [submitted, setSubmitted] = useState(false);
      const [stockFilter, setStockFilter] = useState('all');
      const [restock, setRestock] = useState(null);
      const [showCats, setShowCats] = useState(false);

      const promos = activePromos(db);
      const canEdit = hasPermission('can_edit_product');
      const set = (k) => (e) => setForm(f => ({ ...f, [k]: e && e.target ? e.target.value : e }));
      const nameError = submitted && !form.name.trim() ? 'Nama produk wajib diisi.' : null;
      const skuTrim = (form.sku || '').trim().toUpperCase();
      const skuOwner = skuTrim && db.products.find(p => p.sku.toUpperCase() === skuTrim && (editing === 'new' || p.id !== editing?.id));
      const skuError = skuOwner ? `SKU ${skuTrim} sudah dipakai "${skuOwner.name}". Gunakan kode lain.` : null;
      const autoSku = () => { let k; do { k = 'SKU-' + Math.floor(1000 + Math.random() * 9000); } while (db.products.some(p => p.sku === k)); return k; };
      const priceWarn = Number(form.sell_price) < Number(form.buy_price) ? 'Harga jual lebih rendah dari HPP.' : null;
      const promoPrice = Number(form.promo_price) || 0;
      const promoError = promoPrice > 0 && promoPrice >= Number(form.sell_price) ? 'Harga promo harus lebih rendah dari harga jual.' : null;
      const promoHint = promoPrice > 0 && !promoError
        ? `Tampil di kasir: ${formatIDR(form.sell_price)} dicoret → ${formatIDR(promoPrice)} (hemat ${Math.round((1 - promoPrice / form.sell_price) * 100)}%)`
        : 'Kosongkan jika tidak ada diskon.';

      const [newCat, setNewCat] = useState(null);
      const addCategory = () => {
        const name = (newCat || '').trim();
        if (!name) return;
        if (!db.categories.some(c => c.toLowerCase() === name.toLowerCase())) setDb(prev => ({ ...prev, categories: [...prev.categories, name] }));
        setForm(f => ({ ...f, category: db.categories.find(c => c.toLowerCase() === name.toLowerCase()) || name }));
        setNewCat(null);
      };
      const setVariant = (i, k, v) => setForm(f => ({ ...f, variants: f.variants.map((x, j) => j === i ? { ...x, [k]: v } : x) }));
      const variantStock = !form.no_stock && hasVariantStock(form);
      const shownStock = variantStock ? variantStockSum(form.variants) : form.stock;
      // A new variant row scrolls into view with its name field ready to type
      const variantListRef = useRef(null);
      const variantCount = useRef(0);
      useEffect(() => {
        const n = (form.variants || []).length;
        if (editing && n > variantCount.current && variantListRef.current) {
          const row = variantListRef.current.lastElementChild;
          if (row) { row.scrollIntoView({ block: 'center', behavior: 'smooth' }); const input = row.querySelector('input'); input && input.focus({ preventScroll: true }); }
        }
        variantCount.current = n;
      }, [form.variants, editing]);
      const addVariant = () => setForm(f => ({ ...f, variants: [...(f.variants || []), { id: '', name: '', price: f.sell_price, buy_price: '', stock: '' }] }));
      const open = (p) => { variantCount.current = p === 'new' ? 0 : (p.variants || []).length; setNewCat(null); setEditing(p); setForm(p === 'new' ? { ...EMPTY_PRODUCT, category: db.categories.find(c => c !== 'Semua') || 'Lainnya' } : { ...EMPTY_PRODUCT, ...p }); setConfirmDelete(false); setSubmitted(false); };
      const close = () => setEditing(null);

      // Both filter counts follow the search, so "Semua (5)" means 5 products match what was typed
      const q = search.trim().toLowerCase();
      const searched = db.products.filter(p => !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
      const lowSearched = searched.filter(isLowStock);
      const rows = stockFilter === 'low' ? lowSearched : searched;
      const nowStamp = () => { const d = new Date(); return `${dateKey(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

      const save = () => {
        setSubmitted(true);
        if (!form.name.trim() || promoError || skuError) return;
        const clean = {
          name: form.name.trim(), category: form.category,
          buy_price: Number(form.buy_price) || 0, sell_price: Number(form.sell_price) || 0, promo_price: promoPrice,
          min_stock: parseInt(form.min_stock, 10) || 0, no_stock: !!form.no_stock,
          unit: form.unit || 'Pcs', img: form.img || '',
          variants: (form.variants || []).filter(v => v.name.trim()).map(v => ({
            id: v.id || generateId('VAR'), name: v.name.trim(), price: Number(v.price) || 0,
            buy_price: Number(v.buy_price) > 0 ? Number(v.buy_price) : '',
            stock: form.no_stock || v.stock === '' || v.stock == null ? '' : Math.max(0, parseInt(v.stock, 10) || 0)
          }))
        };
        clean.stock = clean.no_stock ? 0 : hasVariantStock(clean) ? variantStockSum(clean.variants) : parseInt(form.stock, 10) || 0;
        if (editing === 'new') {
          const added = { id: 'p-' + Date.now(), sku: skuTrim || autoSku(), ...clean };
          setDb(prev => ({ ...prev, products: [added, ...prev.products], stockHistory: added.no_stock ? prev.stockHistory : [{ id: generateId('SH'), date: nowStamp(), sku: added.sku, name: added.name, qtyChange: `+${added.stock}`, type: 'Stok awal produk baru', user: currentUser.name }, ...prev.stockHistory] }));
          notify(`${added.name} ditambahkan ke katalog.`);
        } else {
          const diff = clean.no_stock || editing.no_stock ? 0 : clean.stock - editing.stock;
          setDb(prev => ({
            ...prev,
            products: prev.products.map(p => p.id === editing.id ? { ...p, ...clean, sku: skuTrim || p.sku } : p),
            stockHistory: diff !== 0 ? [{ id: generateId('SH'), date: nowStamp(), sku: editing.sku, name: clean.name, qtyChange: diff > 0 ? `+${diff}` : `${diff}`, type: 'Penyesuaian stok manual', user: currentUser.name }, ...prev.stockHistory] : prev.stockHistory
          }));
          notify(`${clean.name} diperbarui.`);
        }
        close();
      };

      const remove = () => {
        if (!hasPermission('can_delete_product')) return notify('Anda tidak memiliki izin menghapus produk.', 'warn');
        setDb(prev => ({ ...prev, products: prev.products.filter(p => p.id !== editing.id) }));
        notify(`${editing.name} dihapus.`);
        close();
      };

      const saveRestock = () => {
        if (!restock.qty) return;
        const p = restock.product;
        const v = hasVariantStock(p) && findVariant(p, restock.variant_id || p.variants[0].id);
        setDb(prev => ({
          ...prev,
          products: prev.products.map(x => x.id === p.id ? changeLineStock(x, v ? v.id : '', restock.qty) : x),
          stockHistory: [{ id: generateId('SH'), date: nowStamp(), sku: p.sku, name: v ? `${p.name} · ${v.name}` : p.name, qtyChange: `+${restock.qty}`, type: restock.note || 'Restock', user: currentUser.name }, ...prev.stockHistory]
        }));
        notify(`Stok ${p.name} bertambah ${restock.qty}.`);
        setRestock(null);
      };

      return (
        <div className="space-y-5">
          <PageHeader title="Katalog & Inventori" desc="Kelola menu, foto, harga, diskon, dan stok."
            actions={<>
              {currentUser.role === 'owner' && <Btn variant="secondary" icon="grid" onClick={() => setShowCats(true)}>Kategori</Btn>}
              <Btn variant="secondary" icon="clock" onClick={() => setShowHistory(true)}>Riwayat stok</Btn>
              {hasPermission('can_add_product') && <Btn variant="secondary" icon="upload" onClick={() => setImporting(true)}>Impor massal</Btn>}
              {hasPermission('can_add_product') && <Btn icon="plus" onClick={() => open('new')}>Tambah produk</Btn>}
            </>} />
          {importing && <ProductImportModal db={db} setDb={setDb} notify={notify} currentUser={currentUser} isOwner={isOwner} session={session} onClose={() => setImporting(false)} />}

          <Card>
            <div className="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row sm:items-center sm:justify-between">
              <SearchInput id="prod-search" value={search} onChange={setSearch} placeholder="Cari nama atau SKU (cth. COF)…" className="w-full sm:max-w-sm" />
              <SegmentedControl label="Filter stok" value={stockFilter} onChange={setStockFilter}
                options={[{ value: 'all', label: `Semua (${searched.length})` }, { value: 'low', label: `Stok menipis (${lowSearched.length})` }]} />
            </div>
            <div className="overflow-x-auto">
              <table className="w-full min-w-[780px] text-left text-sm">
                <thead className="bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-600">
                  <tr>
                    <th scope="col" className="px-4 py-3">Produk</th><th scope="col" className="px-4 py-3">Kategori</th>
                    <th scope="col" className="px-4 py-3 text-right">HPP</th><th scope="col" className="px-4 py-3 text-right">Harga jual</th>
                    <th scope="col" className="px-4 py-3 text-right">Margin</th><th scope="col" className="px-4 py-3">Stok</th>
                    <th scope="col" className="px-4 py-3"><span className="sr-only">Aksi</span></th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {rows.map(p => {
                    const info = priceInfo(p, promos);
                    const margin = info.price ? Math.round(((info.price - p.buy_price) / info.price) * 100) : 0;
                    return (
                      <tr key={p.id} className="hover:bg-slate-50">
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-3">
                            <ProductThumb product={p} className="h-11 w-11 flex-shrink-0 rounded-lg" textClass="text-xs" />
                            <div><p className="font-semibold text-slate-900">{p.name}</p><p className="font-mono text-xs text-slate-500">{p.sku}{!p.img && ' · belum ada foto'}</p></div>
                          </div>
                        </td>
                        <td className="px-4 py-3 text-slate-700">{p.category}</td>
                        <td className="px-4 py-3 text-right text-slate-600 tabular">{formatIDR(p.buy_price)}</td>
                        <td className="px-4 py-3 text-right">
                          <div className="flex flex-col items-end">
                            <PriceTag info={info} className="items-end" />
                            {info.label && <span className="text-xs text-rose-600">{info.label}</span>}
                          </div>
                        </td>
                        <td className={cx('px-4 py-3 text-right tabular', margin < 20 ? 'text-amber-700' : 'text-slate-700')}>{margin}%</td>
                        <td className="px-4 py-3">
                          {p.no_stock ? <Badge tone="slate">Tanpa stok</Badge>
                            : p.stock <= 0 ? <Badge tone="rose">Habis</Badge>
                            : p.stock <= p.min_stock ? <Badge tone="amber"><span className="tabular">{p.stock}</span> {p.unit} · menipis</Badge>
                            : <span className="text-slate-800 tabular">{p.stock} {p.unit}</span>}
                        </td>
                        <td className="whitespace-nowrap px-4 py-3 text-right">
                          {canEdit && <>
                            {!p.no_stock && <Btn variant="ghost" size="sm" icon="plus" onClick={() => setRestock({ product: p, qty: 0, note: 'Restock' })} aria-label={`Tambah stok ${p.name}`}>Stok</Btn>}
                            <Btn variant="ghost" size="sm" icon="edit" onClick={() => open(p)} aria-label={`Edit ${p.name}`}>Edit</Btn>
                          </>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {rows.length === 0 && <EmptyState icon="search" title={stockFilter === 'low' ? 'Tidak ada stok menipis yang cocok' : 'Tidak ada produk yang cocok'} />}
            </div>
          </Card>

          {editing && (
            <Modal title={editing === 'new' ? 'Tambah produk' : 'Edit produk'} onClose={close} size="xl"
              footer={confirmDelete ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus produk ini secara permanen?</p>
                <Btn variant="secondary" onClick={() => setConfirmDelete(false)}>Batal</Btn>
                <Btn variant="danger" onClick={remove}>Ya, hapus</Btn>
              </> : <>
                {editing !== 'new' && hasPermission('can_delete_product') && <Btn variant="ghost" icon="trash" className="text-rose-700 hover:bg-rose-50 hover:text-rose-800" onClick={() => setConfirmDelete(true)}>Hapus</Btn>}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={close}>Batal</Btn>
                <Btn onClick={save}>Simpan</Btn>
              </>}>
              {/* Six-column grid: pairs take 3 columns each, the stock row 2 each, so every input edge lines up */}
              <div className="grid grid-cols-1 items-start gap-x-4 gap-y-5 sm:grid-cols-6">
                <div className="sm:col-span-6">
                  <ImageUpload label="Foto produk" value={form.img} onChange={(v) => setForm(f => ({ ...f, img: v }))}
                    hint="Ambil foto atau pilih dari galeri. Foto otomatis dipotong persegi dan dikompres agar ringan." />
                </div>
                <Field label="Nama produk" error={nameError} className="sm:col-span-6">
                  <input autoFocus value={form.name} onChange={set('name')} className={inputCls} placeholder="cth. Es Kopi Susu" />
                </Field>
                <Field label="Kode SKU" error={skuError} hint="Kosongkan untuk dibuat otomatis." className="sm:col-span-3"><input value={form.sku} aria-invalid={!!skuError} onChange={e => setForm(f => ({ ...f, sku: e.target.value.toUpperCase().replace(/\s/g, '') }))} className={cx(inputCls, 'font-mono', skuError && 'border-rose-400')} placeholder="SKU-001" /></Field>
                <div className="sm:col-span-3">
                  <span className="text-sm font-medium text-slate-700">Kategori</span>
                  {newCat === null ? (
                    <div className="mt-1.5 flex gap-2">
                      <select aria-label="Kategori" value={form.category} onChange={set('category')} className={cx(inputCls, 'min-w-0 flex-1')}>
                        {db.categories.filter(c => c !== 'Semua').map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                      {currentUser.role === 'owner' && <IconBtn icon="plus" label="Buat kategori baru" onClick={() => setNewCat('')} className="border border-slate-300" />}
                    </div>
                  ) : (
                    <div className="mt-1.5 flex gap-2">
                      <input autoFocus aria-label="Nama kategori baru" value={newCat} maxLength={30} onChange={e => setNewCat(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addCategory(); } if (e.key === 'Escape') { e.stopPropagation(); setNewCat(null); } }} placeholder="cth. Kopi Susu" className={cx(inputCls, 'min-w-0 flex-1')} />
                      <Btn onClick={addCategory} disabled={!newCat.trim()} className="flex-shrink-0">Simpan</Btn>
                      <IconBtn icon="x" label="Batal membuat kategori" onClick={() => setNewCat(null)} />
                    </div>
                  )}
                  {currentUser.role === 'owner' && newCat === null && <span className="mt-1 block text-xs text-slate-500">Tekan + untuk kategori baru.</span>}
                </div>
                <Field label="Harga beli (HPP)" className="sm:col-span-3"><MoneyInput value={form.buy_price} onChange={set('buy_price')} /></Field>
                <Field label="Harga jual normal" hint={priceWarn} className="sm:col-span-3"><MoneyInput value={form.sell_price} onChange={set('sell_price')} /></Field>
                <div className="sm:col-span-6">
                  <span className="text-sm font-medium text-slate-700">Harga promo (harga coret)</span>
                  <div className="mt-1.5 flex flex-col gap-2 sm:flex-row">
                    <div className="min-w-0 flex-1"><MoneyInput aria-label="Harga promo" value={form.promo_price} onChange={set('promo_price')} placeholder="Tidak ada diskon" /></div>
                    <div role="group" aria-label="Potongan cepat" className="grid grid-cols-3 gap-2 sm:w-[216px] sm:flex-shrink-0">
                      {[10, 20, 30].map(pct => (
                        <button key={pct} type="button" onClick={() => setForm(f => ({ ...f, promo_price: Math.round(f.sell_price * (1 - pct / 100) / 500) * 500 }))}
                          className={cx('min-h-[44px] rounded-xl border border-slate-300 bg-white text-sm font-semibold text-slate-700 tabular transition-colors hover:bg-slate-50', focusRing)}>−{pct}%</button>
                      ))}
                    </div>
                  </div>
                  {promoError ? <span className="mt-1 block text-xs font-medium text-rose-600" role="alert">{promoError}</span> : <span className="mt-1 block text-xs text-slate-500">{promoHint}</span>}
                </div>
                <div className="sm:col-span-2">
                  <div className="flex items-center justify-between gap-2">
                    <label htmlFor="product-stock" className="text-sm font-medium text-slate-700">Jumlah stok</label>
                    <button type="button" aria-pressed={!!form.no_stock} onClick={() => setForm(f => ({ ...f, no_stock: !f.no_stock }))}
                      className={cx('-my-1 inline-flex min-h-[32px] items-center gap-1 rounded-lg border px-2 text-xs font-semibold transition-colors', form.no_stock ? 'border-brand-600 bg-brand-50 text-brand-800' : 'border-slate-300 bg-white text-slate-600 hover:bg-slate-50', focusRing)}>
                      {form.no_stock && <SvgIcon name="check" className="h-3.5 w-3.5" />}Tanpa stok
                    </button>
                  </div>
                  <input id="product-stock" type="number" min="0" inputMode="numeric" value={form.no_stock ? '' : shownStock} onChange={set('stock')} disabled={variantStock || !!form.no_stock} placeholder={form.no_stock ? 'Tidak dihitung' : undefined}
                    className={cx(inputCls, 'mt-1.5 tabular disabled:bg-slate-100 disabled:text-slate-600')} />
                  {(form.no_stock || variantStock) && <span className="mt-1 block text-xs text-slate-500">{form.no_stock ? 'Bisa dijual terus, stok tidak berkurang.' : 'Otomatis dari stok varian.'}</span>}
                </div>
                <Field label="Stok minimum" hint={form.no_stock ? null : 'Peringatan di bawah angka ini.'} className="sm:col-span-2"><input type="number" min="0" inputMode="numeric" value={form.no_stock ? '' : form.min_stock} onChange={set('min_stock')} disabled={!!form.no_stock} className={cx(inputCls, 'tabular disabled:bg-slate-100')} /></Field>
                <Field label="Satuan" className="sm:col-span-2"><input value={form.unit} onChange={set('unit')} className={inputCls} placeholder="Pcs / Cup / Kg" /></Field>
                <div className="sm:col-span-6">
                  <div className="flex items-center justify-between gap-3">
                    <div>
                      <span className="text-sm font-medium text-slate-700">Varian</span>
                      <span className="block text-xs text-slate-500">Contoh: ukuran Kecil/Besar atau rasa. Isi stok varian agar dihitung terpisah; kosongkan untuk memakai stok produk.</span>
                    </div>
                    <Btn variant="secondary" size="sm" icon="plus" onClick={addVariant}>Tambah varian</Btn>
                  </div>
                  {(form.variants || []).length > 0 && (
                    <ul ref={variantListRef} className="mt-3 space-y-2">
                      {form.variants.map((v, i) => (
                        <li key={v.id || i} className="grid grid-cols-2 items-end gap-2 rounded-xl border border-slate-200 p-3 sm:grid-cols-[minmax(0,1fr)_8.5rem_8.5rem_5.5rem_auto]">
                          <Field label="Nama varian" className="col-span-2 sm:col-span-1"><input value={v.name} maxLength={30} onChange={e => setVariant(i, 'name', e.target.value)} placeholder="cth. Besar" className={inputCls} /></Field>
                          <Field label="Harga jual"><MoneyInput value={v.price} onChange={(val) => setVariant(i, 'price', val)} /></Field>
                          <Field label="HPP"><MoneyInput value={v.buy_price} onChange={(val) => setVariant(i, 'buy_price', val)} placeholder={formatNumberWithDots(form.buy_price || 0)} /></Field>
                          <Field label="Stok"><input type="number" min="0" inputMode="numeric" value={form.no_stock ? '' : v.stock ?? ''} onChange={e => setVariant(i, 'stock', e.target.value)} disabled={!!form.no_stock} placeholder="—" className={cx(inputCls, 'tabular disabled:bg-slate-100')} /></Field>
                          <IconBtn icon="trash" label={`Hapus varian ${v.name || i + 1}`} iconClass="h-4 w-4" onClick={() => setForm(f => ({ ...f, variants: f.variants.filter((_, j) => j !== i) }))} className="justify-self-end text-slate-500 hover:bg-rose-50 hover:text-rose-600" />
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            </Modal>
          )}

          {restock && (
            <Modal title={`Tambah stok ${restock.product.name}`} desc={`Stok sekarang ${restock.product.stock} ${restock.product.unit}`} onClose={() => setRestock(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setRestock(null)}>Batal</Btn><Btn onClick={saveRestock} disabled={!restock.qty}>Simpan</Btn></>}>
              <div className="space-y-4">
                <Field label="Jumlah masuk" hint={restock.qty ? `Stok baru: ${restock.product.stock + restock.qty} ${restock.product.unit}` : 'Untuk barang dari supplier, sebaiknya catat lewat Pembelian & PO.'}>
                  <input autoFocus type="number" min="1" inputMode="numeric" value={restock.qty || ''} onChange={e => setRestock({ ...restock, qty: Math.max(0, parseInt(e.target.value, 10) || 0) })} className={cx(inputCls, 'tabular')} />
                </Field>
                {hasVariantStock(restock.product) && (
                  <Field label="Varian"><select value={restock.variant_id || restock.product.variants[0].id} onChange={e => setRestock({ ...restock, variant_id: e.target.value })} className={inputCls}>{restock.product.variants.map(v => <option key={v.id} value={v.id}>{v.name} · stok {parseInt(v.stock, 10) || 0}</option>)}</select></Field>
                )}
                <Field label="Keterangan"><input value={restock.note} onChange={e => setRestock({ ...restock, note: e.target.value })} className={inputCls} /></Field>
              </div>
            </Modal>
          )}

          {showHistory && (
            <Modal title="Riwayat pergerakan stok" onClose={() => setShowHistory(false)} size="lg">
              <SearchInput id="history-search" value={historyQuery} onChange={setHistoryQuery} placeholder="Cari produk, SKU, keterangan, atau nama…" />
              {filteredHistory.length === 0 ? <EmptyState icon={hq ? 'search' : 'clock'} title={hq ? 'Tidak ada riwayat yang cocok' : 'Belum ada riwayat'} /> : (
                <ul className="mt-2 divide-y divide-slate-100">
                  {filteredHistory.map(log => {
                    const neg = String(log.qtyChange).startsWith('-');
                    return (
                      <li key={log.id} className="flex items-center justify-between gap-3 py-3">
                        <div className="min-w-0">
                          <p className="text-sm font-semibold text-slate-900">{log.name} <span className="font-mono text-xs font-normal text-slate-500">{log.sku}</span></p>
                          <p className="text-sm text-slate-600">{log.type}</p>
                          <p className="text-xs text-slate-500">{log.date} · {log.user}</p>
                        </div>
                        <span className={cx('whitespace-nowrap font-mono text-base font-bold', neg ? 'text-rose-600' : 'text-emerald-700')}>{log.qtyChange}</span>
                      </li>
                    );
                  })}
                </ul>
              )}
            </Modal>
          )}
          {showCats && <CategoryManager db={db} setDb={setDb} notify={notify} onClose={() => setShowCats(false)} />}
        </div>
      );
    }

    // Bos manages the menu categories shown as filters on the Kasir page
    function CategoryManager({ db, setDb, notify, onClose }) {
      const [name, setName] = useState('');
      const cats = db.categories.filter(c => c !== 'Semua');
      const trimmed = name.trim();
      const dup = !!trimmed && db.categories.some(c => c.toLowerCase() === trimmed.toLowerCase());
      const add = (e) => {
        e.preventDefault();
        if (!trimmed || dup) return;
        setDb(prev => ({ ...prev, categories: [...prev.categories, trimmed] }));
        setName('');
        notify(`Kategori ${trimmed} ditambahkan.`);
      };
      return (
        <Modal title="Kategori menu" desc="Kategori tampil sebagai filter di halaman Kasir." onClose={onClose} footer={<Btn onClick={onClose}>Selesai</Btn>}>
          <form onSubmit={add} className="flex gap-2">
            <label className="sr-only" htmlFor="new-cat">Nama kategori baru</label>
            <input id="new-cat" autoFocus value={name} onChange={e => setName(e.target.value)} maxLength={30} placeholder="cth. Kopi Susu" className={inputCls} />
            <Btn type="submit" icon="plus" disabled={!trimmed || dup} className="flex-shrink-0">Tambah</Btn>
          </form>
          {dup && <p className="mt-1 text-xs font-medium text-rose-600" role="alert">Kategori ini sudah ada.</p>}
          {cats.length === 0 ? <p className="mt-4 text-sm text-slate-500">Belum ada kategori.</p> : (
            <ul className="mt-4 divide-y divide-slate-100">
              {cats.map(c => {
                const n = db.products.filter(p => p.category === c).length;
                return (
                  <li key={c} className="flex items-center justify-between gap-3 py-2">
                    <div className="min-w-0">
                      <p className="truncate text-sm font-semibold text-slate-900">{c}</p>
                      <p className="text-xs text-slate-500">{n ? `${n} produk` : 'Belum ada produk'}</p>
                    </div>
                    <IconBtn icon="trash" label={`Hapus kategori ${c}`} className="text-rose-600 hover:bg-rose-50"
                      onClick={() => n
                        ? notify(`Pindahkan dulu ${n} produk dari kategori ${c} sebelum menghapusnya.`, 'warn')
                        : (setDb(prev => ({ ...prev, categories: prev.categories.filter(x => x !== c) })), notify(`Kategori ${c} dihapus.`, 'info'))} />
                  </li>
                );
              })}
            </ul>
          )}
        </Modal>
      );
    }

    // =====================================================================
    // CUSTOMERS
    // =====================================================================
    // Loyalty points were removed: customers never see the POS, so points had no way to be redeemed.
    function CustomersModule({ db, setDb, notify, currentUser }) {
      const [form, setForm] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [search, setSearch] = useState('');
      const [confirmDel, setConfirmDel] = useState(false);
      // Deposit: { kind: 'refund' | 'transfer', all, amount, to, q } while one of the two forms is open
      const [dep, setDep] = useState(null);
      useEffect(() => { setConfirmDel(false); setDep(null); }, [form && form.id]);
      const saldo = form?.id ? db.customers.find(c => c.id === form.id)?.deposit || 0 : 0;
      const depAmount = dep ? (dep.all ? saldo : dep.amount) : 0;
      const depError = dep && !dep.all && depAmount > saldo ? `Melebihi saldo ${formatIDR(saldo)}.` : null;
      const depTargets = dep?.kind === 'transfer' ? db.customers.filter(c => c.id !== form.id && c.id !== 'cust-1' && (!dep.q.trim() || c.name.toLowerCase().includes(dep.q.trim().toLowerCase()) || c.phone.includes(dep.q.trim()))) : [];
      const depHistory = form?.id ? [
        ...allSalesOf(db).filter(s => s.customer_id === form.id && s.status !== 'void' && (s.deposit_in || s.deposit_used)).flatMap(s => [
          ...(s.deposit_in ? [{ id: s.id + 'i', date: s.date, label: `Deposit · ${s.receipt_no}`, amount: s.deposit_in }] : []),
          ...(s.deposit_used ? [{ id: s.id + 'u', date: s.date, label: `Dipakai belanja · ${s.receipt_no}`, amount: -s.deposit_used }] : [])
        ]),
        ...(db.deposit_moves || []).filter(m => m.customer_id === form.id || m.to_id === form.id).map(m => ({
          id: m.id, date: m.date,
          label: m.kind === 'refund' ? `Uang dikembalikan · ${m.by}` : m.to_id === form.id ? `Pindahan dari ${m.customer_name}` : `Dipindah ke ${m.to_name}`,
          amount: m.to_id === form.id ? m.amount : -m.amount
        }))
      ].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 8) : [];

      const confirmDep = () => {
        if (!dep || depError || depAmount <= 0 || (dep.kind === 'transfer' && !dep.to)) return;
        const { id, name } = form, amount = depAmount, target = db.customers.find(c => c.id === dep.to);
        const stamp = new Date().toISOString();
        const base = { id: generateId('DEP'), date: stamp, customer_id: id, customer_name: name, amount, by: currentUser.name, by_id: currentUser.id };
        if (dep.kind === 'refund') {
          const session = db.cashSessions.find(s => !s.closed_at);
          setDb(prev => ({
            ...prev,
            customers: prev.customers.map(c => c.id === id ? { ...c, deposit: Math.max(0, (c.deposit || 0) - amount) } : c),
            deposit_moves: [{ ...base, kind: 'refund' }, ...(prev.deposit_moves || [])],
            expenses: [{ id: generateId('EXP'), date: dateKey(), category: DEPOSIT_REFUND, amount, note: name, by: currentUser.name, by_id: currentUser.id, ...(session ? { session_id: session.id } : {}) }, ...prev.expenses]
          }));
          notify(`${formatIDR(amount)} dikembalikan ke ${name} dan dicatat sebagai pengeluaran.`);
        } else {
          setDb(prev => ({
            ...prev,
            customers: prev.customers.map(c => c.id === id ? { ...c, deposit: Math.max(0, (c.deposit || 0) - amount) } : c.id === target.id ? { ...c, deposit: (c.deposit || 0) + amount } : c),
            deposit_moves: [{ ...base, kind: 'transfer', to_id: target.id, to_name: target.name }, ...(prev.deposit_moves || [])]
          }));
          notify(`Saldo ${formatIDR(amount)} dipindahkan dari ${name} ke ${target.name}.`);
        }
        setDep(null);
      };

      const removeCustomer = () => {
        setDb(prev => ({ ...prev, customers: prev.customers.filter(c => c.id !== form.id) }));
        notify(`${form.name} dihapus dari daftar pelanggan.`, 'info');
        setForm(null);
      };

      const q = search.trim().toLowerCase();
      const list = db.customers.filter(c => c.id !== 'cust-1' && (!q || c.name.toLowerCase().includes(q) || c.phone.includes(q)));

      const save = () => {
        setSubmitted(true);
        if (!form.name.trim() || waError(form.phone)) return;
        if (form.id) {
          setDb(prev => ({ ...prev, customers: prev.customers.map(c => c.id === form.id ? { ...c, name: form.name.trim(), phone: form.phone || '-' } : c) }));
          notify(`Data ${form.name} diperbarui.`);
        } else {
          const added = { id: 'cust-' + Date.now(), name: form.name.trim(), phone: form.phone || '-', total_spent: 0, debt: 0, visits: 0, deposit: 0 };
          setDb(prev => ({ ...prev, customers: [...prev.customers, added] }));
          notify(`${added.name} ditambahkan.`);
        }
        setForm(null);
      };

      const waLink = (c) => {
        const num = c.phone.replace(/\D/g, '').replace(/^0/, '62');
        const msg = `Halo ${c.name}, ini pengingat dari ${db.business.name}: kasbon Anda saat ini ${formatIDR(c.debt)}. Terima kasih.`;
        return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
      };

      return (
        <div className="space-y-5">
          <PageHeader title="Pelanggan" desc="Pelanggan tetap, riwayat belanja, kasbon, dan deposit."
            actions={<Btn icon="plus" onClick={() => { setForm({ name: '', phone: '' }); setSubmitted(false); }}>Tambah pelanggan</Btn>} />
          <SearchInput id="cust-search" value={search} onChange={setSearch} placeholder="Cari nama atau nomor HP…" className="max-w-sm" />

          {list.length === 0 ? <Card><EmptyState icon="customers" title="Pelanggan tidak ditemukan" desc="Pelanggan baru juga bisa ditambahkan langsung dari layar kasir." /></Card> : (
            <ul className="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3">
              {list.map(c => (
                <li key={c.id}>
                  <Card className="h-full p-4">
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex min-w-0 items-center gap-3">
                        <Avatar name={c.name} className="h-10 w-10 text-sm" />
                        <div className="min-w-0"><p className="truncate font-semibold text-slate-900">{c.name}</p><p className="text-sm text-slate-500">{c.phone}</p></div>
                      </div>
                      <IconBtn icon="edit" label={`Edit ${c.name}`} iconClass="h-4 w-4" onClick={() => { setForm({ ...c }); setSubmitted(false); }} className="-mr-2 -mt-2 h-9 w-9" />
                    </div>
                    <dl className="mt-4 flex flex-wrap justify-between gap-x-1 gap-y-2 whitespace-nowrap border-t border-slate-100 pt-3 text-xs sm:text-[13px]">
                      <div><dt className="text-xs text-slate-500">Kunjungan</dt><dd className="font-semibold text-slate-900 tabular">{c.visits}×</dd></div>
                      <div><dt className="text-xs text-slate-500">Total belanja</dt><dd className="font-semibold text-slate-900 tabular">{formatIDR(c.total_spent)}</dd></div>
                      <div><dt className="text-xs text-slate-500">Kasbon</dt><dd className={cx('font-semibold tabular', c.debt > 0 ? 'text-rose-600' : 'text-slate-400')}>{c.debt > 0 ? formatIDR(c.debt) : '—'}</dd></div>
                      <div><dt className="text-xs text-slate-500">Deposit</dt><dd className={cx('font-semibold tabular', c.deposit > 0 ? 'text-emerald-700' : 'text-slate-400')}>{c.deposit > 0 ? formatIDR(c.deposit) : '—'}</dd></div>
                    </dl>
                    {c.debt > 0 && c.phone !== '-' && (
                      <a href={waLink(c)} target="_blank" rel="noreferrer" className={cx('mt-3 inline-flex min-h-[36px] items-center gap-2 rounded-xl border border-emerald-300 bg-emerald-50 px-3 text-xs font-semibold text-emerald-800 hover:bg-emerald-100', focusRing)}>
                        <SvgIcon name="chat" className="h-4 w-4" />Ingatkan kasbon via WhatsApp
                      </a>
                    )}
                  </Card>
                </li>
              ))}
            </ul>
          )}

          {form && (
            <Modal title={form.id ? 'Edit pelanggan' : 'Tambah pelanggan'} onClose={() => setForm(null)}
              footer={confirmDel ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus {form.name}? Riwayat transaksinya tetap ada di laporan.</p>
                <Btn variant="secondary" onClick={() => setConfirmDel(false)}>Batal</Btn>
                <Btn variant="danger" onClick={removeCustomer}>Ya, hapus</Btn>
              </> : <>
                {form.id && <IconBtn icon="trash" label={`Hapus ${form.name}`} className="text-rose-600 hover:bg-rose-50"
                  onClick={() => form.debt > 0 ? notify(`${form.name} masih punya kasbon ${formatIDR(form.debt)}. Lunasi dulu sebelum dihapus.`, 'warn') : saldo > 0 ? notify(`${form.name} masih punya saldo Deposit ${formatIDR(saldo)}. Kembalikan atau pindahkan dulu.`, 'warn') : setConfirmDel(true)} />}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={() => setForm(null)}>Batal</Btn>
                <Btn onClick={save}>Simpan</Btn>
              </>}>
              <div className="space-y-4">
                <Field label="Nama lengkap" error={submitted && !form.name.trim() ? 'Nama wajib diisi.' : null}>
                  <input autoFocus value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className={inputCls} autoComplete="off" />
                </Field>
                <Field label="Nomor WhatsApp" error={waError(form.phone)} hint="Angka saja, diawali 08. Untuk mengirim pengingat kasbon.">
                  <WaInput value={form.phone} onChange={v => setForm({ ...form, phone: v })} />
                </Field>
                {form.id && (
                  <section aria-labelledby="dep-title" className="border-t border-slate-200 pt-4">
                    <div className="flex items-baseline justify-between gap-2">
                      <h4 id="dep-title" className="text-sm font-bold text-slate-900">Deposit</h4>
                      <span className={cx('text-base font-bold tabular', saldo > 0 ? 'text-emerald-700' : 'text-slate-400')}>{saldo > 0 ? formatIDR(saldo) : '—'}</span>
                    </div>
                    {!dep && (
                      <div className="mt-2 grid grid-cols-2 gap-2">
                        <Btn variant="secondary" size="sm" disabled={!saldo} onClick={() => setDep({ kind: 'refund', all: true, amount: 0, to: '', q: '' })}>Uang Dikembalikan</Btn>
                        <Btn variant="secondary" size="sm" disabled={!saldo} onClick={() => setDep({ kind: 'transfer', all: true, amount: 0, to: '', q: '' })}>Pindahkan Saldo</Btn>
                      </div>
                    )}
                    {dep && (
                      <div className="mt-2 space-y-3 rounded-xl border border-slate-200 bg-slate-50 p-3">
                        <p className="text-sm font-semibold text-slate-900">{dep.kind === 'refund' ? 'Uang Dikembalikan' : 'Pindahkan Saldo'}</p>
                        {dep.kind === 'transfer' && (
                          <div>
                            <SearchInput id="dep-search" value={dep.q} onChange={q => setDep({ ...dep, q })} placeholder="Cari nama pelanggan…" />
                            <ul role="radiogroup" aria-label="Pelanggan tujuan" className="mt-2 max-h-40 divide-y divide-slate-100 overflow-y-auto rounded-xl border border-slate-200 bg-white">
                              {depTargets.length === 0 && <li className="p-3 text-sm text-slate-500">Pelanggan tidak ditemukan.</li>}
                              {depTargets.map(c => {
                                const on = dep.to === c.id;
                                return (
                                  <li key={c.id}>
                                    <button type="button" role="radio" aria-checked={on} onClick={() => setDep({ ...dep, to: c.id })}
                                      className={cx('flex min-h-[44px] w-full items-center justify-between gap-2 px-3 text-left text-sm', focusRing, on ? 'bg-brand-50 font-semibold text-brand-900' : 'text-slate-800 hover:bg-slate-50')}>
                                      <span className="min-w-0 truncate">{c.name}</span>
                                      {on ? <SvgIcon name="check" className="h-4 w-4 flex-shrink-0" /> : c.deposit > 0 && <span className="flex-shrink-0 text-xs text-slate-500 tabular">{formatIDR(c.deposit)}</span>}
                                    </button>
                                  </li>
                                );
                              })}
                            </ul>
                          </div>
                        )}
                        <SegmentedControl label="Jumlah" value={dep.all ? 'all' : 'some'} onChange={v => setDep({ ...dep, all: v === 'all' })} options={[{ value: 'all', label: 'Semua' }, { value: 'some', label: 'Isi nominal' }]} />
                        {!dep.all && <Field label="Nominal" error={depError}><MoneyInput value={dep.amount} onChange={v => setDep({ ...dep, amount: v })} /></Field>}
                        {dep.kind === 'refund' && <p className="text-xs text-slate-600">Otomatis tercatat sebagai pengeluaran kategori Uang Deposit Pelanggan.</p>}
                        <div className="flex justify-end gap-2">
                          <Btn variant="ghost" size="sm" onClick={() => setDep(null)}>Batal</Btn>
                          <Btn size="sm" disabled={!!depError || depAmount <= 0 || (dep.kind === 'transfer' && !dep.to)} onClick={confirmDep}>{dep.kind === 'refund' ? 'Kembalikan' : 'Pindahkan'} {formatIDR(depAmount)}</Btn>
                        </div>
                      </div>
                    )}
                    {depHistory.length > 0 && (
                      <ul className="mt-3 space-y-1 text-xs">
                        {depHistory.map(h => (
                          <li key={h.id} className="flex justify-between gap-2 text-slate-600">
                            <span className="min-w-0 truncate">{fmtDateTime(h.date)} · {h.label}</span>
                            <span className={cx('flex-shrink-0 font-semibold tabular', h.amount > 0 ? 'text-emerald-700' : 'text-slate-900')}>{h.amount > 0 ? '+' : '−'} {formatIDR(Math.abs(h.amount))}</span>
                          </li>
                        ))}
                      </ul>
                    )}
                  </section>
                )}
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // PURCHASES
    // =====================================================================
    const PO_TONE = { 'Diterima Penuh': 'green', 'Proses Pengiriman': 'blue', 'Draft PO': 'slate' };
    const NON_MENU_CATEGORIES = ['Bahan Baku', 'Kemasan', 'Perlengkapan', 'Lainnya'];
    const UNITS = ['Pcs', 'Kg', 'Gram', 'Liter', 'mL', 'Pack', 'Dus', 'Botol', 'Karung', 'Lusin', 'Cup', 'Porsi'];
    const newPoItem = () => ({ key: generateId('IT'), product_id: '', name: '', category: 'Bahan Baku', qty: 1, unit: 'Pcs', unit_cost: 0 });

    function PurchasesModule({ db, setDb, notify, currentUser }) {
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState(null);
      const [newSup, setNewSup] = useState({ name: '', phone: '', address: '' });
      const [tried, setTried] = useState(false);
      const [confirmDel, setConfirmDel] = useState(false);

      const itemCategories = [...new Set([...db.categories.filter(c => c !== 'Semua'), ...NON_MENU_CATEGORIES])];
      const locked = editing && editing !== 'new' && editing.stock_applied;

      const open = (po) => {
        setEditing(po); setTried(false); setConfirmDel(false);
        const sup = db.suppliers.find(x => x.id === (po === 'new' ? db.suppliers[0]?.id : po.supplier_id));
        setNewSup({ name: sup?.name || '', phone: sup?.phone || '', address: sup?.address || '' });
        setForm(po === 'new'
          ? { supplier_id: db.suppliers[0]?.id || '__new', date: dateKey(), status: 'Draft PO', payment: 'lunas', due_date: addDays(dateKey(), 14), note: '', items: [newPoItem()] }
          : { ...po, due_date: po.due_date || addDays(po.date, 14), items: po.items.map(it => ({ ...it, key: generateId('IT'), product_id: it.product_id || '' })) });
      };

      // Goods already received from the order leave the menu stock again
      const removePo = () => {
        const po = editing;
        const stamp = `${dateKey()} ${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
        setDb(prev => ({
          ...prev,
          products: po.stock_applied ? prev.products.map(p => { const qty = po.items.filter(i => i.product_id === p.id).reduce((a, i) => a + i.qty, 0); return qty && !p.no_stock ? { ...p, stock: Math.max(0, p.stock - qty) } : p; }) : prev.products,
          stockHistory: po.stock_applied ? [...po.items.filter(i => i.product_id).map(i => ({ id: generateId('SH'), date: stamp, sku: prev.products.find(p => p.id === i.product_id)?.sku || i.category, name: i.name, qtyChange: `-${i.qty} ${i.unit}`, type: `Pesanan ${po.po_number} dihapus`, user: currentUser.name })), ...prev.stockHistory] : prev.stockHistory,
          purchases: prev.purchases.filter(p => p.id !== po.id)
        }));
        notify(`Pesanan ${po.po_number} dihapus.`, 'info');
        setEditing(null);
      };

      const updateItem = (key, patch) => setForm(f => ({ ...f, items: f.items.map(it => it.key === key ? { ...it, ...patch } : it) }));
      const pickProduct = (key, productId) => {
        const p = db.products.find(x => x.id === productId);
        updateItem(key, p ? { product_id: p.id, name: p.name, category: p.category, unit: p.unit, unit_cost: p.buy_price } : { product_id: '', name: '' });
      };

      const total = form ? form.items.reduce((a, it) => a + (Number(it.qty) || 0) * (Number(it.unit_cost) || 0), 0) : 0;
      const itemsInvalid = form && (form.items.length === 0 || form.items.some(it => !it.name.trim() || !(Number(it.qty) > 0) || !(Number(it.unit_cost) > 0)));
      const supplierInvalid = form && ((form.supplier_id === '__new' && !newSup.name.trim()) || !!waError(newSup.phone));

      const save = () => {
        setTried(true);
        if (!locked && (itemsInvalid || supplierInvalid)) return;
        let supplierId = form.supplier_id;
        let createdSup = null;
        if (supplierId === '__new') { createdSup = { id: generateId('SUP'), name: newSup.name.trim(), phone: newSup.phone, address: newSup.address.trim() }; supplierId = createdSup.id; }
        const supplierName = createdSup ? createdSup.name : db.suppliers.find(s => s.id === supplierId)?.name || '-';
        const items = locked ? editing.items : form.items.map(({ key, ...it }) => ({ ...it, product_id: it.product_id || null, name: it.name.trim(), qty: Number(it.qty), unit_cost: Number(it.unit_cost) }));
        const base = editing === 'new' ? { id: generateId('PO'), po_number: `PO-${form.date.replace(/-/g, '')}-${Math.floor(10 + Math.random() * 90)}`, paid: 0, stock_applied: false } : editing;
        const po = {
          ...base, supplier_id: supplierId, supplier: supplierName, date: form.date, status: form.status,
          payment: form.payment, due_date: form.payment === 'tempo' ? form.due_date : null, note: form.note,
          items, total: locked ? editing.total : items.reduce((a, it) => a + it.qty * it.unit_cost, 0)
        };
        // Receiving a PO adds menu items to stock once; non-menu goods are logged in stock history
        const receiveNow = po.status === 'Diterima Penuh' && !po.stock_applied;
        const stamp = `${dateKey()} ${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
        setDb(prev => {
          let products = prev.products, history = prev.stockHistory;
          if (receiveNow) {
            products = products.map(p => { const qty = po.items.filter(i => i.product_id === p.id).reduce((a, i) => a + i.qty, 0); return qty && !p.no_stock ? { ...p, stock: p.stock + qty } : p; });
            history = [...po.items.map(i => ({ id: generateId('SH'), date: stamp, sku: prev.products.find(p => p.id === i.product_id)?.sku || i.category, name: i.name, qtyChange: `+${i.qty} ${i.unit}`, type: `Penerimaan ${po.po_number} · ${po.supplier}`, user: currentUser.name })), ...history];
          }
          const saved = { ...po, stock_applied: po.stock_applied || receiveNow };
          return {
            ...prev, products, stockHistory: history,
            // Phone/address edited in the order form are saved back to the supplier
            suppliers: createdSup ? [...prev.suppliers, createdSup] : prev.suppliers.map(x => x.id === supplierId ? { ...x, phone: newSup.phone, address: newSup.address.trim() } : x),
            purchases: editing === 'new' ? [saved, ...prev.purchases] : prev.purchases.map(p => p.id === saved.id ? saved : p)
          };
        });
        notify(receiveNow ? `${po.po_number} diterima. Stok menu bertambah otomatis.` : `${po.po_number} ${editing === 'new' ? 'dibuat' : 'diperbarui'}.`);
        setEditing(null);
      };

      const [poSearch, setPoSearch] = useState('');
      const [poMonth, setPoMonth] = useState(dateKey().slice(0, 7));
      const poMonths = [...new Set([dateKey().slice(0, 7), ...db.purchases.map(p => p.date.slice(0, 7))])].sort().reverse();
      const pq = poSearch.trim().toLowerCase();
      const sorted = [...db.purchases]
        .filter(p => (poMonth === 'all' || p.date.startsWith(poMonth)) &&
