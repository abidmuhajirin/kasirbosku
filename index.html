                      <p className="text-slate-600">Modal {formatIDR(s.opening_cash)}{s.closed_at ? ` · ditutup ${fmtTime(s.closed_at)} oleh ${s.closed_by}` : ' · masih buka'}</p>
                      {s.note && <p className="text-slate-500">Catatan: {s.note}</p>}
                    </div>
                    {s.closed_at && <Badge tone={s.difference === 0 ? 'green' : s.difference < 0 ? 'rose' : 'amber'}>{s.difference === 0 ? 'Sesuai' : `${s.difference > 0 ? 'Lebih' : 'Kurang'} ${formatIDR(Math.abs(s.difference))}`}</Badge>}
                  </li>
                ))}
              </ul>
            </Card>
          )}

          {detail && !reprint && !voiding && (
            <Modal title={detail.receipt_no} desc={`${fmtDateTime(detail.date)} · ${detail.cashier}`} onClose={() => setDetail(null)}
              footer={<>
                {detail.status !== 'void' && (canVoid
                  ? <Btn variant="ghost" icon="ban" className="text-rose-700 hover:bg-rose-50" onClick={() => { setVoidReason(detail.void_request?.status === 'pending' ? detail.void_request.reason : ''); setVoiding(detail); }}>Batalkan</Btn>
                  : detail.void_request?.status === 'pending'
                    ? <Badge tone="amber">Menunggu persetujuan Bos</Badge>
                    : <Btn variant="ghost" icon="ban" className="text-rose-700 hover:bg-rose-50" onClick={() => { setVoidReason(''); setVoiding(detail); }}>Ajukan pembatalan</Btn>)}
                <span className="flex-1" />
                <Btn variant="secondary" icon="printer" onClick={() => setReprint(detail)}>Cetak ulang</Btn>
              </>}>
              {detail.status === 'void' && <div className="mb-3 rounded-xl bg-rose-50 p-3 text-sm text-rose-900">Dibatalkan oleh {detail.voided_by} ({fmtDateTime(detail.voided_at)}): {detail.void_reason}</div>}
              <p className="text-sm text-slate-600">Pelanggan <span className="font-semibold text-slate-900">{detail.customer_name}</span> · {PAYMENT_LABELS[detail.payment_method]}</p>
              <ul className="mt-3 divide-y divide-slate-100">
                {detail.items.map((it, i) => (
                  <li key={i} className="flex justify-between gap-2 py-2 text-sm"><span>{it.name} <span className="text-slate-500">× {it.qty}</span></span><span className="tabular">{formatIDR(it.qty * it.sell_price)}</span></li>
                ))}
              </ul>
              <dl className="mt-2 space-y-1 border-t border-slate-200 pt-2 text-sm">
                <div className="flex justify-between text-slate-600"><dt>Subtotal</dt><dd className="tabular">{formatIDR(detail.subtotal)}</dd></div>
                {detail.discount > 0 && <div className="flex justify-between text-emerald-700"><dt>Diskon{detail.coupon_code ? ` & voucher ${detail.coupon_code}` : ''}</dt><dd className="tabular">− {formatIDR(detail.discount)}</dd></div>}
                {detail.tax > 0 && <div className="flex justify-between text-slate-600"><dt>Pajak</dt><dd className="tabular">{formatIDR(detail.tax)}</dd></div>}
                <div className="flex justify-between font-bold text-slate-900"><dt>Total</dt><dd className="tabular">{formatIDR(detail.total)}</dd></div>
              </dl>
              {detail.status !== 'void' && detail.void_request && (
                <p className={cx('mt-3 rounded-xl p-3 text-sm', detail.void_request.status === 'rejected' ? 'bg-slate-100 text-slate-700' : 'bg-amber-50 text-amber-900')}>
                  {detail.void_request.status === 'rejected' ? `Pengajuan pembatalan ditolak ${detail.void_request.decided_by}.` : 'Pengajuan pembatalan menunggu persetujuan Bos.'} Alasan: “{detail.void_request.reason}” ({detail.void_request.by})
                </p>
              )}
              {detail.status !== 'void' && !canVoid && !detail.void_request && <p className="mt-3 text-xs text-slate-500">Transaksi yang salah bisa diajukan pembatalannya. Bos akan meninjau dan menyetujui.</p>}
            </Modal>
          )}

          {voiding && (
            <Modal title={canVoid ? `Batalkan ${voiding.receipt_no}?` : `Ajukan pembatalan ${voiding.receipt_no}`}
              desc={canVoid ? `${formatIDR(voiding.total)} · stok produk akan dikembalikan` : `${formatIDR(voiding.total)} · Bos akan meninjau pengajuan ini`} onClose={() => setVoiding(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setVoiding(null)}>Kembali</Btn>
                <Btn variant="danger" onClick={canVoid ? confirmVoid : requestVoid} disabled={!voidReason.trim()}>{canVoid ? 'Ya, batalkan' : 'Kirim pengajuan'}</Btn></>}>
              <div className="space-y-3">
                <div className="flex flex-wrap gap-2" role="group" aria-label="Alasan cepat">
                  {VOID_REASONS.map(r => {
                    const on = voidReason === r;
                    return <button key={r} type="button" aria-pressed={on} onClick={() => setVoidReason(r)}
                      className={cx('min-h-[36px] rounded-lg border px-3 text-sm font-medium transition-colors', focusRing, on ? 'border-brand-600 bg-brand-600 text-white' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50')}>{r}</button>;
                  })}
                </div>
                <Field label="Alasan dibatalkan" hint="Wajib diisi. Tercatat di laporan untuk dicek Bos.">
                  <textarea autoFocus rows={3} value={voidReason} onChange={e => setVoidReason(e.target.value)} className={cx(inputCls, 'py-2')} placeholder="Jelaskan kenapa transaksi ini perlu dibatalkan" />
                </Field>
              </div>
            </Modal>
          )}

          {reprint && <ReceiptModal sale={reprint} business={db.business} customers={db.customers} title="Cetak ulang struk" onClose={() => setReprint(null)} />}
        </div>
      );
    }

    // =====================================================================
    // PRODUCTS
    // =====================================================================
    const EMPTY_PRODUCT = { name: '', sku: '', category: 'Coffee', buy_price: 10000, sell_price: 25000, promo_price: 0, stock: 20, min_stock: 5, unit: 'Pcs', img: '' };

    function ProductsModule({ db, setDb, notify, currentUser, hasPermission }) {
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState(EMPTY_PRODUCT);
      const [showHistory, setShowHistory] = useState(false);
      const [historyQuery, setHistoryQuery] = useState('');
      const hq = historyQuery.trim().toLowerCase();
      const filteredHistory = db.stockHistory.filter(l => !hq || [l.name, l.sku, l.type, l.user, l.date].some(v => String(v || '').toLowerCase().includes(hq)));
      const [confirmDelete, setConfirmDelete] = useState(false);
      const [search, setSearch] = useState('');
      const [submitted, setSubmitted] = useState(false);
      const [stockFilter, setStockFilter] = useState('all');
      const [restock, setRestock] = useState(null);
      const [showCats, setShowCats] = useState(false);

      const promos = activePromos(db);
      const canEdit = hasPermission('can_edit_product');
      const set = (k) => (e) => setForm(f => ({ ...f, [k]: e && e.target ? e.target.value : e }));
      const nameError = submitted && !form.name.trim() ? 'Nama produk wajib diisi.' : null;
      const skuTrim = (form.sku || '').trim().toUpperCase();
      const skuOwner = skuTrim && db.products.find(p => p.sku.toUpperCase() === skuTrim && (editing === 'new' || p.id !== editing?.id));
      const skuError = skuOwner ? `SKU ${skuTrim} sudah dipakai "${skuOwner.name}". Gunakan kode lain.` : null;
      const autoSku = () => { let k; do { k = 'SKU-' + Math.floor(1000 + Math.random() * 9000); } while (db.products.some(p => p.sku === k)); return k; };
      const priceWarn = Number(form.sell_price) < Number(form.buy_price) ? 'Harga jual lebih rendah dari HPP.' : null;
      const promoPrice = Number(form.promo_price) || 0;
      const promoError = promoPrice > 0 && promoPrice >= Number(form.sell_price) ? 'Harga promo harus lebih rendah dari harga jual.' : null;
      const promoHint = promoPrice > 0 && !promoError
        ? `Tampil di kasir: ${formatIDR(form.sell_price)} dicoret → ${formatIDR(promoPrice)} (hemat ${Math.round((1 - promoPrice / form.sell_price) * 100)}%)`
        : 'Kosongkan jika tidak ada diskon.';

      const open = (p) => { setEditing(p); setForm(p === 'new' ? { ...EMPTY_PRODUCT, category: db.categories.find(c => c !== 'Semua') || 'Lainnya' } : { ...EMPTY_PRODUCT, ...p }); setConfirmDelete(false); setSubmitted(false); };
      const close = () => setEditing(null);

      // Both filter counts follow the search, so "Semua (5)" means 5 products match what was typed
      const q = search.trim().toLowerCase();
      const searched = db.products.filter(p => !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
      const lowSearched = searched.filter(p => p.stock <= p.min_stock);
      const rows = stockFilter === 'low' ? lowSearched : searched;
      const nowStamp = () => { const d = new Date(); return `${dateKey(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

      const save = () => {
        setSubmitted(true);
        if (!form.name.trim() || promoError || skuError) return;
        const clean = {
          name: form.name.trim(), category: form.category,
          buy_price: Number(form.buy_price) || 0, sell_price: Number(form.sell_price) || 0, promo_price: promoPrice,
          stock: parseInt(form.stock, 10) || 0, min_stock: parseInt(form.min_stock, 10) || 0,
          unit: form.unit || 'Pcs', img: form.img || ''
        };
        if (editing === 'new') {
          const added = { id: 'p-' + Date.now(), sku: skuTrim || autoSku(), ...clean };
          setDb(prev => ({ ...prev, products: [added, ...prev.products], stockHistory: [{ id: generateId('SH'), date: nowStamp(), sku: added.sku, name: added.name, qtyChange: `+${added.stock}`, type: 'Stok awal produk baru', user: currentUser.name }, ...prev.stockHistory] }));
          notify(`${added.name} ditambahkan ke katalog.`);
        } else {
          const diff = clean.stock - editing.stock;
          setDb(prev => ({
            ...prev,
            products: prev.products.map(p => p.id === editing.id ? { ...p, ...clean, sku: skuTrim || p.sku } : p),
            stockHistory: diff !== 0 ? [{ id: generateId('SH'), date: nowStamp(), sku: editing.sku, name: clean.name, qtyChange: diff > 0 ? `+${diff}` : `${diff}`, type: 'Penyesuaian stok manual', user: currentUser.name }, ...prev.stockHistory] : prev.stockHistory
          }));
          notify(`${clean.name} diperbarui.`);
        }
        close();
      };

      const remove = () => {
        if (!hasPermission('can_delete_product')) return notify('Anda tidak memiliki izin menghapus produk.', 'warn');
        setDb(prev => ({ ...prev, products: prev.products.filter(p => p.id !== editing.id) }));
        notify(`${editing.name} dihapus.`);
        close();
      };

      const saveRestock = () => {
        if (!restock.qty) return;
        const p = restock.product;
        setDb(prev => ({
          ...prev,
          products: prev.products.map(x => x.id === p.id ? { ...x, stock: x.stock + restock.qty } : x),
          stockHistory: [{ id: generateId('SH'), date: nowStamp(), sku: p.sku, name: p.name, qtyChange: `+${restock.qty}`, type: restock.note || 'Restock', user: currentUser.name }, ...prev.stockHistory]
        }));
        notify(`Stok ${p.name} bertambah ${restock.qty}.`);
        setRestock(null);
      };

      return (
        <div className="space-y-5">
          <PageHeader title="Katalog & Inventori" desc="Kelola menu, foto, harga, diskon, dan stok."
            actions={<>
              {currentUser.role === 'owner' && <Btn variant="secondary" icon="grid" onClick={() => setShowCats(true)}>Kategori</Btn>}
              <Btn variant="secondary" icon="clock" onClick={() => setShowHistory(true)}>Riwayat stok</Btn>
              {hasPermission('can_add_product') && <Btn icon="plus" onClick={() => open('new')}>Tambah produk</Btn>}
            </>} />

          <Card>
            <div className="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row sm:items-center sm:justify-between">
              <SearchInput id="prod-search" value={search} onChange={setSearch} placeholder="Cari nama atau SKU (cth. COF)…" className="w-full sm:max-w-sm" />
              <SegmentedControl label="Filter stok" value={stockFilter} onChange={setStockFilter}
                options={[{ value: 'all', label: `Semua (${searched.length})` }, { value: 'low', label: `Stok menipis (${lowSearched.length})` }]} />
            </div>
            <div className="overflow-x-auto">
              <table className="w-full min-w-[780px] text-left text-sm">
                <thead className="bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-600">
                  <tr>
                    <th scope="col" className="px-4 py-3">Produk</th><th scope="col" className="px-4 py-3">Kategori</th>
                    <th scope="col" className="px-4 py-3 text-right">HPP</th><th scope="col" className="px-4 py-3 text-right">Harga jual</th>
                    <th scope="col" className="px-4 py-3 text-right">Margin</th><th scope="col" className="px-4 py-3">Stok</th>
                    <th scope="col" className="px-4 py-3"><span className="sr-only">Aksi</span></th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {rows.map(p => {
                    const info = priceInfo(p, promos);
                    const margin = info.price ? Math.round(((info.price - p.buy_price) / info.price) * 100) : 0;
                    return (
                      <tr key={p.id} className="hover:bg-slate-50">
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-3">
                            <ProductThumb product={p} className="h-11 w-11 flex-shrink-0 rounded-lg" textClass="text-xs" />
                            <div><p className="font-semibold text-slate-900">{p.name}</p><p className="font-mono text-xs text-slate-500">{p.sku}{!p.img && ' · belum ada foto'}</p></div>
                          </div>
                        </td>
                        <td className="px-4 py-3 text-slate-700">{p.category}</td>
                        <td className="px-4 py-3 text-right text-slate-600 tabular">{formatIDR(p.buy_price)}</td>
                        <td className="px-4 py-3 text-right">
                          <div className="flex flex-col items-end">
                            <PriceTag info={info} className="items-end" />
                            {info.label && <span className="text-xs text-rose-600">{info.label}</span>}
                          </div>
                        </td>
                        <td className={cx('px-4 py-3 text-right tabular', margin < 20 ? 'text-amber-700' : 'text-slate-700')}>{margin}%</td>
                        <td className="px-4 py-3">
                          {p.stock <= 0 ? <Badge tone="rose">Habis</Badge>
                            : p.stock <= p.min_stock ? <Badge tone="amber"><span className="tabular">{p.stock}</span> {p.unit} · menipis</Badge>
                            : <span className="text-slate-800 tabular">{p.stock} {p.unit}</span>}
                        </td>
                        <td className="whitespace-nowrap px-4 py-3 text-right">
                          {canEdit && <>
                            <Btn variant="ghost" size="sm" icon="plus" onClick={() => setRestock({ product: p, qty: 0, note: 'Restock' })} aria-label={`Tambah stok ${p.name}`}>Stok</Btn>
                            <Btn variant="ghost" size="sm" icon="edit" onClick={() => open(p)} aria-label={`Edit ${p.name}`}>Edit</Btn>
                          </>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {rows.length === 0 && <EmptyState icon="search" title={stockFilter === 'low' ? 'Tidak ada stok menipis yang cocok' : 'Tidak ada produk yang cocok'} />}
            </div>
          </Card>

          {editing && (
            <Modal title={editing === 'new' ? 'Tambah produk' : 'Edit produk'} onClose={close} size="lg"
              footer={confirmDelete ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus produk ini secara permanen?</p>
                <Btn variant="secondary" onClick={() => setConfirmDelete(false)}>Batal</Btn>
                <Btn variant="danger" onClick={remove}>Ya, hapus</Btn>
              </> : <>
                {editing !== 'new' && hasPermission('can_delete_product') && <Btn variant="ghost" icon="trash" className="text-rose-700 hover:bg-rose-50 hover:text-rose-800" onClick={() => setConfirmDelete(true)}>Hapus</Btn>}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={close}>Batal</Btn>
                <Btn onClick={save}>Simpan</Btn>
              </>}>
              <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div className="sm:col-span-2">
                  <ImageUpload label="Foto produk" value={form.img} onChange={(v) => setForm(f => ({ ...f, img: v }))}
                    hint="Ambil foto atau pilih dari galeri. Foto otomatis dipotong persegi dan dikompres agar ringan." />
                </div>
                <Field label="Nama produk" error={nameError} className="sm:col-span-2">
                  <input autoFocus value={form.name} onChange={set('name')} className={inputCls} placeholder="cth. Es Kopi Susu" />
                </Field>
                <Field label="Kode SKU" error={skuError} hint="Harus unik. Kosongkan untuk dibuat otomatis."><input value={form.sku} aria-invalid={!!skuError} onChange={e => setForm(f => ({ ...f, sku: e.target.value.toUpperCase().replace(/\s/g, '') }))} className={cx(inputCls, 'font-mono', skuError && 'border-rose-400')} placeholder="SKU-001" /></Field>
                <Field label="Kategori">
                  <select value={form.category} onChange={set('category')} className={inputCls}>
                    {db.categories.filter(c => c !== 'Semua').map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </Field>
                <Field label="Harga beli (HPP)"><MoneyInput value={form.buy_price} onChange={set('buy_price')} /></Field>
                <Field label="Harga jual normal" hint={priceWarn}><MoneyInput value={form.sell_price} onChange={set('sell_price')} /></Field>
                <Field label="Harga promo (harga coret)" error={promoError} hint={promoHint} className="sm:col-span-2">
                  <div className="flex gap-2">
                    <div className="flex-1"><MoneyInput value={form.promo_price} onChange={set('promo_price')} placeholder="Tidak ada diskon" /></div>
                    {[10, 20, 30].map(pct => (
                      <Btn key={pct} variant="secondary" size="sm" className="min-h-[44px]" onClick={() => setForm(f => ({ ...f, promo_price: Math.round(f.sell_price * (1 - pct / 100) / 500) * 500 }))}>−{pct}%</Btn>
                    ))}
                  </div>
                </Field>
                <Field label="Jumlah stok"><input type="number" min="0" inputMode="numeric" value={form.stock} onChange={set('stock')} className={cx(inputCls, 'tabular')} /></Field>
                <Field label="Batas stok minimum" hint="Peringatan muncul di bawah angka ini."><input type="number" min="0" inputMode="numeric" value={form.min_stock} onChange={set('min_stock')} className={cx(inputCls, 'tabular')} /></Field>
                <Field label="Satuan"><input value={form.unit} onChange={set('unit')} className={inputCls} placeholder="Pcs / Cup / Kg" /></Field>
              </div>
            </Modal>
          )}

          {restock && (
            <Modal title={`Tambah stok ${restock.product.name}`} desc={`Stok sekarang ${restock.product.stock} ${restock.product.unit}`} onClose={() => setRestock(null)}
              footer={<><span className="flex-1" /><Btn variant="secondary" onClick={() => setRestock(null)}>Batal</Btn><Btn onClick={saveRestock} disabled={!restock.qty}>Simpan</Btn></>}>
              <div className="space-y-4">
                <Field label="Jumlah masuk" hint={restock.qty ? `Stok baru: ${restock.product.stock + restock.qty} ${restock.product.unit}` : 'Untuk barang dari supplier, sebaiknya catat lewat Pembelian & PO.'}>
                  <input autoFocus type="number" min="1" inputMode="numeric" value={restock.qty || ''} onChange={e => setRestock({ ...restock, qty: Math.max(0, parseInt(e.target.value, 10) || 0) })} className={cx(inputCls, 'tabular')} />
                </Field>
                <Field label="Keterangan"><input value={restock.note} onChange={e => setRestock({ ...restock, note: e.target.value })} className={inputCls} /></Field>
              </div>
            </Modal>
          )}

          {showHistory && (
            <Modal title="Riwayat pergerakan stok" onClose={() => setShowHistory(false)} size="lg">
              <SearchInput id="history-search" value={historyQuery} onChange={setHistoryQuery} placeholder="Cari produk, SKU, keterangan, atau nama…" />
              {filteredHistory.length === 0 ? <EmptyState icon={hq ? 'search' : 'clock'} title={hq ? 'Tidak ada riwayat yang cocok' : 'Belum ada riwayat'} /> : (
                <ul className="mt-2 divide-y divide-slate-100">
                  {filteredHistory.map(log => {
                    const neg = String(log.qtyChange).startsWith('-');
                    return (
                      <li key={log.id} className="flex items-center justify-between gap-3 py-3">
                        <div className="min-w-0">
                          <p className="text-sm font-semibold text-slate-900">{log.name} <span className="font-mono text-xs font-normal text-slate-500">{log.sku}</span></p>
                          <p className="text-sm text-slate-600">{log.type}</p>
                          <p className="text-xs text-slate-500">{log.date} · {log.user}</p>
                        </div>
                        <span className={cx('whitespace-nowrap font-mono text-base font-bold', neg ? 'text-rose-600' : 'text-emerald-700')}>{log.qtyChange}</span>
                      </li>
                    );
                  })}
                </ul>
              )}
            </Modal>
          )}
          {showCats && <CategoryManager db={db} setDb={setDb} notify={notify} onClose={() => setShowCats(false)} />}
        </div>
      );
    }

    // Bos manages the menu categories shown as filters on the Kasir page
    function CategoryManager({ db, setDb, notify, onClose }) {
      const [name, setName] = useState('');
      const cats = db.categories.filter(c => c !== 'Semua');
      const trimmed = name.trim();
      const dup = !!trimmed && db.categories.some(c => c.toLowerCase() === trimmed.toLowerCase());
      const add = (e) => {
        e.preventDefault();
        if (!trimmed || dup) return;
        setDb(prev => ({ ...prev, categories: [...prev.categories, trimmed] }));
        setName('');
        notify(`Kategori ${trimmed} ditambahkan.`);
      };
      return (
        <Modal title="Kategori menu" desc="Kategori tampil sebagai filter di halaman Kasir." onClose={onClose} footer={<Btn onClick={onClose}>Selesai</Btn>}>
          <form onSubmit={add} className="flex gap-2">
            <label className="sr-only" htmlFor="new-cat">Nama kategori baru</label>
            <input id="new-cat" autoFocus value={name} onChange={e => setName(e.target.value)} maxLength={30} placeholder="cth. Kopi Susu" className={inputCls} />
            <Btn type="submit" icon="plus" disabled={!trimmed || dup} className="flex-shrink-0">Tambah</Btn>
          </form>
          {dup && <p className="mt-1 text-xs font-medium text-rose-600" role="alert">Kategori ini sudah ada.</p>}
          {cats.length === 0 ? <p className="mt-4 text-sm text-slate-500">Belum ada kategori.</p> : (
            <ul className="mt-4 divide-y divide-slate-100">
              {cats.map(c => {
                const n = db.products.filter(p => p.category === c).length;
                return (
                  <li key={c} className="flex items-center justify-between gap-3 py-2">
                    <div className="min-w-0">
                      <p className="truncate text-sm font-semibold text-slate-900">{c}</p>
                      <p className="text-xs text-slate-500">{n ? `${n} produk` : 'Belum ada produk'}</p>
                    </div>
                    <IconBtn icon="trash" label={`Hapus kategori ${c}`} className="text-rose-600 hover:bg-rose-50"
                      onClick={() => n
                        ? notify(`Pindahkan dulu ${n} produk dari kategori ${c} sebelum menghapusnya.`, 'warn')
                        : (setDb(prev => ({ ...prev, categories: prev.categories.filter(x => x !== c) })), notify(`Kategori ${c} dihapus.`, 'info'))} />
                  </li>
                );
              })}
            </ul>
          )}
        </Modal>
      );
    }

    // =====================================================================
    // CUSTOMERS
    // =====================================================================
    // Loyalty points were removed: customers never see the POS, so points had no way to be redeemed.
    function CustomersModule({ db, setDb, notify }) {
      const [form, setForm] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [search, setSearch] = useState('');
      const [confirmDel, setConfirmDel] = useState(false);
      useEffect(() => setConfirmDel(false), [form && form.id]);

      const removeCustomer = () => {
        setDb(prev => ({ ...prev, customers: prev.customers.filter(c => c.id !== form.id) }));
        notify(`${form.name} dihapus dari daftar pelanggan.`, 'info');
        setForm(null);
      };

      const q = search.trim().toLowerCase();
      const list = db.customers.filter(c => c.id !== 'cust-1' && (!q || c.name.toLowerCase().includes(q) || c.phone.includes(q)));

      const save = () => {
        setSubmitted(true);
        if (!form.name.trim() || waError(form.phone)) return;
        if (form.id) {
          setDb(prev => ({ ...prev, customers: prev.customers.map(c => c.id === form.id ? { ...c, name: form.name.trim(), phone: form.phone || '-' } : c) }));
          notify(`Data ${form.name} diperbarui.`);
        } else {
          const added = { id: 'cust-' + Date.now(), name: form.name.trim(), phone: form.phone || '-', total_spent: 0, debt: 0, visits: 0 };
          setDb(prev => ({ ...prev, customers: [...prev.customers, added] }));
          notify(`${added.name} ditambahkan.`);
        }
        setForm(null);
      };

      const waLink = (c) => {
        const num = c.phone.replace(/\D/g, '').replace(/^0/, '62');
        const msg = `Halo ${c.name}, ini pengingat dari ${db.business.name}: kasbon Anda saat ini ${formatIDR(c.debt)}. Terima kasih.`;
        return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
      };

      return (
        <div className="space-y-5">
          <PageHeader title="Pelanggan" desc="Pelanggan tetap, riwayat belanja, dan kasbon."
            actions={<Btn icon="plus" onClick={() => { setForm({ name: '', phone: '' }); setSubmitted(false); }}>Tambah pelanggan</Btn>} />
          <SearchInput id="cust-search" value={search} onChange={setSearch} placeholder="Cari nama atau nomor HP…" className="max-w-sm" />

          {list.length === 0 ? <Card><EmptyState icon="customers" title="Pelanggan tidak ditemukan" desc="Pelanggan baru juga bisa ditambahkan langsung dari layar kasir." /></Card> : (
            <ul className="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3">
              {list.map(c => (
                <li key={c.id}>
                  <Card className="h-full p-4">
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex min-w-0 items-center gap-3">
                        <Avatar name={c.name} className="h-10 w-10 text-sm" />
                        <div className="min-w-0"><p className="truncate font-semibold text-slate-900">{c.name}</p><p className="text-sm text-slate-500">{c.phone}</p></div>
                      </div>
                      <IconBtn icon="edit" label={`Edit ${c.name}`} iconClass="h-4 w-4" onClick={() => { setForm({ ...c }); setSubmitted(false); }} className="-mr-2 -mt-2 h-9 w-9" />
                    </div>
                    <dl className="mt-4 grid grid-cols-3 gap-2 border-t border-slate-100 pt-3 text-sm">
                      <div><dt className="text-xs text-slate-500">Kunjungan</dt><dd className="font-semibold text-slate-900 tabular">{c.visits}×</dd></div>
                      <div><dt className="text-xs text-slate-500">Total belanja</dt><dd className="font-semibold text-slate-900 tabular">{formatIDR(c.total_spent)}</dd></div>
                      <div><dt className="text-xs text-slate-500">Kasbon</dt><dd className={cx('font-semibold tabular', c.debt > 0 ? 'text-rose-600' : 'text-slate-400')}>{c.debt > 0 ? formatIDR(c.debt) : '—'}</dd></div>
                    </dl>
                    {c.debt > 0 && c.phone !== '-' && (
                      <a href={waLink(c)} target="_blank" rel="noreferrer" className={cx('mt-3 inline-flex min-h-[36px] items-center gap-2 rounded-xl border border-emerald-300 bg-emerald-50 px-3 text-xs font-semibold text-emerald-800 hover:bg-emerald-100', focusRing)}>
                        <SvgIcon name="chat" className="h-4 w-4" />Ingatkan kasbon via WhatsApp
                      </a>
                    )}
                  </Card>
                </li>
              ))}
            </ul>
          )}

          {form && (
            <Modal title={form.id ? 'Edit pelanggan' : 'Tambah pelanggan'} onClose={() => setForm(null)}
              footer={confirmDel ? <>
                <p className="flex-1 self-center text-sm font-medium text-rose-700">Hapus {form.name}? Riwayat transaksinya tetap ada di laporan.</p>
                <Btn variant="secondary" onClick={() => setConfirmDel(false)}>Batal</Btn>
                <Btn variant="danger" onClick={removeCustomer}>Ya, hapus</Btn>
              </> : <>
                {form.id && <IconBtn icon="trash" label={`Hapus ${form.name}`} className="text-rose-600 hover:bg-rose-50"
                  onClick={() => form.debt > 0 ? notify(`${form.name} masih punya kasbon ${formatIDR(form.debt)}. Lunasi dulu sebelum dihapus.`, 'warn') : setConfirmDel(true)} />}
                <span className="flex-1" />
                <Btn variant="secondary" onClick={() => setForm(null)}>Batal</Btn>
                <Btn onClick={save}>Simpan</Btn>
              </>}>
              <div className="space-y-4">
                <Field label="Nama lengkap" error={submitted && !form.name.trim() ? 'Nama wajib diisi.' : null}>
                  <input autoFocus value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className={inputCls} autoComplete="off" />
                </Field>
                <Field label="Nomor WhatsApp" error={waError(form.phone)} hint="Angka saja, diawali 08. Untuk mengirim pengingat kasbon.">
                  <WaInput value={form.phone} onChange={v => setForm({ ...form, phone: v })} />
                </Field>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // PURCHASES
    // =====================================================================
    const PO_TONE = { 'Diterima Penuh': 'green', 'Proses Pengiriman': 'blue', 'Draft PO': 'slate' };
    const NON_MENU_CATEGORIES = ['Bahan Baku', 'Kemasan', 'Perlengkapan', 'Lainnya'];
    const UNITS = ['Pcs', 'Kg', 'Gram', 'Liter', 'mL', 'Pack', 'Dus', 'Botol', 'Karung', 'Lusin', 'Cup', 'Porsi'];
    const newPoItem = () => ({ key: generateId('IT'), product_id: '', name: '', category: 'Bahan Baku', qty: 1, unit: 'Pcs', unit_cost: 0 });

    function PurchasesModule({ db, setDb, notify, currentUser }) {
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState(null);
      const [newSup, setNewSup] = useState({ name: '', phone: '', address: '' });
      const [tried, setTried] = useState(false);

      const itemCategories = [...new Set([...db.categories.filter(c => c !== 'Semua'), ...NON_MENU_CATEGORIES])];
      const locked = editing && editing !== 'new' && editing.stock_applied;

      const open = (po) => {
        setEditing(po); setTried(false);
        const sup = db.suppliers.find(x => x.id === (po === 'new' ? db.suppliers[0]?.id : po.supplier_id));
        setNewSup({ name: sup?.name || '', phone: sup?.phone || '', address: sup?.address || '' });
        setForm(po === 'new'
          ? { supplier_id: db.suppliers[0]?.id || '__new', date: dateKey(), status: 'Draft PO', payment: 'lunas', due_date: addDays(dateKey(), 14), note: '', items: [newPoItem()] }
          : { ...po, due_date: po.due_date || addDays(po.date, 14), items: po.items.map(it => ({ ...it, key: generateId('IT'), product_id: it.product_id || '' })) });
      };

      const updateItem = (key, patch) => setForm(f => ({ ...f, items: f.items.map(it => it.key === key ? { ...it, ...patch } : it) }));
      const pickProduct = (key, productId) => {
        const p = db.products.find(x => x.id === productId);
        updateItem(key, p ? { product_id: p.id, name: p.name, category: p.category, unit: p.unit, unit_cost: p.buy_price } : { product_id: '', name: '' });
      };

      const total = form ? form.items.reduce((a, it) => a + (Number(it.qty) || 0) * (Number(it.unit_cost) || 0), 0) : 0;
      const itemsInvalid = form && (form.items.length === 0 || form.items.some(it => !it.name.trim() || !(Number(it.qty) > 0) || !(Number(it.unit_cost) > 0)));
      const supplierInvalid = form && ((form.supplier_id === '__new' && !newSup.name.trim()) || !!waError(newSup.phone));

      const save = () => {
        setTried(true);
        if (!locked && (itemsInvalid || supplierInvalid)) return;
        let supplierId = form.supplier_id;
        let createdSup = null;
        if (supplierId === '__new') { createdSup = { id: generateId('SUP'), name: newSup.name.trim(), phone: newSup.phone, address: newSup.address.trim() }; supplierId = createdSup.id; }
        const supplierName = createdSup ? createdSup.name : db.suppliers.find(s => s.id === supplierId)?.name || '-';
        const items = locked ? editing.items : form.items.map(({ key, ...it }) => ({ ...it, product_id: it.product_id || null, name: it.name.trim(), qty: Number(it.qty), unit_cost: Number(it.unit_cost) }));
        const base = editing === 'new' ? { id: generateId('PO'), po_number: `PO-${form.date.replace(/-/g, '')}-${Math.floor(10 + Math.random() * 90)}`, paid: 0, stock_applied: false } : editing;
        const po = {
          ...base, supplier_id: supplierId, supplier: supplierName, date: form.date, status: form.status,
          payment: form.payment, due_date: form.payment === 'tempo' ? form.due_date : null, note: form.note,
          items, total: locked ? editing.total : items.reduce((a, it) => a + it.qty * it.unit_cost, 0)
        };
        // Receiving a PO adds menu items to stock once; non-menu goods are logged in stock history
        const receiveNow = po.status === 'Diterima Penuh' && !po.stock_applied;
        const stamp = `${dateKey()} ${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
        setDb(prev => {
          let products = prev.products, history = prev.stockHistory;
          if (receiveNow) {
            products = products.map(p => { const qty = po.items.filter(i => i.product_id === p.id).reduce((a, i) => a + i.qty, 0); return qty ? { ...p, stock: p.stock + qty } : p; });
            history = [...po.items.map(i => ({ id: generateId('SH'), date: stamp, sku: prev.products.find(p => p.id === i.product_id)?.sku || i.category, name: i.name, qtyChange: `+${i.qty} ${i.unit}`, type: `Penerimaan ${po.po_number} · ${po.supplier}`, user: currentUser.name })), ...history];
          }
          const saved = { ...po, stock_applied: po.stock_applied || receiveNow };
          return {
            ...prev, products, stockHistory: history,
            // Phone/address edited in the order form are saved back to the supplier
            suppliers: createdSup ? [...prev.suppliers, createdSup] : prev.suppliers.map(x => x.id === supplierId ? { ...x, phone: newSup.phone, address: newSup.address.trim() } : x),
            purchases: editing === 'new' ? [saved, ...prev.purchases] : prev.purchases.map(p => p.id === saved.id ? saved : p)
          };
        });
        notify(receiveNow ? `${po.po_number} diterima. Stok menu bertambah otomatis.` : `${po.po_number} ${editing === 'new' ? 'dibuat' : 'diperbarui'}.`);
        setEditing(null);
      };

      const [poSearch, setPoSearch] = useState('');
      const [poMonth, setPoMonth] = useState(dateKey().slice(0, 7));
      const poMonths = [...new Set([dateKey().slice(0, 7), ...db.purchases.map(p => p.date.slice(0, 7))])].sort().reverse();
      const pq = poSearch.trim().toLowerCase();
      const sorted = [...db.purchases]
        .filter(p => (poMonth === 'all' || p.date.startsWith(poMonth)) &&
          (!pq || p.supplier.toLowerCase().includes(pq) || p.po_number.toLowerCase().includes(pq) || p.items.some(it => it.name.toLowerCase().includes(pq) || it.category.toLowerCase().includes(pq))))
        .sort((a, b) => b.date.localeCompare(a.date));
      const bySupplier = Object.values(sorted.reduce((m, po) => {
        m[po.supplier] = m[po.supplier] || { name: po.supplier, count: 0, total: 0, debt: 0 };
        m[po.supplier].count++; m[po.supplier].total += po.total; m[po.supplier].debt += poOutstanding(po);
        return m;
      }, {})).sort((a, b) => b.total - a.total);

      return (
        <div className="space-y-5">
          <PageHeader title="Supplier / Pemasok" desc="Pesanan barang ke pemasok. Barang menu yang diterima otomatis menambah stok." actions={<Btn icon="plus" onClick={() => open('new')}>Buat Pesanan Barang</Btn>} />
          <Card className="flex flex-col gap-3 p-4 sm:flex-row sm:items-end">
            <div className="flex-1">
              <span className="text-sm font-medium text-slate-700">Cari</span>
              <SearchInput id="po-search" value={poSearch} onChange={setPoSearch} placeholder="Nama supplier, no. PO, atau barang…" className="mt-1.5" />
            </div>
            <Field label="Bulan" className="sm:w-56">
              <select value={poMonth} onChange={e => setPoMonth(e.target.value)} className={inputCls}>
                <option value="all">Semua bulan</option>
                {poMonths.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}
              </select>
            </Field>
          </Card>
          {sorted.length > 0 && (
            <div className="grid grid-cols-1 gap-3 lg:grid-cols-3">
              <StatCard label={poMonth === 'all' ? 'Total pembelian' : `Pembelian ${monthLabel(poMonth)}`} value={formatIDR(sorted.reduce((a, po) => a + po.total, 0))} sub={`${sorted.length} PO dari ${bySupplier.length} supplier`} icon="purchases" />
              <Card className="p-4 lg:col-span-2">
                <p className="text-sm font-semibold text-slate-900">Supplier di periode ini</p>
                <ul className="mt-2 flex flex-wrap gap-2">
                  {bySupplier.map(x => (
                    <li key={x.name} className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm">
                      <p className="font-semibold text-slate-900">{x.name}</p>
                      <p className="text-xs text-slate-600">{x.count} PO · {formatIDR(x.total)}{x.debt > 0 && <span className="font-medium text-rose-600"> · hutang {formatIDR(x.debt)}</span>}</p>
                    </li>
                  ))}
                </ul>
              </Card>
            </div>
          )}
          <Card>
            <div className="overflow-x-auto">
              <table className="w-full min-w-[820px] text-left text-sm">
                <thead className="bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-600">
                  <tr><th scope="col" className="px-4 py-3">No. PO</th><th scope="col" className="px-4 py-3">Supplier</th><th scope="col" className="px-4 py-3">Barang</th><th scope="col" className="px-4 py-3 text-right">Nilai</th><th scope="col" className="px-4 py-3">Pembayaran</th><th scope="col" className="px-4 py-3">Status</th><th scope="col" className="px-4 py-3"><span className="sr-only">Aksi</span></th></tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {sorted.map(po => (
                    <tr key={po.id} className="align-top hover:bg-slate-50">
                      <td className="px-4 py-3"><p className="font-mono font-semibold text-slate-900">{po.po_number}</p><p className="text-xs text-slate-500">{fmtDateShort(po.date)}</p></td>
                      <td className="px-4 py-3">
                        {(() => { const sp = db.suppliers.find(x => x.id === po.supplier_id); return <>
                          <p className="font-medium text-slate-900">{po.supplier}</p>
                          <p className="text-xs text-slate-500 tabular">{sp?.phone ? `HP ${sp.phone}` : 'Belum ada nomor HP'}</p>
                          {sp?.address && <p className="max-w-[14rem] truncate text-xs text-slate-500" title={sp.address}>{sp.address}</p>}
                        </>; })()}
                      </td>
                      <td className="px-4 py-3">
                        <ul className="space-y-0.5">
                          {po.items.slice(0, 3).map((it, i) => <li key={i} className="text-slate-700"><span className="font-medium">{it.name}</span> <span className="text-slate-500">· {it.qty} {it.unit} · {it.category}</span></li>)}
                          {po.items.length > 3 && <li className="text-xs text-slate-500">+{po.items.length - 3} barang lainnya</li>}
                        </ul>
                      </td>
                      <td className="px-4 py-3 text-right font-semibold text-slate-900 tabular">{formatIDR(po.total)}</td>
                      <td className="px-4 py-3">
                        {po.payment === 'tempo'
                          ? poOutstanding(po) > 0
                            ? <><Badge tone={po.due_date < dateKey() ? 'rose' : 'amber'}>Tempo · sisa {formatIDR(poOutstanding(po))}</Badge><p className="mt-1 text-xs text-slate-500">Jatuh tempo {fmtDateShort(po.due_date)}</p></>
                            : <Badge tone="green">Tempo · lunas</Badge>
                          : <Badge tone="green">Lunas</Badge>}
                      </td>
                      <td className="px-4 py-3"><Badge tone={PO_TONE[po.status] || 'slate'}>{po.status}</Badge></td>
                      <td className="px-4 py-3 text-right"><Btn variant="ghost" size="sm" icon="edit" onClick={() => open(po)} aria-label={`Edit ${po.po_number}`}>Edit</Btn></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {sorted.length === 0 && <EmptyState icon="purchases" title={db.purchases.length ? 'Tidak ada pembelian yang cocok' : 'Belum ada purchase order'} desc={db.purchases.length ? 'Coba ubah bulan atau kata pencarian.' : undefined} />}
            </div>
          </Card>

          {editing && form && (
            <Modal title={editing === 'new' ? 'Buat pesanan barang' : `Pesanan ${editing.po_number}`} size="xl" onClose={() => setEditing(null)}
              footer={<><p className="flex-1 self-center text-sm text-slate-600">Total <span className="text-base font-bold text-slate-900 tabular">{formatIDR(locked ? editing.total : total)}</span></p><Btn variant="secondary" onClick={() => setEditing(null)}>Batal</Btn><Btn onClick={save}>{form.status === 'Diterima Penuh' && !(editing !== 'new' && editing.stock_applied) ? 'Simpan & terima barang' : 'Simpan'}</Btn></>}>
              <div className="space-y-4">
                <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
                  <Field label="Supplier" className="sm:col-span-2">
                    <select value={form.supplier_id} className={inputCls} onChange={e => {
                      const id = e.target.value;
                      const sp = db.suppliers.find(x => x.id === id);
                      setForm({ ...form, supplier_id: id });
                      setNewSup(sp ? { name: sp.name, phone: sp.phone || '', address: sp.address || '' } : { name: '', phone: '', address: '' });
                    }}>
                      {db.suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      <option value="__new">+ Supplier baru…</option>
                    </select>
                  </Field>
                  <Field label="Tanggal"><input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} className={inputCls} /></Field>
                </div>
                <div className="grid grid-cols-1 gap-3 rounded-xl bg-slate-50 p-3 sm:grid-cols-2">
                  {form.supplier_id === '__new' && (
                    <Field label="Nama supplier" className="sm:col-span-2" error={tried && !newSup.name.trim() ? 'Wajib diisi.' : null}><input value={newSup.name} onChange={e => setNewSup({ ...newSup, name: e.target.value })} className={inputCls} /></Field>
                  )}
                  <Field label="Nomor HP / WhatsApp supplier" error={waError(newSup.phone)}><WaInput value={newSup.phone} onChange={v => setNewSup({ ...newSup, phone: v })} /></Field>
                  <Field label="Alamat supplier"><input value={newSup.address} onChange={e => setNewSup({ ...newSup, address: e.target.value })} className={inputCls} placeholder="cth. Jl. Kaliurang Km 7, Sleman" /></Field>
                  {form.supplier_id !== '__new' && <p className="text-xs text-slate-500 sm:col-span-2">Perubahan nomor HP dan alamat ikut tersimpan ke data supplier ini.</p>}
                </div>

                <div>
                  <p className="text-sm font-medium text-slate-700">Barang yang dibeli</p>
                  {locked && <p className="mt-1 text-xs text-slate-500">Barang sudah diterima dan masuk stok, jadi daftar barang tidak bisa diubah lagi.</p>}
                  <ul className="mt-2 space-y-2">
                    {form.items.map((it, idx) => (
                      <li key={it.key} className="rounded-xl border border-slate-200 p-3">
                        <div className="grid grid-cols-2 gap-2 sm:grid-cols-12">
                          <label className="col-span-2 sm:col-span-4">
                            <span className="text-xs font-medium text-slate-600">Produk</span>
                            <select disabled={locked} value={it.product_id || ''} onChange={e => pickProduct(it.key, e.target.value)} className={cx(inputCls, 'mt-1')}>
                              <option value="">Barang lain (bukan menu)</option>
                              {db.products.map(p => <option key={p.id} value={p.id}>{p.name} · {p.sku}</option>)}
                            </select>
                          </label>
                          <label className="col-span-2 sm:col-span-4">
                            <span className="text-xs font-medium text-slate-600">Nama barang</span>
                            <input disabled={locked || !!it.product_id} value={it.name} onChange={e => updateItem(it.key, { name: e.target.value })} placeholder="cth. Gula pasir" className={cx(inputCls, 'mt-1', tried && !it.name.trim() && 'border-rose-400')} />
                          </label>
                          <label className="col-span-2 sm:col-span-4">
                            <span className="text-xs font-medium text-slate-600">Jenis</span>
                            <select disabled={locked} value={it.category} onChange={e => updateItem(it.key, { category: e.target.value })} className={cx(inputCls, 'mt-1')}>
                              {itemCategories.map(c => <option key={c}>{c}</option>)}
                            </select>
                          </label>
                          <label className="sm:col-span-2">
                            <span className="text-xs font-medium text-slate-600">Jumlah</span>
                            <input disabled={locked} type="number" min="0" step="any" inputMode="decimal" value={it.qty} onChange={e => updateItem(it.key, { qty: e.target.value })} className={cx(inputCls, 'mt-1 tabular', tried && !(Number(it.qty) > 0) && 'border-rose-400')} />
                          </label>
                          <label className="sm:col-span-3">
                            <span className="text-xs font-medium text-slate-600">Satuan</span>
                            <select disabled={locked} value={it.unit} onChange={e => updateItem(it.key, { unit: e.target.value })} className={cx(inputCls, 'mt-1')}>
                              {[...new Set([it.unit, ...UNITS])].map(u => <option key={u}>{u}</option>)}
                            </select>
                          </label>
                          <label className="col-span-2 sm:col-span-4">
                            <span className="text-xs font-medium text-slate-600">Harga per {it.unit}</span>
                            <div className="mt-1"><MoneyInput disabled={locked} value={it.unit_cost} onChange={v => updateItem(it.key, { unit_cost: v })} className={tried && !(Number(it.unit_cost) > 0) ? 'border-rose-400' : ''} /></div>
                          </label>
                          <div className="col-span-2 flex items-end justify-between gap-2 sm:col-span-3">
                            <span className="pb-3 text-sm font-semibold text-slate-900 tabular">{formatIDR((Number(it.qty) || 0) * (Number(it.unit_cost) || 0))}</span>
                            {!locked && form.items.length > 1 && <IconBtn icon="trash" label={`Hapus barang ${idx + 1}`} onClick={() => setForm(f => ({ ...f, items: f.items.filter(x => x.key !== it.key) }))} className="text-rose-600 hover:bg-rose-50" />}
                          </div>
                        </div>
                      </li>
                    ))}
                  </ul>
                  {!locked && <Btn variant="secondary" size="sm" icon="plus" className="mt-2" onClick={() => setForm(f => ({ ...f, items: [...f.items, newPoItem()] }))}>Tambah barang</Btn>}
                  {tried && itemsInvalid && !locked && <p className="mt-2 text-xs font-medium text-rose-600" role="alert">Lengkapi nama, jumlah, dan harga setiap barang.</p>}
                </div>

                <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
                  <Field label="Status">
                    <select value={form.status} onChange={e => setForm({ ...form, status: e.target.value })} className={inputCls}>
                      <option>Draft PO</option><option>Proses Pengiriman</option><option>Diterima Penuh</option>
                    </select>
                  </Field>
                  <Field label="Pembayaran">
                    <select value={form.payment} onChange={e => setForm({ ...form, payment: e.target.value })} className={inputCls}>
                      <option value="lunas">Lunas (bayar langsung)</option>
                      <option value="tempo">Tempo (jadi hutang)</option>
                    </select>
                  </Field>
                  {form.payment === 'tempo' && <Field label="Jatuh tempo"><input type="date" value={form.due_date} min={form.date} onChange={e => setForm({ ...form, due_date: e.target.value })} className={inputCls} /></Field>}
                </div>
                <Field label="Catatan"><input value={form.note || ''} onChange={e => setForm({ ...form, note: e.target.value })} className={inputCls} placeholder="Opsional" /></Field>
                {form.status === 'Diterima Penuh' && !(editing !== 'new' && editing.stock_applied) && (
                  <p className="rounded-xl bg-brand-50 p-3 text-sm text-brand-900">Saat disimpan, barang menu akan otomatis menambah stok, dan semua barang tercatat di riwayat stok.</p>
                )}
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // =====================================================================
    // ATTENDANCE, OVERTIME & REWARDS
    // =====================================================================
    const REWARD_TYPES = ['Karyawan Teladan', 'Tepat Waktu', 'Target Penjualan', 'Lembur Ekstra', 'Lainnya'];

    function AttendanceModule({ db, setDb, notify, currentUser, isOwner, todayKey, myAttendance, clockIn, clockOut, clocking, deviceId }) {
      const [tab, setTab] = useState(isOwner ? 'today' : 'me');
      const [month, setMonth] = useState(todayKey.slice(0, 7));
      const [rewardForm, setRewardForm] = useState(null);
      const [rejecting, setRejecting] = useState(null);
      const [distanceCheck, setDistanceCheck] = useState(null);
      const [leaveForm, setLeaveForm] = useState(null);
      const leaveOn = (userId, key) => (db.leaves || []).find(l => l.user_id === userId && l.date === key);
      const saveLeave = () => {
        const f = leaveForm;
        if (!f.user_id || f.to < f.from) return;
        const days = [];
        for (let k = f.from; k <= f.to && days.length < 31; k = addDays(k, 1)) days.push(k);
        const t = LEAVE_TYPES[f.type];
        setDb(prev => {
          const taken = new Set((prev.leaves || []).filter(l => l.user_id === f.user_id).map(l => l.date));
          const added = days.filter(d => !taken.has(d)).map(d => ({ id: generateId('LV'), user_id: f.user_id, date: d, type: f.type, note: f.note.trim(), by: currentUser.name }));
          return withStaffNotif({ ...prev, leaves: [...added, ...(prev.leaves || [])] }, f.user_id,
            { icon: 'calendar', tone: t.tone, title: `Anda dicatat ${t.label}`, msg: `${days.length > 1 ? `${fmtDateShort(f.from)} – ${fmtDateShort(f.to)}` : fmtDateShort(f.from)}${f.note.trim() ? ` · ${f.note.trim()}` : ''}`, go: 'attendance' });
        });
        notify(`${db.users.find(u => u.id === f.user_id)?.name} dicatat ${t.label} ${days.length} hari.`);
        setLeaveForm(null);
      };
      const removeLeave = (l) => { setDb(prev => ({ ...prev, leaves: (prev.leaves || []).filter(x => x.id !== l.id) })); notify('Catatan ketidakhadiran dihapus.', 'info'); };
      const work = db.business.work;
      const staff = db.users.filter(u => isStaffRole(u.role) && u.status !== 'Nonaktif');
      const storeDevices = db.business.store_devices || [];
      const pendingCount = db.overtime.filter(o => o.status === 'pending').length;

      const months = Array.from({ length: 6 }, (_, i) => { const d = new Date(todayKey + 'T00:00:00'); d.setDate(1); d.setMonth(d.getMonth() - i); return dateKey(d).slice(0, 7); });
      const updateWork = (patch) => setDb(prev => ({ ...prev, business: { ...prev.business, work: { ...prev.business.work, ...patch } } }));
      const updateShift = (id, patch) => updateWork({ shifts: work.shifts.map(s => s.id === id ? { ...s, ...patch } : s) });
      const updateUser = (id, patch) => setDb(prev => withStaffNotif({ ...prev, users: prev.users.map(u => u.id === id ? { ...u, ...patch } : u) }, id,
        patch.shift_id
          ? { icon: 'clock', tone: 'blue', title: 'Jadwal shift diubah', msg: `Shift Anda sekarang ${work.shifts.find(s => s.id === patch.shift_id)?.name}.`, go: 'attendance' }
          : { icon: 'calendar', tone: 'blue', title: 'Hari libur diubah', msg: `Hari libur mingguan Anda sekarang ${WEEKDAYS[patch.day_off]}.`, go: 'attendance' }));

      const decideOt = (ot, status, note) => {
        const pay = formatIDR(Math.round(ot.minutes / 60 * work.overtime_rate));
        setDb(prev => withStaffNotif({ ...prev, overtime: prev.overtime.map(o => o.id === ot.id ? { ...o, status, decided_by: currentUser.name, decided_at: new Date().toISOString(), owner_note: note || '' } : o) }, ot.user_id,
          status === 'approved'
            ? { icon: 'check', tone: 'green', title: 'Lembur disetujui', msg: `Lembur ${fmtDateShort(ot.date)} selama ${fmtDuration(ot.minutes)} disetujui (${pay}).`, go: 'attendance' }
            : { icon: 'x', tone: 'rose', title: 'Lembur ditolak', msg: `Lembur ${fmtDateShort(ot.date)} ditolak${note ? `: ${note}` : '.'}`, go: 'attendance' }));
        const u = db.users.find(x => x.id === ot.user_id);
        notify(status === 'approved' ? `Lembur ${u?.name} ${fmtDuration(ot.minutes)} disetujui (${formatIDR(Math.round(ot.minutes / 60 * work.overtime_rate))}).` : `Lembur ${u?.name} ditolak.`, status === 'approved' ? 'success' : 'info');
      };

      const giveReward = () => {
        const f = rewardForm;
        if (!f.user_id || !f.amount) return;
        setDb(prev => withStaffNotif({ ...prev, rewards: [{ id: generateId('RW'), user_id: f.user_id, date: todayKey, type: f.type, amount: f.amount, note: f.note, given_by: currentUser.name }, ...prev.rewards] }, f.user_id,
          { icon: 'gift', tone: 'purple', title: `Anda dapat reward ${f.type}`, msg: `${formatIDR(f.amount)} dari ${currentUser.name}${f.note ? ` · ${f.note}` : ''}. Masuk ke gaji bulan ini.`, go: 'attendance' }));
        notify(`Reward ${f.type} untuk ${db.users.find(u => u.id === f.user_id)?.name} tercatat.`);
        setRewardForm(null);
      };

      const exportPayroll = () => {
        downloadCsv(`Rekap_Gaji_${month}.csv`, [
          [`Rekap Absensi & Gaji ${db.business.name}`, monthLabel(month)], [],
          ['Karyawan', 'Shift', 'Hadir (hari)', 'Terlambat (hari)', 'Sakit', 'Izin', 'Alpha', 'Jam kerja', 'Lembur disetujui (jam)', 'Upah lembur', 'Reward', 'Gaji pokok', 'Total dibayar'],
          ...staff.map(u => { const r = monthlyRecap(db, u, month); return [u.name, shiftOf(u, work).name, r.present, r.lateDays, r.sick, r.permit, r.alpha, (r.worked / 60).toFixed(1), (r.otMinutes / 60).toFixed(1), r.otPay, r.reward, u.base_salary, r.total]; })
        ]);
        notify('Rekap gaji diunduh (CSV).');
      };

      const checkMyDistance = async () => {
        setDistanceCheck({ loading: true });
        try {
          const c = await getPosition();
          setDistanceCheck({ dist: Math.round(haversineM(c.latitude, c.longitude, db.business.location.lat, db.business.location.lng)), acc: Math.round(c.accuracy) });
        } catch { setDistanceCheck({ error: 'Lokasi tidak bisa dibaca. Izinkan akses lokasi di browser.' }); }
      };

      const tabs = isOwner
        ? [{ value: 'today', label: 'Hari ini' }, { value: 'schedule', label: 'Shift & aturan' }, { value: 'recap', label: 'Rekap & gaji' }, { value: 'overtime', label: `Lembur${pendingCount ? ` (${pendingCount})` : ''}` }, { value: 'rewards', label: 'Reward' }]
        : [{ value: 'me', label: 'Absensi saya' }];

      const ruleSummary = [
        work.attendance_gps && `wajib berada ≤ ${work.attendance_radius} m dari toko`,
        work.attendance_code && 'memakai kode dari layar kasir (kecuali di perangkat toko)',
        !work.attendance_code && work.attendance_store_device && 'hanya dari perangkat kasir toko'
      ].filter(Boolean).join(' dan ');

      // ---------- Staff view ----------
      const MyView = () => {
        const recap = monthlyRecap(db, currentUser, month);
        const myShift = shiftOf(currentUser, work);
        const myRecords = db.attendance.filter(a => a.user_id === currentUser.id && a.date.startsWith(month)).sort((a, b) => b.date.localeCompare(a.date));
        const myOts = db.overtime.filter(o => o.user_id === currentUser.id && o.date.startsWith(month));
        const myRewards = db.rewards.filter(r => r.user_id === currentUser.id).slice(0, 5);
        const info = myAttendance ? attendanceInfo(myAttendance, work, currentUser) : null;
        return (
          <div className="space-y-5">
            <Card className="p-5">
              <div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div>
                  <p className="text-sm text-slate-600">{myShift.name} · {myShift.start}–{myShift.end} · toleransi {work.late_tolerance} menit</p>
                  {!myAttendance && <p className="mt-1 text-lg font-bold text-slate-900">Anda belum absen masuk.</p>}
                  {myAttendance && !myAttendance.clock_out && <p className="mt-1 text-lg font-bold text-slate-900">Masuk {fmtTime(myAttendance.clock_in)} {info.lateMin ? <Badge tone="amber" className="ml-1 align-middle">Terlambat {fmtDuration(info.lateMin)}</Badge> : <Badge tone="green" className="ml-1 align-middle">Tepat waktu</Badge>}</p>}
                  {myAttendance?.clock_out && <p className="mt-1 text-lg font-bold text-slate-900">Selesai: {fmtTime(myAttendance.clock_in)}–{fmtTime(myAttendance.clock_out)} ({fmtDuration(info.worked)})</p>}
                  {ruleSummary && <p className="mt-1 flex items-center gap-1.5 text-xs text-slate-500"><SvgIcon name="location" className="h-3.5 w-3.5" />Absen {ruleSummary}.</p>}
                </div>
                {!myAttendance && <Btn icon="login" onClick={clockIn} disabled={clocking} className="sm:min-w-[180px]">{clocking ? 'Memeriksa lokasi…' : 'Absen masuk'}</Btn>}
                {myAttendance && !myAttendance.clock_out && <Btn variant="dark" icon="logout" onClick={clockOut} disabled={clocking} className="sm:min-w-[180px]">{clocking ? 'Memeriksa lokasi…' : 'Absen pulang'}</Btn>}
              </div>
              {myAttendance && !myAttendance.clock_out && <p className="mt-3 text-xs text-slate-500">Pulang lewat {myShift.end} lebih dari {work.overtime_min} menit otomatis diajukan sebagai lembur ke Bos.</p>}
            </Card>

            <Field label="Bulan" className="max-w-xs"><select value={month} onChange={e => setMonth(e.target.value)} className={inputCls}>{months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}</select></Field>
            <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
              <StatCard label="Hadir" value={`${recap.present} hari`} sub={`${recap.lateDays}× terlambat · sakit ${recap.sick} · izin ${recap.permit} · alpha ${recap.alpha}`} icon="calendar" />
              <StatCard label="Lembur disetujui" value={fmtDuration(recap.otMinutes)} sub={recap.otPending ? `${recap.otPending} menunggu persetujuan` : formatIDR(recap.otPay)} icon="clock" tone="blue" />
              <StatCard label="Reward" value={formatIDR(recap.reward)} icon="gift" tone="purple" />
              <StatCard label="Perkiraan diterima" value={formatIDR(recap.total)} sub="Gaji pokok + lembur + reward" icon="dollar" highlight />
            </div>

            <div className="grid grid-cols-1 gap-5 lg:grid-cols-2">
              <Card>
                <div className="border-b border-slate-200 p-4"><h3 className="text-base font-bold text-slate-900">Riwayat absen</h3></div>
                {myRecords.length === 0 ? <EmptyState icon="calendar" title="Belum ada absensi bulan ini" /> : (
                  <ul className="max-h-96 divide-y divide-slate-100 overflow-y-auto">
                    {myRecords.map(r => { const i = attendanceInfo(r, work, currentUser); return (
                      <li key={r.id} className="flex items-center justify-between gap-2 px-4 py-2.5 text-sm">
                        <span className="text-slate-700">{fmtDateShort(r.date)}</span>
                        <span className="flex items-center gap-2 tabular">{fmtTime(r.clock_in)}–{fmtTime(r.clock_out)} {i.lateMin ? <Badge tone="amber">Telat {i.lateMin}m</Badge> : null}</span>
                      </li>); })}
                  </ul>
                )}
              </Card>
              <Card>
                <div className="border-b border-slate-200 p-4"><h3 className="text-base font-bold text-slate-900">Lembur & reward</h3></div>
                <ul className="divide-y divide-slate-100">
                  {myOts.length === 0 && myRewards.length === 0 && <li className="p-4 text-sm text-slate-500">Belum ada lembur atau reward.</li>}
                  {myOts.map(o => (
                    <li key={o.id} className="flex items-center justify-between gap-2 px-4 py-2.5 text-sm">
                      <span>Lembur {fmtDateShort(o.date)} · {fmtDuration(o.minutes)}</span>
                      <Badge tone={o.status === 'approved' ? 'green' : o.status === 'rejected' ? 'rose' : 'amber'}>{o.status === 'approved' ? 'Disetujui' : o.status === 'rejected' ? 'Ditolak' : 'Menunggu'}</Badge>
                    </li>
                  ))}
                  {myRewards.map(r => (
                    <li key={r.id} className="flex items-center justify-between gap-2 px-4 py-2.5 text-sm">
                      <span className="flex items-center gap-2"><SvgIcon name="gift" className="h-4 w-4 text-purple-600" />{r.type} · {fmtDateShort(r.date)}</span>
                      <span className="font-semibold text-purple-700 tabular">{formatIDR(r.amount)}</span>
                    </li>
                  ))}
                </ul>
              </Card>
            </div>
          </div>
        );
      };

      // ---------- Owner views ----------
      const TodayView = () => (
        <div className="space-y-4">
          <div className="flex justify-end">
            <Btn variant="secondary" icon="calendar" onClick={() => setLeaveForm({ user_id: staff[0]?.id || '', type: 'sakit', from: todayKey, to: todayKey, note: '' })}>Liburkan karyawan</Btn>
          </div>
          {work.shifts.map(sh => {
            const members = staff.filter(u => shiftOf(u, work).id === sh.id);
            if (!members.length) return null;
            return (
              <Card key={sh.id}>
                <div className="flex items-center justify-between border-b border-slate-200 px-4 py-3">
                  <h3 className="text-sm font-bold text-slate-900">{sh.name}</h3>
                  <span className="text-sm text-slate-600 tabular">{sh.start}–{sh.end}</span>
                </div>
                <ul className="divide-y divide-slate-100">
                  {members.map(u => {
                    const rec = db.attendance.find(a => a.user_id === u.id && (a.date === todayKey || !a.clock_out));
                    const info = rec ? attendanceInfo(rec, work, u) : null;
                    const isDayOff = new Date(todayKey + 'T00:00:00').getDay() === Number(u.day_off);
                    const leave = leaveOn(u.id, todayKey);
                    return (
                      <li key={u.id} className="flex flex-col gap-2 p-4 sm:flex-row sm:items-center sm:justify-between">
                        <div className="flex items-center gap-3">
                          <Avatar name={u.name} />
                          <div>
                            <p className="font-semibold text-slate-900">{u.name}</p>
                            <p className="text-sm text-slate-600">{rec ? `Masuk ${fmtTime(rec.clock_in)}${rec.clock_out ? ` · Pulang ${fmtTime(rec.clock_out)} (${fmtDuration(info.worked)})` : ''}` : isDayOff ? 'Jadwal libur' : 'Belum absen'}</p>
                            {rec?.verify_in && <p className="text-xs text-slate-500">Terverifikasi: {rec.verify_in}</p>}
                          </div>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                          {leave ? <Badge tone={LEAVE_TYPES[leave.type].tone}>{LEAVE_TYPES[leave.type].label}{leave.note ? ` · ${leave.note}` : ''}</Badge>
                            : !rec ? <Badge tone={isDayOff ? 'slate' : 'rose'}>{isDayOff ? 'Libur' : 'Belum hadir'}</Badge>
                            : info.lateMin ? <Badge tone="amber">Terlambat {fmtDuration(info.lateMin)}</Badge>
                            : <Badge tone="green">Tepat waktu</Badge>}
                          {leave
                            ? <Btn variant="ghost" size="sm" onClick={() => removeLeave(leave)}>Batalkan</Btn>
                            : !rec && <Btn variant="secondary" size="sm" icon="calendar" onClick={() => setLeaveForm({ user_id: u.id, type: 'sakit', from: todayKey, to: todayKey, note: '' })}>Liburkan</Btn>}
                        </div>
                      </li>
                    );
                  })}
                </ul>
              </Card>
            );
          })}
        </div>
      );

      const ScheduleView = () => (
        <div className="space-y-5">
          <Card className="p-5">
            <div className="flex flex-wrap items-start justify-between gap-2">
              <div><h3 className="text-base font-bold text-slate-900">Daftar shift</h3><p className="text-sm text-slate-600">Atur 1 sampai 3 shift. Shift yang melewati tengah malam (cth. 23:00–07:00) didukung.</p></div>
              {work.shifts.length < 3 && <Btn variant="secondary" size="sm" icon="plus" onClick={() => updateWork({ shifts: [...work.shifts, { id: generateId('S'), name: `Shift ${work.shifts.length + 1}`, start: '15:00', end: '23:00' }] })}>Tambah shift</Btn>}
            </div>
            <ul className="mt-4 space-y-2">
              {work.shifts.map(sh => {
                const used = staff.filter(u => shiftOf(u, work).id === sh.id).length;
                return (
                  <li key={sh.id} className="grid grid-cols-2 items-end gap-2 rounded-xl border border-slate-200 p-3 sm:grid-cols-[1fr_8rem_8rem_auto]">
                    <label className="col-span-2 sm:col-span-1"><span className="text-xs font-medium text-slate-600">Nama shift</span><input value={sh.name} onChange={e => updateShift(sh.id, { name: e.target.value })} className={cx(inputCls, 'mt-1')} /></label>
                    <label><span className="text-xs font-medium text-slate-600">Masuk</span><input type="time" value={sh.start} onChange={e => updateShift(sh.id, { start: e.target.value })} className={cx(inputCls, 'mt-1')} /></label>
                    <label><span className="text-xs font-medium text-slate-600">Pulang</span><input type="time" value={sh.end} onChange={e => updateShift(sh.id, { end: e.target.value })} className={cx(inputCls, 'mt-1')} /></label>
                    <div className="col-span-2 flex items-center justify-between gap-2 sm:col-span-1">
                      <span className="text-xs text-slate-500">{used} orang</span>
                      {work.shifts.length > 1 && <IconBtn icon="trash" label={`Hapus ${sh.name}`} disabled={used > 0} title={used ? 'Pindahkan karyawan dulu' : `Hapus ${sh.name}`} onClick={() => updateWork({ shifts: work.shifts.filter(s => s.id !== sh.id) })} className="text-rose-600 hover:bg-rose-50 disabled:opacity-40" />}
                    </div>
                  </li>
                );
              })}
            </ul>
          </Card>

          <Card>
            <div className="border-b border-slate-200 p-4"><h3 className="text-base font-bold text-slate-900">Jadwal karyawan</h3></div>
            <ul className="divide-y divide-slate-100">
              {staff.map(u => (
                <li key={u.id} className="flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between">
                  <span className="flex items-center gap-3"><Avatar name={u.name} /><span className="font-semibold text-slate-900">{u.name}</span></span>
                  <div className="grid grid-cols-2 gap-2 sm:w-[26rem]">
                    <label><span className="sr-only">Shift {u.name}</span>
                      <select value={shiftOf(u, work).id} onChange={e => updateUser(u.id, { shift_id: e.target.value })} className={inputCls}>
                        {work.shifts.map(s => <option key={s.id} value={s.id}>{s.name} ({s.start}–{s.end})</option>)}
                      </select>
                    </label>
                    <label><span className="sr-only">Hari libur {u.name}</span>
                      <select value={u.day_off ?? 0} onChange={e => updateUser(u.id, { day_off: Number(e.target.value) })} className={inputCls}>
                        {WEEKDAYS.map((d, i) => <option key={d} value={i}>Libur {d}</option>)}
                      </select>
                    </label>
                  </div>
                </li>
              ))}
            </ul>
          </Card>

          <Card className="p-5">
            <h3 className="text-base font-bold text-slate-900">Aturan terlambat & lembur</h3>
            <div className="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-3">
              <Field label="Toleransi telat (menit)"><input type="number" min="0" value={work.late_tolerance} onChange={e => updateWork({ late_tolerance: Number(e.target.value) || 0 })} className={cx(inputCls, 'tabular')} /></Field>
              <Field label="Upah lembur per jam"><MoneyInput value={work.overtime_rate} onChange={v => updateWork({ overtime_rate: v })} /></Field>
              <Field label="Minimal lembur (menit)"><input type="number" min="0" value={work.overtime_min} onChange={e => updateWork({ overtime_min: Number(e.target.value) || 0 })} className={cx(inputCls, 'tabular')} /></Field>
            </div>
          </Card>

          <Card className="p-5">
            <div className="flex items-start gap-3">
              <span className="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><SvgIcon name="permissions" className="h-5 w-5" /></span>
              <div><h3 className="text-base font-bold text-slate-900">Cegah absen dari luar toko</h3><p className="text-sm text-slate-600">Aktifkan salah satu atau keduanya. Pemeriksaan berlaku saat absen masuk dan pulang.</p></div>
            </div>
            <div className="mt-4 space-y-4">
              <div className="rounded-xl border border-slate-200 p-4">
                <div className="flex items-center justify-between gap-4">
                  <div><p id="att-gps" className="text-sm font-semibold text-slate-900">Wajib berada di toko (GPS)</p><p className="text-sm text-slate-600">HP karyawan harus dalam radius tertentu dari lokasi toko ({db.business.location.city}).</p></div>
                  <Switch checked={!!work.attendance_gps} onChange={v => updateWork({ attendance_gps: v })} labelledBy="att-gps" />
                </div>
                {work.attendance_gps && (
                  <div className="mt-3 flex flex-wrap items-end gap-3">
                    <Field label="Radius"><select value={work.attendance_radius} onChange={e => updateWork({ attendance_radius: Number(e.target.value) })} className={inputCls}>{[50, 100, 150, 300, 500].map(r => <option key={r} value={r}>{r} meter</option>)}</select></Field>
                    <Btn variant="secondary" icon="location" onClick={checkMyDistance} disabled={distanceCheck?.loading}>{distanceCheck?.loading ? 'Membaca lokasi…' : 'Cek jarak perangkat ini'}</Btn>
                    {distanceCheck?.dist != null && <p className={cx('pb-3 text-sm font-medium', distanceCheck.dist <= work.attendance_radius ? 'text-emerald-700' : 'text-rose-600')}>±{distanceCheck.dist} m dari toko (akurasi {distanceCheck.acc} m)</p>}
                    {distanceCheck?.error && <p className="pb-3 text-sm text-rose-600">{distanceCheck.error}</p>}
                  </div>
                )}
              </div>
              <div className="rounded-xl border border-slate-200 p-4">
                <div className="flex items-center justify-between gap-4">
                  <div><p id="att-dev" className="text-sm font-semibold text-slate-900">Hanya dari perangkat kasir toko</p><p className="text-sm text-slate-600">Absen hanya bisa dilakukan di HP/tablet kasir yang sudah didaftarkan Bos, bukan di HP pribadi.</p></div>
                  <Switch checked={!!work.attendance_store_device} onChange={v => updateWork({ attendance_store_device: v })} labelledBy="att-dev" />
                </div>
                <div className="mt-3 flex flex-wrap items-center gap-3 text-sm">
                  <Badge tone={storeDevices.includes(deviceId) ? 'green' : 'slate'}><SvgIcon name="device" className="h-3.5 w-3.5" />{storeDevices.includes(deviceId) ? 'Perangkat ini terdaftar' : 'Perangkat ini belum terdaftar'}</Badge>
                  <span className="text-slate-500">{storeDevices.length} perangkat toko</span>
                  {storeDevices.includes(deviceId)
                    ? <Btn variant="ghost" size="sm" onClick={() => setDb(prev => ({ ...prev, business: { ...prev.business, store_devices: storeDevices.filter(d => d !== deviceId) } }))}>Hapus perangkat ini</Btn>
                    : <Btn variant="secondary" size="sm" icon="device" onClick={() => { setDb(prev => ({ ...prev, business: { ...prev.business, store_devices: [...storeDevices, deviceId] } })); notify('Perangkat ini didaftarkan sebagai perangkat kasir toko.'); }}>Daftarkan perangkat ini</Btn>}
                </div>
              </div>
              <div className="rounded-xl border border-emerald-200 bg-emerald-50/40 p-4">
                <div className="flex items-center justify-between gap-4">
                  <div>
                    <p id="att-code" className="flex flex-wrap items-center gap-2 text-sm font-semibold text-slate-900">Kode absen dari layar kasir <Badge tone="green">Disarankan</Badge></p>
                    <p className="text-sm text-slate-600">Perangkat kasir toko menampilkan kode 6 angka yang berganti tiap 30 detik. Karyawan yang absen dari HP sendiri wajib memasukkan kode itu, jadi harus benar-benar ada di toko untuk melihatnya.</p>
                  </div>
                  <Switch checked={!!work.attendance_code} labelledBy="att-code"
                    onChange={v => setDb(prev => ({ ...prev, business: { ...prev.business, attendance_secret: prev.business.attendance_secret || newSecret(), work: { ...prev.business.work, attendance_code: v } } }))} />
                </div>
                {work.attendance_code && storeDevices.length === 0 && (
                  <p className="mt-3 rounded-lg bg-amber-50 p-2.5 text-sm text-amber-900 ring-1 ring-amber-200">Belum ada perangkat toko. Buka aplikasi di HP/tablet kasir lalu tekan <b>Daftarkan perangkat ini</b> di atas, supaya kodenya tampil di sana.</p>
                )}
              </div>
              <ul className="space-y-1 rounded-xl bg-slate-50 p-3 text-xs leading-relaxed text-slate-600">
                <li>• Paling aman: nyalakan <b>Kode absen</b> dan <b>GPS</b> sekaligus.</li>
                <li>• Jam absen memakai jam server, jadi mengubah jam di HP tidak berpengaruh.</li>
                <li>• Setiap absen mencatat cara verifikasinya (kolom keterangan di rekap), sehingga Bos bisa mengecek.</li>
              </ul>
            </div>
          </Card>
        </div>
      );

      const RecapView = () => {
        const recaps = staff.map(u => ({ u, r: monthlyRecap(db, u, month) }));
        const perfect = recaps.filter(x => x.r.present >= 10 && x.r.lateDays === 0);
        return (
          <div className="space-y-4">
            <div className="flex flex-wrap items-end justify-between gap-3">
              <Field label="Bulan"><select value={month} onChange={e => setMonth(e.target.value)} className={inputCls}>{months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}</select></Field>
              <Btn variant="secondary" icon="download" onClick={exportPayroll}>Export rekap gaji</Btn>
            </div>
            {perfect.length > 0 && (
              <div className="flex flex-col gap-3 rounded-2xl border border-purple-200 bg-purple-50 p-4 sm:flex-row sm:items-center sm:justify-between">
