    const downloadCsv = (filename, rows) => {
      const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));

    // Resizes uploads before storing: a raw phone photo is 3–10 MB, the store only needs ~100 KB.
    // 'cover' crops to a square (menu photos), 'contain' keeps the whole image (QRIS must stay scannable).
    // The result is made smaller (lower quality, then fewer pixels) until it fits maxBytes.
    const PHOTO_INPUT_MAX = 20 * 1024 * 1024;
    const dataUrlBytes = (d) => Math.round((d.length - d.indexOf(',') - 1) * 3 / 4);
    function imageFileToDataUrl(file, { size = 480, mode = 'cover', type = 'image/webp', quality = 0.82, maxBytes = 120 * 1024 } = {}) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) return reject(new Error('File harus berupa gambar (JPG, PNG, atau WEBP).'));
        if (file.size > PHOTO_INPUT_MAX) return reject(new Error('Ukuran foto maksimal 20 MB.'));
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const draw = (px) => {
            if (mode === 'cover') {
              const s = Math.min(img.width, img.height);
              canvas.width = canvas.height = px;
              ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, px, px);
              ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, px, px);
            } else {
              const scale = Math.min(1, px / Math.max(img.width, img.height));
              canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
              ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }
          };
          // Browsers that cannot make WEBP (older iPhones) fall back to JPEG
          const encode = (q) => {
            if (type === 'image/png') return canvas.toDataURL('image/png');
            const d = canvas.toDataURL(type, q);
            return d.startsWith(`data:${type}`) ? d : canvas.toDataURL('image/jpeg', q);
          };
          let px = size, out = '';
          for (let round = 0; round < 6; round++) {
            draw(px);
            for (const q of type === 'image/png' ? [1] : [quality, 0.7, 0.6]) {
              out = encode(q);
              if (dataUrlBytes(out) <= maxBytes) return resolve(out);
            }
            px = Math.round(px * 0.8);
          }
          resolve(out);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak dapat dibaca.')); };
        img.src = url;
      });
    }

    // Deterministic PRNG so the demo data looks the same on every fresh install
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // =====================================================================
    // PRAYER TIMES (Kemenag RI: Subuh 20°, Isya 18°, Ashar Syafi'i, ihtiyat 2 menit)
    // Astronomical formulas follow the public-domain PrayTimes.org algorithm.
    // =====================================================================
    function computePrayerTimes(y, m, d, lat, lng, tz) {
      const rad = Math.PI / 180;
      const dsin = x => Math.sin(x * rad), dcos = x => Math.cos(x * rad), dtan = x => Math.tan(x * rad);
      const darcsin = x => Math.asin(x) / rad, darccos = x => Math.acos(Math.max(-1, Math.min(1, x))) / rad;
      const darctan2 = (a, b) => Math.atan2(a, b) / rad, darccot = x => Math.atan(1 / x) / rad;
      const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };

      let Y = y, M = m;
      if (M <= 2) { Y -= 1; M += 12; }
      const A = Math.floor(Y / 100), B = 2 - A + Math.floor(A / 4);
      const JD = Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + d + B - 1524.5 - lng / (15 * 24);

      const sun = (jd) => {
        const D = jd - 2451545.0;
        const g = fix(357.529 + 0.98560028 * D, 360);
        const q = fix(280.459 + 0.98564736 * D, 360);
        const L = fix(q + 1.915 * dsin(g) + 0.020 * dsin(2 * g), 360);
        const e = 23.439 - 0.00000036 * D;
        const RA = darctan2(dcos(e) * dsin(L), dcos(L)) / 15;
        return { decl: darcsin(dsin(e) * dsin(L)), eqt: q / 15 - fix(RA, 24) };
      };
      const midDay = (t) => fix(12 - sun(JD + t).eqt, 24);
      const altTime = (alt, t, ccw) => {
        const decl = sun(JD + t).decl;
        const T = darccos((dsin(alt) - dsin(decl) * dsin(lat)) / (dcos(decl) * dcos(lat))) / 15;
        return midDay(t) + (ccw ? -T : T);
      };
      const asrTime = (t) => {
        const decl = sun(JD + t).decl;
        return altTime(darccot(1 + dtan(Math.abs(lat - decl))), t, false);
      };

      const adj = (h) => h + tz - lng / 15;
      const ih = 2 / 60;
      const t = {
        subuh: adj(altTime(-20, 5 / 24, true)) + ih,
        terbit: adj(altTime(-0.833, 6 / 24, true)) - ih,
        dzuhur: adj(midDay(12 / 24)) + ih,
        ashar: adj(asrTime(13 / 24)) + ih,
        maghrib: adj(altTime(-0.833, 18 / 24, false)) + ih,
        isya: adj(altTime(-18, 18 / 24, false)) + ih
      };
      t.imsak = t.subuh - 10 / 60;
      const out = {};
      Object.keys(t).forEach(k => { out[k] = Math.round(fix(t[k], 24) * 60); });
      return out;
    }

    function playChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        [[0, 660], [0.5, 550], [1.0, 440]].forEach(([t, f]) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.05);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.9);
          o.connect(g); g.connect(ctx.destination);
          o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.95);
        });
        setTimeout(() => ctx.close(), 2500);
      } catch { /* audio unavailable */ }
    }

    const SvgIcon = ({ name, className = 'w-5 h-5' }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={ICONS[name] || ICONS.info} />
      </svg>
    );

    // =====================================================================
    // UI PRIMITIVES
    // =====================================================================
    const focusRing = 'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:ring-offset-2';
    const inputCls = 'w-full min-h-[44px] rounded-xl border border-slate-300 bg-white px-3 text-sm text-slate-900 placeholder:text-slate-400 focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-600/25 disabled:bg-slate-100';

    const BTN_VARIANTS = {
      primary: 'bg-brand-700 text-white hover:bg-brand-800 shadow-sm',
      success: 'bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm',
      secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50',
      danger: 'bg-rose-600 text-white hover:bg-rose-700',
      warning: 'bg-amber-400 text-slate-900 hover:bg-amber-300',
      ghost: 'text-slate-600 hover:bg-slate-100 hover:text-slate-900',
      dark: 'bg-slate-900 text-white hover:bg-slate-800'
    };

    function Btn({ variant = 'primary', size = 'md', icon, className, children, ...rest }) {
      return (
        <button
          type="button"
          className={cx(
            'inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition-colors disabled:cursor-not-allowed disabled:opacity-50',
            focusRing,
            size === 'sm' ? 'min-h-[36px] px-3 text-xs' : 'min-h-[44px] px-4 text-sm',
            BTN_VARIANTS[variant], className
          )}
          {...rest}
        >
          {icon && <SvgIcon name={icon} className="w-4 h-4 flex-shrink-0" />}
          {children}
        </button>
      );
    }

    function IconBtn({ icon, label, className, iconClass = 'w-5 h-5', ...rest }) {
      return (
        <button type="button" aria-label={label} title={label}
          className={cx('inline-flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-xl text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900', focusRing, className)}
          {...rest}>
          <SvgIcon name={icon} className={iconClass} />
        </button>
      );
    }

    function Field({ label, hint, error, children, className }) {
      return (
        <label className={cx('block', className)}>
          <span className="text-sm font-medium text-slate-700">{label}</span>
          <div className="mt-1.5">{children}</div>
          {error
            ? <span className="mt-1 block text-xs font-medium text-rose-600" role="alert">{error}</span>
            : hint && <span className="mt-1 block text-xs text-slate-500">{hint}</span>}
        </label>
      );
    }

    function MoneyInput({ value, onChange, className, ...rest }) {
      return (
        <div className="relative">
          <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-500">Rp</span>
          <input type="text" inputMode="numeric" className={cx(inputCls, 'pl-10 tabular font-semibold', className)}
            value={value ? formatNumberWithDots(value) : ''}
            onChange={(e) => onChange(parseDotsToNumber(e.target.value))} {...rest} />
        </div>
      );
    }

    // WhatsApp numbers: digits only, normalised to 08xx-xxxx-xxxx (a pasted +62 prefix becomes 0)
    const formatWa = (raw) => {
      let d = String(raw || '').replace(/\D/g, '');
      if (d.startsWith('62')) d = '0' + d.slice(2);
      d = d.slice(0, 13);
      return [d.slice(0, 4), d.slice(4, 8), d.slice(8)].filter(Boolean).join('-');
    };
    const waError = (v) => {
      const d = String(v || '').replace(/\D/g, '');
      if (!d) return null;
      return /^08\d{8,11}$/.test(d) ? null : 'Nomor WhatsApp harus diawali 08 dan berisi 10–13 angka.';
    };
    function WaInput({ value, onChange, className, ...rest }) {
      return (
        <input type="tel" inputMode="numeric" autoComplete="tel" maxLength={15} placeholder="0812-3456-7890"
          value={value === '-' ? '' : (value || '')} onChange={e => onChange(formatWa(e.target.value))}
          className={cx(inputCls, 'tabular', waError(value) && 'border-rose-400', className)} {...rest} />
      );
    }

    // Any phone number (incl. landline like 0274-555123): digits only, must start with 0
    const formatPhone = (raw) => {
      let d = String(raw || '').replace(/\D/g, '');
      if (d.startsWith('62')) d = '0' + d.slice(2);
      if (d.startsWith('08')) return formatWa(d);
      d = d.slice(0, 14);
      return [d.slice(0, 4), d.slice(4)].filter(Boolean).join('-');
    };
    const phoneError = (v) => {
      const d = String(v || '').replace(/\D/g, '');
      if (!d) return null;
      return /^0\d{7,13}$/.test(d) ? null : 'Nomor telepon harus diawali 0 dan berisi 8–14 angka.';
    };
    function PhoneInput({ value, onChange, className, ...rest }) {
      return (
        <input type="tel" inputMode="numeric" autoComplete="tel" maxLength={16} placeholder="0274-555123"
          value={value === '-' ? '' : (value || '')} onChange={e => onChange(formatPhone(e.target.value))}
          className={cx(inputCls, 'tabular', phoneError(value) && 'border-rose-400', className)} {...rest} />
      );
    }

    const StarIcon = ({ className = 'h-4 w-4' }) => (
      <svg className={className} viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false">
        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
      </svg>
    );

    function Switch({ checked, onChange, labelledBy, label }) {
      return (
        <button type="button" role="switch" aria-checked={checked}
          aria-labelledby={labelledBy} aria-label={labelledBy ? undefined : label}
          onClick={() => onChange(!checked)}
          className={cx("relative inline-flex h-7 w-12 flex-shrink-0 items-center rounded-full transition-colors before:absolute before:-inset-2 before:content-['']", focusRing, checked ? 'bg-brand-700' : 'bg-slate-300')}>
          <span className={cx('inline-block h-5 w-5 rounded-full bg-white shadow transition-transform', checked ? 'translate-x-6' : 'translate-x-1')} />
        </button>
      );
    }

    const BADGE_TONES = {
      teal: 'bg-brand-50 text-brand-800 ring-brand-200',
      green: 'bg-emerald-50 text-emerald-800 ring-emerald-200',
      amber: 'bg-amber-50 text-amber-800 ring-amber-200',
      rose: 'bg-rose-50 text-rose-700 ring-rose-200',
      slate: 'bg-slate-100 text-slate-700 ring-slate-200',
      purple: 'bg-purple-50 text-purple-800 ring-purple-200',
      blue: 'bg-blue-50 text-blue-800 ring-blue-200'
    };
    const Badge = ({ tone = 'slate', children, className }) => (
      <span className={cx('inline-flex items-center gap-1 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1 ring-inset', BADGE_TONES[tone], className)}>{children}</span>
    );

    const Card = ({ className, children, ...rest }) => (
      <section className={cx('rounded-2xl border border-slate-200 bg-white shadow-sm', className)} {...rest}>{children}</section>
    );

    function PageHeader({ title, desc, actions }) {
      return (
        <div className="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
          {/* On phones the top bar already names the page, so the title here is kept for screen readers only */}
          <div>
            <h2 className="text-xl font-bold text-slate-900 max-md:sr-only">{title}</h2>
            <span className="mt-1.5 block h-1 w-10 rounded-full bg-sun-400 max-md:hidden" aria-hidden="true" />
            {desc && <p className="mt-1 text-sm text-slate-600">{desc}</p>}
          </div>
          {actions && <div className="flex flex-wrap gap-2">{actions}</div>}
        </div>
      );
    }

    function StatCard({ label, value, sub, icon, tone = 'teal', highlight, subTone }) {
      const iconTone = { teal: 'bg-brand-500 text-white', amber: 'bg-amber-50 text-amber-700', rose: 'bg-rose-50 text-rose-700', blue: 'bg-blue-50 text-blue-700', purple: 'bg-purple-50 text-purple-700' }[tone];
      return (
        <div className={cx('rounded-2xl border p-4 shadow-sm', highlight ? 'border-brand-600 bg-brand-600 text-white' : 'border-slate-200 bg-white')}>
          <div className="flex items-start justify-between gap-2">
            <span className={cx('text-sm font-medium', highlight ? 'text-brand-100' : 'text-slate-600')}>{label}</span>
            <span className={cx('flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full', highlight ? 'bg-white/15 text-white' : iconTone)}>
              <SvgIcon name={icon} className="w-5 h-5" />
            </span>
          </div>
          <p className={cx('mt-2 text-lg font-bold tabular break-words sm:text-2xl', highlight ? 'text-white' : 'text-slate-900')}>{value}</p>
          {sub && <p className={cx('mt-1 text-xs', highlight ? 'text-brand-100' : subTone || 'text-slate-500')}>{sub}</p>}
        </div>
      );
    }

    function EmptyState({ icon, title, desc, action }) {
      return (
        <div className="flex flex-col items-center justify-center px-4 py-10 text-center">
          <span className="flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-100 text-slate-500"><SvgIcon name={icon} className="w-7 h-7" /></span>
          <p className="mt-3 text-sm font-semibold text-slate-800">{title}</p>
          {desc && <p className="mt-1 max-w-xs text-sm text-slate-500">{desc}</p>}
          {action && <div className="mt-4">{action}</div>}
        </div>

      const sales = [], attendance = [], overtime = [];
      for (let back = 29; back >= 0; back--) {
        const key = addDays(today, -back);
        const day = new Date(key + 'T00:00:00');
        const n = 4 + Math.floor(rnd() * 7);
        for (let i = 0; i < n; i++) {
          const dt = new Date(day);
          const hour = 7 + Math.floor(rnd() * 15);
          dt.setHours(hour, Math.floor(rnd() * 60));
          if (dt > now) continue;
          const picks = new Set();
          const k = 1 + Math.floor(rnd() * 3);
          while (picks.size < k) picks.add(SEED_PRODUCTS[Math.floor(rnd() * SEED_PRODUCTS.length)].id);
          const items = makeItems([...picks].map(id => [id, 1 + Math.floor(rnd() * 2)]));

          const r = rnd();
          const cashier = hour < 15 ? kasir[0] : kasir[1];

    async function vaultDeriveKey(password, salt) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: VAULT_ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    async function vaultSeal(username, session, key, salt) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(session)));
      const all = readLocal(VAULT_KEY, {}) || {};
      all[username] = { salt: toB64(salt), iv: toB64(iv), ct: toB64(ct), saved: new Date().toISOString() };
      writeLocal(VAULT_KEY, all);
    }
    async function vaultRemember(username, password, session) {
      if (!canVault() || !username) return;
      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const key = await vaultDeriveKey(password, salt);
        vaultKeys.set(username, { key, salt });
        await vaultSeal(username, session, key, salt);
      } catch { /* offline sign-in simply stays unavailable on this browser */ }
    }
    async function vaultRefresh(session) {
      const k = vaultKeys.get(session?.user?.username);
      if (k) try { await vaultSeal(session.user.username, session, k.key, k.salt); } catch {}
    }
    function vaultForget(username) {
      vaultKeys.delete(username);
      const all = readLocal(VAULT_KEY, {}) || {};
      if (all[username]) { delete all[username]; writeLocal(VAULT_KEY, all); }
    }
    // -> { session } or { error }
    async function vaultOpen(username, password) {
      const all = readLocal(VAULT_KEY, {}) || {};
      const e = all[username];
      if (!e || !canVault()) return { error: 'Tidak ada internet. Akun ini belum pernah masuk di perangkat ini, jadi masuk pertama kali butuh internet.' };
      if (e.until && e.until > Date.now()) return { error: `Terlalu banyak percobaan. Coba lagi ${Math.ceil((e.until - Date.now()) / 60000)} menit lagi.` };
      try {
        const salt = fromB64(e.salt);
        const key = await vaultDeriveKey(password, salt);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(e.iv) }, key, fromB64(e.ct));
        const session = JSON.parse(new TextDecoder().decode(plain));
        vaultKeys.set(username, { key, salt });
        if (e.fails) { delete e.fails; delete e.until; writeLocal(VAULT_KEY, all); }
        return { session };
      } catch {
        e.fails = (e.fails || 0) + 1;
        if (e.fails >= 5) { e.fails = 0; e.until = Date.now() + 5 * 60000; }
        writeLocal(VAULT_KEY, all);
        return { error: 'Tidak ada internet, dan password tidak cocok dengan password terakhir yang dipakai di perangkat ini.' };
      }
    }

    class ApiError extends Error {
      constructor(status, message) { super(message); this.status = status; }
    }
    async function apiFetch(path, { token, method = 'GET', json, blob } = {}) {
      const headers = {};
      if (token) headers.Authorization = `Bearer ${token}`;
      if (json !== undefined) headers['Content-Type'] = 'application/json';
      if (blob) headers['Content-Type'] = blob.type;
      let res;
      try { res = await fetch(CLOUD_API + path, { method, headers, body: blob || (json !== undefined ? JSON.stringify(json) : undefined) }); }
      catch { throw new ApiError(0, 'Tidak ada koneksi ke server. Periksa internet.'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new ApiError(res.status, data.error || `Server sedang bermasalah (${res.status}).`);
      return data;
    }

    // A real store starts from these, not from the demo data
    function defaultBusiness(name = '') {
      return {
        name, type: '', address: '', phone: '', qris_nmid: '', qris_image: '',
        monthly_target: 10000000, tax_rate: 10, tax_active: false, bank_accounts: [],
        location: { city: 'Jakarta', lat: -6.2088, lng: 106.8456, tz: 7 },
        prayer: { enabled: true, remind_before: 10, sound: true, hijri_offset: 0 },
        work: { shifts: DEFAULT_SHIFTS, late_tolerance: 10, overtime_rate: 15000, overtime_min: 30, attendance_gps: false, attendance_radius: 150, attendance_store_device: false },
        store_devices: [],
        receipt: {
          logo: '', show_logo: true, show_address: true, show_phone: true, show_cashier: true, show_customer: true,
          show_discount: true, show_tax: true, show_brand: true, paper: '58',
          header: name ? `Selamat datang di ${name}!` : '', footer: 'Terima kasih telah berbelanja. Simpan struk ini.'
        }
      };
    }
    function mergeBusiness(base, sb = {}) {
      sb = sb || {};
      return {
        ...base, ...sb,
        location: { ...base.location, ...(sb.location || {}) },
        prayer: { ...base.prayer, ...(sb.prayer || {}) },
        work: { ...base.work, ...(sb.work || {}) },
        receipt: { ...base.receipt, ...(sb.receipt || {}) }
      };
    }
    // Server copy -> what the app keeps locally (defaults filled in the same way on every device)
    function normalizeDoc(id, val) {
      if (id === 'business') return mergeBusiness(defaultBusiness(val?.name || ''), val);
      if (id === 'permissions') return { ...DEFAULT_PERMISSIONS, ...val };
      return val;
    }
    function loadCloudDb(tenantId) {
      const saved = readLocal(cloudKey(tenantId, 'db'), {}) || {};
      const db = { categories: ['Semua'], ...Object.fromEntries(COLLECTION_KEYS.map(k => [k, []])), ...saved };
      return { ...db, business: normalizeDoc('business', saved.business || {}), permissions: normalizeDoc('permissions', saved.permissions || {}) };
    }

    function forEachRecord(db, fn) {
      for (const [k, v] of Object.entries(db)) {
        if (DOC_KEYS.includes(k)) fn('_doc', k, v);
        else if (Array.isArray(v)) v.forEach(r => { if (r && r.id != null) fn(k, String(r.id), r); });
      }
    }
    function counterBase(coll, rec) {
      const fields = COUNTER_FIELDS[coll];
      if (!fields || !rec) return null;
      return Object.fromEntries(fields.filter(f => typeof rec[f] === 'number').map(f => [f, rec[f]]));
    }
    const isDataImage = (v) => typeof v === 'string' && v.startsWith('data:image/');
    function findDataImages(v, out = new Set()) {
      if (isDataImage(v)) out.add(v);
      else if (Array.isArray(v)) v.forEach(x => findDataImages(x, out));
      else if (v && typeof v === 'object') Object.values(v).forEach(x => findDataImages(x, out));
      return out;
    }
    function replaceDeep(v, from, to) {
      if (v === from) return to;
      if (Array.isArray(v)) {
        let changed = false;
        const n = v.map(x => { const y = replaceDeep(x, from, to); if (y !== x) changed = true; return y; });
        return changed ? n : v;
      }
      if (v && typeof v === 'object') {
        let changed = false;
        const n = {};
        for (const [k, x] of Object.entries(v)) { const y = replaceDeep(x, from, to); if (y !== x) changed = true; n[k] = y; }
        return changed ? n : v;
      }
      return v;
    }
    function replaceInDb(db, coll, id, from, to) {
      if (coll === '_doc') { const v = replaceDeep(db[id], from, to); return v === db[id] ? db : { ...db, [id]: v }; }
      const list = db[coll];
      if (!Array.isArray(list)) return db;
      let changed = false;
      const next = list.map(r => { if (String(r?.id) !== id) return r; const n = replaceDeep(r, from, to); if (n !== r) changed = true; return n; });
      return changed ? { ...db, [coll]: next } : db;
    }
    function mergeRemote(db, updates) {
      const next = { ...db };
      const lists = {};
      for (const u of updates) {
        if (u.coll === '_doc') { if (!u.deleted) next[u.id] = u.val; continue; }
        const L = lists[u.coll] || (lists[u.coll] = { items: [...(Array.isArray(db[u.coll]) ? db[u.coll] : [])], index: null, added: false });
        if (!L.index) L.index = new Map(L.items.map((r, i) => [String(r?.id), i]));
        const i = L.index.get(u.id);
        if (u.deleted) { if (i != null) { L.items.splice(i, 1); L.index = null; } continue; }
        if (i != null) { L.items[i] = u.val; continue; }
        if (NEWEST_FIRST.has(u.coll)) { L.items.unshift(u.val); L.index = null; }
        else { L.items.push(u.val); L.index.set(u.id, L.items.length - 1); }
        L.added = true;
      }
      for (const [coll, L] of Object.entries(lists)) {
        // Sales made offline on another device arrive late; keep dated lists in date order
        if (L.added && NEWEST_FIRST.has(coll) && L.items.every(r => r && r.date)) L.items.sort((a, b) => String(b.date).localeCompare(String(a.date)));
        next[coll] = L.items;
      }
      return next;
    }

    // Keeps this device and the server in step.
    // Local data = what the server has + this device's unsent changes (the outbox), so nothing is lost offline.
    function useCloudSync({ session, db, setDb, notify, onSessionUpdate, onSessionEnd, readOnly = false }) {
      const enabled = !!session;
      const tenantId = session?.tenant.id;
      const cb = useRef({});
      cb.current = { setDb, notify, onSessionUpdate, onSessionEnd, token: session?.token };
      const st = useRef(null);
      if (enabled && !st.current) {
        const outbox = new Map((readLocal(cloudKey(tenantId, 'outbox'), []) || []).map(e => [recKey(e.coll, e.id), e]));
        const server = new Map();
        forEachRecord(db, (coll, id, rec) => { const k = recKey(coll, id); if (!outbox.has(k)) server.set(k, JSON.stringify(rec)); });
        st.current = { outbox, server, prev: db, cursor: readLocal(cloudKey(tenantId, 'cursor'), 0) || 0, busy: false, again: false, dead: false, uploads: new Map(), timer: null };
      }
      const [status, setStatus] = useState({ phase: 'syncing', pending: st.current ? st.current.outbox.size : 0, last: null, error: null });

      const persistOutbox = () => {
        const s = st.current;
        if (!writeLocal(cloudKey(tenantId, 'outbox'), [...s.outbox.values()]) && !s.quotaWarned) {
          s.quotaWarned = true;
          cb.current.notify('Penyimpanan perangkat penuh. Sambungkan internet agar perubahan terkirim.', 'warn');
        }
      };

      const applyRows = (rows) => {
        const s = st.current;
        const updates = [];
        for (const r of rows) {
          const k = recKey(r.coll, r.id);
          if (r.deleted || r.data == null) {
            s.server.delete(k);
            if (!s.outbox.has(k)) updates.push({ coll: r.coll, id: r.id, deleted: true });
            continue;
          }
          const val = r.coll === '_doc' ? normalizeDoc(r.id, r.data) : r.data;
          s.server.set(k, JSON.stringify(val));
          // A record this device is still sending keeps its local version; the server merges it on arrival
          if (!s.outbox.has(k)) updates.push({ coll: r.coll, id: r.id, val });
        }
        if (updates.length) cb.current.setDb(prev => mergeRemote(prev, updates));
      };

      const pushAll = async () => {
        const s = st.current;
        // Photos go to R2 first; the record then carries the photo's address instead of the photo itself
        for (const e of [...s.outbox.values()]) {
          if (e.deleted) continue;
          for (const du of findDataImages(e.data)) {
            let url = s.uploads.get(du);
            if (!url) {
              const blob = await fetch(du).then(r => r.blob());
              ({ url } = await apiFetch('/api/files', { token: cb.current.token, method: 'POST', blob }));
              s.uploads.set(du, url);
            }
            const cur = s.outbox.get(recKey(e.coll, e.id));
            if (cur) cur.data = replaceDeep(cur.data, du, url);
            cb.current.setDb(prev => replaceInDb(prev, e.coll, e.id, du, url));
          }
        }
        for (let round = 0; round < 50 && s.outbox.size; round++) {
          const batch = [...s.outbox.values()].slice(0, 100).map(e => ({ ...e }));
          const res = await apiFetch('/api/sync/push', {
            token: cb.current.token, method: 'POST',
            json: { changes: batch.map(({ coll, id, data, deleted, base }) => ({ coll, id, data, deleted, base })) }
          });
          let progressed = false;
          for (const e of batch) {
            const k = recKey(e.coll, e.id);
            if (e.deleted) s.server.delete(k); else s.server.set(k, JSON.stringify(e.data));
            if (s.outbox.get(k)?.v === e.v) { s.outbox.delete(k); progressed = true; }
          }
          if (res.rejected?.length) {
            res.rejected.forEach(r => s.outbox.delete(recKey(r.coll, r.id)));
            applyRows(res.rejected);
            const reason = res.rejected.find(r => r.reason)?.reason;
            cb.current.notify(reason || 'Sebagian perubahan hanya boleh dilakukan Bos, jadi dibatalkan.', 'warn');
          }
          persistOutbox();
          setStatus(x => ({ ...x, pending: s.outbox.size }));
          if (!progressed) break;
        }
      };

      const pullAll = async () => {
        const s = st.current;
        for (let page = 0; page < 500; page++) {
          const res = await apiFetch(`/api/sync/pull?since=${s.cursor}`, { token: cb.current.token });
          if (res.rows.length) applyRows(res.rows);
          s.cursor = res.cursor;
          writeLocal(cloudKey(tenantId, 'cursor'), s.cursor);
          learnServerTime(res.now);
          cb.current.onSessionUpdate?.({ token: res.token, user: res.user, tenant: res.tenant });
          if (!res.more) return;
        }
      };

      const schedule = (ms) => {
        const s = st.current;
        clearTimeout(s.timer);
        s.timer = setTimeout(run, ms);
      };

      async function run() {
        const s = st.current;
        if (!s || s.dead) return;
        if (s.busy) { s.again = true; return; }
        s.busy = true; s.again = false;
        setStatus(x => ({ ...x, phase: 'syncing' }));
        try {
          await pushAll();
          await pullAll();
          setStatus({ phase: 'synced', pending: s.outbox.size, last: new Date().toISOString(), error: null });
        } catch (e) {
          if (e.status === 401) { s.dead = true; cb.current.onSessionEnd?.(e.message); return; }
          setStatus(x => ({ ...x, phase: e.status === 0 ? 'offline' : 'error', pending: s.outbox.size, error: e.message }));
          if (e.status === 403 && !s.warned) { s.warned = true; cb.current.notify(e.message, 'warn'); }
        } finally {
          s.busy = false;
          if (s.again && !s.dead) schedule(300);
        }
      }

      // Every local change is compared with the server's copy; differences wait in the outbox
      useEffect(() => {
        if (!enabled) return;
        const s = st.current, prev = s.prev;
        s.prev = db;
        if (prev === db || readOnly) return;
        let changed = false;
        const note = (coll, id, rec, before) => {
          const k = recKey(coll, id);
          const js = JSON.stringify(rec);
          const queued = s.outbox.get(k);
          if (s.server.get(k) === js) { if (queued) { s.outbox.delete(k); changed = true; } return; }
          if (queued && !queued.deleted && JSON.stringify(queued.data) === js) return;
          s.outbox.set(k, { coll, id, data: rec, deleted: false, base: queued ? queued.base : counterBase(coll, before), v: (queued?.v || 0) + 1 });
          changed = true;
        };
        const noteDelete = (coll, id) => {
          const k = recKey(coll, id);
          if (s.server.has(k)) { s.outbox.set(k, { coll, id, data: null, deleted: true, base: null, v: (s.outbox.get(k)?.v || 0) + 1 }); changed = true; }
          else if (s.outbox.delete(k)) changed = true;
        };
        for (const key of Object.keys(db)) {
          const a = prev[key], b = db[key];
          if (a === b) continue;
          if (DOC_KEYS.includes(key)) { note('_doc', key, b, a); continue; }
          if (!Array.isArray(b)) continue;
          const before = new Map((Array.isArray(a) ? a : []).filter(r => r && r.id != null).map(r => [String(r.id), r]));
          for (const r of b) {
            if (!r || r.id == null) continue;
            const id = String(r.id), old = before.get(id);
            before.delete(id);
            if (old !== r) note(key, id, r, old);
          }
          for (const id of before.keys()) noteDelete(key, id);
        }
        if (changed) {
          persistOutbox();
          setStatus(x => ({ ...x, pending: s.outbox.size }));
          schedule(1500);
        }
      }, [db]);

      useEffect(() => {
        if (!enabled) return;
        const s = st.current;
        run();
        const timer = setInterval(() => { if (document.visibilityState === 'visible') run(); }, 20000);
        const onVisible = () => { if (document.visibilityState === 'visible') run(); };
        window.addEventListener('online', run);
        document.addEventListener('visibilitychange', onVisible);
        return () => {
          s.dead = true;
          clearInterval(timer); clearTimeout(s.timer);
          window.removeEventListener('online', run);
          document.removeEventListener('visibilitychange', onVisible);
        };
      }, []);

      return { status, syncNow: run };
    }

    const SYNC_LOOK = {
      synced: { label: 'Tersimpan', cls: 'border-emerald-200 bg-emerald-50 text-emerald-800', dot: 'bg-emerald-500' },
      syncing: { label: 'Menyinkron…', cls: 'border-brand-200 bg-brand-50 text-brand-800', dot: 'bg-brand-500 animate-pulse' },
      offline: { label: 'Offline', cls: 'border-amber-300 bg-amber-50 text-amber-900', dot: 'bg-amber-500' },
      error: { label: 'Gagal sinkron', cls: 'border-rose-200 bg-rose-50 text-rose-700', dot: 'bg-rose-500' }
    };
    function SyncChip({ status, onClick }) {
      const look = SYNC_LOOK[status.phase] || SYNC_LOOK.syncing;
      const pending = status.pending > 0 && status.phase !== 'syncing' ? status.pending : 0;
      const desc = status.phase === 'synced' ? 'semua data sudah tersimpan di server'
        : status.phase === 'offline' ? `offline, ${status.pending} perubahan menunggu dikirim`
        : status.phase === 'error' ? `gagal sinkron: ${String(status.error || '').replace(/\.$/, '')}` : 'sedang menyinkronkan';
      return (
        <button type="button" onClick={onClick} aria-label={`Status sinkron: ${desc}. Klik untuk sinkron sekarang.`}
          title={status.last ? `Terakhir sinkron ${fmtTime(status.last)}` : undefined}
          className={cx('inline-flex min-h-[40px] min-w-[40px] items-center justify-center gap-2 rounded-xl border px-3 text-xs font-semibold transition-colors', focusRing, look.cls)}>
          <span className={cx('h-2 w-2 rounded-full', look.dot)} aria-hidden="true" />
          <span className="hidden lg:inline">{look.label}</span>
          {pending > 0 && <span className="tabular">{pending}</span>}
        </button>
      );
    }

    // ---------- Login & activation ----------
    // KB-XXXX-XXXX-XXXX-XXXX, with or without dashes and the KB prefix; the server reads it the same way
    const productKeyCore = (raw) => {
      const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      return s.length === 18 && s.startsWith('KB') ? s.slice(2) : s;
    };

    function AuthScreen({ onLogin, notice }) {
      const [mode, setMode] = useState('login');
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');
      const [forgot, setForgot] = useState(false);
      const [login, setLogin] = useState({ username: readLocal('kasirbosku_last_user', '') || '', password: '' });
      const [act, setAct] = useState({ key: '', store_name: '', owner_name: '', username: '', password: '', password2: '' });
      const [created, setCreated] = useState(null);

      // The login ID is kept on the session so offline sign-in can find this account again
      const finish = (s, username, password) => {
        const sess = { ...s, user: { ...s.user, username } };
        writeLocal('kasirbosku_last_user', username);
        vaultRemember(username, password, sess);
        return sess;
      };

      const submitLogin = async (e) => {
        e.preventDefault();
        setError('');
        const username = login.username.trim().toLowerCase();
        if (!username || !login.password) return setError('Isi ID login dan password.');
        setBusy(true);
        try {
          const s = await apiFetch('/api/login', { method: 'POST', json: { username, password: login.password } });
          onLogin(finish(s, username, login.password));
        } catch (err) {
          if (err.status !== 0) { setError(err.message); return; }
          // No internet: open the copy this device kept from the last online sign-in
          const r = await vaultOpen(username, login.password);
          if (r.session) { writeLocal('kasirbosku_last_user', username); onLogin(r.session); }
          else setError(r.error);
        } finally { setBusy(false); }
      };

      const keyCore = productKeyCore(act.key);
      const actErrors = {
        key: keyCore.length !== 16 ? 'Product key terdiri dari 16 huruf/angka, cth. KB-A1B2-C3D4-E5F6-G7H8.' : null,
        store_name: !act.store_name.trim() ? 'Nama toko wajib diisi.' : null,
        owner_name: !act.owner_name.trim() ? 'Nama kamu wajib diisi.' : null,
        username: !/^[a-z0-9._]{3,20}$/.test(act.username.trim().toLowerCase()) ? '3–20 karakter: huruf kecil, angka, titik, atau garis bawah.' : null,
        password: act.password.length < 6 ? 'Minimal 6 karakter.' : null,
        password2: act.password2 !== act.password ? 'Password tidak sama.' : null
      };
      const [tried, setTried] = useState(false);

                <p className="mt-3 rounded-xl bg-brand-50 p-3 text-left text-sm text-brand-900 ring-1 ring-brand-100">Tambahkan karyawan di menu <b>Karyawan</b>. Mereka masuk dengan ID login dan password masing-masing, dari HP mana saja.</p>

              <Card className="p-5 sm:p-6">

                {notice && <p className="mt-4 rounded-xl bg-amber-50 p-3 text-sm text-amber-900 ring-1 ring-amber-200" role="status">{notice}</p>}

                {mode === 'login' ? (
                  <form onSubmit={submitLogin} className="mt-5 space-y-4" noValidate>
                    <Field label="ID login / Username">
                      <input value={login.username} onChange={e => setLogin(l => ({ ...l, username: e.target.value.toLowerCase() }))} className={inputCls}

                    <div>
                      <Field label="Password">
                        <PasswordInput value={login.password} onChange={v => setLogin(l => ({ ...l, password: v }))} placeholder="Masukkan password" />

                      <div className="mt-1 flex justify-end">
                        <button type="button" onClick={() => setForgot(true)} className={cx('min-h-[36px] rounded-lg px-1 text-sm font-semibold text-brand-700 hover:underline', focusRing)}>Lupa password?</button>
                      </div>
                    </div>
                    {error && <p className="text-sm font-medium text-rose-600" role="alert">{error}</p>}
                    <Btn type="submit" className="w-full" disabled={busy} icon="login">{busy ? 'Memeriksa…' : 'Masuk'}</Btn>

                  <form onSubmit={submitActivate} className="mt-5 space-y-4" noValidate>
                    <Field label="Product key" error={actErr('key')} hint="Dikirim penjual saat kamu membeli KasirBosku.">
                      <input value={act.key} onChange={e => setAct(a => ({ ...a, key: e.target.value.toUpperCase() }))} className={cx(inputCls, 'font-mono uppercase')}
                        placeholder="cth. KB-A1B2-C3D4-E5F6-G7H8" autoComplete="off" autoCapitalize="characters" spellCheck="false" maxLength={30} />
                    </Field>
                    <Field label="Nama toko" error={actErr('store_name')}>
                      <input value={act.store_name} onChange={setA('store_name')} className={inputCls} autoComplete="organization" maxLength={60} placeholder="cth. Warung Berkah Jaya" />
                    </Field>
                    <Field label="Nama Kamu Bos" error={actErr('owner_name')}>
                      <input value={act.owner_name} onChange={setA('owner_name')} className={inputCls} autoComplete="name" maxLength={60} placeholder="cth. Budi Santoso" />
                    </Field>
                    <Field label="ID login / Username" error={actErr('username')} hint="Dipakai untuk masuk. Huruf kecil, angka, titik, atau garis bawah.">
                      <input value={act.username} onChange={e => setAct(a => ({ ...a, username: e.target.value.toLowerCase() }))} className={inputCls}
                        autoComplete="username" autoCapitalize="none" spellCheck="false" maxLength={20} placeholder="cth. budi.berkah" />

                    <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
                      <Field label="Password" error={actErr('password')}><PasswordInput value={act.password} onChange={v => setAct(a => ({ ...a, password: v }))} autoComplete="new-password" placeholder="Minimal 6 karakter" /></Field>
                      <Field label="Ulangi password" error={actErr('password2')}><PasswordInput value={act.password2} onChange={v => setAct(a => ({ ...a, password2: v }))} autoComplete="new-password" placeholder="Ketik ulang password" /></Field>

            <p className="mt-4 text-center text-xs text-slate-500">Data toko tersimpan di server dan tetap bisa dipakai saat sinyal hilang.</p>
            <p className="mt-2 text-center text-xs text-slate-500">crafted by <a href={MAKER_URL} target="_blank" rel="noreferrer" className={cx('font-semibold text-brand-700 hover:underline', focusRing)}>menjadibos.com</a></p>
          </div>
          {forgot && <ForgotPasswordModal username={login.username.trim()} onClose={() => setForgot(false)} />}
        </div>
      );
    }

    function AttendanceCodePrompt({ onDone }) {

      return (

          footer={<><Btn variant="secondary" onClick={() => onDone(null)}>Batal</Btn><Btn type="submit" form="att-code-form" disabled={code.length !== 6}>Absen</Btn></>}>

            <label htmlFor="att-code" className="sr-only">Kode absen</label>
            <input id="att-code" autoFocus inputMode="numeric" autoComplete="one-time-code" maxLength={6} value={code}
              onChange={e => setCode(e.target.value.replace(/\D/g, '').slice(0, 6))} placeholder="000000"
              className={cx(inputCls, 'h-16 text-center font-mono text-3xl font-bold tracking-[0.4em]')} />
