      );
    }

    function OpenSessionModal({ db, setDb, notify, currentUser, onClose, onOpened, continuing }) {
      const last = [...db.cashSessions].reverse().find(s => s.closed_at);
      const [amount, setAmount] = useState(last ? last.counted_cash : 200000);
      const open = () => {
        const s = { id: generateId('SES'), opened_by: currentUser.name, opened_at: new Date().toISOString(), opening_cash: amount };
        setDb(prev => ({ ...prev, cashSessions: [...prev.cashSessions, s] }));
        notify(`Kasir dibuka dengan modal ${formatIDR(amount)}.`);
        onOpened();
      };
      return (
        <Modal title="Buka kasir" desc={continuing ? 'Buka kasir dulu sebelum menerima pembayaran.' : 'Hitung uang di laci sebelum mulai berjualan.'} onClose={onClose}
          footer={<><span className="flex-1" /><Btn variant="secondary" onClick={onClose}>Batal</Btn><Btn icon="unlock" onClick={open}>{continuing ? 'Buka & lanjut bayar' : 'Buka kasir'}</Btn></>}>
          <Field label="Modal awal di laci" hint={last ? `Uang terhitung saat tutup terakhir: ${formatIDR(last.counted_cash)}` : 'Uang kembalian yang tersedia di laci.'}>
            <MoneyInput autoFocus value={amount} onChange={setAmount} className="text-lg" />
          </Field>
        </Modal>
      );
    }

    function CloseSessionModal({ db, setDb, notify, currentUser, session, onClose }) {
      const expected = expectedCash(db, session);
      const moves = drawerMoves(db, session);
      const [counted, setCounted] = useState(expected);
      const [note, setNote] = useState('');
      const diff = counted - expected;
      const sessionSales = allSalesOf(db).filter(s => isValidSale(s) && s.session_id === session.id);
      const byMethod = ['cash', 'qris', 'transfer', 'bayar_nanti'].map(m => ({ m, total: sessionSales.filter(s => s.payment_method === m).reduce((a, s) => a + s.total, 0) }));
      const needsNote = diff !== 0 && !note.trim();

      const close = () => {
        if (needsNote) return;
        setDb(prev => ({ ...prev, cashSessions: prev.cashSessions.map(s => s.id === session.id ? { ...s, closed_at: new Date().toISOString(), closed_by: currentUser.name, expected_cash: expected, counted_cash: counted, difference: diff, note, sales_count: sessionSales.length } : s) }));
        notify(diff === 0 ? 'Kasir ditutup. Uang di laci sesuai.' : `Kasir ditutup dengan selisih ${diff > 0 ? '+' : '−'}${formatIDR(Math.abs(diff))}.`, diff === 0 ? 'success' : 'warn');
        onClose();
      };

      return (
        <Modal title="Tutup kasir" desc={`Dibuka ${fmtTime(session.opened_at)} oleh ${session.opened_by} · ${sessionSales.length} transaksi`} onClose={onClose}
          footer={<><span className="flex-1" /><Btn variant="secondary" onClick={onClose}>Batal</Btn><Btn icon="lock" onClick={close} disabled={needsNote}>Tutup kasir</Btn></>}>
          <dl className="space-y-1.5 text-sm">
            {byMethod.map(({ m, total }) => (
              <div key={m} className="flex justify-between text-slate-600"><dt>Penjualan {PAYMENT_LABELS[m]}</dt><dd className="font-medium text-slate-900 tabular">{formatIDR(total)}</dd></div>
            ))}
            <div className="flex justify-between border-t border-slate-200 pt-2 text-slate-600"><dt>Modal awal</dt><dd className="tabular">{formatIDR(session.opening_cash)}</dd></div>
            {moves.repaid > 0 && <div className="flex justify-between text-slate-600"><dt>Pelunasan kasbon tunai</dt><dd className="tabular">{formatIDR(moves.repaid)}</dd></div>}
            {moves.refunded > 0 && <div className="flex justify-between text-slate-600"><dt>Uang pelanggan dikembalikan</dt><dd className="tabular">− {formatIDR(moves.refunded)}</dd></div>}
            {moves.change > 0 && <div className="flex justify-between text-slate-600"><dt>Kembalian QRIS/transfer</dt><dd className="tabular">− {formatIDR(moves.change)}</dd></div>}
            <div className="flex justify-between font-semibold text-slate-900"><dt>Seharusnya di laci</dt><dd className="tabular">{formatIDR(expected)}</dd></div>
          </dl>
          <div className="mt-4 space-y-4">
            <Field label="Uang fisik yang dihitung"><MoneyInput autoFocus value={counted} onChange={setCounted} className="text-lg" /></Field>
            <div className={cx('flex items-center justify-between rounded-xl p-3 text-sm font-semibold', diff === 0 ? 'bg-emerald-50 text-emerald-900' : diff < 0 ? 'bg-rose-50 text-rose-900' : 'bg-amber-50 text-amber-900')}>
              <span>{diff === 0 ? 'Sesuai' : diff < 0 ? 'Kurang' : 'Lebih'}</span>
              <span className="tabular">{diff === 0 ? formatIDR(0) : `${diff > 0 ? '+' : '−'}${formatIDR(Math.abs(diff))}`}</span>
            </div>
            {diff !== 0 && (
              <Field label="Keterangan selisih" error={needsNote ? 'Wajib diisi jika ada selisih.' : null}>
                <input value={note} onChange={e => setNote(e.target.value)} className={inputCls} placeholder="cth. salah beri kembalian" />
              </Field>
            )}
          </div>
        </Modal>
      );
    }

    // =====================================================================
    // SALES REPORT
    // =====================================================================
    const RANGES = [
      { value: 'today', label: 'Hari ini' }, { value: 'yesterday', label: 'Kemarin' }, { value: '7d', label: '7 hari' },
      { value: '30d', label: '30 hari' }, { value: 'month', label: 'Bulan ini' }, { value: 'year', label: 'Tahun ini' }, { value: 'custom', label: 'Pilih tanggal' }
    ];
    function rangeBounds(id, from, to) {
      const today = dateKey();
      switch (id) {
        case 'today': return [today, today];
        case 'yesterday': return [addDays(today, -1), addDays(today, -1)];
        case '7d': return [addDays(today, -6), today];
        case '30d': return [addDays(today, -29), today];
        case 'month': return [today.slice(0, 8) + '01', today];
        case 'year': return [today.slice(0, 5) + '01-01', today];
        default: return [from || today, to || today];
      }
    }

    function SalesReportModule({ db, setDb, notify, currentUser, hasPermission, isOwner }) {
      const [range, setRange] = useState('today');
      const [customFrom, setCustomFrom] = useState(addDays(dateKey(), -6));
      const [customTo, setCustomTo] = useState(dateKey());
      const [cashierFilter, setCashierFilter] = useState('all');
      const [methodFilter, setMethodFilter] = useState('all');
      const [search, setSearch] = useState('');
      const [showVoid, setShowVoid] = useState(false);
      const [limit, setLimit] = useState(30);
      const [detail, setDetail] = useState(null);
      const [reprint, setReprint] = useState(null);
      const [voiding, setVoiding] = useState(null);
      const [voidReason, setVoidReason] = useState('');
      const [productSort, setProductSort] = useState({ key: 'qty', dir: 'desc' });
      const [txSort, setTxSort] = useState({ key: 'date', dir: 'desc' });
      const [expForm, setExpForm] = useState(null);
      const [pdfBusy, setPdfBusy] = useState(false);
      const canRecordExpense = currentUser.role !== 'investor';
      const saveExpense = () => {
        if (!expForm.amount) return;
        addExpense(setDb, expForm, currentUser);
        notify(`Pengeluaran ${formatIDR(expForm.amount)} dicatat. Bos bisa melihatnya di Laba Rugi.`);
        setExpForm(null);
      };

      const [from, to] = rangeBounds(range, customFrom, customTo);
      const singleDay = from === to;
      // A clicked bar narrows the whole page and its exports to that bar
      const [pick, setPick] = useState(null);
      useEffect(() => setPick(null), [from, to, cashierFilter, methodFilter]);
      // Long periods would give a bar too thin to read, so they group by month
      const chartUnit = singleDay ? 'hour' : (new Date(to) - new Date(from)) / 86400000 > 62 ? 'month' : 'day';
      const inPick = (s) => !pick || (chartUnit === 'hour' ? new Date(s.date).getHours() === pick.key : saleDay(s).startsWith(pick.key));
      const pickBar = (chart) => {
        const bar = chart?.activePayload?.[0]?.payload;
        if (!bar?.total) return;
        setLimit(30);
        setPick(p => p?.key === bar.key ? null : { key: bar.key, label: chartUnit === 'hour' ? `pukul ${bar.label}.00` : chartUnit === 'month' ? monthLabel(bar.key) : fmtDateShort(bar.key) });
      };

      // Everyone sees the whole store's sales and can narrow them to one cashier
      const scoped = allSalesOf(db).filter(s => {
        const k = saleDay(s);
        if (k < from || k > to) return false;
        if (cashierFilter === 'me' && s.cashier_id !== currentUser.id) return false;
        if (cashierFilter !== 'all' && cashierFilter !== 'me' && s.cashier_id !== cashierFilter) return false;
        if (methodFilter !== 'all' && s.payment_method !== methodFilter && !(methodFilter === 'deposit' && s.deposit_used > 0)) return false;
        return true;
      });
      // The chart always shows the whole period; everything else on the page follows the clicked bar
      const periodValid = scoped.filter(isValidSale);
      const inView = pick ? scoped.filter(inPick) : scoped;
      const valid = inView.filter(isValidSale);
      const voided = inView.filter(s => !isValidSale(s));
      // Kasbon paid back in this period: one row per nota paid, under the method the customer paid with
      const cashierName = db.users.find(u => u.id === cashierFilter)?.name;
      const payRows = useMemo(() => kasbonPayRows(db), [db.debt_payments, db.sales, db.offlineQueue, db.customers]);
      const repayments = payRows.filter(({ pay: p }) => {
        const k = dateKey(new Date(p.date));
        if (k < from || k > to) return false;
        if (cashierFilter === 'me' && p.by_id !== currentUser.id && p.by !== currentUser.name) return false;
        if (cashierFilter !== 'all' && cashierFilter !== 'me' && p.by_id !== cashierFilter && p.by !== cashierName) return false;
        return methodFilter === 'all' || (p.method || 'cash') === methodFilter;
      }).map(({ pay: p, sale, amount, settled }, i) => ({ id: `${p.id}:${i}`, repay: true, sale, settled, date: p.date, receipt_no: sale?.receipt_no || `INV-${dateKey(new Date(p.date)).replace(/-/g, '')}-${String(p.id).slice(-4)}`, cashier: p.by || '-', customer_name: sale?.customer_name || db.customers.find(c => c.id === p.party_id)?.name || '-', payment_method: p.method || 'cash', total: amount, items: sale?.items || [] })).filter(inPick);
      const repaid = repayments.reduce((a, p) => a + p.total, 0);

      const gross = valid.reduce((a, s) => a + s.total, 0);
      const net = valid.reduce((a, s) => a + s.total - (s.tax || 0), 0);
      const discount = valid.reduce((a, s) => a + (s.discount || 0), 0);
      const itemsSold = valid.reduce((a, s) => a + s.items.reduce((b, it) => b + it.qty, 0), 0);
      const avg = valid.length ? Math.round(gross / valid.length) : 0;
      const hpp = valid.reduce((a, s) => a + saleCost(s, db.products), 0);
      const depositIn = valid.reduce((a, s) => a + (s.deposit_in || 0), 0);
      const depositUsed = valid.reduce((a, s) => a + (s.deposit_used || 0), 0);

      const chartData = useMemo(() => {
        if (singleDay) {
          return Array.from({ length: 18 }, (_, i) => {
            const h = 6 + i;
            return { key: h, label: `${pad(h)}`, total: periodValid.filter(s => new Date(s.date).getHours() === h).reduce((a, s) => a + s.total, 0) };
          });
        }
        const out = [];
        if (chartUnit === 'month') {
          for (let m = from.slice(0, 7); m <= to.slice(0, 7); m = dateKey(new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 1)).slice(0, 7)) {
            out.push({ key: m, label: new Date(m + '-01T00:00:00').toLocaleDateString('id-ID', { month: 'short', year: '2-digit' }), total: periodValid.filter(s => saleDay(s).startsWith(m)).reduce((a, s) => a + s.total, 0) });
          }
          return out;
        }
        for (let k = from; k <= to; k = addDays(k, 1)) {
          out.push({ key: k, label: new Date(k + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }), total: periodValid.filter(s => saleDay(s) === k).reduce((a, s) => a + s.total, 0) });
        }
        return out;
      }, [scoped.length, from, to, periodValid.reduce((a, s) => a + s.total, 0)]);

      const tallyProducts = (list) => {
        const map = {};
        list.forEach(s => s.items.forEach(it => {
          map[it.id] = map[it.id] || { id: it.id, name: it.name, qty: 0, omzet: 0 };
          map[it.id].qty += it.qty; map[it.id].omzet += it.qty * it.sell_price;
        }));
        return Object.values(map);
      };
      const productRows = useMemo(() => tallyProducts(valid), [scoped.length, gross, pick?.key]);
      const productTotal = productRows.reduce((a, p) => a + p.omzet, 0) || 1;
      const productSorters = { qty: p => p.qty, omzet: p => p.omzet, share: p => p.omzet, name: p => p.name.toLowerCase() };
      const sortedProducts = sortBy(productRows, productSort, productSorters);

      const byMethod = Object.keys(PAYMENT_LABELS).map(m => {
        // Saldo was already income when it was left; this line shows how much of it got spent
        if (m === 'deposit') { const used = valid.filter(s => s.deposit_used > 0); return { m, count: used.length, total: depositUsed, repay: 0 }; }
        const list = valid.filter(s => s.payment_method === m);
        const back = repayments.filter(p => p.payment_method === m);
        const repay = back.reduce((a, p) => a + p.total, 0);
        return { m, count: list.length + back.length, total: list.reduce((a, s) => a + s.total, 0) + repay, repay };
      }).filter(x => x.count);
      // Money received, by method. Kasbon is a sale not paid yet and saldo was received earlier, so neither counts here
      const moneyMethods = byMethod.filter(x => x.m !== 'deposit' && x.m !== 'bayar_nanti');
      const otherMethods = byMethod.filter(x => x.m === 'deposit' || x.m === 'bayar_nanti');
      const otherLabel = (x) => x.m === 'deposit' ? 'Deposit (potong saldo)' : 'Kasbon baru';
      const methodSum = byMethod.reduce((a, x) => a + x.total, 0) || 1;

      const byCashier = db.users.map(u => {
        const list = valid.filter(s => s.cashier_id === u.id);
        return { u, count: list.length, total: list.reduce((a, s) => a + s.total, 0) };
      }).filter(x => x.count);

      const kasbonStatus = useMemo(() => kasbonStatusMap(db), [db.sales, db.offlineQueue, db.customers]);
      // "Lunas" / "Sebagian" next to the method; the search box finds these labels too
      const payState = (s) => s.repay ? (s.settled ? 'Lunas' : 'Sebagian')
        : s.payment_method === 'bayar_nanti' && s.status !== 'void' ? { paid: 'Lunas', partial: 'Sebagian' }[kasbonStatus.get(s.id)] || '' : '';
      const qs = search.trim().toLowerCase();
      const txList = sortBy([...(showVoid ? scoped : valid), ...repayments]
        .filter(s => !qs || s.receipt_no.toLowerCase().includes(qs) || s.customer_name.toLowerCase().includes(qs) || s.items.some(it => it.name.toLowerCase().includes(qs))
          || (PAYMENT_LABELS[s.payment_method] || '').toLowerCase().includes(qs) || payState(s).toLowerCase().includes(qs)),
        txSort, { date: s => new Date(s.date).getTime(), total: s => s.total });
      // One sale can have two rows (the kasbon, then its repayment), so the list is never added up as one column
      const txSales = txList.filter(s => !s.repay && s.status !== 'void');
      const txTotal = txSales.reduce((a, s) => a + s.total, 0);
      const txRepaid = txList.filter(s => s.repay).reduce((a, s) => a + s.total, 0);
      const txPaidNow = txSales.filter(s => s.payment_method !== 'bayar_nanti').reduce((a, s) => a + s.total, 0);
      const paidOff = (id) => payRows.filter(r => r.sale?.id === id).reduce((a, r) => a + r.amount, 0);
      const txUnpaid = txSales.filter(s => s.payment_method === 'bayar_nanti').reduce((a, s) => a + Math.max(0, s.total - paidOff(s.id)), 0);
      // The dates the page is showing: the period, or the clicked day or month inside it
      const [viewFrom, viewTo] = !pick || chartUnit === 'hour' ? [from, to]
        : chartUnit === 'day' ? [pick.key, pick.key]
        : [pick.key + '-01' < from ? from : pick.key + '-01', [dateKey(new Date(Number(pick.key.slice(0, 4)), Number(pick.key.slice(5, 7)), 0)), to].sort()[0]];
      const periodText = pick ? (chartUnit === 'hour' ? `${fmtDateShort(from)} ${pick.label}` : pick.label)
        : singleDay ? fmtDateShort(from) : `${fmtDateShort(from)} s/d ${fmtDateShort(to)}`;

      const [exporting, setExporting] = useState(false);
      const exportReport = async () => {
        setExporting(true);
        const expenses = db.expenses.filter(e => e.date >= viewFrom && e.date <= viewTo).sort((a, b) => a.date.localeCompare(b.date));
        const expTotal = expenses.reduce((a, e) => a + (Number(e.amount) || 0), 0);
        const int = (v) => ({ v, t: 'int' });
        const how = await downloadReport(`Laporan_Penjualan_${viewFrom}_${viewTo}`, {
          title: `Laporan Penjualan · ${db.business.name}`,
          subtitle: `Periode ${periodText} · dibuat ${fmtDateTime(new Date().toISOString())} oleh ${currentUser.name}`,
          sheets: [
            { name: 'Ringkasan', tables: [
              { heading: 'Ringkasan', columns: [{ header: 'Keterangan', width: 34 }, { header: 'Nilai', width: 20, t: 'money' }], rows: [
                ['Penjualan (termasuk pajak)', gross], ['Total pemasukan', net], ['Diskon diberikan', discount],
                ['Jumlah transaksi', int(valid.length)], ['Item terjual', int(itemsSold)], ['Rata-rata per transaksi', avg],
                ...(isOwner ? [['HPP', hpp], ['Laba kotor', net - hpp]] : []),
                ['Pelunasan kasbon diterima', repaid], ['Deposit masuk (termasuk penjualan)', depositIn], ['Saldo deposit dipakai', depositUsed], ['Pengeluaran / biaya operasional', expTotal]
              ] },
              { heading: 'Metode pembayaran', columns: [{ header: 'Metode' }, { header: 'Total', t: 'money' }, { header: 'Jumlah', width: 12, t: 'int' }, { header: 'Termasuk pelunasan kasbon', width: 26, t: 'money' }],
                rows: moneyMethods.map(x => [PAYMENT_LABELS[x.m], x.total, x.count, x.repay]), total: ['Total uang masuk', moneyMethods.reduce((a, x) => a + x.total, 0), moneyMethods.reduce((a, x) => a + x.count, 0), repaid] },
              ...(otherMethods.length ? [{ heading: 'Bukan uang masuk', columns: [{ header: 'Keterangan' }, { header: 'Total', t: 'money' }, { header: 'Jumlah', t: 'int' }], rows: otherMethods.map(x => [otherLabel(x), x.total, x.count]) }] : []),
              { heading: 'Per kasir', columns: [{ header: 'Kasir' }, { header: 'Total', t: 'money' }, { header: 'Nota', t: 'int' }],
                rows: byCashier.map(x => [x.u.name, x.total, x.count]) }
            ] },
            { name: 'Transaksi', tables: [{
              columns: [{ header: 'Waktu', width: 20 }, { header: 'No. Nota', width: 22 }, { header: 'Kasir', width: 18 }, { header: 'Pelanggan', width: 20 }, { header: 'Metode', width: 12 },
                { header: 'Subtotal', width: 15, t: 'money' }, { header: 'Diskon', width: 13, t: 'money' }, { header: 'Voucher', width: 12 }, { header: 'Pajak', width: 13, t: 'money' }, { header: 'Potong saldo', width: 14, t: 'money' }, { header: 'Deposit', width: 14, t: 'money' }, { header: 'Total', width: 15, t: 'money' }, { header: 'Status', width: 16 }, { header: 'Item', width: 50 }],
              rows: txList.map(s => s.repay
                ? [fmtDateTime(s.date), s.receipt_no, s.cashier, s.customer_name, `${PAYMENT_LABELS[s.payment_method]} · Pelunasan kasbon`, '', '', '', '', '', '', { v: s.total, t: 'paren' }, payState(s), s.items.map(it => `${it.name} x${it.qty}`).join('; ')]
                : [fmtDateTime(s.date), s.receipt_no, s.cashier, s.customer_name, PAYMENT_LABELS[s.payment_method], s.subtotal, s.discount || 0, s.coupon_code || '', s.tax || 0, s.deposit_used || 0, s.deposit_in || 0, s.total, s.status === 'void' ? 'Batal' : payState(s) || (s.payment_method === 'bayar_nanti' ? 'Kasbon' : 'Selesai'), s.items.map(it => `${it.name} x${it.qty}`).join('; ')]),
              totals: [
                ['Total penjualan', '', '', '', '', '', '', '', '', '', '', txTotal, '', 'Nominal dalam kurung adalah pelunasan kasbon, tidak dihitung sebagai penjualan'],
                ['Uang masuk', '', '', '', '', '', '', '', '', '', '', txPaidNow + txRepaid, '', `Penjualan non-kasbon ${pdfMoney(txPaidNow)} + pelunasan ${pdfMoney(txRepaid)}`],
                ['Kasbon belum dibayar', '', '', '', '', '', '', '', '', '', '', txUnpaid, '', '']
              ]
            }] },
            { name: 'Produk', tables: [{
              columns: [{ header: 'Produk', width: 34 }, { header: 'Terjual', width: 12, t: 'int' }, { header: 'Omzet', width: 18, t: 'money' }, { header: 'Porsi', width: 10, t: 'pct' }],
              rows: sortedProducts.map(p => [p.name, p.qty, p.omzet, p.omzet / productTotal]),
              total: ['Total', itemsSold, productRows.reduce((a, p) => a + p.omzet, 0), 1]
            }] },
            { name: 'Pengeluaran', tables: [{
              columns: [{ header: 'Tanggal', width: 16 }, { header: 'Kategori', width: 20 }, { header: 'Catatan', width: 36 }, { header: 'Dicatat oleh', width: 20 }, { header: 'Nominal', width: 16, t: 'money' }],
              rows: expenses.map(e => [fmtDateShort(e.date), expenseCat(e), e.note || '', e.by || '', Number(e.amount) || 0]),
              total: ['Total', '', '', '', expTotal]
            }] }
          ]
        });
        setExporting(false);
        notify(reportDone(how, 'Laporan penjualan'));
      };

      // Same look as the Laba Rugi PDF: blue header, then one table per topic
      const downloadPdf = async () => {
        setPdfBusy(true);
        try {
          const JsPDF = await ensureJsPdf();
          const doc = new JsPDF({ unit: 'pt', format: 'a4' });
          const rp = pdfMoney;
          const margin = { left: 40, right: 40, top: 40, bottom: 44 };
          const footStyles = { fillColor: [238, 244, 255], textColor: 30, fontStyle: 'bold' };
          await pdfHeader(doc, 'Laporan Penjualan', `${db.business.name} · ${periodText}`);
          const strong = (text, fill) => ({ content: text, styles: { fontStyle: 'bold', ...(fill ? { fillColor: [238, 244, 255] } : {}) } });
          const rightHead = (...cols) => ({ didParseCell: (d) => { if (d.section === 'head' && cols.includes(d.column.index)) d.cell.styles.halign = 'right'; } });
          doc.autoTable({
            startY: 95, theme: 'plain', margin, ...rightHead(1),
            head: [['Ringkasan Penjualan', 'Nominal']], headStyles: { fillColor: PDF_BLUE, textColor: 255, fontStyle: 'bold' },
            styles: { fontSize: 11, cellPadding: 7 }, columnStyles: { 1: { halign: 'right' } },
            body: [
              ['Jumlah transaksi', `${valid.length}`], ['Item terjual', `${itemsSold}`], ['Rata-rata per transaksi', rp(avg)],
              ['Diskon diberikan', `- ${rp(discount)}`],
              ...(depositIn ? [['Deposit masuk', rp(depositIn)]] : []),
              ...(depositUsed ? [['Saldo deposit dipakai', rp(depositUsed)]] : []),
              ...(repaid ? [['Pelunasan kasbon diterima', rp(repaid)]] : []),
              [strong('Total pemasukan'), strong(rp(net))],
              ...(isOwner ? [['HPP (harga beli produk terjual)', `- ${rp(hpp)}`], [strong('LABA KOTOR', true), strong(rp(net - hpp), true)]] : []),
              [strong('TOTAL PENJUALAN (termasuk pajak)', !isOwner), strong(rp(gross), !isOwner)]
            ]
          });
          const section = (title, desc) => {
            let y = doc.lastAutoTable.finalY + 34;
            if (y > 700) { doc.addPage(); y = 50; }
            doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(30);
            doc.text(title, 40, y);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110);
            doc.text(desc, 40, y + 14);
            return y + 24;
          };
          doc.autoTable({
            startY: section('Metode Pembayaran', 'Uang yang diterima, termasuk pelunasan kasbon di periode ini.'), margin, ...rightHead(1, 2),
            head: [['Metode', 'Transaksi', 'Total']],
            body: moneyMethods.length ? moneyMethods.map(x => [PAYMENT_LABELS[x.m], x.count, rp(x.total)]) : [[{ content: 'Tidak ada uang masuk', colSpan: 3 }]],
            foot: [
              ['Total uang masuk', { content: moneyMethods.reduce((a, x) => a + x.count, 0), styles: { halign: 'right' } }, { content: rp(moneyMethods.reduce((a, x) => a + x.total, 0)), styles: { halign: 'right' } }],
              ...otherMethods.map(x => [`${otherLabel(x)}, bukan uang masuk`, { content: x.count, styles: { halign: 'right' } }, { content: rp(x.total), styles: { halign: 'right' } }].map(c => typeof c === 'string' ? { content: c, styles: { fontStyle: 'normal', fillColor: 255 } } : { ...c, styles: { ...c.styles, fontStyle: 'normal', fillColor: 255 } }))
            ], footStyles, showFoot: 'lastPage',
            headStyles: { fillColor: PDF_BLUE }, styles: { fontSize: 10 }, columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' } }
          });
          doc.autoTable({
            startY: section('Penjualan per Produk', 'Diurutkan dari yang paling laku.'), margin, ...rightHead(1, 2, 3),
            head: [['Produk', 'Terjual', 'Omzet', 'Porsi']],
            body: productRows.length ? [...productRows].sort((a, b) => b.qty - a.qty).map(p => [p.name, p.qty, rp(p.omzet), `${Math.round(p.omzet / productTotal * 100)}%`]) : [[{ content: 'Tidak ada data', colSpan: 4 }]],
            headStyles: { fillColor: PDF_BLUE }, styles: { fontSize: 10 }, columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' } }
          });
          const expenses = db.expenses.filter(e => e.date >= viewFrom && e.date <= viewTo).sort((a, b) => b.date.localeCompare(a.date));
          doc.autoTable({
            startY: section('Rincian Pengeluaran (Biaya Operasional)', `Semua uang keluar untuk operasional toko selama ${periodText}.`), margin, ...rightHead(3),
            head: [['Tanggal', 'Jenis pengeluaran', 'Keterangan', 'Uang keluar']],
            foot: [[{ content: 'Total pengeluaran', colSpan: 3 }, { content: rp(expenses.reduce((a, e) => a + (Number(e.amount) || 0), 0)), styles: { halign: 'right' } }]], footStyles, showFoot: 'lastPage',
            body: expenses.length ? expenses.map(e => [fmtDateShort(e.date), expenseCat(e), e.note || '-', rp(e.amount)]) : [[{ content: 'Tidak ada pengeluaran di periode ini', colSpan: 4 }]],
            headStyles: { fillColor: PDF_BLUE }, styles: { fontSize: 10 }, columnStyles: { 3: { halign: 'right' } }
          });
          doc.autoTable({
            startY: section('Daftar Transaksi', `${txList.length} baris, urut seperti di layar.${txRepaid ? ' Nominal dalam kurung adalah pelunasan kasbon, tidak dihitung sebagai penjualan.' : ''}`), margin, ...rightHead(4),
            head: [['Waktu', 'Nota', 'Pelanggan', 'Metode', 'Total']],
            foot: [
              [{ content: 'Total penjualan', colSpan: 4 }, { content: rp(txTotal), styles: { halign: 'right' } }],
              [{ content: `Uang masuk (non-kasbon ${rp(txPaidNow)} + pelunasan ${rp(txRepaid)})`, colSpan: 4 }, { content: rp(txPaidNow + txRepaid), styles: { halign: 'right' } }],
              [{ content: 'Kasbon belum dibayar', colSpan: 4 }, { content: rp(txUnpaid), styles: { halign: 'right' } }]
            ], footStyles, showFoot: 'lastPage',
            body: txList.length ? txList.map(s => [fmtDateTime(s.date), s.receipt_no, s.customer_name,
              (s.repay ? [PAYMENT_LABELS[s.payment_method], 'Pelunasan kasbon', payState(s) === 'Sebagian' ? 'Sebagian' : ''] : [PAYMENT_LABELS[s.payment_method], payState(s), s.status === 'void' ? 'Batal' : '']).filter(Boolean).join(' · '),
              s.repay ? `(${rp(s.total)})` : rp(s.total)]) : [[{ content: 'Tidak ada transaksi', colSpan: 5 }]],
            headStyles: { fillColor: PDF_BLUE }, styles: { fontSize: 9 }, columnStyles: { 4: { halign: 'right' } }
          });
          pdfFooter(doc, currentUser.name);
          doc.save(`Laporan_Penjualan_${db.business.name.replace(/\s+/g, '_')}_${viewFrom}_${viewTo}.pdf`);
          notify('PDF laporan penjualan diunduh.');
        } catch {
          notify('PDF gagal dibuat (butuh internet untuk pertama kali).', 'warn');
        } finally { setPdfBusy(false); }
      };

      const canVoid = hasPermission('can_void_sale');
      const voidSale = (sale, reason) => {
        setDb(prev => {
          const mark = list => list.map(s => s.id === sale.id ? { ...s, status: 'void', void_reason: reason, voided_by: currentUser.name, voided_at: new Date().toISOString(), void_request: s.void_request ? { ...s.void_request, status: 'approved', decided_by: currentUser.name, decided_at: new Date().toISOString() } : undefined } : s);
          const stamp = `${dateKey()} ${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
          return {
            ...prev,
            sales: mark(prev.sales),
            offlineQueue: mark(prev.offlineQueue),
            products: applySaleLines(prev.products, sale.items, 1),
            customers: prev.customers.map(c => {
              if (c.id === 'cust-1' || !(c.id === sale.customer_id || c.name === sale.customer_name)) return c;
              const kasbon = sale.payment_method === 'bayar_nanti';
              return {
                ...c, visits: Math.max(0, c.visits - 1),
                debt: kasbon ? Math.max(0, c.debt - sale.total) : c.debt,
                total_spent: kasbon ? c.total_spent : Math.max(0, c.total_spent - saleBill(sale)),
                ...(sale.deposit_used || sale.deposit_in ? { deposit: Math.max(0, (c.deposit || 0) + (sale.deposit_used || 0) - (sale.deposit_in || 0)) } : {})
              };
            }),
            stockHistory: [...sale.items.map(it => ({ id: generateId('SH'), date: stamp, sku: prev.products.find(p => p.id === productIdOf(it))?.sku || '-', name: it.name, qtyChange: `+${it.qty}`, type: `Pembatalan ${sale.receipt_no}`, user: currentUser.name })), ...prev.stockHistory]
          };
        });
        // Tell the cashier whose sale it was (or who asked for the cancellation)
        const affected = sale.void_request?.by_id || (sale.cashier_id !== currentUser.id ? sale.cashier_id : null);
        if (affected) setDb(prev => withStaffNotif(prev, affected, sale.void_request?.by_id
          ? { icon: 'check', tone: 'green', title: 'Pengajuan pembatalan disetujui', msg: `${sale.receipt_no} (${formatIDR(sale.total)}) sudah dibatalkan oleh ${currentUser.name}.`, go: 'sales_report' }
          : { icon: 'ban', tone: 'rose', title: 'Transaksi Anda dibatalkan', msg: `${sale.receipt_no} (${formatIDR(sale.total)}) dibatalkan oleh ${currentUser.name}: ${reason}`, go: 'sales_report' }));
        notify(`${sale.receipt_no} dibatalkan. Stok dikembalikan.`, 'warn');
        setVoiding(null); setDetail(null); setVoidReason('');
      };
      const confirmVoid = () => { if (voidReason.trim()) voidSale(voiding, voidReason.trim()); };
      const markRequest = (sale, patch) => setDb(prev => {
        const mark = list => list.map(s => s.id === sale.id ? { ...s, void_request: { ...(s.void_request || {}), ...patch } } : s);
        return { ...prev, sales: mark(prev.sales), offlineQueue: mark(prev.offlineQueue) };
      });
      const requestVoid = () => {
        if (!voidReason.trim()) return;
        markRequest(voiding, { reason: voidReason.trim(), by: currentUser.name, by_id: currentUser.id, at: new Date().toISOString(), status: 'pending' });
        notify(`Pengajuan pembatalan ${voiding.receipt_no} dikirim ke Bos.`, 'info');
        setVoiding(null); setDetail(null); setVoidReason('');
      };
      const rejectRequest = (sale) => {
        markRequest(sale, { status: 'rejected', decided_by: currentUser.name, decided_at: new Date().toISOString() });
        if (sale.void_request?.by_id) setDb(prev => withStaffNotif(prev, sale.void_request.by_id, { icon: 'x', tone: 'rose', title: 'Pengajuan pembatalan ditolak', msg: `${sale.receipt_no} tetap tercatat sebagai penjualan.`, go: 'sales_report' }));
        notify(`Pengajuan pembatalan ${sale.receipt_no} ditolak.`, 'info');
      };
      const pendingRequests = isOwner ? allSalesOf(db).filter(s => s.status !== 'void' && s.void_request?.status === 'pending') : [];
      const VOID_REASONS = ['Salah input', 'Pelanggan batal pesan', 'Pelanggan salah sebut pesanan', 'Pembayaran gagal'];

      const sessions = [...db.cashSessions].filter(s => { const k = dateKey(new Date(s.opened_at)); return k >= viewFrom && k <= viewTo; }).reverse();

      return (
        <div className="space-y-5">
          <PageHeader title="Laporan Penjualan" desc="Semua transaksi toko. Pilih kasir untuk melihat penjualan satu orang."
            actions={<>
              {canRecordExpense && <Btn variant="secondary" icon="plus" onClick={() => setExpForm(newExpense())}>Catat pengeluaran</Btn>}
              <Btn variant="secondary" icon="download" onClick={exportReport} disabled={exporting || (!scoped.length && !repayments.length)}>{exporting ? 'Membuat…' : 'Excel'}</Btn>
              <Btn variant="dark" icon="download" onClick={downloadPdf} disabled={pdfBusy || (!scoped.length && !repayments.length)}>{pdfBusy ? 'Membuat PDF…' : 'Unduh PDF'}</Btn>
            </>} />
          {expForm && <ExpenseModal form={expForm} setForm={setExpForm} onSave={saveExpense} onClose={() => setExpForm(null)} expenses={db.expenses} />}

          {pendingRequests.length > 0 && (
            <Card className="border-amber-300 bg-amber-50/40 p-4">
              <h3 className="flex items-center gap-2 text-base font-bold text-slate-900"><SvgIcon name="alert" className="h-5 w-5 text-amber-600" />Pengajuan pembatalan dari kasir ({pendingRequests.length})</h3>
              <ul className="mt-2 divide-y divide-amber-100">
                {pendingRequests.map(s => (
                  <li key={s.id} className="flex flex-col gap-2 py-3 sm:flex-row sm:items-center sm:justify-between">
                    <div className="min-w-0 text-sm">
                      <p className="font-semibold text-slate-900"><span className="font-mono">{s.receipt_no}</span> · {formatIDR(s.total)} · {fmtDateTime(s.date)}</p>
                      <p className="text-slate-600">Diajukan {s.void_request.by}, {fmtDateTime(s.void_request.at)}</p>
                      <p className="text-slate-900">Alasan dibatalkan: <span className="font-medium">“{s.void_request.reason}”</span></p>
                    </div>
                    <div className="flex flex-shrink-0 gap-2">
                      <Btn variant="ghost" size="sm" onClick={() => setDetail(s)}>Lihat</Btn>
                      <Btn variant="secondary" size="sm" onClick={() => rejectRequest(s)}>Tolak</Btn>
                      <Btn variant="danger" size="sm" onClick={() => voidSale(s, s.void_request.reason)}>Setujui pembatalan</Btn>
                    </div>
                  </li>
                ))}
              </ul>
            </Card>
          )}

          <Card className="space-y-3 p-4">
            <SegmentedControl label="Periode" size="md" value={range} onChange={(v) => { setRange(v); setLimit(30); }} options={RANGES} />
            <div className="flex flex-wrap items-end gap-3">
              {range === 'custom' && <>
                <Field label="Dari"><input type="date" value={customFrom} max={customTo} onChange={e => setCustomFrom(e.target.value)} className={inputCls} /></Field>
                <Field label="Sampai"><input type="date" value={customTo} min={customFrom} max={dateKey()} onChange={e => setCustomTo(e.target.value)} className={inputCls} /></Field>
              </>}
              <Field label="Kasir">
                <select value={cashierFilter} onChange={e => setCashierFilter(e.target.value)} className={inputCls}>
                  <option value="all">Semua kasir</option>
                  {!isOwner && <option value="me">Penjualan saya</option>}
                  {db.users.filter(u => u.role !== 'investor').map(u => <option key={u.id} value={u.id}>{u.name}{u.id === currentUser.id ? ' (saya)' : ''}</option>)}
                </select>
              </Field>
              <Field label="Metode bayar">
                <select value={methodFilter} onChange={e => setMethodFilter(e.target.value)} className={inputCls}>
                  <option value="all">Semua metode</option>
                  {Object.entries(PAYMENT_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                </select>
              </Field>
              <p className="pb-3 text-sm text-slate-500">{periodText}</p>
            </div>
          </Card>

          <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
            <StatCard label="Penjualan (termasuk pajak)" value={formatIDR(gross)} sub={`Total pemasukan ${formatIDR(net)}${depositIn ? ` · Termasuk deposit ${formatIDR(depositIn)}` : ''}`} icon="dollar" />

    // =====================================================================
